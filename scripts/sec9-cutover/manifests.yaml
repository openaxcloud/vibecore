# Mirrors the parts of infra/helm/platform the cutover depends on:
# maxUnavailable: 0 / maxSurge: 1, minReadySeconds, a preStop drain, and the
# activation flag delivered via a ConfigMap consumed with envFrom.
apiVersion: v1
kind: ConfigMap
metadata: {name: platform-env, namespace: sec9}
data:
  DEPLOYMENT_ACCESS_ACTIVATION_ENABLED: "0"
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: sec9}
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{port: 3001, targetPort: 3001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sec9
  labels: {app.kubernetes.io/name: api}
spec:
  replicas: 2
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: api, app.kubernetes.io/instance: vibecore}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/instance: vibecore}
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: state
          hostPath: {path: /tmp/sec9-state, type: DirectoryOrCreate}
      containers:
        - name: api
          image: sec9-api:old
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/stub-api.mjs"]
          ports: [{containerPort: 3001}]
          # Same shape as the chart: ~10s drain while endpoints propagate.
          lifecycle:
            preStop:
              exec: {command: ["node", "-e", "setTimeout(function(){}, 10000)"]}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: MODE
              value: "old"
          envFrom:
            - configMapRef: {name: platform-env}
          volumeMounts: [{name: state, mountPath: /state}]
          readinessProbe:
            httpGet: {path: /healthz, port: 3001}
            initialDelaySeconds: 1
            periodSeconds: 2
