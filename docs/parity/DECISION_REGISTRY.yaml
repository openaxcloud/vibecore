  - decisionId: DEC-GALLERY-OPTION-B
    title: "Gallery : garder notre noyau prouvé + greffer la substance de l'autre session (option B)"
    rationale: >
      Avi laisse trancher ; décision B confirmée sur MESURE, pas sur goût :
      (1) sa passation annonce « 6 cartes converties en apps de démo (Orbit CRM,
      Northstar, Pulse, Launchline, Kindred, Relay) » mais ses artefacts
      public/gallery-apps/ s'appellent ai-agent/fastify-api/landing-page/
      mobile-starter/next-dashboard = les noms framework — LA CONVERSION N'A PAS EU
      LIEU ; (2) sa vue liste est cassée (chevauchement vignettes/titres, documenté
      par lui) ; (3) rien de son travail n'est prouvé live, notre noyau l'est (pin
      immuable + secrets:[] en base). ⇒ noyau prouvé nôtre + greffe de TOUTE sa
      substance (modération, signalement, provenance, versions, hub 12 sources avec
      adaptateurs réels, catalogue package, probe SSRF/DNS-rebinding, Empty sans Agent).
    consequence: "Ne jette rien ; réconcilie sur la branche d'intégration, pas d'écrasement."
    owner: claude
    priority: 2
    cost: "reconcile deux modèles DB (GalleryListing vs ProjectTemplateGallery) + renum migration"
