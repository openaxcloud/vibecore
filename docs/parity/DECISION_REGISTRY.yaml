  - decisionId: DEC-BILLING-LEGACY-VS-LEDGER
    decisionType: ECODE_DECISION
    title: "Facturation : NOUVEAU LEDGER (double entrée) adopté — ancien système de crédits ABANDONNÉ"
    rationale: >
      TRANCHÉ par Avi (20/07/2026) : la facturation E-Code = le nouveau grand
      livre en double entrée (BILLING_LEDGER_CONTRACT, UsageReservation,
      UsageEvent immuable, compensation). L'ancien système de crédits
      (CreditWallet/checkpoints/packs/PAYG, certifié SHADOW) est ABANDONNÉ.
      AUCUNE migration de soldes : Avi confirme qu'il n'y a AUCUN utilisateur
      réel — toutes les données actuelles sont fictives ; les soldes/crédits
      existants sont remis à zéro / purgés proprement (tombstone + preuve
      d'effacement, §16.12), pas de conversion.
    consequence: "Implémenter le ledger minimal (UNK-BILLING-MINIMAL-IMPL) ; purge propre des données fictives du wallet ; le SEUL reste côté owner = les 2 actions Stripe (produits/prix des plans + remplacement de la clé)."
    owner: owner
    priority: 1
    cost: "purge wallet + implémentation ledger (déjà tracée)"
    status: DECIDED
    decidedAt: "2026-07-20"
    nextAction: "Ledger minimal (UNK-BILLING-MINIMAL-IMPL) + purge wallet ; Stripe = actions Avi"
    targetDate: "2026-08-15"
  - decisionId: DEC-ECODE-FREE-APP-EXPIRY-30D
    decisionType: ECODE_DECISION
    title: "App du plan gratuit effacée à 30 jours — ADOPTÉE (comme Replit)"
    rationale: >
      Avi dit OUI (20/07/2026) : E-Code adopte la règle mesurée chez Replit
      (RPL-28 : 1 app publiée sur le plan gratuit, expiration à 30 jours).
      Mécanique OBLIGATOIRE conforme à l'invariant §16.12 du plan : toute
      suppression possède tombstone, fenêtre de récupération, purge
      planifiée et preuve d'effacement — jamais un hard-delete silencieux.
      Notification avant expiration ; un upgrade pendant la fenêtre
      restaure sans perte.
    consequence: "Entitlement starter (OFFERING) + job d'expiration (tombstone→fenêtre→purge→preuve) à implémenter et prouver."
    owner: owner
    priority: 2
    cost: "job d'expiration + notifications + preuve d'effacement"
    status: DECIDED
    decidedAt: "2026-07-20"
    nextAction: "Implémenter (UNK-FREE-EXPIRY-IMPL) — capacité, pas contrat"
    targetDate: "2026-09-30"
  - decisionId: DEC-OWNER-REMIX-DEFAULT-LICENSE
    title: "Licence par défaut d'un listing Gallery sans licence déclarée"
    status: OPEN
    owner: owner
    priority: 2
    rationale: "Le chantier V3-05 (licence+consentement versionnés au remix) est codé : un listing SANS licence déclarée affiche « No license specified by the author » et le remix reste possible après acceptation du texte de consentement plateforme (REMIX_CONSENT_VERSION). C'est un choix PRODUIT non tranché : (a) exiger une licence à la curation, (b) adopter une licence par défaut imposée, ou (c) conserver « non renseignée » avec consentement plateforme (comportement actuel du code)."
    consequence: "Tant que non tranché, le comportement (c) s'applique — honnête et affiché, jamais une licence inventée. Trancher (a) ou (b) = petite modif du schéma de curation admin."
    cost: "aucun coût technique notable ; enjeu juridique à valider"
    nextAction: "Avi tranche (a)/(b)/(c) ; appliquer au schéma admin si (a)/(b)"
    targetDate: "2026-08-15"
