  - decisionId: DEC-OWNER-D1-GIT-RECONCILE
    decisionType: OWNER_DECISION
    title: "D1 — Réconciliation du split-brain Git, autorisée avec procédure contrôlée"
    rationale: >
      Citation Avi : « Merge toi meme et verifie les commits des autres sessions
      si ils sont bon tu les prend ». Procédure adoptée (document expert, approuvé
      17/07) : branche d'intégration créée depuis origin/main, refs de sauvegarde
      des deux pointes, inventaire des commits uniques, aucune réécriture
      d'historique, CI complète et PR avant main ; fichiers de suivi régénérés
      après le merge. Aucun force-push.
    consequence: "Une seule pointe canonique ; le worktree local n'est plus jamais une source de vérité ; main protégée."
    owner: owner
    priority: 1
    cost: "fenêtre courte de freeze des 4 fichiers de suivi"
    status: DECIDED
    decidedAt: "2026-07-17"
    nextAction: "Exécuter (UNK-GIT-RECONCILE-DONE, cible 2026-07-20)"
    targetDate: "2026-07-20"
  - decisionId: DEC-OWNER-D2-ROLLBACK-PERMANENT
    decisionType: OWNER_DECISION
    title: "D2 — Rollback par digest PERMANENT et fail-closed"
    rationale: >
      Approuvé « Oui » (17/07/2026), contenu = document expert : rendre
      SERVER_DEPLOY_ROLLBACK_FROM_DIGEST=1 permanent dans Helm (values-prod +
      staging + JSON schema, test de rendu obligatoire). Legacy fail-closed :
      backfill retainedDigest quand l'artefact existe ; sinon 409 typé
      NO_RETAINED_DIGEST — aucun fallback vers une URL potentiellement morte.
      Canary + alerte si le flag manque après helm upgrade + test post-deploy.
    consequence: "Le faux rollback ne peut pas revenir au prochain helm upgrade ; un 409 franc remplace un faux succès."
    owner: owner
    priority: 1
    cost: "backfill + canary ; migration puis suppression du fallback URL-only"
    status: DECIDED
    decidedAt: "2026-07-17"
    nextAction: "Appliquer (UNK-ROLLBACK-FLAG-APPLIED, cible 2026-07-24)"
    targetDate: "2026-07-24"
  - decisionId: DEC-OWNER-D3-NIX-MULTIZONE
    decisionType: OWNER_DECISION
    title: "D3 — GO store Nix multi-zone, topologie réelle + coût mesuré"
    rationale: >
      Approuvé « Oui » (17/07/2026), contenu = document expert : GO multi-zone
      AVANT d'activer Python par défaut. Préférence : snapshot signé par
      génération puis clone zonal identique dans chaque zone active, montage
      topology-aware, même generationId/contentHash/signature partout (dérive ⇒
      pod bloqué). Test de drain de zone-a puis projet Python créé en zone-b.
      Le coût est MESURÉ sur les SKU/capacité provisionnée europe-west9 —
      « ~10 $/mois » reste une hypothèse jusqu'à mesure. Regional PD = option à
      benchmarker (2 zones, ~2× coût), pas le choix par défaut.
    consequence: "Python zéro-manuel débloqué sans SPOF zonal (SPOF-1, OPERATIONS_DR.md)."
    owner: owner
    priority: 1
    cost: "clones zonaux par génération — chiffrage après mesure SKU réelle"
    status: DECIDED
    decidedAt: "2026-07-17"
    nextAction: "Exécuter (UNK-NIX-MULTIZONE-IMPL, cible 2026-08-01)"
    targetDate: "2026-08-01"
  - decisionId: DEC-OWNER-D4-BILLING-BEFORE-CONNECTORS
    decisionType: OWNER_DECISION
    title: "D4 — Billing minimal sûr AVANT les connecteurs Import, puis lots"
    rationale: >
      Approuvé « Oui » (17/07/2026), contenu = document expert : un import qui
      consomme des crédits ne démarre pas sans réservation idempotente et
      compensation sur échec. Minimum : UsageReservation (idempotency key,
      montant max, expiration, release/commit), débit réel après étape billable,
      hard limit à frontière sûre, UsageEvent immuable corrélé
      importJobId↔reservationId↔ledgerEntryId, UI estimation/plafond/facturé.
      Ensuite connecteurs PAR LOTS : lot 1 cœur Git (Vercel, Previous Agent
      export, Bolt, Lovable, Base44) ; lot 2 design (Figma, Claude) ; lot 3
      données (Spreadsheet). Inventaire corrigé : 12 entrées dont Previous
      Agent export (RPL-24).
    consequence: "Aucun travail billable sans contrôle ; surface produit livrée par lots mutualisés."
    owner: owner
    priority: 2
    cost: "décale les connecteurs derrière le minimum billing"
    status: DECIDED
    decidedAt: "2026-07-17"
    nextAction: "UNK-BILLING-MINIMAL-IMPL (2026-08-15) puis lot 1"
    targetDate: "2026-08-15"
  - decisionId: DEC-OWNER-D5-E2E-ACCOUNT
