    consequence: >
      Soit on l'assume comme décision E-CODE AVEC son coût de modération
      (Trust & Safety, revue humaine, anti-abus), soit on ne le fait pas. Ne pas
      le présenter comme « parité Replit ».
    owner: avi
    priority: 2
    cost: "modération humaine + anti-abus (non chiffré)"
