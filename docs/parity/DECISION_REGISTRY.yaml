  - decisionId: DEC-GALLERY-NO-SELF-PUBLISH
    title: "Pas de bouton « Publish to Gallery » self-service"
    rationale: >
      Replit n'a PAS de publication self-service : « Submit your App » pointe sur
      un Typeform EXTERNE (form.typeform.com/to/yVYAWg79) = intake humaine curée
      (RPL-17, vérifié+hashé). Un bouton « Publish to Gallery » in-product serait
