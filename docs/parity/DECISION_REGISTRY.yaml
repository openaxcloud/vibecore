    targetDate: "2026-08-01"
  - decisionId: DEC-OWNER-D6-TPL02-POSTHOC
    decisionType: OWNER_DECISION
    title: "D6 — TPL-02 : validation a posteriori des captures + gate déplacé au merge/release"
    rationale: >
      Approuvé « Oui » (17/07/2026), contenu = document expert : valider a
      posteriori les captures si conformes et liées au commit réellement poussé ;
      ne pas retirer du code valide pour punir un écart de processus ;
      enregistrer l'écart. NOUVELLE RÈGLE : les pushes vers une branche de
      travail sont autorisés ; merge vers main, déploiement production et
      passage à ✅ TESTÉ LIVE sont bloqués tant que la preuve n'est pas
      approuvée (champ proofApproval : reviewer, timestamp, evidenceIds).
    consequence: "L'écart de processus TPL-02.PROOF est clos par gouvernance, pas par revert."
    owner: owner
    priority: 3
    cost: "champ proofApproval + blocage CI merge/release pour les chantiers capture-required"
    status: DECIDED
    decidedAt: "2026-07-17"
    nextAction: "Valider les captures Gallery a posteriori + câbler proofApproval"
    targetDate: "2026-07-31"
  - decisionId: DEC-OWNER-TRACKING-FILES-VERSIONED
