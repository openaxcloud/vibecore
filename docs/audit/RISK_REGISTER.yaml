    title: DNS rebinding can bypass hostname-only SSRF validation
    severity: P1
    likelihood: plausible
    impact: high
    status: OPEN
    invariant: Server-originated requests never reach metadata, loopback, private, link-local, or unauthorized cluster addresses.
    scenario: A validated public hostname changes or returns a private address at connection time, or a redirect resolves to an unsafe destination.
    affectedAssets:
      - cloud metadata credentials
      - internal APIs and databases
      - tenant services
      - model and connector secrets
    evidenceRefs:
      - services/api/src/app.ts:2115-2264
      - services/api/src/mcp-marketplace.ts:330-390
    existingControls:
      - Extensive literal-IP canonicalization and private-range blocklist.
      - HTTPS-only webhook policy.
      - Redirect and timeout controls on selected clients.
    controlFailure: DNS answers are not validated and pinned at socket connection time.
    requiredTreatment:
      - Safe resolver/agent shared by webhook, Git, MCP and provider clients.
      - Revalidate each redirect and all A/AAAA answers.
      - Enforce defense-in-depth egress policy.
    requiredTests:
      - controlled rebinding DNS
      - public-to-private redirect
      - IPv4 and IPv6 metadata targets
      - API and workspace egress negative drill
    owner: application-security
    reviewer: independent-security-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN

