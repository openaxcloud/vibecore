riskPolicy:
  severityOrder:
    - P0
    - P1
    - P2
    - P3
  definitions:
    P0: Direct integrity, financial, security, or recovery invariant violation capable of blocking launch or causing irreversible material harm.
    P1: High-impact exposure or missing proof on a critical path; must be closed before parity or production-readiness signature.
    P2: Material quality or operational weakness that must be planned and verified but is not by itself a launch-stopping invariant in this audit.
  acceptanceRules:
    - P0 and P1 risks cannot be accepted by a code author alone.
    - Closure requires an exact-commit fix, positive and negative tests, concurrency/failure tests where applicable, and independent review.
    - External-system claims require real dedicated test infrastructure and raw, hashed evidence.
    - No risk in this register is SIGNED_PROVEN.
