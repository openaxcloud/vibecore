  - id: RISK-SEC-002
    gapIds:
      - GAP-SEC-OBJECT-TOKEN-REVOCATION
      - GAP-STORE-GCS-FAILURE-CONCURRENCY
    title: Stale workspace token retains destructive object-storage access after authority changes
    severity: P1
    likelihood: plausible
    impact: high
    status: OPEN
    invariant: Workspace-derived storage authority ends when the workspace/user/project authority ends.
    scenario: A token copied from a workspace remains valid for up to seven days after stop, member removal, project transfer, or deletion and can delete a bucket or issue upload URLs.
    affectedAssets:
      - project objects
      - previews and thumbnails
      - exports and snapshots
      - deletion compliance
    evidenceRefs:
      - services/api/src/app.ts:3186-3254
      - services/api/src/app.ts:30538-30708
      - services/api/src/object-storage.ts:227-375
    existingControls:
      - Signed token with expiry and projectId.
      - Object keys and project bucket names are server-derived.
    controlFailure: No generation/revocation/workspace-state/scope check occurs at authorization time.
    requiredTreatment:
      - Short TTL, audience and read/write scope.
      - Online generation or revocation check tied to workspace and project lifecycle.
      - Deletion fence blocks new signed URLs and bucket recreation.
    requiredTests:
