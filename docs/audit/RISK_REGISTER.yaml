risks:
  - id: RISK-FIN-001
    gapIds:
      - GAP-BILL-LEDGER-ATOMICITY
    title: Ledger crash window can create credit, lose a hold, or return a false completed settlement
    severity: P0
    likelihood: likely_under_fault
    impact: critical
    status: OPEN
    invariant: Every reservation state has exactly one balanced, durably linked ledger effect.
    scenario: >-
      The process dies after reservation creation but before reserve posting, or after COMMITTED transition but before
      settlement posting. Expiration/replay observes the state but not the missing effect and either releases a nonexistent
      hold or reports the settlement complete.
    affectedAssets:
      - customer credit balances
      - revenue ledger
      - spend caps
      - financial reconciliation
    evidenceRefs:
      - services/api/src/ledger-store.ts:195-412
      - services/api/src/tests/ledger-store-db.spec.ts:20-275
    existingControls:
      - Transaction entries are balanced inside postTransaction.
      - Idempotency uniqueness exists per organization and key.
      - Compare-and-set prevents two callers from winning the same state transition.
    controlFailure: State transition, ledger posting, and linkage do not share a transaction or durable recovery protocol.
    requiredTreatment:
      - Serialize hard-limit decision per organization.
      - Couple state and ledger effect transactionally or via a recoverable outbox.
      - Add a reconciler for incomplete reserve, settle, compensate, and release effects.
    requiredTests:
      - deterministic two-connection hard-limit race
      - kill after each write boundary and restart
      - ledger balance and entitlement reconciliation
    owner: billing-ledger
    reviewer: independent-financial-systems-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN

  - id: RISK-FIN-002
    gapIds:
      - GAP-BILL-STRIPE-CREDITPACK-IDEMPOTENCY
    title: Partial Stripe webhook failure can grant the same purchased credit pack twice
    severity: P0
    likelihood: plausible
    impact: critical
    status: OPEN
    invariant: One external payment produces at most one entitlement and one ledger credit.
    scenario: >-
      Credit-pack creation commits, audit recording throws, the handler deletes the Stripe-event dedup row, and Stripe retries.
      No uniqueness on payment_intent prevents a second pack.
    affectedAssets:
      - credit entitlements
      - revenue recognition
      - fraud controls
      - customer balance
    evidenceRefs:
      - services/api/src/app.ts:25561-26007
      - services/api/src/app.ts:25656-25683
      - packages/database/prisma/schema.prisma:1983-1994
      - services/api/src/prisma-store.ts:4745-4762
    existingControls:
      - Stripe signatures are verified.
      - A StripeEvent dedup row rejects a fully completed sequential replay.
    controlFailure: The dedup fence is reopened after a non-idempotent effect has committed.
    requiredTreatment:
      - Unique external payment key on the entitlement.
      - Durable event/effect state machine with independently retryable audit side effect.
    requiredTests:
      - concurrent duplicate delivery in Stripe test mode
      - audit failure after entitlement creation
      - handler crash before HTTP acknowledgement
    owner: billing-platform
    reviewer: independent-billing-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN

  - id: RISK-REL-001
    gapIds:
      - GAP-DEPLOY-ROLLBACK-DIGEST-LINEARIZATION
    title: Rollback can serve unverified destination bytes with a source digest
    severity: P0
    likelihood: plausible_under_fault
    impact: critical
    status: OPEN
    invariant: No restored release receives traffic before final-byte digest verification and durable manifest commit.
    scenario: >-
      Restore produces partial or altered destination bytes; the deployment is marked READY; destination digest computation
      fails and falls back to the source digest. Operators and users see a successful rollback whose manifest does not prove
      the served bytes.
    affectedAssets:
      - published customer applications
      - release history
      - incident rollback
      - artifact integrity
    evidenceRefs:
      - services/api/src/app.ts:6644-6726
      - services/api/src/app.ts:33265-33352
      - PLAN_REMAINING_UNIFIED.md:42-44
    existingControls:
      - Source snapshot digest is checked.
      - Server rollback resolves retained image digests.
      - Helm deployment uses atomic rollback on rollout failure.
    controlFailure: READY precedes destination verification; manifest write is best-effort.
    requiredTreatment:
      - Integrate and independently review the unmerged rollback-integrity work.
      - Use pending/verified manifest states and reconcile interrupted work.
    requiredTests:
      - corrupt destination after source verification
      - fail destination digest computation
      - crash before manifest and before READY
      - real publish and rollback by exact digest
    owner: deployments
    reviewer: independent-release-integrity-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN

  - id: RISK-FIN-003
    gapIds:
      - GAP-BILL-METERING-EXACTLY-ONCE
      - GAP-BILL-CREDIT-DEBIT-CONCURRENCY
    title: Metering crash windows permit permanent undercharge, duplicate charge, or negative wallet state
    severity: P1
    likelihood: likely_under_retry
    impact: high
    status: OPEN
    invariant: Each measured usage window is charged once and only once, with a reconciliable source identity.
    scenario: >-
      A swallowed charge failure consumes lastMeteredAt and loses revenue; a successful charge followed by failed watermark
      update is retried and charged twice; credit compensation is lost on process crash.
    affectedAssets:
      - customer invoices and balances
      - platform margin
      - quota and spend-cap enforcement
    evidenceRefs:
      - services/api/src/app.ts:3637-3684
      - services/api/src/metering-service.ts:1-228
      - services/api/src/deploy-runtime-metering.ts:91-200
      - services/api/src/credits-service.ts:151-248
    existingControls:
      - Advisory locks serialize selected metering loops.
      - PAYG rows can use a stable reference.
      - Guarded pack decrements reduce one over-consumption path.
    controlFailure: Locks do not make charge, usage event, PAYG record, and watermark one durable effect.
    requiredTreatment:
      - Durable metering-window identity and state machine.
      - Reconciliation against runtime/storage/provider source counters.
    requiredTests:
      - fault injection at every metering write
      - duplicate cron and overlapping reconcile
      - concurrent final-credit consumption
    owner: billing-metering
    reviewer: independent-billing-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN_BEFORE_PAID_USE

