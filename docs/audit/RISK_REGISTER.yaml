    dueGate: 5
    riskAcceptance: FORBIDDEN

  - id: RISK-CACHE-001
    gapIds:
      - GAP-BILL-METERING-EXACTLY-ONCE
    title: Per-process fail-open pricing and routing caches can create replica split-brain
    severity: P1
    likelihood: plausible
    impact: high
    status: OPEN
    invariant: A billed or routed operation records and uses one authoritative, valid card version across replicas.
    scenario: The active DB card is invalid or temporarily unavailable; each process falls back and caches independently for 60 seconds, producing mixed pricing or model routing during the same interval.
    affectedAssets:
      - customer charges
      - model selection and cost
      - audit reconciliation
    evidenceRefs:
      - services/api/src/rate-card-service.ts:1-87
      - services/api/src/agent-routing-service.ts:1-80
    existingControls:
      - Schema validation of stored card data.
      - Each operation can stamp the version used.
    controlFailure: Validation failure and DB outage fail open to a process-local fallback with no shared invalidation or degraded state.
    requiredTreatment:
      - Versioned immutable card snapshot per operation.
      - Shared invalidation and explicit degraded policy for billing-authoritative reads.
    requiredTests:
      - multiple replicas during card activation
      - corrupt active card and DB outage
      - verify recorded price and model version across retries
    owner: billing-model-routing
    reviewer: distributed-systems-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN_FOR_PAID_USE

  - id: RISK-SEC-006
    gapIds:
      - GAP-PREVIEW-TENANT-PRIVATE-FAILOPEN
    title: Disabled and fail-open preview authorization can expose another tenant's private runtime
    severity: P0
    likelihood: likely
    impact: critical
    status: OPEN
    invariant: An unauthenticated, unauthorized or unresolved preview request never exchanges bytes with a workspace upstream.
    scenario: >-
      The deployed proxy leaves tenant/private-port enforcement disabled, or the private-port lookup times out or returns an
      error. The proxy interprets the port as public and forwards HTTP, WebSocket, SSE or uploaded content to a workspace the
      caller is not authorized to access.
    affectedAssets:
      - tenant source code and application data
      - development credentials and cookies
      - workspace network services
      - customer trust and isolation guarantees
    evidenceRefs:
      - services/preview-proxy/src/app.ts:504-539
      - services/preview-proxy/src/app.ts:1211-1246
      - infra/helm/platform/templates/configmap.yaml:146-158
    existingControls:
      - Optional tenant-cookie and private-port checks exist when explicitly enabled.
      - Unit tests exercise selected enabled-option paths.
    controlFailure: Authorization defaults off and private classification explicitly fails open on dependency failure.
    requiredTreatment:
      - Make tenant and access-policy enforcement mandatory at startup.
      - Make unknown/private lookup failure deny before routing and centralize the policy across transports.
      - Audit denied access with tenant-safe identifiers and bounded dependency timeouts.
    requiredTests:
      - two-tenant anonymous and cross-tenant HTTP, WebSocket, SSE, upload and streaming denial
      - lookup timeout, refusal, non-2xx and malformed response denial
      - revoked/expired session and scale-to-zero wake denial before upstream bytes
    owner: preview-platform-security
    reviewer: independent-tenant-isolation-reviewer
    dueGate: 2
    riskAcceptance: FORBIDDEN

  - id: RISK-AGENT-001
    gapIds:
      - GAP-AGENT-ASK-READONLY-ENFORCEMENT
    title: Ask mode can execute model- or message-supplied file and shell actions
    severity: P0
    likelihood: likely
    impact: critical
    status: OPEN
    invariant: Read-only mode has zero side effects even when model output or repository content is malicious.
    scenario: >-
      A prompt-injected model response or crafted replay contains an action tag while Ask is selected. The global message
      parser lacks the current mode, adds file/shell actions and invokes workbenchStore.runAction, modifying the project or
      starting a process despite the user selecting read-only behavior.
    affectedAssets:
      - project source and Git history
      - workspace processes and network
      - databases, secrets and deployments reachable by tools
      - user consent and agent auditability
    evidenceRefs:
      - app/components/chat/BaseChat.tsx:532-547
      - app/components/chat/BaseChat.tsx:1794-1844
      - app/lib/hooks/useMessageParser.ts:9-76
    existingControls:
      - The UI describes Ask as read-only.
      - The prompt instructs the model not to edit or execute.
    controlFailure: A prompt is advisory; no capability check exists at parser, queue or final mutation boundary.
    requiredTreatment:
      - Issue immutable server-side capability grants per execution and verify them at every tool side-effect boundary.
      - Prevent read-only messages from registering or replaying mutating actions.
      - Record explicit denied-tool audit events without executing client callbacks.
    requiredTests:
      - adversarial assistant and user action tags in Ask mode
      - streaming cancellation, reconnect, replay and mode switch with pending action
      - filesystem, Git, process, DB, secret, network and deployment state non-mutation proof
    owner: agent-runtime-security
    reviewer: independent-agent-security-reviewer
    dueGate: 2
    riskAcceptance: FORBIDDEN

  - id: RISK-SEC-007
    gapIds:
      - GAP-SEC-SECRET-BROWSER-PLAINTEXT
    title: Project readers and browser surfaces can receive plaintext credential material
    severity: P0
    likelihood: likely
    impact: critical
    status: OPEN
    invariant: Secret and credential values are encrypted at rest and never returned to the browser, logs or agent context.
    scenario: >-
      A project reader requests env-vars and receives their values, including AUTH_JWT_SECRET created by the auth scaffold, or
      a security manager invokes secret reveal and receives decrypted material in the browser. A compromised browser,
      extension, XSS, agent prompt or logged response can then exfiltrate durable credentials.
    affectedAssets:
      - application JWT signing keys
      - database and provider credentials
      - deployment and integration secrets
      - tenant sessions and data
    evidenceRefs:
      - packages/database/prisma/schema.prisma:513-539
      - services/api/src/app.ts:21083-21261
      - services/api/src/tests/env-var-scope-routes.spec.ts
    existingControls:
      - ProjectSecret supports encrypted ciphertext and hashed lookup material.
      - Secret reveal requires security:manage.
      - Selected logger fields have redaction rules.
    controlFailure: ProjectEnvVar is plaintext/exportable and both env-var and explicit reveal APIs cross the browser trust boundary.
    requiredTreatment:
      - Separate public configuration metadata from non-exportable secret references.
      - Encrypt or externalize all credential-bearing values and remove raw-value read responses.
      - Provide brokered runtime/deployment injection, rotation and revocation with access audit.
    requiredTests:
      - neutral-name canary across reader, writer and admin API/UI/agent surfaces
      - ephemeral PostgreSQL dump ciphertext inspection
      - log, trace, error, export and browser payload exfiltration scan
      - active-workload rotation and revocation
    owner: identity-secrets-security
    reviewer: independent-application-security-reviewer
    dueGate: 2
    riskAcceptance: FORBIDDEN

  - id: RISK-RUNTIME-001
    gapIds:
      - GAP-RUNTIME-WORKSPACE-DELETE-ORPHAN
    title: Failed workspace cleanup is marked DELETED and permanently hidden from garbage collection
    severity: P1
    likelihood: plausible
    impact: critical
    status: OPEN
    invariant: A terminally deleted workspace has no remaining Kubernetes or storage resource and no reusable credential.
    scenario: >-
      One Kubernetes delete fails, Promise.allSettled is ignored, and the database row becomes DELETED. garbageCollect reads
      only non-deleted rows, so the surviving PVC, Secret, Pod or Service is never retried and may retain data, credentials,
      routability or cost indefinitely.
    affectedAssets:
      - project source and persistent volumes
      - workspace agent credentials
      - tenant isolation and resource quotas
      - cluster capacity and cost
    evidenceRefs:
      - services/workspace-manager/src/manager.ts:1143-1206
      - services/workspace-manager/src/manager.spec.ts:125
    existingControls:
      - Every Kubernetes delete is attempted.
      - Garbage collection has an overlap guard and optimistic workspace guard.
    controlFailure: Per-resource outcomes are discarded and terminal state excludes the failed cleanup from reconciliation.
    requiredTreatment:
      - Persist cleanup state and per-resource outcomes.
      - Reconcile incomplete deletes across process restart until observed absence.
      - Linearize terminal deletion against reopen and PVC generation.
    requiredTests:
      - independent Service, Pod, Secret and PVC delete failure injection
      - restart and duplicate deletion convergence
      - concurrent delete, GC and reopen with persistent-data canary
    owner: workspace-runtime
    reviewer: independent-runtime-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN

  - id: RISK-DATA-002
    gapIds:
      - GAP-DATA-DB-RESTORE-CUTOVER
    title: Database restore can report COMPLETED while applications still use the old database
    severity: P1
    likelihood: likely
    impact: critical
    status: OPEN
    invariant: Restore completion means validated recovered data is the single authoritative target used by the application.
    scenario: >-
      CNPG reports the recovery cluster healthy, maintenance marks the restore COMPLETED, but DATABASE_URL is never cut over.
      Operators and users believe recovery succeeded while workloads continue on old data; an ad hoc later cutover can also
      create split-brain writes or destroy the only rollback target.
    affectedAssets:
      - tenant application data
      - recovery correctness and RPO
      - database credentials and connection state
      - operator incident decisions
    evidenceRefs:
      - services/api/src/database-provisioner.ts:388-392
      - services/api/src/database-provisioner.ts:637-665
      - services/api/src/app.ts:28566-28585
    existingControls:
      - A separate CNPG recovery cluster is created.
      - Cluster health and readyInstances are polled.
    controlFailure: No data validation, connection-secret cutover, writer fencing, application readiness or rollback transition exists.
    requiredTreatment:
      - Add a durable restore/cutover state machine with old/new target identity and writer fencing.
      - Validate recovered data and application queries before COMPLETED.
      - Retain and exercise the prior target until an explicit rollback window closes.
    requiredTests:
      - real Postgres/CNPG pre/post snapshot data and active app cutover
      - crash before and after secret update and readiness
      - concurrent queries/migration/restore and rollback without split-brain
    owner: data-platform
    reviewer: independent-database-recovery-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN

  - id: RISK-DATA-003
    gapIds:
      - GAP-IMPORT-PARTIAL-ROLLBACK
    title: Import failure can leave a visible partial project while reporting rollback
    severity: P1
    likelihood: plausible
    impact: high
    status: OPEN
    invariant: A failed import leaves neither a target project nor files, manifest, usage or billing effects.
    scenario: >-
      The importer creates the target project and then fails during file, manifest, usage or state persistence. cleanupImport
      clears only in-memory staging/ledger and changes job state; the partial project survives and a retry can create another
      project or mismatched usage record.
    affectedAssets:
      - imported source and Git expectations
      - project quotas and usage accounting
      - user-visible project inventory
      - credentials found during import
    evidenceRefs:
      - services/api/src/app.ts:19190-19194
      - services/api/src/app.ts:19484-19541
      - services/api/src/import-pipeline.ts
    existingControls:
      - Pre-commit staging and consent/redaction state machine.
      - In-process credit reservation compensation.
      - Import state transition tests.
    controlFailure: The rollback path does not compensate durable target/storage/manifest/usage effects created before COMMITTED.
    requiredTreatment:
      - Persist a saga/outbox with idempotent compensators for every effect.
      - Hide the target until commit publication or durably delete it before terminal failure.
      - Uniquely bind idempotency key to target and usage effect across replicas.
    requiredTests:
      - failure and restart after every durable write boundary
      - multi-replica same-key concurrency
      - cancellation/timeout/retry with zero partial visibility and zero charge
    owner: project-imports
    reviewer: independent-distributed-systems-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN

  - id: RISK-DEPLOY-002
    gapIds:
      - GAP-DEPLOY-REPRODUCIBILITY-PRIVATE-ACCESS
      - GAP-SUPPLY-CHAIN-DEPLOYED-DIGEST
    title: Publication can lack immutable revision identity, private access enforcement and operational custom domains
    severity: P1
    likelihood: likely
    impact: high
    status: OPEN
    invariant: A published endpoint serves the reviewed immutable artifact under the declared access and domain policy.
    scenario: >-
      Production selects the snapshot path because the revision allowlist is empty, publish copies READY metadata/URL without
      proving artifact bytes, or a user supplies a custom domain/private expectation that is only stored or presented in UI.
      The endpoint can serve unverifiable bytes publicly, without completed DNS ownership or managed TLS lifecycle.
    affectedAssets:
      - deployed application integrity
      - private customer applications
      - custom-domain traffic and TLS identity
      - rollback and incident forensics
    evidenceRefs:
      - infra/helm/platform/values-prod.yaml:137-142
      - services/api/src/deployments.ts:747-793
      - app/routes/projects.$projectId.deployments.tsx:729-760
      - services/api/src/app.ts:30780-33800
    existingControls:
      - Deployment records, status transitions and publish/rollback routes.
      - CommitSha and customDomain metadata fields.
      - A candidate revision-bound path behind an empty rollout allowlist.
    controlFailure: Metadata and a READY state do not prove immutable runtime bytes, access enforcement, DNS ownership or certificate readiness.
    requiredTreatment:
      - Make digest-addressed revision builds the publication identity.
      - Implement fail-closed public/private/password policy at ingress.
      - Add custom-domain ownership, DNS and managed TLS state machines with rollback/revocation.
    requiredTests:
      - deterministic rebuild and runtime imageID equality
      - anonymous, cross-tenant, wrong-password and revoked-access denial
      - dedicated test-domain DNS, TLS issuance, renewal, rollback and cleanup
    owner: deployments-platform
    reviewer: independent-deployment-security-reviewer
    dueGate: 5
    riskAcceptance: FORBIDDEN

  - id: RISK-SEC-008
    gapIds:
      - GAP-SEC-SECRET-SCAN-VERSION-DRIFT
    title: Older CI secret scanner can report green while a newer pinned-equivalent scan finds untriaged candidates
    severity: P1
    likelihood: plausible
    impact: critical
    status: OPEN
    invariant: A green secret gate means the exact repository tree was scanned by the approved engine and every candidate has a reviewed disposition.
    scenario: >-
      CI passes with gitleaks 8.21.2, while the same no-git/redacted scan on gitleaks 8.30.1 returns 12 candidates in committed
      HTML evidence and a browser bundle. If any candidate is real, source consumers receive a credential; if candidates are
      false positives but remain untriaged, teams may either ignore future failures or add an unsafe broad allowlist.
    affectedAssets:
      - repository and CI credentials
      - captured third-party/session data
      - users of committed browser assets
      - confidence in blocking security controls
    evidenceRefs:
      - .github/workflows/security.yaml:126-163
      - .gitleaks.toml:1-52
      - docs/deploy-evidence/2026-07-21-gallery-pricing-v4/replit-pricing-dom.html
      - docs/deploy-evidence/2026-07-22-gallery-pricing-har/pricing-dom.html
      - docs/parity/baseline/snapshots/2026-07-16/gallery-detail-journey-mapper.rendered.html
      - docs/parity/baseline/snapshots/2026-07-16/pricing.html
      - docs/parity/baseline/snapshots/2026-07-16/pricing.rendered.html
      - public/ecode-static/assets/vendor-xterm-DXYfT5Jh.js
    existingControls:
      - Blocking no-git gitleaks CI job with repository configuration and redacted SARIF artifact.
      - Narrow allowlists for several documented synthetic/generated sources.
      - The reported newer scan used --redact, so this audit does not expose candidate values.
    controlFailure: Scanner version drift changes detection results and the newer-engine candidates have no reviewed disposition.
    requiredTreatment:
      - Pin one approved gitleaks version across CI, local tooling and pre-commit, with automated drift detection.
      - Triage candidates by redacted fingerprint and rule; never copy their values into tickets or audit docs.
      - Purge and rotate confirmed credentials, or add narrowly evidenced regression-tested suppression for false positives.
    requiredTests:
      - identical-version/config-hash CI and local exact-tree scans
      - candidate disposition review with no secret material in logs or artifacts
      - confirmed-secret rotation/revocation and old-value denial
      - false-positive fixture plus narrow suppression regression
    owner: application-security-supply-chain
    reviewer: independent-application-security-reviewer
    dueGate: 2
    riskAcceptance: FORBIDDEN
