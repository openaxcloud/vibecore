  - id: RISK-DATA-001
    gapIds:
      - GAP-DATA-ACCOUNT-PURGE
      - GAP-DATA-PROJECT-HARD-DELETE-EXTERNALS
    title: Account and project deletion can leave live or orphaned external data and ownerless organizations
    severity: P1
    likelihood: likely_when_deletion_used
    impact: high
    status: OPEN
    invariant: A deletion is complete only after every owned resource is fenced, deleted, and independently observed absent.
    scenario: Account intent reaches ready-to-purge but has no executor, legacy delete removes only the user, or project hard-delete removes DB metadata while workloads, PVCs, files, deployments and GCS data remain.
    affectedAssets:
      - personal data
      - customer source code
      - organization ownership
      - storage and compute cost
      - audit/compliance evidence
    evidenceRefs:
      - services/api/src/app.ts:9955-10078
      - services/api/src/app.ts:17473-17516
      - services/api/src/app.ts:22586-22626
      - services/api/src/prisma-store.ts:374-394
      - services/api/src/prisma-store.ts:1008-1012
    existingControls:
      - Grace and cancellation state calculations exist.
      - Database delete errors other than not-found are surfaced.
      - Project hard-delete requires server-side authorization and optional typed confirmation.
    controlFailure: No durable cross-system deletion saga, generation fence, recovery, or absence receipt.
    requiredTreatment:
      - Durable deletion state machine and per-resource receipts.
      - Freeze new work, uploads, agents, deploys and billing before purge.
      - Separate legal-retention records from active personal identifiers.
    requiredTests:
      - deletion races with upload, workspace, agent, transfer, publish and billing
      - process crash at every phase
      - physical absence before teardown
    owner: data-lifecycle
    reviewer: privacy-and-sre
    dueGate: 3
    riskAcceptance: FORBIDDEN

  - id: RISK-REL-002
    gapIds:
      - GAP-REL-COLLABORATION-REDIS-OUTAGE
      - GAP-REL-COLLABORATION-WS-BACKOFF
    title: Redis outage or WebSocket flapping can silently split collaborators or create unbounded reconnect churn
    severity: P1
    likelihood: plausible
    impact: high
    status: OPEN
    invariant: Collaboration either preserves its documented ordering model across replicas or clearly becomes unavailable; reconnect remains bounded.
    scenario: Redis publish/subscribe fails and each API replica continues local-only, while clients see connected state. Separately, open-close flapping resets backoff immediately and retries forever at minimum delay.
    affectedAssets:
      - concurrent source edits
      - comments and presence
      - rollback/delete coordination
      - API and ingress capacity
    evidenceRefs:
      - services/api/src/app.ts:7296-7420
      - app/lib/collaboration/projectCollaborationClient.ts:362-485
    existingControls:
      - Redis fan-out includes origin-node deduplication.
      - Local send failures remove stale peers.
      - Terminal and file/port watch transports have bounded stability-gated backoff.
    controlFailure: Broker health is not part of readiness and collaboration client resets before stability.
    requiredTreatment:
      - Define CRDT/OT/locking/LWW recovery contract.
      - Shared-broker degraded health and replay/resync protocol.
      - Stability-gated bounded reconnect.
    requiredTests:
      - two API replicas and controlled Redis loss
      - simultaneous edit ordering and resync
      - ingress rapid open-close sequence
    owner: collaboration
    reviewer: distributed-systems-reviewer
    dueGate: 3
    riskAcceptance: FORBIDDEN_FOR_REALTIME_PARITY

