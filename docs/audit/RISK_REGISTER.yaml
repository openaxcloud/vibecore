    invariant: The reviewed source commit uniquely identifies the verified bytes running in every service.
    scenario: A mutable action or image tag changes after review, web builds against deps:latest, or Helm deploys a tag whose digest lacks matching signature/provenance/SBOM.
    affectedAssets:
