    severity: P1
    likelihood: plausible
    impact: high
    status: OPEN_BLOCKED
    invariant: Admission and backpressure keep every shared dependency within a measured safe envelope.
    scenario: Simultaneous workspace wake, preview, agent burst, storage upload or webhook retry exceeds DB connections, Redis, node capacity, queues or provider limits before quotas serialize.
    affectedAssets:
