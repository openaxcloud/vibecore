target_rules:
  - "Each model has exactly one owning module and one migration owner."
  - "Cross-domain reads use versioned queries; writes use commands or versioned events."
  - "Transactional outbox is written in the same transaction as owner state."
  - "Consumers persist event IDs and are safe under duplicate delivery."
  - "Physical database separation is optional and occurs only after ownership, tracing, shadow reads and restore proof."
  - "Generated Prisma clients and migration registries are central files with one active agent owner."

