gaps:
  - id: GAP-BILL-LEDGER-ATOMICITY
    domain: billing-ledger
    severity: P0
    status: BROKEN
    capability: Atomic credit reservation, settlement, release, and hard-limit enforcement
    expectedBehavior: >-
      A reservation and its balanced ledger transaction are one recoverable atomic state change;
      two distinct concurrent reservations cannot both pass the same hard limit; replay after any
      crash either completes the missing effect or returns an already complete result.
    currentBehavior: >-
      reserveUsage reads the reserved balance before serialization, creates the reservation,
      posts the transaction, and links reserveTxId separately. commitReservation, compensateReservation,
      and releaseReservation transition terminal state before posting or linking their ledger effects.
      An ACTIVE reservation without reserveTxId can later be released as though its hold existed.
    userJourneys:
      - import with credit reservation
      - agent or deployment usage charging
      - spend-cap enforcement
    entryPoints:
      ui: []
      api:
        - ledger reservation consumers
    codeEvidence:
      - path: services/api/src/ledger-store.ts
        symbols:
          - LedgerStore.reserveUsage
          - LedgerStore.commitReservation
          - LedgerStore.compensateReservation
          - LedgerStore.releaseReservation
          - LedgerStore.reapExpiredReservations
        lines: "195-412"
    testEvidence:
      - path: services/api/src/tests/ledger-store-db.spec.ts
        coverage: Sequential happy paths and same-key replay; suite skips without DATABASE_URL.
        missing:
          - two simultaneous reservations with distinct idempotency keys
          - crash after reservation row creation
          - crash after state transition but before ledger transaction
          - recovery of rows with missing reserveTxId or settleTxId
    requiredProof:
      - Real ephemeral PostgreSQL with deterministic barriers and two concurrent connections.
      - Fault injection at every transaction boundary followed by process restart and reconciliation.
      - Balanced-ledger and hard-limit assertions after every replay.
    acceptanceCriteria:
      - Reservation row, ledger transaction, and transaction linkage are atomic or reconciled by a durable outbox/state machine.
      - Hard-limit decision is serialized per organization.
      - No replay can create credit, lose a hold, double-settle, or return success for an incomplete effect.
    owner: billing-ledger
    prNeeded: true

  - id: GAP-BILL-STRIPE-CREDITPACK-IDEMPOTENCY
    domain: billing-webhooks
    severity: P0
    status: BROKEN
    capability: Exactly-once credit-pack entitlement under duplicate delivery and partial failure
    expectedBehavior: >-
      A Stripe checkout or payment intent grants a credit pack at most once even when deliveries overlap,
      the handler crashes after a side effect, or an audit write fails.
    currentBehavior: >-
      The Stripe event is recorded before side effects but deleted on any later exception. The credit pack
      is created before the audit write. If creation succeeds and audit fails, retry deletes the dedup fence
      and grants again. stripePaymentIntentId has no uniqueness constraint and createCreditPack is unconditional.
    userJourneys:
      - buy credits
      - retry delayed Stripe webhook
      - reconcile account balance
    entryPoints:
      ui:
        - billing credit-pack purchase
      api:
        - POST /billing/stripe/webhook
    codeEvidence:
      - path: services/api/src/app.ts
        symbols:
          - processStripeEvent
        lines: "25561-26007"
      - path: packages/database/prisma/schema.prisma
        symbols:
          - CreditPack
        lines: "1983-1994"
      - path: services/api/src/prisma-store.ts
        symbols:
          - PrismaApiStore.createCreditPack
        lines: "4745-4762"
    testEvidence:
      - path: services/api/src/tests/api.spec.ts
        lines: "2622-2680"
        coverage: Sequential duplicate event only.
      - path: services/api/src/tests/credit-packs-billing.spec.ts
        lines: "101-182"
        coverage: Paid and unpaid happy paths.
    requiredProof:
      - Stripe test-mode delivery with concurrent duplicate events.
      - Failure injected after pack creation and before handler acknowledgement.
      - Database assertion that one external payment maps to exactly one entitlement and ledger credit.
    acceptanceCriteria:
      - Unique external payment identity enforced in the database.
      - Event claim, entitlement effect, and durable completion marker are transactionally coupled or reconciled.
      - Audit failure cannot reopen a non-idempotent effect.
    owner: billing-platform
    prNeeded: true

  - id: GAP-DEPLOY-ROLLBACK-DIGEST-LINEARIZATION
    domain: deployment-integrity
    severity: P0
    status: BROKEN
    capability: Digest-verified rollback before a restored release becomes READY
    expectedBehavior: >-
      The digest is calculated from the final restored bytes after all transformations, durably recorded,
      and compared with the intended manifest before the deployment can become READY or receive traffic.
    currentBehavior: >-
      Static rollback verifies the source digest, restores the snapshot, marks the destination READY, and only
      then calculates the destination digest. A failed destination calculation falls back to the source digest.
      General manifest append is best-effort after READY and errors are swallowed.
    userJourneys:
      - rollback a failed production publish
      - inspect immutable deployment history
    entryPoints:
      ui:
        - deployment history rollback
      api:
        - deployment rollback handler
    codeEvidence:
      - path: services/api/src/app.ts
        symbols:
          - writeReleaseManifest
          - static rollback branch
        lines: "6644-6726,33265-33352"
    branchContext:
      candidateBranch: fix/deploy-rollback-integrity
      candidateCommit: b0690bfe1a137912fa39cc1c21ba6c50740acdb3
      mergedIntoAuditCommit: false
      note: Candidate branch evidence is not evidence for audited main.
    requiredProof:
      - Fault-injected restore interrupted before digest, before manifest commit, and before READY.
      - Destination-byte corruption and digest-calculation failure must leave the release non-serving.
      - Real publish v1, publish v2, delete v1 revision, rollback, verify content and digest, then repeat after process restart.
    acceptanceCriteria:
      - No source-digest fallback for destination bytes.
      - READY transition and durable verified manifest share one linearization protocol.
      - Incomplete manifests are reconciled or fail closed before traffic.
    owner: deployments
    prNeeded: true

