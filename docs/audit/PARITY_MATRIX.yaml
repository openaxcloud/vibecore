schema_version: 1
document: "E-Code Replit and Cursor parity matrix"
baseline:
  repository: "openaxcloud/vibecore"
  branch: "main"
  audited_commit: "8a93e995b37de513a142acaf41fed364787c5e4e"
  audit_date: "2026-08-07"
  audit_mode: "Gate 1 read-only repository inspection"
  external_systems_exercised: false
  independent_counter_audit_completed: false
status_policy:
  allowed:
    - SIGNED_PROVEN
    - PROVEN_REVIEW_PENDING
    - IMPLEMENTED_UNPROVEN
    - PARTIAL
    - STUB
    - BROKEN
    - ABSENT
    - OUT_OF_SCOPE
    - BLOCKED
    - UNKNOWN
    - REFUSED
  signed_proven_allowed_in_this_matrix: false
  rationale: "No exact-SHA external proof or independent counter-audit was completed. Source tests were inspected but not treated as live proof."
tracking_alignment:
  source: "REPLIT_PARITY.md"
  scope: "Gallery, import, remix, empty-project, and Gallery application sub-scope only; it is not the complete Replit or Cursor parity source."
  exact_sha_live_tracking_replayed: false
  reservation: "Existing tracking claims and evidence were not replayed on 8a93e995b37de513a142acaf41fed364787c5e4e and therefore do not upgrade any row to PROVEN_REVIEW_PENDING or SIGNED_PROVEN."
