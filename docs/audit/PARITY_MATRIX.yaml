  - stable_id: "REPLIT-CREATE-IMPORT-001"
    capability: "Project creation and import"
    official_reference: "https://docs.replit.com/replit-app/import-to-replit"
    user_journey: "Create an empty project or import GitHub, Bitbucket, ZIP, template, monorepo, branches, submodules, LFS, and large or hostile repositories with resumable, atomic cleanup."
    ecode_status: PARTIAL
    ui_entry:
      - "app/lib/import-hub.ts:85-197 — import hub tile catalogue"
    api:
      - "services/api/src/app.ts:19233-19542 — secure import staging and execution route"
    code_evidence:
      - "services/api/src/import-pipeline.ts:62-79 — import state machine"
      - "services/api/src/import-pipeline.ts:158-193 — only github, bitbucket, zip, and empty are executed"
      - "services/api/src/import-pipeline.ts:251-370 — secret scanning and consent checks"
      - "services/api/src/project-storage.ts:915-954 — shallow Git clone with --depth=1"
      - "services/api/src/app.ts:19484-19502 — target Project is created before file writes"
      - "services/api/src/app.ts:19533-19541 — catch path does not delete the partially created Project"
      - "services/api/src/app.ts:19190-19194 — cleanup removes staging only"
    positive_evidence: "Source tests exercise import routes with test stores and doubles; they were not rerun as exact-SHA external imports."
    negative_evidence: "No proof for private GitHub credentials, full history, branches, submodules, LFS, archive bombs, malicious repositories, or absence of residual target data after failure."
    concurrency_evidence: "Idempotency state is process-local; no distributed two-request race proof."
    live_evidence: "BLOCKED — requires dedicated public/private Git repositories, hostile fixtures, large repositories, and an ephemeral storage/database environment."
    risk: "A failed import can leave a visible partial project, and shallow clone breaks history-preservation parity."
    reservation: "Import hub breadth is greater than the actually executed provider set. The failure rollback path is BROKEN."
    owner: "Projects and Imports"
    pr_required: true

