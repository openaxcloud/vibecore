name: Préparer la pile E2E
description: >-
  Monte la pile locale complète dont la suite E2E a besoin : dépôt, Node, pnpm,
  dépendances, navigateurs Playwright, postgres/redis/mailpit, base, API, web,
  admin.

  POURQUOI UNE ACTION COMPOSITE ET PAS UN COPIER-COLLER. Le canari iOS est NON
  BLOQUANT et tournait pourtant dans le job qui porte le contrôle requis : ses
  15 min 12 s mesurées étaient donc sur le chemin critique de CHAQUE mise en
  production. Le sortir dans son propre job demande la même préparation — et
  deux copies de 93 lignes divergeraient au premier changement. C'est
  exactement ce que disait `docs/bugs/DETTE-CI-ACTION-COMPOSITE-001.md` : à
  faire par une action composite, pas par un copier-coller.

  Les variables d'environnement (ports, URL, clé du fournisseur) viennent du
  bloc `env:` du JOB appelant : les étapes d'une action composite en héritent.
  Rien n'est donc dupliqué côté configuration non plus.

inputs:
  navigateurs:
    description: >-
      Navigateurs Playwright à installer. `chromium` suffit à la suite
      bloquante ; le canari iOS a besoin de `webkit` en plus. Installer WebKit
      pour rien coûte du temps sur le chemin critique.
    required: false
    default: chromium

runs:
  using: composite
  steps:
  - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

  - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
    with:
      node-version: 22

  - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    with:
      version: 9.14.4
      run_install: false

  - name: Install
    shell: bash
    run: pnpm install --frozen-lockfile

  - name: Install Playwright browsers
    shell: bash
    run: |
      # BUG-CI-008 — `--with-deps` lance un `apt-get update` : quand un
      # miroir amont réécrit son index PENDANT le run, apt rend « Hash Sum
      # mismatch » et la porte E2E meurt AVANT le moindre test. Mesuré le
      # 2026-09-09 (run E2E 1828, sha dcfb310f, 49 s) : `Err:10
      # https://dl.google.com/linux/chrome-stable/deb` — index publié à
      # 09:41, run à 17:16. Rien ne le retentait.
      #
      # Les deux moitiés sont séparées pour ne retenter QUE celle qui dépend
      # d'un miroir extérieur. Purger /var/lib/apt/lists est ce qui répare
      # un Hash Sum mismatch : relancer sans purger réutilise l'index périmé.
      # Aucune sortie d'erreur n'est masquée (règle 13) — c'est la commande
      # dont on lit le résultat.
      for attempt in 1 2 3; do
        if pnpm exec playwright install-deps chromium webkit; then break; fi
        echo "::warning::apt en échec (tentative $attempt/3) — purge de l'index puis reprise."
        if [ "$attempt" = "3" ]; then exit 1; fi
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get update || true
        sleep 10
      done
      pnpm exec playwright install chromium

      # WebKit UNIQUEMENT si l'appelant le demande. La suite bloquante n'en a
      # pas besoin : l'installer pour rien remettrait du temps sur le chemin
      # critique, ce que ce découpage existe précisément pour enlever.
      if [ "${{ inputs.navigateurs }}" = "chromium,webkit" ]; then

        # Sans faire échouer l'étape : une indisponibilité amont du binaire ne
        # doit pas fermer la porte E2E de tout le monde.
        pnpm exec playwright install webkit || echo "::warning::installation de WebKit en échec — le canari iOS sera sauté."
      fi

  - name: Validate AI provider secret for E2E
    shell: bash
    run: |
      if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
        echo "Production E2E requires ANTHROPIC_API_KEY because the default IDE model is Anthropic."
        exit 1
      fi

  - name: Start local dependencies
    shell: bash
    run: |
      trap 'docker compose --env-file .env -f docker-compose.dev.yml ps; docker compose --env-file .env -f docker-compose.dev.yml logs --tail=120 postgres redis mailpit' ERR
      touch .env
      # BUG-CI-008, règle 7 — la seconde tentative n'existait que dans
      # i18n-live-audit.yml : les trois fichiers portaient trois niveaux de
      # robustesse différents pour la MÊME pile. `down -v` uniquement dans
      # la branche d'échec, pour repartir d'un volume propre.
      if ! docker compose --env-file .env -f docker-compose.dev.yml up -d --wait --wait-timeout 180 postgres redis mailpit; then
        echo '::warning::Les dépendances ne sont pas devenues saines ; on repart proprement pour une seconde et dernière tentative.'
        docker compose --env-file .env -f docker-compose.dev.yml logs --tail=80 postgres redis mailpit || true
        docker compose --env-file .env -f docker-compose.dev.yml down -v || true
        docker compose --env-file .env -f docker-compose.dev.yml up -d --wait --wait-timeout 180 postgres redis mailpit
      fi
      npx wait-on --timeout 180000 --interval 1000 tcp:127.0.0.1:55432 tcp:127.0.0.1:56379 tcp:127.0.0.1:8025

  - name: Prepare database
    shell: bash
    run: |
      pnpm --filter @vibecore/database db:deploy
      pnpm --filter @vibecore/database db:seed

  - name: Start API
    shell: bash
    run: |
      pnpm --filter @vibecore/api dev > /tmp/vibecore-api.log 2>&1 &
      echo $! > /tmp/vibecore-api.pid
      npx wait-on --timeout 180000 --interval 1000 http://127.0.0.1:3001/health

  - name: Build web app
    shell: bash
    run: pnpm run build

  - name: Start web app
    shell: bash
    run: |
      HOST=127.0.0.1 PORT=5173 NODE_ENV=production pnpm run start:node > /tmp/vibecore-web.log 2>&1 &
      echo $! > /tmp/vibecore-web.pid
      npx wait-on --timeout 180000 --interval 1000 http://127.0.0.1:5173

  # PLAYWRIGHT_SKIP_WEB_SERVER means Playwright no longer boots the admin
  # dev server (5174) either — the workflow provides it, like the web app.
  - name: Start admin app
    shell: bash
    run: |
      pnpm --filter @vibecore/admin dev > /tmp/vibecore-admin.log 2>&1 &
      echo $! > /tmp/vibecore-admin.pid
      npx wait-on --timeout 180000 --interval 1000 http://127.0.0.1:5174
