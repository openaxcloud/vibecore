name: French i18n live audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: i18n-live-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-audit:
    name: Playwright ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Every viewport is independent proof. Keep collecting the other three
      # result sets when one viewport exposes untranslated copy or overflow.
      fail-fast: false
      matrix:
        project:
          - desktop-1440
          - desktop-1024
          - tablet-768
          - mobile-390

    env:
      CI: true
      HUSKY: 0
      DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55432/vibecore
      REDIS_URL: redis://127.0.0.1:56379
      POSTGRES_PORT: 55432
      REDIS_PORT: 56379
      API_HOST: 127.0.0.1
      API_PORT: 3001
      API_BASE_URL: http://127.0.0.1:3001
      SAAS_API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      # The workflow starts the real API through its repository dev script and
      # the built SSR app. This prevents Playwright from starting duplicate
      # development servers on their ports.
      PLAYWRIGHT_SKIP_WEB_SERVER: '1'
      I18N_FULL_LIVE_AUDIT: '1'
      I18N_CAPTURE_ALL: '1'
      I18N_EXPECTED_AUDIT_JSON: '282'
      I18N_EXPECTED_SCREENSHOTS: '564'
      I18N_EXPECTED_NEGOTIATION_JSON: '2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Match the production E2E workflow's real local dependencies instead of
      # mocking registration, persistence, mail delivery, or cache behavior.
      # `--wait` bloque jusqu'à ce que les trois services soient déclarés SAINS
      # par leurs propres healthchecks (`pg_isready` pour postgres), et pas
      # seulement démarrés. Sans lui, l'attente ci-dessous ne testait que
      # l'OUVERTURE DU PORT — or postgres ouvre son port avant d'accepter des
      # requêtes, et répond `FATAL: the database system is starting up`. La
      # migration partait alors dans le vide et rendait la CI rouge au hasard.
      - name: Start local dependencies
        run: |
          trap 'docker compose --env-file .env -f docker-compose.dev.yml ps; docker compose --env-file .env -f docker-compose.dev.yml logs --tail=120 postgres redis mailpit' ERR
          touch .env
          docker compose --env-file .env -f docker-compose.dev.yml up -d --wait --wait-timeout 180 postgres redis mailpit
          wait_for_tcp() {
            local host="$1"
            local port="$2"
            local service="$3"

            for _ in {1..180}; do
              if (exec 3<>"/dev/tcp/${host}/${port}") 2>/dev/null; then
                exec 3>&-
                exec 3<&-
                return 0
              fi

              sleep 1
            done

            echo "Timed out waiting for ${service} on ${host}:${port}" >&2
            return 1
          }
          wait_for_tcp 127.0.0.1 55432 postgres
          wait_for_tcp 127.0.0.1 56379 redis
          wait_for_tcp 127.0.0.1 8025 mailpit

      - name: Prepare database
        run: |
          pnpm --filter @vibecore/database db:deploy
          pnpm --filter @vibecore/database db:seed

      - name: Start API
        run: |
          pnpm --filter @vibecore/api dev > /tmp/vibecore-i18n-api-${{ matrix.project }}.log 2>&1 &
          echo $! > /tmp/vibecore-i18n-api-${{ matrix.project }}.pid
          for _ in {1..180}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3001/health > /dev/null; then
              exit 0
            fi

            sleep 1
          done
          echo 'Timed out waiting for the API health endpoint' >&2
          exit 1

      - name: Build web app
        run: pnpm run build

      - name: Start production web app
        run: |
          HOST=127.0.0.1 PORT=5173 NODE_ENV=production pnpm run start:node > /tmp/vibecore-i18n-web-${{ matrix.project }}.log 2>&1 &
          echo $! > /tmp/vibecore-i18n-web-${{ matrix.project }}.pid
          for _ in {1..180}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi

            sleep 1
          done
          echo 'Timed out waiting for the production web app' >&2
          exit 1

      - name: Run exhaustive EN/FR live audit
        run: >-
          pnpm exec playwright test
          tests/e2e/i18n-french-live.spec.ts
          --config=playwright.i18n.config.ts
          --project=${{ matrix.project }}
          --retries=0

      # Per viewport: (84 sitemap + 2 real 404 + 7 auth + 34 user + 14
      # project routes) x 2 themes = 282 audit JSON files. Each route/theme
      # pair captures EN and FR, for 564 PNG files. Locale negotiation adds
      # exactly two separate JSON attachments. The audit config deliberately
      # disables retries so these counts always describe one complete pass.
      - name: Verify complete proof set
        if: always()
        shell: bash
        run: |
          audit_json_count="$(find test-results -type f -path '*/i18n-proof/i18n-audit-*.json' -print | wc -l | tr -d '[:space:]')"
          screenshot_count="$(find test-results -type f -path '*/i18n-proof/*.png' -print | wc -l | tr -d '[:space:]')"
          negotiation_json_count="$({
            find test-results -type f \
              \( -path '*/i18n-proof/first-visit-language-negotiation.json' \
              -o -path '*/i18n-proof/navigator-language-fallback.json' \) \
              -print
          } | wc -l | tr -d '[:space:]')"

          printf 'Audit JSON: %s/%s\n' "$audit_json_count" "$I18N_EXPECTED_AUDIT_JSON"
          printf 'Screenshots: %s/%s\n' "$screenshot_count" "$I18N_EXPECTED_SCREENSHOTS"
          printf 'Negotiation JSON: %s/%s\n' "$negotiation_json_count" "$I18N_EXPECTED_NEGOTIATION_JSON"

          test "$audit_json_count" -eq "$I18N_EXPECTED_AUDIT_JSON"
          test "$screenshot_count" -eq "$I18N_EXPECTED_SCREENSHOTS"
          test "$negotiation_json_count" -eq "$I18N_EXPECTED_NEGOTIATION_JSON"

      - name: Collect local stack diagnostics
        if: always()
        run: |
          docker compose --env-file .env -f docker-compose.dev.yml ps > /tmp/vibecore-i18n-dependencies-${{ matrix.project }}.log 2>&1 || true
          docker compose --env-file .env -f docker-compose.dev.yml logs --no-color postgres redis mailpit >> /tmp/vibecore-i18n-dependencies-${{ matrix.project }}.log 2>&1 || true

      - name: Upload i18n audit proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-live-audit-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: error
          retention-days: 14

      - name: Upload local stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-live-audit-logs-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            /tmp/vibecore-i18n-api-${{ matrix.project }}.log
            /tmp/vibecore-i18n-web-${{ matrix.project }}.log
            /tmp/vibecore-i18n-dependencies-${{ matrix.project }}.log
          if-no-files-found: error
          retention-days: 14
