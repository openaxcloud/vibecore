name: Private Runtime Recipe (functional only)

on:
  workflow_dispatch:
  push:
    branches: [validation/private-runtime-20261113-7b970996, qa/vibecore-same-pvc-932]

permissions:
  contents: read

jobs:
  private-runtime:
    if: ${{ github.ref != 'refs/heads/qa/vibecore-same-pvc-932' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HUSKY: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.14.4
          run_install: false
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned kind and kubectl clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-runtime-bin"
          cd "$RUNNER_TEMP/private-runtime-bin"
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          curl -fsSLo kind.sha256 https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64.sha256sum
          echo "$(cut -d ' ' -f 1 kind.sha256)  kind" | sha256sum -c -
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod 0755 kind kubectl
          echo "$RUNNER_TEMP/private-runtime-bin" >> "$GITHUB_PATH"
      - name: Validate recipe contracts
        run: |
          pnpm exec vitest run scripts/private-runtime-recipe/checks.test.ts
          pnpm exec tsc -p scripts/private-runtime-recipe/tsconfig.json
      - name: Real API to manager to pod recipe
        run: pnpm exec tsx scripts/private-runtime-recipe/run.ts
      - name: Remove only the generated local cluster (also on cancellation)
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/vibecore-private-runtime-state.json"; then
            node_modules/.bin/tsx scripts/private-runtime-recipe/run.ts --cleanup
          fi
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-runtime-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: private-runtime-evidence/
          if-no-files-found: ignore
          retention-days: 7

  same-pvc-932:
    if: ${{ github.event_name == 'push' && github.repository == 'openaxcloud/vibecore' && github.ref == 'refs/heads/qa/vibecore-same-pvc-932' && github.run_attempt == 1 && github.event.before == '686f1f7c9ff767d0cc8fdcef43697cb70c3f882a' && github.event.after == github.sha && github.event.forced == false && github.event.created == false && github.event.deleted == false && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: product
    env:
      HUSKY: '0'
      CI: 'true'
      E2E_PROVIDER_MODE: absent
      PRIVATE_RUNTIME_BROWSER_BASELINE: '1'
      PRIVATE_RUNTIME_SAME_PVC: '1'
      PRIVATE_RUNTIME_QA_SOURCE_ROOT: ${{ github.workspace }}/qa-source
    steps:
      - name: Checkout immutable reviewed workflow and harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 2
          path: qa-source
          persist-credentials: false
      - name: Checkout exact detached product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5d352aaf354b6098b0a2ad4283b4ba48d76f9ad7
          path: product
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.14.4
          run_install: false
      - name: Overlay reviewed QA paths and attest both sources
        run: |
          set -euo pipefail
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/aster-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          node "$PRIVATE_RUNTIME_QA_SOURCE_ROOT/scripts/aster-browser/prepare-overlay.mjs" "$PRIVATE_RUNTIME_QA_SOURCE_ROOT" "$PWD"
          node --input-type=module -e "import {attestSamePvcSources} from './scripts/aster-browser/source-attestation.mjs'; console.log(JSON.stringify(attestSamePvcSources()));"
      - name: Frozen product dependency installation
        run: pnpm install --frozen-lockfile
      - name: Static harness checks before cluster allocation
        run: |
          set -euo pipefail
          pnpm exec tsc -p scripts/aster-browser/tsconfig.json
          pnpm exec tsc -p scripts/private-runtime-recipe/tsconfig.json
          node --test scripts/aster-browser/*.node-test.mjs
          pnpm exec vitest run scripts/private-runtime-recipe/checks.test.ts scripts/aster-browser/stack.spec.ts scripts/aster-browser/baseline-policy.spec.ts scripts/aster-browser/environment.spec.ts scripts/aster-browser/contracts.spec.ts scripts/aster-browser/gateway.spec.ts
      - name: Install pinned local clients and Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-runtime-bin"
          pushd "$RUNNER_TEMP/private-runtime-bin"
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          curl -fsSLo kind.sha256 https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64.sha256sum
          echo "$(cut -d ' ' -f 1 kind.sha256)  kind" | sha256sum -c -
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod 0755 kind kubectl
          echo "$RUNNER_TEMP/private-runtime-bin" >> "$GITHUB_PATH"
          popd
          pnpm exec playwright install --with-deps chromium
      - name: Real disposable same-PVC browser regression
        id: recipe932
        run: |
          set -euo pipefail
          if pnpm exec tsx scripts/private-runtime-recipe/run.ts > "$RUNNER_TEMP/same-pvc-private-run.log" 2>&1 3> "$RUNNER_TEMP/same-pvc-diagnostics.jsonl"; then
            echo 'Recipe finished; verified outcome follows after cleanup.'
          else
            echo '::error::Same-PVC recipe did not complete. Raw logs withheld; no regression pass.'
            exit 1
          fi
      - name: Always clean only owned disposable cluster after launch
        id: cleanup932
        if: ${{ always() && steps.recipe932.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/vibecore-private-runtime-state.json"; then
            if ! node_modules/.bin/tsx scripts/private-runtime-recipe/run.ts --cleanup > "$RUNNER_TEMP/same-pvc-private-cleanup.log" 2>&1 3> "$RUNNER_TEMP/same-pvc-cleanup-diagnostics.jsonl"; then
              echo '::error::Owned-cluster cleanup failed; result is not a pass.'
              exit 1
            fi
          else
            printf '["cleanup","no-state"]\n' > "$RUNNER_TEMP/same-pvc-cleanup-diagnostics.jsonl"
          fi
          echo 'Owned-cluster cleanup completed or no cluster state was created.'
      - name: Sanitized regression verdict only
        if: ${{ always() }}
        env:
          RECIPE_OUTCOME: ${{ steps.recipe932.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup932.outcome }}
        run: |
          if test -f scripts/private-runtime-recipe/diagnostics.mjs; then
            echo 'Recipe checkpoints (not a verdict):'
            node scripts/private-runtime-recipe/diagnostics.mjs "$RUNNER_TEMP/same-pvc-diagnostics.jsonl"
            echo 'Cleanup checkpoints (not a verdict):'
            node scripts/private-runtime-recipe/diagnostics.mjs "$RUNNER_TEMP/same-pvc-cleanup-diagnostics.jsonl"
          fi
          if test -f scripts/aster-browser/same-pvc-summary.mjs; then
            node scripts/aster-browser/same-pvc-summary.mjs
          else
            echo '::error::Same-PVC regression NOT VERIFIED: setup incomplete.'
            exit 1
          fi
