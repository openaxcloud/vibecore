name: Private Runtime Recipe (functional only)

on:
  workflow_dispatch:
    inputs:
      browser_baseline:
        description: 'Run the non-destructive authenticated browser baseline only'
        type: boolean
        default: false
  push:
    branches: [validation/private-runtime-20261113-7b970996]

permissions:
  contents: read

jobs:
  private-runtime:
    # The dedicated baseline ref must never allocate a runner on push or in the full recipe mode.
    if: ${{ github.ref != 'refs/heads/qa/aster-browser-baseline-20261115' || (github.event_name == 'workflow_dispatch' && inputs.browser_baseline) }}
    # Keep the runner compatible with the pinned Playwright browser binaries.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HUSKY: '0'
      CI: 'true'
      E2E_PROVIDER_MODE: absent
      PRIVATE_RUNTIME_BROWSER_BASELINE: ${{ inputs.browser_baseline && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.14.4
          run_install: false
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned kind and kubectl clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-runtime-bin"
          cd "$RUNNER_TEMP/private-runtime-bin"
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          curl -fsSLo kind.sha256 https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64.sha256sum
          echo "$(cut -d ' ' -f 1 kind.sha256)  kind" | sha256sum -c -
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod 0755 kind kubectl
          echo "$RUNNER_TEMP/private-runtime-bin" >> "$GITHUB_PATH"
      - name: Install Chromium for the optional browser baseline
        if: inputs.browser_baseline
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/aster-playwright"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          pnpm exec playwright install --with-deps chromium
      - name: Validate recipe contracts
        run: |
          pnpm exec vitest run scripts/private-runtime-recipe/checks.test.ts
          pnpm exec tsc -p scripts/private-runtime-recipe/tsconfig.json
          pnpm exec vitest run scripts/aster-browser/stack.spec.ts scripts/aster-browser/baseline-policy.spec.ts scripts/aster-browser/environment.spec.ts
      - name: Real API to manager to pod recipe
        id: recipe
        run: pnpm exec tsx scripts/private-runtime-recipe/run.ts
      - name: Remove only the generated local cluster (also on cancellation)
        id: cleanup
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/vibecore-private-runtime-state.json"; then
            node_modules/.bin/tsx scripts/private-runtime-recipe/run.ts --cleanup
          fi
      - name: Bounded browser baseline summary
        if: always() && inputs.browser_baseline
        env:
          BASELINE_JOB_STATUS: ${{ job.status }}
          BASELINE_RECIPE_OUTCOME: ${{ steps.recipe.outcome }}
          BASELINE_CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          if test -f scripts/aster-browser/job_summary.py; then
            python3 scripts/aster-browser/job_summary.py
          else
            printf '%s\n' 'Browser baseline: summary unavailable because checkout is incomplete.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized evidence
        if: always() && !inputs.browser_baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-runtime-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            private-runtime-evidence/
            scripts/aster-browser/aster-browser-results/
          if-no-files-found: ignore
          retention-days: 7
