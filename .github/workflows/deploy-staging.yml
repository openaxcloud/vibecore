name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest
  push:
    branches: [stable]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: https://${{ vars.STAGING_APP_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          # docker.yml publishes images tagged `sha-<7char>` (docker
          # metadata-action `type=sha,format=short`). On a push to `stable`
          # we must reference that exact tag, NOT the full 40-char github.sha,
          # which was never published and causes ImagePullBackOff.
          if [ -n "${IMAGE_TAG_INPUT}" ]; then
            RESOLVED="${IMAGE_TAG_INPUT}"
          else
            RESOLVED="sha-$(git rev-parse --short=7 HEAD)"
          fi
          echo "image_tag=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${RESOLVED}"
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.STAGING_APP_CLUSTER }}
          location: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy platform chart
        run: |
          helm upgrade --install vibecore infra/helm/platform \
            --namespace vibecore \
            --create-namespace \
            --set global.environment=staging \
            --set global.imageTag="${{ steps.tag.outputs.image_tag }}" \
            --set global.appDomain="${{ vars.STAGING_APP_DOMAIN }}" \
            --set global.previewDomain="${{ vars.STAGING_PREVIEW_DOMAIN }}"

      - name: Smoke tests
        env:
          SYNTHETIC_BASE_URL: https://${{ vars.STAGING_APP_DOMAIN }}
        run: pnpm synthetic:health
