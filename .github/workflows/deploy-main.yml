# Continuous deployment to production on push to main.
#
# Why this exists: every prod deploy used to be a manual `gcloud builds submit`
# from a laptop followed by a hand-typed `helm upgrade`. This wires the same
# steps into CI.
#
# Relationship to deploy-prod.yml: that workflow is the *gated, manual* path
# (staging-validation gate + rollback confirmation + immutable pinned tag).
# This workflow is the *continuous* path: it builds the two prod image tiers
# from the pushed commit and rolls them out. Both deploy the same chart/release;
# they are intentionally separate because the manual path's required inputs and
# `confirm_rollback_plan == READY` gate cannot be satisfied by a push event.
#
# Build constraints (see infra/cloudbuild/*.yaml and docs/INFRASTRUCTURE.md):
#   * Only ONE Cloud Build worker slot exists, and cloudbuild.yaml's 7 parallel
#     builds deadlock an 8GB VM. So we run the two tier builds SEQUENTIALLY via
#     two blocking `gcloud builds submit` calls (no --async).
#   * runtime-tier.yaml rebuilds the `deps` base image; single-web.yaml only
#     *consumes* a deps image via _DEPS_TAG. Runtime therefore builds first and
#     publishes deps:<sha>, then web builds against that exact deps tag so the
#     web image matches this commit's lockfile.
#   * runtime-tier.yaml serializes api, workspace-manager, preview-proxy,
#     ai-gateway, worker and screenshotter on the 8 GB worker. Admin is not built
#     by this continuous path; its current digest is carried forward unchanged.
#
# ---------------------------------------------------------------------------
# RELEASE INTEGRITY (exact-SHA gate) — added 2026-08-12
# ---------------------------------------------------------------------------
# Until now this workflow built and rolled out EVERY push to main with no
# relationship to that commit's test results. Verified against the GitHub API,
# three commits reached production on a red or cancelled pipeline:
#
#   113c17e8  Production CI = failure    -> deployed
#   9fc8a243  Production CI = failure    -> deployed
#   3a53b439  Production CI + Quality = cancelled -> deployed
#
# and Production E2E had never run on any of them, because e2e.yml did not
# trigger on push to main at all.
#
# The structure below closes that. Read it as four layers:
#
#   resolve-target   binds the whole run to ONE full 40-hex commit. There is no
#                    free-form tag input any more: a dispatch names a commit, and
#                    that commit must already be on main.
#   release-gate     proves CI + E2E + Security + Quality are green FOR THAT EXACT
#                    COMMIT. It holds NO cloud credentials — `id-token: write` is
#                    granted per-job, and only to build-and-deploy — so a refusal
#                    is structurally before WIF, not merely before it in reading
#                    order.
#   preflight-gates  repo-local policy (secret scan, signing wiring).
#   build-and-deploy builds, resolves every image to an immutable DIGEST, scans
#                    and signature-verifies THAT digest, records a manifest
#                    (service -> source sha -> build id -> digest -> signature ->
#                    SBOM), deploys BY DIGEST, and then proves the running pods
#                    report those digests back.
#
# Break-glass (when the gate must be bypassed) is deliberately NOT here: it lives
# in deploy-break-glass.yml, which can only deploy a previously signed manifest
# and needs two approvals. Adding a bypass switch to this workflow would make the
# gate optional, which is the same as not having it.

name: Deploy Production (Continuous)

on:
  push:
    branches: [main]
    # Doc/branding-only commits don't change any runtime image, so skip the
    # (expensive) build+rollout for them. Anything under docs/ or any *.md file
    # (README, CLAUDE.md, runbooks) is ignored; a commit that also touches code
    # still deploys. Only affects CI triggering, never the runtime.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      target_sha:
        description: >-
          Full 40-hex commit sha to deploy. Must already be an ancestor of
          origin/main and must pass the same release gate as a push. Leave empty
          to deploy the head of main.
        required: false
      force_tiers:
        description: >-
          Force which tiers to build (comma list of web/runtime/wsagent, or 'all'),
          bypassing path detection. For validating conditional builds via dispatch.
        required: false

# NOTE: `id-token: write` is deliberately NOT granted here. Granting it at the
# workflow level hands a WIF-exchangeable token to every job, including the gate
# that is supposed to be able to refuse before any cloud credential exists. It is
# granted on build-and-deploy alone.
permissions:
  contents: read

# Never run two production rollouts at once, and never cancel an in-flight one
# (cancelling mid-`helm upgrade --atomic` or mid-build leaves things half-applied).
concurrency:
  group: deploy-production-continuous
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPO: vibecore-prod-containers
  FLEET_MEMBERSHIP: vibecore-prod-app
  HELM_RELEASE: vibecore
  HELM_NAMESPACE: vibecore

jobs:
  # ---------------------------------------------------------------------------
  # Bind the run to exactly one commit, before anything else happens.
  # ---------------------------------------------------------------------------
  resolve-target:
    name: Resolve target commit (exact SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      short_sha: ${{ steps.target.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the dispatch path has to prove the requested commit is
          # actually on main, which needs main's history locally.
          fetch-depth: 0

      - name: Resolve and bind target SHA
        id: target
        env:
          # Via env, never interpolated into the shell: this value is attacker-
          # controllable on a dispatch and the run must not be able to execute it.
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${TARGET_SHA_INPUT:-}" ]; then
            # A dispatch may only name a commit — never a free-form image tag.
            # The old `short_sha` input accepted any 7-40 hex string and used it
            # directly as the tag to build and deploy, with no requirement that it
            # correspond to a commit, to main, or to anything that had been tested.
            if ! printf '%s' "${TARGET_SHA_INPUT}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::target_sha must be a FULL 40-hex commit sha (got '${TARGET_SHA_INPUT}')"
              exit 1
            fi
            TARGET_SHA="${TARGET_SHA_INPUT}"

            if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
              echo "::error::${TARGET_SHA} is not a commit in this repository"
              exit 1
            fi
            # Must already be on main. Without this, a dispatch could deploy a
            # commit that only ever existed on a side branch — reviewed by nobody,
            # merged by nobody — while still passing a per-commit check gate.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "${TARGET_SHA}" origin/main; then
              echo "::error::${TARGET_SHA} is not an ancestor of origin/main — refusing to deploy an off-main commit"
              exit 1
            fi
          else
            TARGET_SHA="${PUSH_SHA}"
          fi

          if ! printf '%s' "${TARGET_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::resolved target sha is not 40-hex: '${TARGET_SHA}'"
            exit 1
          fi

          # The image tag is DERIVED from the target commit, never supplied. This is
          # what makes "the tag we build" and "the commit we gated" the same fact.
          SHORT_SHA="${TARGET_SHA:0:10}"

          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "### Target commit"
            echo ""
            echo "- **SHA:** \`${TARGET_SHA}\`"
            echo "- **Derived image tag:** \`${SHORT_SHA}\`"
            echo "- **Trigger:** \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The gate. Holds no cloud credentials — see the permissions block.
  # ---------------------------------------------------------------------------
  release-gate:
    name: Release gate — required checks green for THIS commit (blocking)
    needs: [resolve-target]
    runs-on: ubuntu-latest
    # Long enough to outlast a full CI+E2E cycle for the commit that was just
    # pushed; the gate itself refuses within seconds once a check goes red.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read # read other workflows' runs for this commit
      # NO id-token. A refusal here happens before any Google credential exists.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Assert checkout is exactly the target commit
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "HEAD=${HEAD_SHA} TARGET=${TARGET_SHA}"
          if [ "${HEAD_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::checkout HEAD ${HEAD_SHA} != target ${TARGET_SHA}"
            exit 1
          fi

      - name: Assert every required workflow file exists at the pinned path
        run: |
          set -euo pipefail
          # The policy pins workflows by numeric id + path. If the file is gone at
          # this commit, the gate would sit waiting for a run that can never start,
          # and the failure would look like a timeout instead of what it is.
          missing=0
          while read -r p; do
            if [ ! -f "${p}" ]; then
              echo "::error::required workflow file '${p}' does not exist at this commit"
              missing=1
            else
              echo "ok: ${p}"
            fi
          done < <(python3 -c "import json;[print(w['path']) for w in json.load(open('scripts/release-gate/required-checks.json'))['requiredWorkflows']]")
          [ "${missing}" -eq 0 ]

      - name: Self-test the gate engine before trusting it
        # Hermetic (Node stdlib only, no node_modules): the gate proves its own
        # refusal logic on fixtures before it is allowed to decide anything real.
        run: node scripts/release-gate/verify-required-checks.mjs --self-test

      - name: Verify required checks are green for this exact commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          node scripts/release-gate/verify-required-checks.mjs \
            --sha "${TARGET_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json gate-verdict.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-verdict-${{ needs.resolve-target.outputs.short_sha }}
          path: gate-verdict.json
          if-no-files-found: warn

  # B6 — gates that must pass BEFORE anything is built or rolled out.
  #
  # security.yaml already runs gitleaks on push/PR, but that is a *separate*
  # workflow: a red run there does not stop this one, so a secret could still
  # ride into production. This job puts the same check on the deploy path
  # itself, where failing it actually prevents the rollout.
  preflight-gates:
    name: Preflight gates (secrets + pipeline policy, blocking)
    needs: [resolve-target, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Assert checkout is exactly the target commit
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::checkout HEAD ${HEAD_SHA} != target ${TARGET_SHA}"
            exit 1
          fi
          echo "scanning ${HEAD_SHA}"

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (blocking)
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

      # Policy gate: the image-signing steps are what make the Kyverno admission
      # policy satisfiable. If someone deletes or renames them, builds keep
      # succeeding and the failure only surfaces later as pods refused at
      # admission — during a rollout, at the worst possible moment. Assert here
      # instead, where the error is obvious and cheap.
      # The validator parses the step structure rather than grepping it. A
      # line-range grep here is actively dangerous: an awk range like
      # /id: sign-image/,/^  - id: [^s]/ never closes when the following step
      # also starts with "s" (scan-images), so it swallows that step's
      # `allowFailure: true` and the gate fails on a perfectly good tree.
      # The validator is HERMETIC — pure Python 3 stdlib, no PyYAML — so the gate
      # never depends on a dependency that happens to be preinstalled on the
      # runner. --self-test first proves the parser itself before it is trusted.
      - name: Pipeline policy — image signing must still be wired
        run: |
          set -euo pipefail
          python3 scripts/validate-image-signing-wired.py --self-test
          python3 scripts/validate-image-signing-wired.py

      # Same idea, applied to the gate itself: prove that THIS workflow still runs
      # the deploy behind the release gate, still withholds WIF from the gate job,
      # still pins the rollout by digest, and still requires all four pipelines.
      # A gate that can be quietly unwired is a gate with an expiry date.
      - name: Pipeline policy — the exact-SHA release gate must still be wired
        run: |
          set -euo pipefail
          node scripts/release-gate/validate-deploy-gate-wired.mjs --self-test
          node scripts/release-gate/validate-deploy-gate-wired.mjs

  build-and-deploy:
    name: Build tiers sequentially, then helm upgrade by digest
    # Both gates, explicitly. `preflight-gates` already needs `release-gate`, but
    # naming it here too means a future edit to preflight's `needs:` cannot quietly
    # detach the deploy from the gate.
    needs: [resolve-target, release-gate, preflight-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # the ONLY job that can exchange a WIF token
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          # Pinned to the gated commit, not to whatever main points at now: on a
          # busy branch, `github.sha` for a queued run can be several commits behind
          # HEAD, and checking out a ref instead of a sha would build code that was
          # never gated.
          ref: ${{ needs.resolve-target.outputs.target_sha }}
          # Full history so the change-detection step can diff this push against
          # its `before` SHA (or HEAD~1 on workflow_dispatch).
          fetch-depth: 0

      - name: Assert checkout is exactly the gated commit
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          SHORT_SHA: ${{ needs.resolve-target.outputs.short_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "HEAD=${HEAD_SHA} TARGET=${TARGET_SHA}"
          if [ "${HEAD_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::checkout HEAD ${HEAD_SHA} != gated target ${TARGET_SHA} — refusing to build"
            exit 1
          fi
          # The image tag is a pure function of the gated commit. Assert that too,
          # so a mismatch surfaces here rather than as an image nobody can trace.
          if [ "${SHORT_SHA}" != "${TARGET_SHA:0:10}" ]; then
            echo "::error::short sha ${SHORT_SHA} is not derived from ${TARGET_SHA}"
            exit 1
          fi
          echo "TARGET_SHA=${TARGET_SHA}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      # Decide which image tiers actually need rebuilding from the changed paths.
      # CONSERVATIVE: default every tier to TRUE and only flip to false when we are
      # confident its inputs are untouched, so any doubt (no resolvable base, shared
      # package/lockfile/Dockerfile/workflow change, dispatch with no diff) rebuilds
      # everything — i.e. worst case is exactly today's behaviour, never a stale or
      # missing image. A skipped tier keeps its current image via `helm --reuse-values`.
      - name: Detect changed tiers
        id: tiers
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_TIERS: ${{ inputs.force_tiers }}
        run: |
          set -euo pipefail
          RUNTIME=true; WEB=true; WSAGENT=true

          # Manual override (dispatch only) to validate conditional builds without a
          # real push. e.g. force_tiers=web exercises the web-only skip path live.
          if [ -n "${FORCE_TIERS:-}" ]; then
            if [ "${FORCE_TIERS}" = "all" ]; then
              RUNTIME=true; WEB=true; WSAGENT=true
            else
              RUNTIME=false; WEB=false; WSAGENT=false
              case ",${FORCE_TIERS}," in *,web,*) WEB=true;; esac
              case ",${FORCE_TIERS}," in *,runtime,*) RUNTIME=true;; esac
              case ",${FORCE_TIERS}," in *,wsagent,*) WSAGENT=true;; esac
            fi
            echo "FORCE_TIERS=${FORCE_TIERS} -> runtime=${RUNTIME} web=${WEB} wsagent=${WSAGENT}"
            {
              echo "runtime=${RUNTIME}"; echo "web=${WEB}"; echo "wsagent=${WSAGENT}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=""
          if printf '%s' "${BEFORE_SHA:-}" | grep -Eq '^[0-9a-f]{40}$' && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE="${BEFORE_SHA}"            # push event: diff against the pushed-from SHA
          elif git rev-parse --verify -q HEAD~1 >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD~1)"  # dispatch / shallow fallback: diff the last commit
          fi

          if [ -n "${BASE}" ]; then
            CHANGED="$(git diff --name-only "${BASE}" HEAD || true)"
            echo "Changed files since ${BASE}:"; printf '%s\n' "${CHANGED}"

            # Shared inputs that feed EVERY tier -> rebuild all (don't try to be clever).
            if printf '%s\n' "${CHANGED}" | grep -Eq '^(packages/|pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|Dockerfile|infra/docker/|infra/cloudbuild/cloudbuild\.yaml|\.github/workflows/deploy-main\.yml)'; then
              echo "Shared/base input changed -> build ALL tiers"
            else
              RUNTIME=false; WEB=false; WSAGENT=false
              printf '%s\n' "${CHANGED}" | grep -Eq '^(services/(api|workspace-manager|preview-proxy|ai-gateway|worker)/|infra/cloudbuild/runtime-tier\.yaml)' && RUNTIME=true || true
              printf '%s\n' "${CHANGED}" | grep -Eq '^(app/|electron/|vite\.config|uno\.config|tsconfig|infra/cloudbuild/single-web\.yaml)' && WEB=true || true
              printf '%s\n' "${CHANGED}" | grep -Eq '^(services/workspace-agent/|infra/cloudbuild/workspace-agent\.yaml)' && WSAGENT=true || true

              # If nothing tier-specific matched (docs/CI-only push), still roll web+runtime
              # as a safe no-op-ish default rather than deploying nothing unexpectedly.
              if [ "${RUNTIME}" = false ] && [ "${WEB}" = false ] && [ "${WSAGENT}" = false ]; then
                echo "No tier-specific change detected -> default to web+runtime"
                RUNTIME=true; WEB=true
              fi
            fi
          else
            echo "No resolvable base SHA -> build ALL tiers"
          fi

          echo "runtime=${RUNTIME}" >> "$GITHUB_OUTPUT"
          echo "web=${WEB}" >> "$GITHUB_OUTPUT"
          echo "wsagent=${WSAGENT}" >> "$GITHUB_OUTPUT"
          echo "Tiers to build -> runtime=${RUNTIME} web=${WEB} wsagent=${WSAGENT}"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ---- Build 1/2: runtime tier (six serialized backend service images) ----
      # Builds the deps base and runtime images first; publishes deps:<sha> +
      # deps:latest so the web build can pin _DEPS_TAG. Blocking by design.
      - name: Build runtime tier (Cloud Build)
        if: steps.tiers.outputs.runtime == 'true'
        run: |
          set -euo pipefail
          echo "::group::gcloud builds submit — runtime-tier"
          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/runtime-tier.yaml \
            --substitutions=_SHORT_SHA="${SHORT_SHA}" \
            --machine-type=e2-highcpu-8 \
            --timeout=3600s \
            .
          echo "::endgroup::"

      # ---- Build 2/2: web tier ----
      # Runs only after the runtime build above succeeds (sequential — single
      # worker slot). Pins _DEPS_TAG to this commit's freshly built deps image.
      - name: Build web tier (Cloud Build)
        if: steps.tiers.outputs.web == 'true'
        run: |
          set -euo pipefail
          # Pin the web build's deps base to THIS commit only when the runtime tier
          # was rebuilt (which publishes deps:<sha>); otherwise fall back to deps:latest
          # so a web-only deploy still builds against a valid, existing base image.
          if [ "${{ steps.tiers.outputs.runtime }}" = "true" ]; then
            DEPS_TAG="${SHORT_SHA}"
          else
            DEPS_TAG="latest"
          fi
          echo "::group::gcloud builds submit — single-web (deps:${DEPS_TAG})"
          # VITE_RUNTIME_MODE *and* VITE_RUNTIME_API_BASE_URL are inlined into
          # the client bundle at vite build time — they must be Cloud Build
          # substitutions -> Docker build args, not runtime configmap values
          # (which the browser never reads). Pin remote-kubernetes so the
          # deployed IDE drives the workspace-manager / preview-proxy backend
          # instead of silently falling back to WebContainer, and pin the API
          # base URL to the off-origin api.e-code.ai host — same-origin
          # /api/runtime hits the web pod (Remix), which has no runtime routes,
          # so the workspace never provisions ("No backend workspace" / "Failed
          # to spawn bolt shell"). The /api/runtime/* routes live on the API
          # service (services/api/src/app.ts), exposed at api.e-code.ai.
          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/single-web.yaml \
            --substitutions=_DEPS_TAG="${DEPS_TAG}",_SHORT_SHA="${SHORT_SHA}",_VITE_RUNTIME_MODE=remote-kubernetes,_VITE_RUNTIME_API_BASE_URL=https://api.e-code.ai/api/runtime,_VITE_BYOK_DISABLED=true \
            --machine-type=e2-highcpu-8 \
            --timeout=1800s \
            .
          echo "::endgroup::"

      # ---- Build 3/3: workspace-agent runtime image ----
      # The agent runs INSIDE each workspace pod (its own Dockerfile, node-pty
      # native build, NOT the deps base), so it can't join the runtime tier.
      # Tag matches the prod convention `sha-<short>`; helm --set below points
      # platformEnv.runtime.workspaceAgentImage at it. New workspaces use the
      # fresh agent immediately; already-running workspaces keep their baked
      # image until they are reprovisioned (reopen / GC), which is expected.
      # Blocking on purpose: shipping a broken agent image should fail the deploy.
      - name: Build workspace-agent (Cloud Build)
        if: steps.tiers.outputs.wsagent == 'true'
        run: |
          set -euo pipefail
          echo "::group::gcloud builds submit — workspace-agent"
          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/workspace-agent.yaml \
            --substitutions=_SHORT_SHA="${SHORT_SHA}" \
            --machine-type=e2-highcpu-8 \
            --timeout=1800s \
            .
          echo "::endgroup::"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # kubectl through Connect Gateway: the cluster control plane is
      # IP-restricted, so direct `get-gke-credentials` won't reach it from a
      # GitHub-hosted runner. Connect Gateway routes kubectl through a
      # Google-managed proxy authenticated by the WIF identity (IAM), no VPN.
      #
      # Moved AHEAD of the scan/deploy steps: resolving digests for the tiers this
      # run did NOT rebuild requires reading what the release currently deploys.
      - name: Get cluster credentials via Connect Gateway
        run: |
          set -euo pipefail
          gcloud components install gke-gcloud-auth-plugin --quiet
          gcloud container fleet memberships get-credentials "${FLEET_MEMBERSHIP}" \
            --project="${GCP_PROJECT_ID}"
          kubectl config current-context

      # Trace each built image back to the build that produced it (manifest field
      # "Cloud Build id"). Resolved by listing builds rather than by capturing
      # `gcloud builds submit` stdout, so the submit commands above stay byte-identical
      # to the proven ones and their logs keep streaming to the run.
      - name: Resolve Cloud Build ids
        id: buildids
        run: |
          set -euo pipefail
          BUILDS_JSON="$(gcloud builds list \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --limit=40 --sort-by=~createTime \
            --format=json)"

          pick() { # $1 = substring identifying an image this build published
            printf '%s' "${BUILDS_JSON}" | jq -r --arg needle "$1" --arg sha "${SHORT_SHA}" '
              [ .[]
                | select(.status == "SUCCESS")
                | select((.substitutions._SHORT_SHA // "") == $sha)
                | select([(.images // [])[] | select(contains($needle))] | length > 0)
              ] | (.[0].id // "")'
          }

          # `if` rather than `[ cond ] && assign`: under `set -e` an AND-list whose
          # left side is false returns non-zero as a whole statement and aborts the
          # step — so a tier that simply was not rebuilt would kill the deploy.
          RUNTIME_BUILD_ID=""; WEB_BUILD_ID=""; WSAGENT_BUILD_ID=""
          if [ "${{ steps.tiers.outputs.runtime }}" = "true" ]; then RUNTIME_BUILD_ID="$(pick "/api:")"; fi
          if [ "${{ steps.tiers.outputs.web }}" = "true" ]; then WEB_BUILD_ID="$(pick "/web:")"; fi
          if [ "${{ steps.tiers.outputs.wsagent }}" = "true" ]; then WSAGENT_BUILD_ID="$(pick "/workspace-agent:")"; fi

          # A rebuilt tier with no traceable build id would produce a manifest that
          # cannot be audited; the manifest builder refuses it, so fail here with a
          # message that says why instead of failing later with a schema error.
          for pair in "runtime:${{ steps.tiers.outputs.runtime }}:${RUNTIME_BUILD_ID}" \
                      "web:${{ steps.tiers.outputs.web }}:${WEB_BUILD_ID}" \
                      "wsagent:${{ steps.tiers.outputs.wsagent }}:${WSAGENT_BUILD_ID}"; do
            tier="${pair%%:*}"; rest="${pair#*:}"; built="${rest%%:*}"; id="${rest#*:}"
            if [ "${built}" = "true" ] && [ -z "${id}" ]; then
              echo "::error::could not resolve the Cloud Build id for the ${tier} tier at _SHORT_SHA=${SHORT_SHA}"
              exit 1
            fi
            echo "${tier} build id: ${id:-(not rebuilt)}"
          done

          {
            echo "RUNTIME_BUILD_ID=${RUNTIME_BUILD_ID}"
            echo "WEB_BUILD_ID=${WEB_BUILD_ID}"
            echo "WSAGENT_BUILD_ID=${WSAGENT_BUILD_ID}"
          } >> "$GITHUB_ENV"

      # ---- Resolve every deployed service to an IMMUTABLE DIGEST ----
      #
      # A tag is a mutable pointer. `--set imageTag=<sha>` only tells the kubelet a
      # name to resolve at pull time; between the vulnerability gate reading
      # `api:<sha>` and the pod pulling it, anything with registry write access can
      # move that tag onto different bytes and nothing in the rollout would notice.
      #
      # Every service in the chart gets a digest — including the tiers this run did
      # not rebuild (and `admin`, which this path never builds). Their currently
      # deployed reference is carried forward as a digest, so the release is fully
      # pinned rather than "pinned for the parts we happened to touch".
      - name: Resolve immutable image digests for every service
        run: |
          set -euo pipefail
          REG="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}"
          echo "REG=${REG}" >> "$GITHUB_ENV"

          # What the release currently has stored, used only for services this run
          # does not rebuild. `-a` includes computed values, so chart defaults are
          # visible too. Missing release (first install) yields an empty object.
          STORED="$(helm get values "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" -a -o json 2>/dev/null || echo '{}')"
          printf '%s' "${STORED}" > /tmp/stored-values.json

          # valuesKey:imageName:tier:chartService:rolled
          #   tier         — which build produces it, i.e. whether THIS run rebuilt it
          #   chartService — helm pins `services.<key>.imageDigest` for it, so its digest
          #                  must be resolvable on EVERY run (rebuilt or carried forward)
          #   rolled       — this workflow waits for its rollout and checks its imageIDs
          #
          # admin: an enabled chart service this continuous path never builds or rolls.
          # Its current digest is carried forward so the release stays fully pinned.
          #
          # screenshotter (`enabled: false` in the chart) and workspace-agent (not a
          # chart service at all — an image reference the api hands to workspace pods,
          # tagged `sha-<sha>`) are chartService=false: there is no Deployment to pin, so
          # nothing to carry forward, and demanding a digest for them on a run that did
          # not rebuild them would block the deploy over an image nobody deploys. They
          # are listed so that WHEN they are rebuilt they are still scanned and
          # signature-verified — the previous vulnerability gate covered both, and
          # dropping them to keep the rollout check simple would have silently ended
          # that coverage. If screenshotter is ever enabled, flip its chartService to
          # true so it gets pinned like every other running service.
          SERVICES="web:web:web:true:true admin:admin:none:true:false api:api:runtime:true:true worker:worker:runtime:true:true aiGateway:ai-gateway:runtime:true:true workspaceManager:workspace-manager:runtime:true:true previewProxy:preview-proxy:runtime:true:true screenshotter:screenshotter:runtime:false:false workspaceAgent:workspace-agent:wsagent:false:false"

          rebuilt_web="${{ steps.tiers.outputs.web }}"
          rebuilt_runtime="${{ steps.tiers.outputs.runtime }}"
          rebuilt_wsagent="${{ steps.tiers.outputs.wsagent }}"

          echo '[]' > /tmp/services.json

          for entry in ${SERVICES}; do
            IFS=: read -r key image tier chart_service rolled <<< "${entry}"

            case "${tier}" in
              web) rebuilt="${rebuilt_web}" ;;
              runtime) rebuilt="${rebuilt_runtime}" ;;
              wsagent) rebuilt="${rebuilt_wsagent}" ;;
              *) rebuilt=false ;;
            esac

            # An image that is neither a chart service nor rebuilt has nothing to carry
            # forward: the workspace-agent is referenced by digest in the configmap, so
            # when this run did not rebuild it the previous value simply stays.
            if [ "${chart_service}" != "true" ] && [ "${rebuilt}" != "true" ]; then
              echo "${key}: not rebuilt and not a chart service — leaving the current reference untouched"
              continue
            fi

            if [ "${rebuilt}" = "true" ]; then
              # The workspace-agent uses the `sha-<sha>` tag convention, not `<sha>`.
              if [ "${tier}" = "wsagent" ]; then TAG="sha-${SHORT_SHA}"; else TAG="${SHORT_SHA}"; fi
              SOURCE_SHA="${TARGET_SHA}"
              case "${tier}" in
                web) BUILD_ID="${WEB_BUILD_ID}" ;;
                runtime) BUILD_ID="${RUNTIME_BUILD_ID}" ;;
                wsagent) BUILD_ID="${WSAGENT_BUILD_ID}" ;;
              esac
            else
              BUILD_ID=""
              # Prefer a digest the previous release already pinned; fall back to its
              # tag on the first digest-based upgrade (and for `admin`, which is only
              # ever tag-deployed by other workflows).
              PINNED="$(jq -r --arg k "${key}" '.services[$k].imageDigest // .global.imageDigest // ""' /tmp/stored-values.json)"
              TAG="$(jq -r --arg k "${key}" '.services[$k].imageTag // .global.imageTag // ""' /tmp/stored-values.json)"
              # The commit that produced the image now running — carried forward, never
              # restamped with this run's commit (the manifest must not claim that a
              # service was built from a commit it was not built from).
              SOURCE_SHA=""
              if printf '%s' "${TAG}" | grep -Eq '^[0-9a-f]{10}$'; then
                SOURCE_SHA="$(git rev-parse "${TAG}" 2>/dev/null || echo "")"
              fi
            fi

            # Every failure below is fail-closed and, on the FIRST digest-based upgrade,
            # is also the most likely thing to stop the cutover. So each one prints what
            # the release actually stores for this service: without it the operator gets
            # "cannot pin this service" and has to go dig the values out of the cluster
            # by hand, during a deploy, to learn something the job already knew.
            explain_stored() {
              echo "::group::what the release stores for ${key}"
              jq -r --arg k "${key}" '{
                "services.\($k).imageDigest": (.services[$k].imageDigest // "(absent)"),
                "services.\($k).imageTag":    (.services[$k].imageTag // "(absent)"),
                "global.imageDigest":         (.global.imageDigest // "(absent)"),
                "global.imageTag":            (.global.imageTag // "(absent)")
              }' /tmp/stored-values.json
              echo "Fix: re-run once with this tier rebuilt, or pin it explicitly with"
              echo "  helm upgrade ... --set-string services.${key}.imageDigest=sha256:<64 hex>"
              echo "::endgroup::"
            }

            if [ -n "${PINNED:-}" ]; then
              DIGEST="${PINNED}"
              echo "${key}: carried forward pinned digest ${DIGEST}"
            else
              if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
                echo "::error::${key}: no digest and no tag available — cannot pin this service"
                explain_stored
                exit 1
              fi
              if [ "${TAG}" = "REQUIRED_OVERRIDE_AT_DEPLOY" ]; then
                # values-prod.yaml's placeholder. Reaching it means the release has no
                # real image pinned for this service, so there is nothing to carry
                # forward — deploying would resolve a placeholder tag that does not exist.
                echo "::error::${key}: the release stores the values-prod placeholder tag; this service has never been pinned to a real image"
                explain_stored
                exit 1
              fi
              # Ask the registry what that tag resolves to RIGHT NOW, once, and use the
              # answer everywhere downstream (scan, signature, deploy, verification).
              DIGEST="$(gcloud artifacts docker images describe "${REG}/${image}:${TAG}" \
                --project="${GCP_PROJECT_ID}" \
                --format='value(image_summary.digest)' 2>/dev/null || echo "")"
              if ! printf '%s' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                echo "::error::${key}: could not resolve ${REG}/${image}:${TAG} to a digest (got '${DIGEST}')"
                echo "The tag does not exist in the registry, or the deploy service account cannot read it."
                explain_stored
                exit 1
              fi
              echo "${key}: ${image}:${TAG} -> ${DIGEST}"
            fi

            jq --arg service "${key}" --arg image "${image}" --arg tag "${TAG}" \
               --arg digest "${DIGEST}" --arg buildId "${BUILD_ID:-}" \
               --arg sourceSha "${SOURCE_SHA:-}" --argjson rebuilt "${rebuilt}" \
               --argjson chartService "${chart_service}" --argjson rolled "${rolled}" \
               '. += [{service:$service, image:$image, tag:$tag, digest:$digest,
                       rebuilt:$rebuilt, chartService:$chartService, rolled:$rolled,
                       cloudBuildId:(if $buildId == "" then null else $buildId end),
                       sourceSha:(if $sourceSha == "" then null else $sourceSha end)}]' \
               /tmp/services.json > /tmp/services.next && mv /tmp/services.next /tmp/services.json
            unset PINNED
          done

          echo "::group::resolved digests"
          jq -r '.[] | "\(.service)\t\(.digest)\t\(if .rebuilt then "rebuilt" else "carried forward" end)\t\(if .rolled then "rolled" else "not rolled" end)"' /tmp/services.json
          echo "::endgroup::"

      - name: Install Trivy and cosign
        run: |
          set -euo pipefail
          # Keep these pinned, and verify the asset actually exists before bumping:
          # release asset names are not stable across versions, and a 404 fails the
          # gate for the wrong reason (curl -sSfL is silent about it until tar chokes).
          TRIVY_VERSION=0.72.0
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version

          COSIGN_VERSION=2.4.3
          curl -sSfL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          sudo install /tmp/cosign /usr/local/bin/cosign
          cosign version

          gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      # B6 — BLOCKING vulnerability gate, now aimed at the DIGEST rather than the tag.
      #
      # Deliberately placed AFTER the builds and BEFORE `helm upgrade`: that is the
      # last point where refusing to ship costs nothing. A gate that ran after the
      # rollout would only be able to tell us we had already shipped the CVE. Scanning
      # the digest closes the remaining gap — the bytes scanned are provably the bytes
      # deployed, because the same digest string is what helm sets.
      #
      # Why Trivy and not the `gcloud artifacts docker images scan` steps in the Cloud
      # Build configs: Artifact Registry scanning is DISABLED on this project
      # (`containerscanning.googleapis.com` is not enabled), so those steps have been
      # failing into their `|| echo WARN` for as long as they have existed and
      # `allowFailure: true` hid it. They report nothing today.
      #
      # --ignore-unfixed: only CVEs with an available fix can block, otherwise the
      # gate is unactionable and the first instinct is to disable it. Accepted-risk
      # CVEs live in .trivyignore with a justification and expiry.
      #
      # The SBOM is produced in the same loop, while Trivy's analysis of that image is
      # still cached, so the supply-chain record costs one extra pass instead of a
      # second full download.
      - name: Vulnerability gate + SBOM on the exact digests (blocking)
        run: |
          set -euo pipefail
          mkdir -p sbom
          rc=0
          while read -r service image digest; do
            ref="${REG}/${image}@${digest}"
            echo "::group::trivy ${service} ${digest}"
            # Two passes so the log is useful: an informational HIGH listing, then the
            # CRITICAL pass that actually decides the gate.
            trivy image --quiet --scanners vuln --severity HIGH \
              --ignore-unfixed --ignorefile .trivyignore "${ref}" || true
            if ! trivy image --quiet --scanners vuln --severity CRITICAL \
                   --ignore-unfixed --ignorefile .trivyignore \
                   --exit-code 1 "${ref}"; then
              echo "::error::CRITICAL fixable vulnerability in ${ref}"
              rc=1
            fi
            trivy image --quiet --format cyclonedx --output "sbom/${service}.cdx.json" "${ref}"
            echo "::endgroup::"
          done < <(jq -r '.[] | "\(.service) \(.image) \(.digest)"' /tmp/services.json)

          if [ "$rc" -ne 0 ]; then
            echo "::error::Vulnerability gate FAILED — refusing to deploy. Fix the CVE, or add a justified entry to .trivyignore."
            exit 1
          fi

          # Record each SBOM's own sha256 in the manifest so the artifact uploaded with
          # this run can later be shown to be the one that was scanned.
          jq -c '.[]' /tmp/services.json | while read -r row; do
            svc="$(printf '%s' "${row}" | jq -r .service)"
            printf '%s  sbom/%s.cdx.json\n' "$(sha256sum "sbom/${svc}.cdx.json" | cut -d' ' -f1)" "${svc}"
          done > sbom/SHA256SUMS
          cat sbom/SHA256SUMS

      # Cosign signatures are already mandatory at admission (Kyverno). Verifying here
      # means an unsigned or mis-signed image is refused BEFORE the rollout starts,
      # instead of appearing as pods stuck at admission mid-upgrade.
      #
      # Verification needs only the KMS PUBLIC key, not signing rights: the deploy
      # service account requires roles/cloudkms.publicKeyViewer on the cosign-images
      # key. If that grant is missing this step fails closed with the role named.
      - name: Verify image signatures (cosign, blocking)
        run: |
          set -euo pipefail
          KMS_KEY="gcpkms://projects/${GCP_PROJECT_ID}/locations/${GAR_LOCATION}/keyRings/vibecore-supply-chain/cryptoKeys/cosign-images"
          echo "KMS_KEY=${KMS_KEY}" >> "$GITHUB_ENV"
          rc=0
          while read -r service image digest; do
            ref="${REG}/${image}@${digest}"
            echo "::group::cosign verify ${service}"
            if cosign verify --key "${KMS_KEY}" "${ref}" >/dev/null 2>/tmp/cosign.err; then
              echo "signature OK: ${ref}"
            else
              sed -n '1,20p' /tmp/cosign.err
              echo "::error::signature verification FAILED for ${ref}"
              rc=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.[] | "\(.service) \(.image) \(.digest)"' /tmp/services.json)
          if [ "$rc" -ne 0 ]; then
            echo "::error::At least one image is not validly signed by ${KMS_KEY}."
            echo "::error::If this is a permissions error, the deploy service account needs roles/cloudkms.publicKeyViewer on that key."
            exit 1
          fi

      # THE MANIFEST (release-integrity requirement 5): service -> source sha ->
      # Cloud Build id -> digest -> signature -> SBOM. The builder REFUSES to emit a
      # manifest that would not be a proof: any missing digest, any rebuilt service
      # without a build id, any image built from a different commit, any unverified
      # signature stops the deploy here.
      - name: Build release manifest (blocking)
        run: |
          set -euo pipefail
          GATE_VERDICT_SHA256=""
          jq -n \
            --arg targetSha "${TARGET_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg registry "${REG}" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg key "${KMS_KEY}" \
            --slurpfile services /tmp/services.json \
            --slurpfile sums <(jq -Rn '[inputs | split("  ") | {(.[1] | sub("^sbom/"; "") | sub("\\.cdx\\.json$"; "")): .[0]}] | add' < sbom/SHA256SUMS) \
            '{targetSha:$targetSha, repository:$repository, registry:$registry,
              workflowRunUrl:$runUrl,
              services: ($services[0] | map(. + {
                signature: {verified: true, key: $key},
                sbom: {format: "cyclonedx-json", artifact: ("sbom/" + .service + ".cdx.json"),
                       sha256: ($sums[0][.service] // null)}
              }))}' > /tmp/manifest-input.json

          node scripts/release-gate/release-manifest.mjs build \
            --input /tmp/manifest-input.json \
            --out release-manifest.json
          cp release-manifest.json sbom/release-manifest.json

      # D2 (approved 2026-07-17): MANDATORY render test before any upgrade. The
      # rollback flag used to live only in a `kubectl set env`, which the next
      # helm upgrade wiped — silently reviving the fake URL-copy rollback. This
      # step proves the chart itself renders SERVER_DEPLOY_ROLLBACK_FROM_DIGEST
      # under default values, values-prod.yaml AND legacy stored values
      # (--reuse-values simulation), and that values.schema.json rejects a
      # malformed value. Failing here blocks the deploy.
      - name: Helm render test — rollback flag (blocking)
        run: node scripts/validate-helm-rollback-flag.mjs

      - name: Record current release revision (for rollback)
        run: |
          set -euo pipefail
          helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" || true
          echo "Rollback: helm rollback ${HELM_RELEASE} <REVISION> -n ${HELM_NAMESPACE}"

      # --reuse-values preserves every existing value (all prod config) and overrides
      # the image references. NOTE: because --reuse-values keeps the release's stored
      # configmap values, a change to values-prod.yaml alone never reaches prod —
      # values that must change here have to be re-asserted via --set.
      # previewUrlTemplate is pinned to the host ROOT (no '/p/<ws>/<port>/' path
      # prefix) so client-side routers in generated apps work; a path prefix makes
      # BrowserRouter-style apps render blank. --atomic auto-rolls-back on a failed
      # upgrade (a bad ai-gateway/worker container fails readiness → rollback; the
      # agent image is a configmap value the api re-reads on its restart).
      #
      # Every service is set BY DIGEST, from the manifest that was just validated —
      # including services this run did not rebuild, whose current digest is carried
      # forward. imageTag is re-asserted alongside purely as human-readable
      # provenance; the chart ignores it whenever a digest is present.
      - name: Helm upgrade (all services pinned by digest)
        run: |
          set -euo pipefail
          SETS=( --set "platformEnv.runtime.previewUrlTemplate=https://{workspaceId}-{port}.preview.e-code.ai/" )
          # D2 (approved 2026-07-17): re-assert the digest-rollback flag on EVERY
          # upgrade (configmap value that --reuse-values would otherwise freeze
          # at whatever the release stored). Belt on top of the chart default
          # "1" + values.schema.json; the post-deploy step below verifies the
          # flag actually reached the running api pods.
          SETS+=( --set-string "platformEnv.runtime.serverDeployRollbackFromDigest=1" )

          # Only entries that ARE chart services get a `services.<key>` override —
          # `--set services.workspaceAgent.…` would invent a service the chart has no
          # template for, and helm would happily store it.
          while read -r service digest tag; do
            SETS+=( --set-string "services.${service}.imageDigest=${digest}" )
            if [ -n "${tag}" ] && [ "${tag}" != "null" ]; then
              SETS+=( --set-string "services.${service}.imageTag=${tag}" )
            fi
          # `!= false`, not a bare truthiness test: an entry whose chartService field is
          # absent would be silently skipped by the latter, i.e. a service would quietly
          # keep whatever digest the release already stored instead of the one this run
          # verified. Absent means "not marked as non-chart", so include it and let the
          # chart reject an unknown key loudly. Same expression as the break-glass path.
          done < <(jq -r '.services[] | select(.chartService != false) | "\(.service) \(.digest) \(.tag // "")"' release-manifest.json)

          # The workspace-agent is not a chart service: it is an image reference the api
          # hands to each workspace pod. Pin it by the digest already resolved, scanned
          # and signature-verified above — never by re-resolving the tag here, which
          # would reintroduce the gap between "what we checked" and "what we ship".
          WSAGENT_DIGEST="$(jq -r '.services[] | select(.service == "workspaceAgent") | .digest' release-manifest.json)"
          if [ -n "${WSAGENT_DIGEST}" ]; then
            SETS+=( --set-string "platformEnv.runtime.workspaceAgentImage=${REG}/workspace-agent@${WSAGENT_DIGEST}" )
          fi

          echo "helm --set args: ${SETS[*]}"
          helm upgrade "${HELM_RELEASE}" infra/helm/platform \
            --namespace "${HELM_NAMESPACE}" \
            --reuse-values \
            --atomic \
            --timeout 10m \
            "${SETS[@]}"

      - name: Verify rollout
        run: |
          set -euo pipefail
          for svc in web api workspace-manager preview-proxy ai-gateway worker; do
            dep="$(kubectl -n "${HELM_NAMESPACE}" get deploy \
              -l "app.kubernetes.io/name=${svc}" -o name 2>/dev/null | head -n1)"
            if [ -z "${dep}" ]; then
              # Fall back to the released chart's naming if the label selector misses.
              dep="deploy/${HELM_RELEASE}-vibecore-platform-${svc}"
            fi
            echo "::group::rollout status ${dep}"
            kubectl -n "${HELM_NAMESPACE}" rollout status "${dep}" --timeout=5m
            echo "::endgroup::"
          done

      # Release-integrity requirement 6, second half: prove the cluster is running the
      # digests this release recorded. `helm upgrade` succeeding only proves what we
      # ASKED for; `imageID` is what the kubelet reports it actually pulled and ran.
      #
      # Only pods of the CURRENT ReplicaSet are examined. With maxUnavailable:0 the old
      # pods can still be terminating when `rollout status` returns, and counting them
      # would report a mismatch for images that are on their way out.
      - name: Verify running imageIDs match the release manifest
        run: |
          set -euo pipefail
          echo '{}' > /tmp/observed.json

          while read -r service image; do
            # Chart service keys are camelCase; the k8s label is kebab-case.
            label="${image}"
            dep="$(kubectl -n "${HELM_NAMESPACE}" get deploy -l "app.kubernetes.io/name=${label}" -o name 2>/dev/null | head -n1)"
            if [ -z "${dep}" ]; then
              dep="deploy/${HELM_RELEASE}-vibecore-platform-${label}"
            fi
            # `kubectl get -o name` prints `deployment.apps/<name>`, NOT `deploy/<name>`.
            # Stripping a literal "deploy/" leaves the group prefix attached, the
            # ownerReferences match below never fires, and the ReplicaSet lookup comes
            # back empty — which this step then reports as "no running pod", i.e. a
            # deploy that failed for a reason that has nothing to do with the images.
            # Caught by scripts/release-gate/proof-digest-rollout.sh on a real cluster.
            depname="${dep##*/}"

            HASH="$(kubectl -n "${HELM_NAMESPACE}" get rs -o json \
              | jq -r --arg d "${depname}" '
                  [ .items[] | select((.metadata.ownerReferences // [])[]?.name == $d) ]
                  | sort_by(.metadata.creationTimestamp) | last
                  | .metadata.labels["pod-template-hash"] // ""')"
            if [ -z "${HASH}" ]; then
              echo "::error::${service}: could not find the current ReplicaSet for ${depname}"
              exit 1
            fi

            IDS="$(kubectl -n "${HELM_NAMESPACE}" get pods \
              -l "app.kubernetes.io/name=${label},pod-template-hash=${HASH}" -o json \
              | jq -c --arg img "${label}" '
                  [ .items[]
                    | select(.metadata.deletionTimestamp == null)
                    | select(.status.phase == "Running")
                    | .status.containerStatuses[]?
                    | select(.name == $img)
                    | .imageID ]')"

            jq --arg s "${service}" --argjson ids "${IDS}" '. + {($s): $ids}' /tmp/observed.json \
              > /tmp/observed.next && mv /tmp/observed.next /tmp/observed.json
          # Must match verify-imageids' own filter EXACTLY (`rolled !== false`). With a
          # bare truthiness test here, an entry whose `rolled` field is absent would be
          # skipped when collecting imageIDs but still demanded by the verifier — which
          # then reports "no running pod reported an imageID" and fails the deploy for a
          # reason that has nothing to do with the images.
          done < <(jq -r '.services[] | select(.rolled != false) | "\(.service) \(.image)"' release-manifest.json)

          echo "::group::observed imageIDs"
          jq . /tmp/observed.json
          echo "::endgroup::"

          # verify-imageids itself skips entries with rolled=false (admin, screenshotter,
          # workspace-agent), so the set of services that must match is decided by the
          # manifest — an auditable artifact — rather than by a filter in this file.
          node scripts/release-gate/release-manifest.mjs verify-imageids \
            --manifest release-manifest.json \
            --observed /tmp/observed.json

      # D2 (approved 2026-07-17): POST-DEPLOY proof that the rollback flag
      # survived the upgrade — checked against the LIVE cluster (rendered
      # configmap value AND the env of a running api pod), not the workflow's
      # own inputs. If this fails the job goes red and the Notify step below
      # alerts (job summary + Slack): that IS the "flag absent after helm
      # upgrade" alert. A failure here does NOT auto-rollback — the deployed
      # code fails CLOSED (api refuses URL-only rollbacks even without the
      # env var), so red-alert-and-investigate beats a blind rollback.
      - name: Verify rollback flag survived the upgrade (D2)
        run: |
          set -euo pipefail
          CM_VALUE="$(kubectl -n "${HELM_NAMESPACE}" get configmap "${HELM_RELEASE}-vibecore-platform-platform-env" \
            -o jsonpath='{.data.SERVER_DEPLOY_ROLLBACK_FROM_DIGEST}')"
          echo "configmap SERVER_DEPLOY_ROLLBACK_FROM_DIGEST='${CM_VALUE}'"
          if [ "${CM_VALUE}" != "1" ]; then
            echo "::error::SERVER_DEPLOY_ROLLBACK_FROM_DIGEST missing/wrong in the live configmap after upgrade (got '${CM_VALUE}', want '1')" >&2
            exit 1
          fi
          # `kubectl exec` is NOT available through the Connect Gateway for the
          # CI's WIF identity (websocket upgrade denied — 5/5 retries failed on
          # both live runs while the pods actually carried '1'). Verify WITHOUT
          # exec, via plain GETs that DO work from here: the api Deployment's
          # pod template must consume the flag — an explicit env entry (must be
          # '1') or envFrom on the platform-env configmap whose live value was
          # asserted above. Every pod the Deployment creates then starts with
          # the flag; there is no per-pod drift channel left to check.
          TEMPLATE_JSON="$(kubectl -n "${HELM_NAMESPACE}" get deploy "${HELM_RELEASE}-vibecore-platform-api" \
            -o jsonpath='{.spec.template.spec.containers[0]}')"
          EXPLICIT="$(printf '%s' "${TEMPLATE_JSON}" | jq -r '[.env // [] | .[] | select(.name=="SERVER_DEPLOY_ROLLBACK_FROM_DIGEST")][0].value // "ABSENT"')"
          CONSUMES_CM="$(printf '%s' "${TEMPLATE_JSON}" | jq -r --arg cm "${HELM_RELEASE}-vibecore-platform-platform-env" '[.envFrom // [] | .[] | select(.configMapRef.name==$cm)] | length')"
          echo "api pod template: explicit env='${EXPLICIT}', envFrom platform-env configmap refs=${CONSUMES_CM}"
          if [ "${EXPLICIT}" != "ABSENT" ] && [ "${EXPLICIT}" != "1" ]; then
            echo "::error::api pod template pins SERVER_DEPLOY_ROLLBACK_FROM_DIGEST='${EXPLICIT}' (explicit env overrides the configmap)" >&2
            exit 1
          fi
          if [ "${EXPLICIT}" = "ABSENT" ] && [ "${CONSUMES_CM}" = "0" ]; then
            echo "::error::api pod template neither sets SERVER_DEPLOY_ROLLBACK_FROM_DIGEST nor consumes the platform-env configmap" >&2
            exit 1
          fi

      # The manifest and SBOMs are the audit trail for this release: what shipped,
      # from which commit and build, as which digests. Uploaded even on failure —
      # a refused or half-finished deploy is exactly when you want to see them.
      - name: Upload release manifest and SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.resolve-target.outputs.short_sha }}
          path: sbom/
          if-no-files-found: warn

      # Notifications: always runs. Writes a GitHub job summary (visible on the
      # run + emailed to the actor by GitHub on failure) and, when a Slack
      # webhook secret is configured, posts there too. The Slack step is a no-op
      # if the secret is absent, so this works with zero extra setup.
      - name: Notify result
        if: always()
        env:
          STATUS: ${{ job.status }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -uo pipefail
          if [ "${STATUS}" = "success" ]; then
            ICON=":white_check_mark:"; TITLE="Production deploy succeeded"
          else
            ICON=":x:"; TITLE="Production deploy FAILED"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## ${TITLE}"
            echo ""
            echo "- **Gated commit:** \`${TARGET_SHA}\`"
            echo "- **Derived tag:** \`${SHORT_SHA:-unknown}\`"
            echo "- **Release:** \`${HELM_RELEASE}\` / ns \`${HELM_NAMESPACE}\`"
            echo "- **Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${SLACK_WEBHOOK}" ]; then
            payload="$(printf '{"text":"%s %s\n>tag: %s | commit: %s\n>%s"}' \
              "${ICON}" "${TITLE}" "${SHORT_SHA:-unknown}" "${TARGET_SHA}" "${RUN_URL}")"
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "${payload}" "${SLACK_WEBHOOK}" || echo "WARN: Slack notify failed (non-fatal)"
          else
            echo "SLACK_DEPLOY_WEBHOOK not set — skipping Slack notification."
          fi
