# Continuous deployment to production on push to main.
#
# Why this exists: every prod deploy used to be a manual `gcloud builds submit`
# from a laptop followed by a hand-typed `helm upgrade`. This wires the same
# steps into CI.
#
# Relationship to deploy-prod.yml: that workflow is the *gated, manual* path
# (staging-validation gate + rollback confirmation + immutable pinned tag).
# This workflow is the *continuous* path: it builds only the affected prod image tiers
# from the pushed commit and rolls them out. Both deploy the same chart/release;
# they are intentionally separate because the manual path's required inputs and
# `confirm_rollback_plan == READY` gate cannot be satisfied by a push event.
#
# Build constraints (see infra/cloudbuild/*.yaml and docs/INFRASTRUCTURE.md):
#   * Only ONE Cloud Build worker slot exists, and cloudbuild.yaml's 7 parallel
#     builds deadlock an 8GB VM. So we run selected tier builds SEQUENTIALLY via
#     blocking `gcloud builds submit` calls (no --async).
#   * runtime-tier.yaml rebuilds the `deps` base image; single-web.yaml and
#     single-admin.yaml only *consume* a deps image via _DEPS_TAG. Runtime
#     therefore builds first and publishes deps:<sha>; affected frontend tiers
#     then build against that exact tag so their images match this commit's lockfile.
#   * runtime-tier.yaml serializes api, workspace-manager, preview-proxy,
#     ai-gateway, worker and screenshotter on the 8 GB worker.

name: Deploy Production (Continuous)

on:
  push:
    branches: [main]
    # Doc/branding-only commits don't change any runtime image, so skip the
    # (expensive) build+rollout for them. Anything under docs/ or any *.md file
    # (README, CLAUDE.md, runbooks) is ignored; a commit that also touches code
    # still deploys. Only affects CI triggering, never the runtime.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      target_sha:
        description: >-
          Full 40-hex commit SHA to build/deploy. It must already be on main;
          defaults to the selected workflow_dispatch ref SHA.
        required: false
      force_tiers:
        description: >-
          Force which tiers to build (comma list of web/admin/runtime/wsagent, or 'all'),
          bypassing path detection. For validating conditional builds via dispatch.
        required: false

permissions:
  contents: read

# Never run two production rollouts at once, and never cancel an in-flight one
# (cancelling mid-`helm upgrade --atomic` or mid-build leaves things half-applied).
concurrency:
  group: deploy-production-continuous
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPO: vibecore-prod-containers
  FLEET_MEMBERSHIP: vibecore-prod-app
  HELM_RELEASE: vibecore
  HELM_NAMESPACE: vibecore

jobs:
  # The first job binds the entire run to one immutable commit and waits for the
  # five independent blocking workflows for that exact SHA. It deliberately has
  # no id-token permission and performs no cloud authentication.
  release-gate:
    name: Exact-SHA required workflows (blocking, before cloud auth)
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      short_sha: ${{ steps.target.outputs.short_sha }}
    steps:
      - name: Bind immutable target SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            push)
              TARGET_SHA="${EVENT_SHA}"
              ;;
            workflow_dispatch)
              TARGET_SHA="${REQUESTED_TARGET_SHA:-${EVENT_SHA}}"
              ;;
            *)
              echo "::error::unsupported deploy trigger: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if ! printf '%s' "${TARGET_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::target_sha must be a full lowercase 40-hex commit SHA" >&2
            exit 1
          fi

          echo "target_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${TARGET_SHA:0:10}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify checkout identity and non-stale main target
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "${CHECKED_OUT_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::checkout mismatch: expected ${TARGET_SHA}, got ${CHECKED_OUT_SHA}" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/verify-deploy-target.sh "${TARGET_SHA}" refs/remotes/origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for exact-SHA blocking workflow conclusions
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          node --test scripts/verify-deploy-target.node-test.mjs
          node --test scripts/wait-for-required-workflows.node-test.mjs
          node scripts/wait-for-required-workflows.mjs \
            --sha "${TARGET_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --timeout-seconds 9900 \
            --poll-seconds 45

  # B6 — gates that must pass BEFORE anything is built or rolled out.
  #
  # security.yaml already runs gitleaks on push/PR, but that is a *separate*
  # workflow: a red run there does not stop this one, so a secret could still
  # ride into production. This job puts the same check on the deploy path
  # itself, where failing it actually prevents the rollout.
  preflight-gates:
    name: Preflight gates (secrets + pipeline policy, blocking)
    needs: [release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gate.outputs.target_sha }}

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (blocking)
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

      # Policy gate: the image-signing steps are what make the Kyverno admission
      # policy satisfiable. If someone deletes or renames them, builds keep
      # succeeding and the failure only surfaces later as pods refused at
      # admission — during a rollout, at the worst possible moment. Assert here
      # instead, where the error is obvious and cheap.
      # The validator parses the step structure rather than grepping it. A
      # line-range grep here is actively dangerous: an awk range like
      # /id: sign-image/,/^  - id: [^s]/ never closes when the following step
      # also starts with "s" (scan-images), so it swallows that step's
      # `allowFailure: true` and the gate fails on a perfectly good tree.
      # The validator is HERMETIC — pure Python 3 stdlib, no PyYAML — so the gate
      # never depends on a dependency that happens to be preinstalled on the
      # runner. --self-test first proves the parser itself before it is trusted.
      - name: Pipeline policy — image signing must still be wired
        run: |
          set -euo pipefail
          python3 scripts/validate-image-signing-wired.py --self-test
          python3 scripts/validate-image-signing-wired.py

      - name: Pipeline policy — admin deploy tier must stay complete
        run: |
          set -euo pipefail
          node --test scripts/detect-deploy-tiers.node-test.mjs
          node scripts/validate-admin-deploy-tier.mjs --self-test
          node scripts/validate-admin-deploy-tier.mjs

      - name: Pipeline policy — activation probe must fail closed
        run: |
          set -euo pipefail
          node --test scripts/probe-deployment-activation.node-test.mjs

  build-and-deploy:
    name: Build tiers sequentially, then helm upgrade
    needs: [release-gate, preflight-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gate.outputs.target_sha }}
          # Full history so the change-detection step can diff this push against
          # its `before` SHA (or HEAD~1 on workflow_dispatch).
          fetch-depth: 0

      - name: Verify immutable checkout and derive image tag
        id: tag
        env:
          TARGET_SHA: ${{ needs.release-gate.outputs.target_sha }}
          SHORT_SHA: ${{ needs.release-gate.outputs.short_sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          EXPECTED_TAG="${TARGET_SHA:0:10}"
          if [ "${CHECKED_OUT_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::checkout mismatch: expected ${TARGET_SHA}, got ${CHECKED_OUT_SHA}" >&2
            exit 1
          fi
          if [ "${SHORT_SHA}" != "${EXPECTED_TAG}" ]; then
            echo "::error::image tag mismatch: expected ${EXPECTED_TAG}, got ${SHORT_SHA}" >&2
            exit 1
          fi
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying source ${TARGET_SHA} as image tag ${SHORT_SHA}"

      # Decide which image tiers actually need rebuilding from the changed paths.
      # CONSERVATIVE: default every tier to TRUE and only flip to false when we are
      # confident its inputs are untouched, so any doubt (no resolvable base, shared
      # package/lockfile/Dockerfile/workflow change, dispatch with no diff) rebuilds
      # everything — i.e. worst case is exactly today's behaviour, never a stale or
      # missing image. A skipped tier keeps its current image via `helm --reuse-values`.
      - name: Detect changed tiers
        id: tiers
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_TIERS: ${{ inputs.force_tiers }}
        run: |
          set -euo pipefail
          ARGS=()
          BASE=""

          # The classifier is executable production logic with hermetic node:test
          # coverage. Keeping path rules out of inline shell makes dependencies
          # (especially admin's two app/i18n imports) reviewable and mutation-testable.
          if [ -n "${FORCE_TIERS:-}" ]; then
            ARGS=( --force "${FORCE_TIERS}" )
          else
            if printf '%s' "${BEFORE_SHA:-}" | grep -Eq '^[0-9a-f]{40}$' && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              BASE="${BEFORE_SHA}"            # push event: diff against the pushed-from SHA
            elif git rev-parse --verify -q HEAD~1 >/dev/null 2>&1; then
              BASE="$(git rev-parse HEAD~1)"  # dispatch fallback: diff the last commit
            fi

            if [ -n "${BASE}" ]; then
              CHANGED_FILE="${RUNNER_TEMP}/deploy-changed-paths.txt"
              git diff --name-only "${BASE}" HEAD > "${CHANGED_FILE}"
              echo "Changed files since ${BASE}:"
              sed -n '1,500p' "${CHANGED_FILE}"
              ARGS=( --changed-file-list "${CHANGED_FILE}" )
            else
              echo "No resolvable base SHA -> build ALL tiers"
              ARGS=( --all )
            fi
          fi

          node scripts/detect-deploy-tiers.mjs "${ARGS[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ---- Build 1/4: runtime tier (six serialized backend service images) ----
      # Builds the deps base and runtime images first; publishes deps:<sha> +
      # deps:latest so the web build can pin _DEPS_TAG. Blocking by design.
      - name: Build runtime tier (Cloud Build)
        if: steps.tiers.outputs.runtime == 'true'
        run: |
          set -euo pipefail
          echo "::group::gcloud builds submit — runtime-tier"
          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/runtime-tier.yaml \
            --substitutions=_SHORT_SHA="${SHORT_SHA}" \
            --machine-type=e2-highcpu-8 \
            --timeout=3600s \
            .
          echo "::endgroup::"

      # ---- Build 2/4: web tier ----
      # Runs only after the runtime build above succeeds (sequential — single
      # worker slot). Pins _DEPS_TAG to this commit's freshly built deps image.
      - name: Build web tier (Cloud Build)
        if: steps.tiers.outputs.web == 'true'
        run: |
          set -euo pipefail
          # Pin the web build's deps base to THIS commit only when the runtime tier
          # was rebuilt (which publishes deps:<sha>); otherwise fall back to deps:latest
          # so a web-only deploy still builds against a valid, existing base image.
          if [ "${{ steps.tiers.outputs.runtime }}" = "true" ]; then
            DEPS_TAG="${SHORT_SHA}"
          else
            DEPS_TAG="latest"
          fi
          echo "::group::gcloud builds submit — single-web (deps:${DEPS_TAG})"
          # VITE_RUNTIME_MODE *and* VITE_RUNTIME_API_BASE_URL are inlined into
          # the client bundle at vite build time — they must be Cloud Build
          # substitutions -> Docker build args, not runtime configmap values
          # (which the browser never reads). Pin remote-kubernetes so the
          # deployed IDE drives the workspace-manager / preview-proxy backend
          # instead of silently falling back to WebContainer, and pin the API
          # base URL to the off-origin api.e-code.ai host — same-origin
          # /api/runtime hits the web pod (Remix), which has no runtime routes,
          # so the workspace never provisions ("No backend workspace" / "Failed
          # to spawn bolt shell"). The /api/runtime/* routes live on the API
          # service (services/api/src/app.ts), exposed at api.e-code.ai.
          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/single-web.yaml \
            --substitutions=_DEPS_TAG="${DEPS_TAG}",_SHORT_SHA="${SHORT_SHA}",_VITE_RUNTIME_MODE=remote-kubernetes,_VITE_RUNTIME_API_BASE_URL=https://api.e-code.ai/api/runtime,_VITE_BYOK_DISABLED=true \
            --machine-type=e2-highcpu-8 \
            --timeout=1800s \
            .
          echo "::endgroup::"

      # ---- Build 3/4: admin tier ----
      # Admin is an independent SPA image. An apps/admin-only change therefore
      # builds exactly one image, while shared lock/deps changes build runtime
      # first and pin this build to deps:<same sha>.
      - name: Build admin tier (Cloud Build)
        if: steps.tiers.outputs.admin == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.tiers.outputs.runtime }}" = "true" ]; then
            DEPS_TAG="${SHORT_SHA}"
          else
            DEPS_TAG="latest"
          fi
          echo "::group::gcloud builds submit — single-admin (deps:${DEPS_TAG})"
          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/single-admin.yaml \
            --substitutions=_DEPS_TAG="${DEPS_TAG}",_SHORT_SHA="${SHORT_SHA}" \
            --machine-type=e2-highcpu-8 \
            --timeout=1800s \
            .
          echo "::endgroup::"

      # ---- Build 4/4: workspace-agent runtime image ----
      # The agent runs INSIDE each workspace pod (its own Dockerfile, node-pty
      # native build, NOT the deps base), so it can't join the runtime tier.
      # Tag matches the prod convention `sha-<short>`; helm --set below points
      # platformEnv.runtime.workspaceAgentImage at it. New workspaces use the
      # fresh agent immediately; already-running workspaces keep their baked
      # image until they are reprovisioned (reopen / GC), which is expected.
      # Blocking on purpose: shipping a broken agent image should fail the deploy.
      - name: Build workspace-agent (Cloud Build)
        if: steps.tiers.outputs.wsagent == 'true'
        run: |
          set -euo pipefail
          echo "::group::gcloud builds submit — workspace-agent"
          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/workspace-agent.yaml \
            --substitutions=_SHORT_SHA="${SHORT_SHA}" \
            --machine-type=e2-highcpu-8 \
            --timeout=1800s \
            .
          echo "::endgroup::"

      # B6 — BLOCKING vulnerability gate on the images this run just built.
      #
      # Deliberately placed AFTER the builds and BEFORE `helm upgrade`: that is
      # the last point where refusing to ship costs nothing. A gate that ran
      # after the rollout would only be able to tell us we had already shipped
      # the CVE.
      #
      # Why Trivy and not the `gcloud artifacts docker images scan` steps in the
      # Cloud Build configs: Artifact Registry scanning is DISABLED on this
      # project (`containerscanning.googleapis.com` is not enabled), so those
      # steps have been failing into their `|| echo WARN` for as long as they
      # have existed and `allowFailure: true` hid it. They report nothing today.
      #
      # --ignore-unfixed: only CVEs with an available fix can block, otherwise
      # the gate is unactionable and the first instinct is to disable it.
      # Accepted-risk CVEs live in .trivyignore with a justification and expiry.
      - name: Vulnerability gate on built images (blocking)
        run: |
          set -euo pipefail
          # Keep this pinned, and verify the asset actually exists before
          # bumping: release asset names are not stable across versions, and a
          # 404 here fails the gate for the wrong reason (curl -sSfL is silent
          # about it until tar chokes).
          TRIVY_VERSION=0.72.0
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version
          gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

          REG="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}"
          IMAGES=""
          if [ "${{ steps.tiers.outputs.web }}" = "true" ]; then
            IMAGES="${IMAGES} ${REG}/web:${SHORT_SHA}"
          fi
          if [ "${{ steps.tiers.outputs.admin }}" = "true" ]; then
            IMAGES="${IMAGES} ${REG}/admin:${SHORT_SHA}"
          fi
          if [ "${{ steps.tiers.outputs.runtime }}" = "true" ]; then
            for s in api workspace-manager preview-proxy ai-gateway worker screenshotter; do
              IMAGES="${IMAGES} ${REG}/${s}:${SHORT_SHA}"
            done
          fi
          if [ "${{ steps.tiers.outputs.wsagent }}" = "true" ]; then
            IMAGES="${IMAGES} ${REG}/workspace-agent:sha-${SHORT_SHA}"
          fi
          if [ -z "${IMAGES// /}" ]; then
            echo "No tier was rebuilt this run — nothing to scan."
            exit 0
          fi

          rc=0
          for img in ${IMAGES}; do
            echo "::group::trivy ${img}"
            # Two passes so the log is useful: an informational HIGH listing,
            # then the CRITICAL pass that actually decides the gate.
            trivy image --quiet --scanners vuln --severity HIGH \
              --ignore-unfixed --ignorefile .trivyignore "${img}" || true
            if ! trivy image --quiet --scanners vuln --severity CRITICAL \
                   --ignore-unfixed --ignorefile .trivyignore \
                   --exit-code 1 "${img}"; then
              echo "::error::CRITICAL fixable vulnerability in ${img}"
              rc=1
            fi
            echo "::endgroup::"
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Vulnerability gate FAILED — refusing to deploy. Fix the CVE, or add a justified entry to .trivyignore."
            exit 1
          fi
          echo "Vulnerability gate passed for:${IMAGES}"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm render test — admin tier (blocking)
        run: node scripts/validate-helm-admin-tier.mjs

      # D2 (approved 2026-07-17): MANDATORY render test before any upgrade. The
      # rollback flag used to live only in a `kubectl set env`, which the next
      # helm upgrade wiped — silently reviving the fake URL-copy rollback. This
      # step proves the chart itself renders SERVER_DEPLOY_ROLLBACK_FROM_DIGEST
      # under default values, values-prod.yaml AND legacy stored values
      # (--reuse-values simulation), and that values.schema.json rejects a
      # malformed value. Failing here blocks the deploy.
      - name: Helm render test — rollback flag (blocking)
        run: node scripts/validate-helm-rollback-flag.mjs

      # P11 screenshotter render test: proves the chart renders the screenshotter
      # Deployment/Service, the chart-managed auth Secret (mounted on every pod)
      # and the egress NetworkPolicy under the exact --set combination the
      # upgrade below uses — BEFORE touching the release. Failing here blocks
      # the deploy instead of burning an --atomic rollback.
      - name: Helm render test — screenshotter (blocking)
        run: node scripts/validate-helm-screenshotter.mjs

      # P104 / SEC-8: same idea as the D2 test above, for the password-activation
      # interlock — and with the default INVERTED (safe state = "0", not armed).
      # Proves the chart renders "0" by default, under values-prod.yaml, and for
      # legacy stored values (--reuse-values), that the schema rejects a malformed
      # value, that an explicit --set can still arm it, and that the api Deployment
      # actually consumes the configmap carrying it. Failing here blocks the deploy.
      - name: Helm render test — password-activation interlock (blocking)
        run: node scripts/validate-helm-access-activation-flag.mjs

      # kubectl through Connect Gateway: the cluster control plane is
      # IP-restricted, so direct `get-gke-credentials` won't reach it from a
      # GitHub-hosted runner. Connect Gateway routes kubectl through a
      # Google-managed proxy authenticated by the WIF identity (IAM), no VPN.
      - name: Get cluster credentials via Connect Gateway
        run: |
          set -euo pipefail
          gcloud components install gke-gcloud-auth-plugin --quiet
          gcloud container fleet memberships get-credentials "${FLEET_MEMBERSHIP}" \
            --project="${GCP_PROJECT_ID}"
          kubectl config current-context

      - name: Record current release revision (for rollback)
        run: |
          set -euo pipefail
          helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" || true
          echo "Rollback: helm rollback ${HELM_RELEASE} <REVISION> -n ${HELM_NAMESPACE}"

      # ---- P104 / SEC-8: decide phase-1 vs steady-state BEFORE the upgrade ----
      #
      # The hazard, precisely: a PRE-CUTOVER api answered a public static
      # deployment with `Cache-Control: public, max-age=60`. A shared cache may
      # replay that entry for 60s with no revalidation, and the origin cannot
      # purge it. Activating password protection inside that window protects the
      # origin and nothing else — an anonymous visitor keeps getting the cached
      # public copy. Post-cutover the origin emits `no-cache, must-revalidate`,
      # which closes the window for good, but only once every pre-cutover pod is
      # gone AND its last response has aged out.
      #
      # Two independent facts decide what this run must do:
      #
      #   CODE_HAS_INTERLOCK — does the tree being deployed even contain the
      #     interlock? It ships in the same commit as the `no-cache` header, so
      #     its absence means this run deploys PRE-cutover api code.
      #   LIVE_FLAG — is the interlock already armed on the live release? It is
      #     only ever set to "1" by the phase-2 step below, i.e. after a barrier
      #     has already run against post-cutover code. So `LIVE_FLAG=1` implies
      #     the pods currently serving are post-cutover and emit `no-cache`;
      #     nothing can mint a fresh max-age=60 entry and no barrier is needed.
      #
      # Any state we cannot positively recognise as "already safe" takes the
      # barrier. The cost of a needless barrier is ~90s of deploy time; the cost
      # of a skipped one is a protected deployment served from a public cache.
      - name: Detect password-activation cutover (SEC-8)
        id: cutover
        run: |
          set -euo pipefail

          # SEC-9: does the PRODUCTION BUNDLE carry the interlock?
          #
          # This used to be `grep -rq ... services/api/src`, which walks a
          # DIRECTORY — and the directory contains the tests. The token lives in
          # access-policy tests too, so deleting the interlock from the
          # production route while leaving the spec in place still matched: the
          # workflow saw "control present", skipped the barrier as steady state,
          # and armed activation against an api with no interlock at all.
          #
          # The fix is not an --exclude list (another denylist to forget). The
          # verifier walks the real production module graph from the production
          # entrypoint (services/api/src/server.ts) and only inspects files
          # genuinely reachable from it — a spec file is not, so it cannot vote.
          # Cross-validated against `tsc`'s own emitted graph (identical file set).
          # It also refuses to certify if any test file IS reachable, or if the
          # graph is implausibly small (a broken walker must never look like a pass).
          #
          # --expect-sha binds the verdict to the exact commit being deployed, so a
          # certification can never be carried over from another tree.
          #
          # The release-gate job above pins target_sha, derives
          # short_sha=${TARGET_SHA:0:10} into this same SHORT_SHA env, and makes
          # every job check out that target. This verifier keeps its independent
          # SHA assertion as a belt against any future workflow wiring regression.
          INTERLOCK_FAIL_REASON=''

          if node scripts/verify-prod-interlock.mjs \
               --expect-sha "${SHORT_SHA}" \
               --json "${RUNNER_TEMP:-/tmp}/sec9-interlock-attestation.json"; then
            CODE_HAS_INTERLOCK=true
          else
            CODE_HAS_INTERLOCK=false
            # Distinguish the two ways this can fail, because they mean very
            # different things and a wrong message sends the next person hunting
            # the wrong bug.
            HEAD_SHA="$(git rev-parse HEAD)"
            case "${HEAD_SHA}" in
              "${SHORT_SHA}"*) INTERLOCK_FAIL_REASON='absent-from-production-bundle' ;;
              *)               INTERLOCK_FAIL_REASON='sha-mismatch' ;;
            esac
          fi

          # `|| true`: the key is absent on every release predating this change,
          # and an absent key must read as "not armed", not as a step failure.
          LIVE_FLAG="$(kubectl -n "${HELM_NAMESPACE}" get configmap \
            "${HELM_RELEASE}-vibecore-platform-platform-env" \
            -o jsonpath='{.data.DEPLOYMENT_ACCESS_ACTIVATION_ENABLED}' 2>/dev/null || true)"

          echo "code carries the interlock : ${CODE_HAS_INTERLOCK}"
          echo "live activation flag       : '${LIVE_FLAG}'"

          if [ "${CODE_HAS_INTERLOCK}" != "true" ]; then
            # Either the interlock is genuinely absent from the shipping bundle
            # (a rollback to pre-cutover api code — that code ignores the flag AND
            # re-emits max-age=60, so it reverts the fix whatever we set here), or
            # the tree we can inspect is not the image being deployed, in which
            # case we simply cannot certify anything. Both disarm: the flag goes
            # to 0, so the next provable post-cutover deploy is treated as a fresh
            # cutover and re-runs the barrier.
            if [ "${INTERLOCK_FAIL_REASON}" = 'sha-mismatch' ]; then
              echo "::warning::SEC-9 exact-SHA gate: deploying image tag ${SHORT_SHA} but the checked-out tree is $(git rev-parse --short=10 HEAD). The production bundle actually being deployed cannot be inspected from here, so the activation interlock is NOT certified. Disarming DEPLOYMENT_ACCESS_ACTIVATION_ENABLED (fail-closed)."
            else
              echo "::warning::Deploying api code WITHOUT the SEC-8 activation interlock in its PRODUCTION BUNDLE — this reverts the deployment-password cache fix (public static deployments will again be served with Cache-Control: max-age=60). Disarming DEPLOYMENT_ACCESS_ACTIVATION_ENABLED."
            fi
            {
              echo "barrier=false"
              echo "phase1_flag=0"
              echo "final_flag=0"
            } >> "$GITHUB_OUTPUT"
          elif [ "${LIVE_FLAG}" = "1" ]; then
            # Steady state: the running pods are already post-cutover, so no pod
            # in this rollout — old or new — can mint a max-age=60 response. Single
            # upgrade, flag re-asserted (--reuse-values would otherwise freeze it).
            echo "Steady state — pods already post-cutover; no drain barrier needed."
            {
              echo "barrier=false"
              echo "phase1_flag=1"
              echo "final_flag=1"
            } >> "$GITHUB_OUTPUT"
          else
            # THE CUTOVER. Roll the new code with activation still closed, drain,
            # wait out the legacy max-age, and only then arm it in phase 2.
            echo "CUTOVER — phase 1 rolls out with activation CLOSED; phase 2 arms it after the drain barrier."
            {
              echo "barrier=true"
              echo "phase1_flag=0"
              echo "final_flag=1"
            } >> "$GITHUB_OUTPUT"
          fi

      # --reuse-values preserves every existing value (including production
      # config) and overrides only the tiers rebuilt above: web, admin, api,
      # workspace-manager, preview-proxy, ai-gateway, worker, and the
      # workspace-agent runtime image. NOTE: because --reuse-values keeps the
      # release's stored configmap values, a change to values-prod.yaml alone
      # never reaches prod — values that must change here have to be re-asserted
      # via --set. previewUrlTemplate is pinned to the host ROOT (no
      # '/p/<ws>/<port>/' path prefix) so client-side routers in generated apps
      # work; a path prefix makes BrowserRouter-style apps render blank.
      # --atomic auto-rolls-back on a failed
      # upgrade (a bad ai-gateway/worker container fails readiness → rollback;
      # the agent image is a configmap value the api re-reads on its restart).
      - name: Helm upgrade (affected image tags)
        run: |
          set -euo pipefail
          # Only --set the imageTag of a tier we actually rebuilt this run; a skipped
          # tier keeps its currently-deployed tag via --reuse-values. This is what
          # makes conditional builds safe: we NEVER point a Deployment at an image
          # tag that wasn't published, so there is no ImagePullBackOff / atomic
          # rollback risk. previewUrlTemplate is always re-asserted (configmap value
          # that --reuse-values would otherwise freeze).
          SETS=( --set "platformEnv.runtime.previewUrlTemplate=https://{workspaceId}-{port}.preview.e-code.ai/" )
          # D2 (approved 2026-07-17): re-assert the digest-rollback flag on EVERY
          # upgrade (configmap value that --reuse-values would otherwise freeze
          # at whatever the release stored). Belt on top of the chart default
          # "1" + values.schema.json; the post-deploy step below verifies the
          # flag actually reached the running api pods.
          SETS+=( --set-string "platformEnv.runtime.serverDeployRollbackFromDigest=1" )
          # P104 / SEC-8: phase-1 value of the activation interlock, decided by the
          # cutover step above ("0" on a cutover, "1" in steady state). Always
          # explicit — --reuse-values would otherwise freeze whatever the release
          # happens to store, which is precisely how an interlock silently rots.
          SETS+=( --set-string "platformEnv.runtime.deploymentAccessActivationEnabled=${{ steps.cutover.outputs.phase1_flag }}" )
          if [ "${{ steps.tiers.outputs.web }}" = "true" ]; then
            SETS+=( --set "services.web.imageTag=${SHORT_SHA}" )
          fi
          if [ "${{ steps.tiers.outputs.admin }}" = "true" ]; then
            SETS+=( --set "services.admin.imageTag=${SHORT_SHA}" )
          fi
          if [ "${{ steps.tiers.outputs.runtime }}" = "true" ]; then
            SETS+=(
              --set "services.api.imageTag=${SHORT_SHA}"
              --set "services.workspaceManager.imageTag=${SHORT_SHA}"
              --set "services.previewProxy.imageTag=${SHORT_SHA}"
              --set "services.aiGateway.imageTag=${SHORT_SHA}"
              --set "services.worker.imageTag=${SHORT_SHA}"
              # P11 screenshotter (auto thumbnails). Asserted here — NOT only in
              # values-prod.yaml — because --reuse-values ignores that file. Gated
              # on the runtime tier so enabled=true is only ever set in a run that
              # just pushed screenshotter:${SHORT_SHA} (never an unpublished tag →
              # no ImagePullBackOff risk); once stored, --reuse-values carries
              # enabled+imageTag through web-only deploys. The shared secret is
              # chart-managed (templates/screenshotter-auth-secret.yaml), the
              # config values are re-asserted like previewUrlTemplate above.
              --set "services.screenshotter.enabled=true"
              --set "services.screenshotter.imageTag=${SHORT_SHA}"
              --set-string "platformEnv.screenshotterUrl=http://vibecore-vibecore-platform-screenshotter.vibecore.svc.cluster.local:3030"
              --set-string "platformEnv.screenshotterAllowedHosts=preview.e-code.ai"
              --set-string "platformEnv.screenshotterPreviewProxyUrl=http://vibecore-vibecore-platform-preview-proxy.vibecore.svc.cluster.local:3020"
            )
          fi
          if [ "${{ steps.tiers.outputs.wsagent }}" = "true" ]; then
            SETS+=( --set "platformEnv.runtime.workspaceAgentImage=${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}/workspace-agent:sha-${SHORT_SHA}" )
          fi
          echo "helm --set args: ${SETS[*]}"
          helm upgrade "${HELM_RELEASE}" infra/helm/platform \
            --namespace "${HELM_NAMESPACE}" \
            --reuse-values \
            --atomic \
            --timeout 10m \
            "${SETS[@]}"

      - name: Verify rollout
        run: |
          set -euo pipefail
          for svc in web admin api workspace-manager preview-proxy ai-gateway worker; do
            dep="$(kubectl -n "${HELM_NAMESPACE}" get deploy \
              -l "app.kubernetes.io/name=${svc}" -o name 2>/dev/null | head -n1)"
            if [ -z "${dep}" ]; then
              # Fall back to the released chart's naming if the label selector misses.
              dep="deploy/${HELM_RELEASE}-vibecore-platform-${svc}"
            fi
            echo "::group::rollout status ${dep}"
            kubectl -n "${HELM_NAMESPACE}" rollout status "${dep}" --timeout=5m
            echo "::endgroup::"
          done
          # A successful rollout alone does not prove Helm used the image this
          # run just signed. Verify the live Deployment template is pinned to the
          # exact admin tag whenever the admin tier was rebuilt.
          if [ "${{ steps.tiers.outputs.admin }}" = "true" ]; then
            ADMIN_DEPLOY="${HELM_RELEASE}-vibecore-platform-admin"
            EXPECTED_ADMIN="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}/admin:${SHORT_SHA}"
            LIVE_ADMIN="$(kubectl -n "${HELM_NAMESPACE}" get deploy "${ADMIN_DEPLOY}" -o jsonpath='{.spec.template.spec.containers[0].image}')"
            echo "admin deployment image: ${LIVE_ADMIN}"
            if [ "${LIVE_ADMIN}" != "${EXPECTED_ADMIN}" ]; then
              echo "::error::admin rollout used '${LIVE_ADMIN}', expected '${EXPECTED_ADMIN}'" >&2
              exit 1
            fi
          fi
          # P11 screenshotter — only exists once a runtime-tier deploy has asserted
          # services.screenshotter.enabled=true (see the helm SETS above), so check
          # for the Deployment instead of failing a web-only deploy that predates it.
          if kubectl -n "${HELM_NAMESPACE}" get deploy "${HELM_RELEASE}-vibecore-platform-screenshotter" >/dev/null 2>&1; then
            echo "::group::rollout status deploy/${HELM_RELEASE}-vibecore-platform-screenshotter"
            kubectl -n "${HELM_NAMESPACE}" rollout status "deploy/${HELM_RELEASE}-vibecore-platform-screenshotter" --timeout=5m
            echo "::endgroup::"
          else
            echo "screenshotter Deployment absent (not yet enabled by a runtime-tier deploy) — skipped"
          fi

      # ---- P104 / SEC-8 · phase 1 -> phase 2 barrier -------------------------
      #
      # `rollout status` above returned as soon as the NEW ReplicaSet was complete.
      # That is not the property we need. Old pods can still exist and still serve
      # (they keep answering through their ~10s preStop drain), and any response
      # they emit carries `max-age=60` — reusable from a shared cache for a full
      # minute after the pod itself is gone. So the barrier waits for BOTH:
      #
      #   1. zero pods outside the image the Deployment now wants — terminating
      #      ones included, since a terminating pod still answers; and
      #   2. 60s (the legacy max-age) + 30s margin of that being CONTINUOUSLY true.
      #
      # The clock is armed when the last old pod disappears, not when the rollout
      # started, and it RE-ARMS from zero if an old pod ever reappears (HPA scaling
      # the previous ReplicaSet, a partial rollback). The margin absorbs clock skew
      # between the pod that stamped the response and this runner, `Age` already
      # accrued in an intermediate cache, and the poll granularity.
      #
      # The state machine lives in scripts/deploy-cache-window.mjs and is proven
      # against a fake clock in scripts/deploy-cache-window.spec.mjs — including
      # the re-arm, the terminating-pod and the timeout cases — so this guarantee
      # is testable without a cluster. On timeout the step FAILS with the release
      # still at DEPLOYMENT_ACCESS_ACTIVATION_ENABLED=0: activation stays closed.
      # ---- P104 / SEC-9 · runtime probe of the DEPLOYED production API --------
      #
      # Everything before this point reasons about SOURCE. This step asks the
      # thing that is actually serving traffic. After phase 1 the rolled-out api
      # must REFUSE to activate password protection, and refuse it with the
      # interlock's own error code. That is only true if the interlock is present
      # AND wired AND reading the flag we set — three things no static check can
      # fully guarantee about a container image built elsewhere by Cloud Build.
      #
      # Unauthenticated on purpose: the route answers 401 before any interlock is
      # consulted, so the probe asserts the WEAKER, always-true property — the api
      # must never answer 2xx here while the interlock is closed. A 2xx means an
      # activation just succeeded unauthenticated, which is a far worse bug.
      # Any real non-2xx response is conclusive refusal; a real 2xx is a blocking
      # security failure. Transport/tooling failures are inconclusive: they keep
      # activation at 0 and skip phase 2 without relabelling a healthy rollout as
      # failed. The script captures stdout, stderr and status separately so `set
      # -e` cannot erase the diagnostic, then deletes only its exact probe pod.
      - name: Runtime probe — deployed api refuses activation in phase 1 (SEC-9)
        id: phase1-probe
        if: steps.cutover.outputs.barrier == 'true'
        run: bash scripts/probe-deployment-activation.sh

      - name: Drain barrier — outlast the legacy public max-age (SEC-8)
        id: barrier
        if: steps.cutover.outputs.barrier == 'true'
        env:
          LEGACY_MAX_AGE_SECONDS: '60'
          SAFETY_MARGIN_SECONDS: '30'
          POLL_INTERVAL_SECONDS: '5'
          MAX_WAIT_SECONDS: '900'
        run: |
          set -euo pipefail
          # The image the api Deployment now WANTS (read back from the live
          # cluster, not assumed from SHORT_SHA — a run where the runtime tier was
          # skipped keeps its previous tag, and the barrier must compare against
          # what is actually being rolled out).
          EXPECTED_IMAGE="$(kubectl -n "${HELM_NAMESPACE}" get deploy \
            "${HELM_RELEASE}-vibecore-platform-api" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [ -z "${EXPECTED_IMAGE}" ]; then
            echo "::error::Could not read the api Deployment's image — refusing to arm activation." >&2
            exit 1
          fi
          echo "Barrier target image: ${EXPECTED_IMAGE}"

          # SEC-10: the api actually running MUST be the commit whose production
          # bundle we certified, or the certification says nothing about it.
          #
          # Without this the barrier can clear against PRE-cutover code. Concretely:
          # a cutover run dies before the helm upgrade (flag never set, api still
          # pre-cutover); a later push touches only app/, so `Detect changed tiers`
          # leaves runtime=false and the api keeps its old image. Cutover detection
          # still says "cutover" (the TREE carries the interlock), the barrier
          # compares pods against that OLD image, finds nothing older, clears after
          # 90s — and phase 2 arms activation against an api with no interlock that
          # is still emitting `max-age=60`. The runtime probe above does not catch
          # it either: it is unauthenticated, and the route answers 401 before the
          # interlock is ever consulted, so a pre-cutover api looks identical.
          #
          # Withhold arming instead — do NOT fail the job. By this point the
          # rollout has already succeeded, and turning "cannot certify the
          # interlock" into "the production deploy failed" would be both wrong and
          # actively harmful: it fires the rollback alarms for a deploy that is
          # fine. The safe outcome is simply that activation stays closed, so this
          # sets armable=false and the phase-2 step below skips. The release stays
          # at DEPLOYMENT_ACCESS_ACTIVATION_ENABLED=0 and the next deploy that
          # really rebuilds the api re-runs the whole sequence.
          case "${EXPECTED_IMAGE}" in
            *:"${SHORT_SHA}")
              echo "armable=true" >> "$GITHUB_OUTPUT"
              echo "SEC-10 ok: running api image is built from the certified commit ${SHORT_SHA}"
              ;;
            *)
              echo "armable=false" >> "$GITHUB_OUTPUT"
              echo "::warning::SEC-10: the api Deployment runs ${EXPECTED_IMAGE}, which is not built from the commit whose production bundle was certified (${SHORT_SHA}) — the runtime tier was not rebuilt this run, so the running code may predate the activation interlock. NOT arming password activation; the release stays fail-closed at DEPLOYMENT_ACCESS_ACTIVATION_ENABLED=0. The deploy itself is unaffected."
              exit 0
              ;;
          esac
          EXPECTED_IMAGE="${EXPECTED_IMAGE}" node scripts/deploy-cache-window.mjs

      # ---- P104 / SEC-8 · phase 2: NOW it is safe to arm activation ----------
      #
      # Only reached when the barrier proved no pre-cutover pod has existed for
      # longer than the legacy max-age. Flipping the configmap changes the pod
      # template's checksum annotation, so the api rolls once more; that is fine
      # and deliberate — every pod involved (old and new) is post-cutover code
      # emitting `no-cache`, so no cache entry can be minted during it. While that
      # roll is in flight, activation requests may hit a not-yet-updated pod and
      # get 503 DEPLOYMENT_ACCESS_ACTIVATION_DISABLED: fail-closed, and transient.
      - name: Phase 2 — arm password activation (SEC-8)
        # SEC-9 requires a conclusive refusal from the deployed API. SEC-10 also
        # requires the barrier to certify that its pods run the verified commit.
        if: steps.cutover.outputs.barrier == 'true' && steps.phase1-probe.outputs.armable == 'true' && steps.barrier.outputs.armable == 'true'
        run: |
          set -euo pipefail
          helm upgrade "${HELM_RELEASE}" infra/helm/platform \
            --namespace "${HELM_NAMESPACE}" \
            --reuse-values \
            --atomic \
            --timeout 10m \
            --set "platformEnv.runtime.previewUrlTemplate=https://{workspaceId}-{port}.preview.e-code.ai/" \
            --set-string "platformEnv.runtime.serverDeployRollbackFromDigest=1" \
            --set-string "platformEnv.runtime.deploymentAccessActivationEnabled=1"
          kubectl -n "${HELM_NAMESPACE}" rollout status \
            "deploy/${HELM_RELEASE}-vibecore-platform-api" --timeout=5m

      # D2 (approved 2026-07-17): POST-DEPLOY proof that the rollback flag
      # survived the upgrade — checked against the LIVE cluster (rendered
      # configmap value AND the env of a running api pod), not the workflow's
      # own inputs. If this fails the job goes red and the Notify step below
      # alerts (job summary + Slack): that IS the "flag absent after helm
      # upgrade" alert. A failure here does NOT auto-rollback — the deployed
      # code fails CLOSED (api refuses URL-only rollbacks even without the
      # env var), so red-alert-and-investigate beats a blind rollback.
      - name: Verify rollback flag survived the upgrade (D2)
        run: |
          set -euo pipefail
          CM_VALUE="$(kubectl -n "${HELM_NAMESPACE}" get configmap "${HELM_RELEASE}-vibecore-platform-platform-env" \
            -o jsonpath='{.data.SERVER_DEPLOY_ROLLBACK_FROM_DIGEST}')"
          echo "configmap SERVER_DEPLOY_ROLLBACK_FROM_DIGEST='${CM_VALUE}'"
          if [ "${CM_VALUE}" != "1" ]; then
            echo "::error::SERVER_DEPLOY_ROLLBACK_FROM_DIGEST missing/wrong in the live configmap after upgrade (got '${CM_VALUE}', want '1')" >&2
            exit 1
          fi
          # `kubectl exec` is NOT available through the Connect Gateway for the
          # CI's WIF identity (websocket upgrade denied — 5/5 retries failed on
          # both live runs while the pods actually carried '1'). Verify WITHOUT
          # exec, via plain GETs that DO work from here: the api Deployment's
          # pod template must consume the flag — an explicit env entry (must be
          # '1') or envFrom on the platform-env configmap whose live value was
          # asserted above. Every pod the Deployment creates then starts with
          # the flag; there is no per-pod drift channel left to check.
          TEMPLATE_JSON="$(kubectl -n "${HELM_NAMESPACE}" get deploy "${HELM_RELEASE}-vibecore-platform-api" \
            -o jsonpath='{.spec.template.spec.containers[0]}')"
          EXPLICIT="$(printf '%s' "${TEMPLATE_JSON}" | jq -r '[.env // [] | .[] | select(.name=="SERVER_DEPLOY_ROLLBACK_FROM_DIGEST")][0].value // "ABSENT"')"
          CONSUMES_CM="$(printf '%s' "${TEMPLATE_JSON}" | jq -r --arg cm "${HELM_RELEASE}-vibecore-platform-platform-env" '[.envFrom // [] | .[] | select(.configMapRef.name==$cm)] | length')"
          echo "api pod template: explicit env='${EXPLICIT}', envFrom platform-env configmap refs=${CONSUMES_CM}"
          if [ "${EXPLICIT}" != "ABSENT" ] && [ "${EXPLICIT}" != "1" ]; then
            echo "::error::api pod template pins SERVER_DEPLOY_ROLLBACK_FROM_DIGEST='${EXPLICIT}' (explicit env overrides the configmap)" >&2
            exit 1
          fi
          if [ "${EXPLICIT}" = "ABSENT" ] && [ "${CONSUMES_CM}" = "0" ]; then
            echo "::error::api pod template neither sets SERVER_DEPLOY_ROLLBACK_FROM_DIGEST nor consumes the platform-env configmap" >&2
            exit 1
          fi

      # P104 / SEC-8: POST-DEPLOY proof, read back from the LIVE cluster. The
      # cutover step supplies the maximum desired state; SEC-9 or SEC-10 may lower
      # it to "0" when the deployed API cannot be certified. A value of "1" still
      # requires a conclusive runtime refusal and a barrier against the certified
      # API commit. This catches a phase-2 no-op and any unproven arming.
      - name: Verify the activation interlock state (SEC-8)
        run: |
          set -euo pipefail
          WANT="${{ steps.cutover.outputs.final_flag }}"
          if [ "${{ steps.cutover.outputs.barrier }}" = 'true' ] && \
             { [ "${{ steps.phase1-probe.outputs.armable }}" != 'true' ] || \
               [ "${{ steps.barrier.outputs.armable }}" != 'true' ]; }; then
            # A healthy rollout may be impossible to certify because the probe
            # was inconclusive (SEC-9) or the live api tag did not bind to the
            # certified commit (SEC-10). Both deliberately withhold phase 2.
            WANT='0'
          fi
          CM_VALUE="$(kubectl -n "${HELM_NAMESPACE}" get configmap "${HELM_RELEASE}-vibecore-platform-platform-env" \
            -o jsonpath='{.data.DEPLOYMENT_ACCESS_ACTIVATION_ENABLED}')"
          echo "configmap DEPLOYMENT_ACCESS_ACTIVATION_ENABLED='${CM_VALUE}' (expected '${WANT}')"
          if [ "${CM_VALUE}" != "${WANT}" ]; then
            echo "::error::DEPLOYMENT_ACCESS_ACTIVATION_ENABLED is '${CM_VALUE}' in the live configmap, expected '${WANT}'" >&2
            exit 1
          fi
          # Same reasoning as the D2 step above: `kubectl exec` is not available to
          # the CI identity through Connect Gateway, so prove the value REACHES the
          # process via the api pod template instead. An explicit env entry would
          # override the configmap, so it must either be absent or already correct.
          TEMPLATE_JSON="$(kubectl -n "${HELM_NAMESPACE}" get deploy "${HELM_RELEASE}-vibecore-platform-api" \
            -o jsonpath='{.spec.template.spec.containers[0]}')"
          EXPLICIT="$(printf '%s' "${TEMPLATE_JSON}" | jq -r '[.env // [] | .[] | select(.name=="DEPLOYMENT_ACCESS_ACTIVATION_ENABLED")][0].value // "ABSENT"')"
          CONSUMES_CM="$(printf '%s' "${TEMPLATE_JSON}" | jq -r --arg cm "${HELM_RELEASE}-vibecore-platform-platform-env" '[.envFrom // [] | .[] | select(.configMapRef.name==$cm)] | length')"
          echo "api pod template: explicit env='${EXPLICIT}', envFrom platform-env configmap refs=${CONSUMES_CM}"
          if [ "${EXPLICIT}" != "ABSENT" ] && [ "${EXPLICIT}" != "${WANT}" ]; then
            echo "::error::api pod template pins DEPLOYMENT_ACCESS_ACTIVATION_ENABLED='${EXPLICIT}' (explicit env overrides the configmap)" >&2
            exit 1
          fi
          if [ "${EXPLICIT}" = "ABSENT" ] && [ "${CONSUMES_CM}" = "0" ]; then
            echo "::error::api pod template neither sets DEPLOYMENT_ACCESS_ACTIVATION_ENABLED nor consumes the platform-env configmap" >&2
            exit 1
          fi
          {
            echo "### SEC-8 password-activation interlock"
            echo ""
            echo "- **Barrier ran this deploy:** \`${{ steps.cutover.outputs.barrier }}\`"
            echo "- **SEC-9 probe armable:** \`${{ steps.phase1-probe.outputs.armable }}\`"
            echo "- **SEC-10 barrier armable:** \`${{ steps.barrier.outputs.armable }}\`"
            echo "- **Live \`DEPLOYMENT_ACCESS_ACTIVATION_ENABLED\`:** \`${CM_VALUE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Notifications: always runs. Writes a GitHub job summary (visible on the
      # run + emailed to the actor by GitHub on failure) and, when a Slack
      # webhook secret is configured, posts there too. The Slack step is a no-op
      # if the secret is absent, so this works with zero extra setup.
      - name: Notify result
        if: always()
        env:
          STATUS: ${{ job.status }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
        run: |
          set -uo pipefail
          if [ "${STATUS}" = "success" ]; then
            ICON=":white_check_mark:"; TITLE="Production deploy succeeded"
          else
            ICON=":x:"; TITLE="Production deploy FAILED"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## ${TITLE}"
            echo ""
            echo "- **Tag:** \`${SHORT_SHA:-unknown}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Release:** \`${HELM_RELEASE}\` / ns \`${HELM_NAMESPACE}\`"
            echo "- **Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${SLACK_WEBHOOK}" ]; then
            payload="$(printf '{"text":"%s %s\n>tag: %s | commit: %s\n>%s"}' \
              "${ICON}" "${TITLE}" "${SHORT_SHA:-unknown}" "${GITHUB_SHA}" "${RUN_URL}")"
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "${payload}" "${SLACK_WEBHOOK}" || echo "WARN: Slack notify failed (non-fatal)"
          else
            echo "SLACK_DEPLOY_WEBHOOK not set — skipping Slack notification."
          fi
