# Continuous deployment to production on push to main.
#
# Why this exists: every prod deploy used to be a manual `gcloud builds submit`
# from a laptop followed by a hand-typed `helm upgrade`. This wires the same
# steps into CI.
#
# Relationship to deploy-prod.yml: that workflow is the *gated, manual* path
# (staging-validation gate + rollback confirmation + immutable pinned tag).
# This workflow is the *continuous* path: it builds the two prod image tiers
# from the pushed commit and rolls them out. Both deploy the same chart/release;
# they are intentionally separate because the manual path's required inputs and
# `confirm_rollback_plan == READY` gate cannot be satisfied by a push event.
#
# Build constraints (see infra/cloudbuild/*.yaml and docs/INFRASTRUCTURE.md):
#   * Only ONE Cloud Build worker slot exists, and cloudbuild.yaml's 7 parallel
#     builds deadlock an 8GB VM. So we run the two tier builds SEQUENTIALLY via
#     two blocking `gcloud builds submit` calls (no --async).
#   * runtime-tier.yaml rebuilds the `deps` base image; single-web.yaml only
#     *consumes* a deps image via _DEPS_TAG. Runtime therefore builds first and
#     publishes deps:<sha>, then web builds against that exact deps tag so the
#     web image matches this commit's lockfile.
#   * runtime-tier.yaml serializes api, workspace-manager, preview-proxy,
#     ai-gateway, worker and screenshotter on the 8 GB worker. Admin is not built
#     by this continuous path; its current digest is carried forward unchanged.
#
# ---------------------------------------------------------------------------
# RELEASE INTEGRITY (exact-SHA gate) — added 2026-08-12
# ---------------------------------------------------------------------------
# Until now this workflow built and rolled out EVERY push to main with no
# relationship to that commit's test results. Verified against the GitHub API,
# three commits reached production on a red or cancelled pipeline:
#
#   113c17e8  Production CI = failure    -> deployed
#   9fc8a243  Production CI = failure    -> deployed
#   3a53b439  Production CI + Quality = cancelled -> deployed
#
# and Production E2E had never run on any of them, because e2e.yml did not
# trigger on push to main at all.
#
# The structure below closes that. Read it as four layers:
#
#   resolve-target   binds the whole run to ONE full 40-hex commit. There is no
#                    free-form tag input any more: a dispatch names a commit, and
#                    that commit must already be on main.
#   release-gate     proves CI + E2E + Security + Quality are green FOR THAT EXACT
#                    COMMIT. It holds NO cloud credentials — `id-token: write` is
#                    granted per-job, and only to build-and-deploy — so a refusal
#                    is structurally before WIF, not merely before it in reading
#                    order.
#   preflight-gates  repo-local policy (secret scan, signing wiring).
#   build-and-deploy builds, resolves every image to an immutable DIGEST, scans
#                    and signature-verifies THAT digest, records a manifest
#                    (service -> source sha -> build id -> digest -> signature ->
#                    SBOM), deploys BY DIGEST, and then proves the running pods
#                    report those digests back.
#
# Break-glass (when the gate must be bypassed) is deliberately NOT here: it lives
# in deploy-break-glass.yml, which can only deploy a previously signed manifest
# and needs two approvals. Adding a bypass switch to this workflow would make the
# gate optional, which is the same as not having it.

name: Deploy Production (Continuous)

on:
  push:
    branches: [main]
    # Commits that cannot change a runtime image skip the (expensive)
    # build+rollout. `paths-ignore` only skips when EVERY changed file matches,
    # so a commit that also touches product code still deploys — this never
    # trades away a real deployment.
    #
    # Why this list grew: on 2026-08-27, five deploys ran back to back and FOUR
    # of them changed zero runtime files — a parity drift-check workflow, an
    # i18n audit Playwright config, a deploy-workflow probe fix, a CI workflow.
    # Each cost a full sequential Cloud Build of both tiers (~50 min), and since
    # deploys are serialized, they were the critical path of the whole merge
    # train while changing nothing that ships.
    #
    # Nothing here ends up inside an image: workflows and composite actions run
    # on the runner, specs and tests are not bundled, and the Playwright configs
    # only drive CI. A change to this very workflow takes effect on the next
    # push regardless, since GitHub reads the workflow from the pushed ref — and
    # `workflow_dispatch` below is always available to force a deploy on demand.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
      - 'tests/**'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/*.spec.mjs'
      - '**/*.spec.js'
      - 'playwright*.config.ts'
  workflow_dispatch:
    inputs:
      target_sha:
        description: >-
          Full 40-hex commit sha to deploy. Must already be an ancestor of
          origin/main and must pass the same release gate as a push. Leave empty
          to deploy the head of main.
        required: false
      force_tiers:
        description: >-
          Force which tiers to build (comma list of web/runtime/wsagent, or 'all'),
          bypassing path detection. For validating conditional builds via dispatch.
        required: false

# NOTE: `id-token: write` is deliberately NOT granted here. Granting it at the
# workflow level hands a WIF-exchangeable token to every job, including the gate
# that is supposed to be able to refuse before any cloud credential exists. It is
# granted on build-and-deploy alone.
permissions:
  contents: read
  # Lire les runs de ce workflow pour retrouver le dernier déploiement RÉUSSI,
  # qui sert de base au calcul des tiers à reconstruire.
  actions: read

# Never run two production rollouts at once, and never cancel an in-flight one
# (cancelling mid-`helm upgrade --atomic` or mid-build leaves things half-applied).
concurrency:
  group: deploy-production-continuous
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPO: vibecore-prod-containers
  FLEET_MEMBERSHIP: vibecore-prod-app
  HELM_RELEASE: vibecore
  HELM_NAMESPACE: vibecore
  # Must match infra/cloudbuild/*.yaml `_KMS_KEYRING` / `_KMS_KEY` — those are what
  # actually SIGN the images. These workflows previously said `vibecore-supply-chain`,
  # a keyring that does not exist in the project (`gcloud kms keyrings list` returns
  # only `ecode-supply-chain`), so `cosign verify` could never have succeeded.
  KMS_KEYRING: ecode-supply-chain
  KMS_KEY_NAME: cosign-images

jobs:
  # ---------------------------------------------------------------------------
  # Bind the run to exactly one commit, before anything else happens.
  # ---------------------------------------------------------------------------
  resolve-target:
    name: Resolve target commit (exact SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      short_sha: ${{ steps.target.outputs.short_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the dispatch path has to prove the requested commit is
          # actually on main, which needs main's history locally.
          fetch-depth: 0

      # THE WORKFLOW GRAPH ITSELF MUST BE MAIN'S.
      #
      # Every other assertion in this file checks the CODE at `target_sha`. None of them
      # can see which workflow YAML is actually executing: `workflow_dispatch` runs the
      # graph from the ref it was dispatched on, so a feature branch could carry an
      # edited deploy-main.yml — with the gate removed — and still reach the production
      # environment and WIF. Production dispatches from feature branches have already
      # succeeded in this repo, so this is observed behaviour, not a hypothetical.
      #
      # `GITHUB_WORKFLOW_REF` is the one value that names the file AND the ref actually
      # loaded, e.g. `owner/repo/.github/workflows/deploy-main.yml@refs/heads/main`. It
      # is set by the runner and is not settable from inputs.
      #
      # This is defence in depth, not the whole defence: the durable controls are the
      # `production` environment's branch policy and the WIF provider's subject
      # condition, both of which need repo/GCP admin. As of 2026-08-12 the `production`
      # environment had `protection_rules: []` and `branch_policy: null` — i.e. no
      # protection at all — so this check is currently the ONLY thing enforcing it.
      - name: Assert this workflow graph is main's, not a side branch's
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_REPOSITORY}/.github/workflows/deploy-main.yml@refs/heads/main"
          echo "workflow_ref = ${WORKFLOW_REF}"
          echo "expected     = ${EXPECTED}"
          if [ "${WORKFLOW_REF}" != "${EXPECTED}" ]; then
            echo "::error::this run is executing '${WORKFLOW_REF}', not the deploy workflow on refs/heads/main."
            echo "::error::Production can only be deployed by main's own workflow file. Dispatch from main."
            exit 1
          fi
          # Belt: on a push, the ref must also be main (paths-ignore/branches already
          # ensure it, but a future trigger edit must not quietly widen this).
          if [ "${EVENT}" = "push" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::push event on ${GITHUB_REF}, expected refs/heads/main"
            exit 1
          fi

      - name: Resolve and bind target SHA
        id: target
        env:
          # Via env, never interpolated into the shell: this value is attacker-
          # controllable on a dispatch and the run must not be able to execute it.
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${TARGET_SHA_INPUT:-}" ]; then
            # A dispatch may only name a commit — never a free-form image tag.
            # The old `short_sha` input accepted any 7-40 hex string and used it
            # directly as the tag to build and deploy, with no requirement that it
            # correspond to a commit, to main, or to anything that had been tested.
            if ! printf '%s' "${TARGET_SHA_INPUT}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::target_sha must be a FULL 40-hex commit sha (got '${TARGET_SHA_INPUT}')"
              exit 1
            fi
            TARGET_SHA="${TARGET_SHA_INPUT}"

          else
            TARGET_SHA="${PUSH_SHA}"
          fi

          if ! printf '%s' "${TARGET_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::resolved target sha is not 40-hex: '${TARGET_SHA}'"
            exit 1
          fi

          # Existence and main-ancestry are checked for EVERY resolved target, not only
          # for an explicitly dispatched one. Previously the push path skipped both on
          # the assumption that `github.sha` is trivially on main — which stops being
          # true the moment a trigger is widened, a workflow is re-dispatched on another
          # ref, or the event payload is anything but a plain push. An assumption that
          # only holds under today's triggers is not a check.
          if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            echo "::error::${TARGET_SHA} is not a commit in this repository"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${TARGET_SHA}" origin/main; then
            echo "::error::${TARGET_SHA} is not an ancestor of origin/main — refusing to deploy an off-main commit"
            exit 1
          fi

          # The image tag is DERIVED from the target commit, never supplied. This is
          # what makes "the tag we build" and "the commit we gated" the same fact.
          SHORT_SHA="${TARGET_SHA:0:10}"

          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "### Target commit"
            echo ""
            echo "- **SHA:** \`${TARGET_SHA}\`"
            echo "- **Derived image tag:** \`${SHORT_SHA}\`"
            echo "- **Trigger:** \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The gate. Holds no cloud credentials — see the permissions block.
  # ---------------------------------------------------------------------------
  release-gate:
    name: Release gate — required checks green for THIS commit (blocking)
    needs: [resolve-target]
    runs-on: ubuntu-latest
    # Long enough to outlast a full CI+E2E cycle for the commit that was just
    # pushed; the gate itself refuses within seconds once a check goes red.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read # read other workflows' runs for this commit
      # NO id-token. A refusal here happens before any Google credential exists.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Assert checkout is exactly the target commit
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "HEAD=${HEAD_SHA} TARGET=${TARGET_SHA}"
          if [ "${HEAD_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::checkout HEAD ${HEAD_SHA} != target ${TARGET_SHA}"
            exit 1
          fi

      - name: Assert every required workflow file exists at the pinned path
        run: |
          set -euo pipefail
          # The policy pins workflows by numeric id + path. If the file is gone at
          # this commit, the gate would sit waiting for a run that can never start,
          # and the failure would look like a timeout instead of what it is.
          missing=0
          while read -r p; do
            if [ ! -f "${p}" ]; then
              echo "::error::required workflow file '${p}' does not exist at this commit"
              missing=1
            else
              echo "ok: ${p}"
            fi
          done < <(python3 -c "import json;[print(w['path']) for w in json.load(open('scripts/release-gate/required-checks.json'))['requiredWorkflows']]")
          [ "${missing}" -eq 0 ]

      - name: Self-test the gate engine before trusting it
        # Hermetic (Node stdlib only, no node_modules): the gate proves its own
        # refusal logic on fixtures before it is allowed to decide anything real.
        run: node scripts/release-gate/verify-required-checks.mjs --self-test

      - name: Verify required checks are green for this exact commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          node scripts/release-gate/verify-required-checks.mjs \
            --sha "${TARGET_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json gate-verdict.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-verdict-${{ needs.resolve-target.outputs.short_sha }}
          path: gate-verdict.json
          if-no-files-found: warn

  # B6 — gates that must pass BEFORE anything is built or rolled out.
  #
  # security.yaml already runs gitleaks on push/PR, but that is a *separate*
  # workflow: a red run there does not stop this one, so a secret could still
  # ride into production. This job puts the same check on the deploy path
  # itself, where failing it actually prevents the rollout.
  preflight-gates:
    name: Preflight gates (secrets + pipeline policy, blocking)
    needs: [resolve-target, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Assert checkout is exactly the target commit
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::checkout HEAD ${HEAD_SHA} != target ${TARGET_SHA}"
            exit 1
          fi
          echo "scanning ${HEAD_SHA}"

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (blocking)
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

      # Policy gate: the image-signing steps are what make the Kyverno admission
      # policy satisfiable. If someone deletes or renames them, builds keep
      # succeeding and the failure only surfaces later as pods refused at
      # admission — during a rollout, at the worst possible moment. Assert here
      # instead, where the error is obvious and cheap.
      # The validator parses the step structure rather than grepping it. A
      # line-range grep here is actively dangerous: an awk range like
      # /id: sign-image/,/^  - id: [^s]/ never closes when the following step
      # also starts with "s" (scan-images), so it swallows that step's
      # `allowFailure: true` and the gate fails on a perfectly good tree.
      # The validator is HERMETIC — pure Python 3 stdlib, no PyYAML — so the gate
      # never depends on a dependency that happens to be preinstalled on the
      # runner. --self-test first proves the parser itself before it is trusted.
      - name: Pipeline policy — image signing must still be wired
        run: |
          set -euo pipefail
          python3 scripts/validate-image-signing-wired.py --self-test
          python3 scripts/validate-image-signing-wired.py

      # Same idea, applied to the gate itself: prove that THIS workflow still runs
      # the deploy behind the release gate, still withholds WIF from the gate job,
      # still pins the rollout by digest, and still requires all four pipelines.
      # A gate that can be quietly unwired is a gate with an expiry date.
      - name: Pipeline policy — the exact-SHA release gate must still be wired
        run: |
          set -euo pipefail
          node scripts/release-gate/validate-deploy-gate-wired.mjs --self-test
          node scripts/release-gate/validate-deploy-gate-wired.mjs

  build-and-deploy:
    name: Build tiers sequentially, then helm upgrade by digest
    # Both gates, explicitly. `preflight-gates` already needs `release-gate`, but
    # naming it here too means a future edit to preflight's `needs:` cannot quietly
    # detach the deploy from the gate.
    needs: [resolve-target, release-gate, preflight-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # the ONLY job that can exchange a WIF token
    environment:
      name: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Pinned to the gated commit, not to whatever main points at now: on a
          # busy branch, `github.sha` for a queued run can be several commits behind
          # HEAD, and checking out a ref instead of a sha would build code that was
          # never gated.
          ref: ${{ needs.resolve-target.outputs.target_sha }}
          # Full history so the change-detection step can diff this push against
          # its `before` SHA (or HEAD~1 on workflow_dispatch).
          fetch-depth: 0

      - name: Assert checkout is exactly the gated commit
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          SHORT_SHA: ${{ needs.resolve-target.outputs.short_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "HEAD=${HEAD_SHA} TARGET=${TARGET_SHA}"
          if [ "${HEAD_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::checkout HEAD ${HEAD_SHA} != gated target ${TARGET_SHA} — refusing to build"
            exit 1
          fi
          # The image tag is a pure function of the gated commit. Assert that too,
          # so a mismatch surfaces here rather than as an image nobody can trace.
          if [ "${SHORT_SHA}" != "${TARGET_SHA:0:10}" ]; then
            echo "::error::short sha ${SHORT_SHA} is not derived from ${TARGET_SHA}"
            exit 1
          fi
          echo "TARGET_SHA=${TARGET_SHA}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      # Decide which image tiers actually need rebuilding from the changed paths.
      # CONSERVATIVE: default every tier to TRUE and only flip to false when we are
      # confident its inputs are untouched, so any doubt (no resolvable base, shared
      # package/lockfile/Dockerfile/workflow change, dispatch with no diff) rebuilds
      # everything — i.e. worst case is exactly today's behaviour, never a stale or
      # missing image. A skipped tier keeps its current image via `helm --reuse-values`.
      - name: Detect changed tiers
        id: tiers
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_TIERS: ${{ inputs.force_tiers }}
          # Sert à retrouver le dernier déploiement RÉUSSI, seule base fiable
          # pour savoir quels tiers reconstruire.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUNTIME=true; WEB=true; WSAGENT=true

          # Manual override (dispatch only) to validate conditional builds without a
          # real push. e.g. force_tiers=web exercises the web-only skip path live.
          if [ -n "${FORCE_TIERS:-}" ]; then
            if [ "${FORCE_TIERS}" = "all" ]; then
              RUNTIME=true; WEB=true; WSAGENT=true
            else
              RUNTIME=false; WEB=false; WSAGENT=false
              case ",${FORCE_TIERS}," in *,web,*) WEB=true;; esac
              case ",${FORCE_TIERS}," in *,runtime,*) RUNTIME=true;; esac
              case ",${FORCE_TIERS}," in *,wsagent,*) WSAGENT=true;; esac
            fi
            echo "FORCE_TIERS=${FORCE_TIERS} -> runtime=${RUNTIME} web=${WEB} wsagent=${WSAGENT}"
            {
              echo "runtime=${RUNTIME}"; echo "web=${WEB}"; echo "wsagent=${WSAGENT}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # La base de comparaison doit être CE QUI EST DÉPLOYÉ, pas le push
          # précédent.
          #
          # Défaut mesuré le 2026-08-30. Douze PR mergées coup sur coup ; chaque
          # nouveau push remplace le déploiement précédent, si bien que seul le
          # dernier run survit — et il comparait au push d'avant, donc au diff
          # d'UNE seule PR.
          #
          # Résultat : runtime=false alors que trois PR de services/api venaient
          # de lander. Le tier n'a pas été construit, l'image API a été reprise
          # telle quelle, et du code mergé n'est jamais arrivé en production —
          # sans qu'aucune porte ne s'en aperçoive, puisque le déploiement, lui,
          # a réussi.
          #
          # On interroge donc le dernier déploiement RÉUSSI de ce workflow : la
          # seule base qui décrive ce qui tourne vraiment.
          BASE=""
          LAST_DEPLOYED="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-main.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || echo "")"

          if printf '%s' "${LAST_DEPLOYED}" | grep -Eq '^[0-9a-f]{40}$' \
            && git cat-file -e "${LAST_DEPLOYED}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "${LAST_DEPLOYED}" HEAD 2>/dev/null; then
            BASE="${LAST_DEPLOYED}"
            echo "Base = dernier deploiement reussi (${BASE})"
          elif printf '%s' "${BEFORE_SHA:-}" | grep -Eq '^[0-9a-f]{40}$' && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE="${BEFORE_SHA}"
            echo "::warning::dernier deploiement reussi introuvable — repli sur le push precedent (${BASE}) ; des tiers peuvent etre manques"
          fi
          # Plus de repli sur HEAD~1 : « le dernier commit » est precisement la
          # fenetre trop etroite qui a cause le defaut. Sans base fiable on
          # construit TOUT (voir le `else` plus bas) : un build de trop coute des
          # minutes, un tier manque coute une regression invisible en production.

          if [ -n "${BASE}" ]; then
            CHANGED="$(git diff --name-only "${BASE}" HEAD || true)"
            echo "Changed files since ${BASE}:"; printf '%s\n' "${CHANGED}"

            # Shared inputs that feed EVERY tier -> rebuild all (don't try to be clever).
            if printf '%s\n' "${CHANGED}" | grep -Eq '^(packages/|pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|Dockerfile|infra/docker/|infra/cloudbuild/cloudbuild\.yaml|\.github/workflows/deploy-main\.yml)'; then
              echo "Shared/base input changed -> build ALL tiers"
            else
              RUNTIME=false; WEB=false; WSAGENT=false
              printf '%s\n' "${CHANGED}" | grep -Eq '^(services/(api|workspace-manager|preview-proxy|ai-gateway|worker)/|infra/cloudbuild/runtime-tier\.yaml)' && RUNTIME=true || true
              printf '%s\n' "${CHANGED}" | grep -Eq '^(app/|electron/|vite\.config|uno\.config|tsconfig|infra/cloudbuild/single-web\.yaml)' && WEB=true || true
              printf '%s\n' "${CHANGED}" | grep -Eq '^(services/workspace-agent/|infra/cloudbuild/workspace-agent\.yaml)' && WSAGENT=true || true

              # If nothing tier-specific matched (docs/CI-only push), still roll web+runtime
              # as a safe no-op-ish default rather than deploying nothing unexpectedly.
              if [ "${RUNTIME}" = false ] && [ "${WEB}" = false ] && [ "${WSAGENT}" = false ]; then
                echo "No tier-specific change detected -> default to web+runtime"
                RUNTIME=true; WEB=true
              fi
            fi
          else
            echo "No resolvable base SHA -> build ALL tiers"
          fi

          echo "runtime=${RUNTIME}" >> "$GITHUB_OUTPUT"
          echo "web=${WEB}" >> "$GITHUB_OUTPUT"
          echo "wsagent=${WSAGENT}" >> "$GITHUB_OUTPUT"
          echo "Tiers to build -> runtime=${RUNTIME} web=${WEB} wsagent=${WSAGENT}"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ---- Build 1/2: runtime tier (six serialized backend service images) ----
      # Builds the deps base and runtime images first; publishes deps:<sha> +
      # deps:latest so the web build can pin _DEPS_TAG. Blocking by design.
      - name: Build runtime tier (Cloud Build)
        if: steps.tiers.outputs.runtime == 'true'
        run: |
          set -euo pipefail
          echo "::group::gcloud builds submit — runtime-tier"
          # Capture the id of THIS submission directly. It used to be recovered
          # afterwards by listing builds and matching on the 10-char short sha, which
          # attributes a build by coincidence of prefix: a re-run, a concurrent
          # submission, or another tier sharing the sha could all match, and the
          # manifest would then name a build that did not produce the image.
          # Logs still stream; --format only shapes the final resource line.
          RUNTIME_BUILD_ID="$(gcloud builds submit \
            --format='value(id)' \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/runtime-tier.yaml \
            --substitutions=_SHORT_SHA="${SHORT_SHA}" \
            --machine-type=e2-highcpu-8 \
            --timeout=3600s \
            . )"
          echo "RUNTIME_BUILD_ID=${RUNTIME_BUILD_ID}" >> "$GITHUB_ENV"
          echo "runtime-tier build id: ${RUNTIME_BUILD_ID}"
          echo "::endgroup::"

      # ---- Build 2/2: web tier ----
      # Runs only after the runtime build above succeeds (sequential — single
      # worker slot). Pins _DEPS_TAG to this commit's freshly built deps image.
      - name: Build web tier (Cloud Build)
        if: steps.tiers.outputs.web == 'true'
        run: |
          set -euo pipefail
          # Pin the web build's deps base to THIS commit only when the runtime tier
          # was rebuilt (which publishes deps:<sha>); otherwise fall back to deps:latest
          # so a web-only deploy still builds against a valid, existing base image.
          if [ "${{ steps.tiers.outputs.runtime }}" = "true" ]; then
            DEPS_TAG="${SHORT_SHA}"
          else
            DEPS_TAG="latest"
          fi
          echo "::group::gcloud builds submit — single-web (deps:${DEPS_TAG})"
          # VITE_RUNTIME_MODE *and* VITE_RUNTIME_API_BASE_URL are inlined into
          # the client bundle at vite build time — they must be Cloud Build
          # substitutions -> Docker build args, not runtime configmap values
          # (which the browser never reads). Pin remote-kubernetes so the
          # deployed IDE drives the workspace-manager / preview-proxy backend
          # instead of silently falling back to WebContainer, and pin the API
          # base URL to the off-origin api.e-code.ai host — same-origin
          # /api/runtime hits the web pod (Remix), which has no runtime routes,
          # so the workspace never provisions ("No backend workspace" / "Failed
          # to spawn bolt shell"). The /api/runtime/* routes live on the API
          # service (services/api/src/app.ts), exposed at api.e-code.ai.
          # Capture the id of THIS submission directly. It used to be recovered
          # afterwards by listing builds and matching on the 10-char short sha, which
          # attributes a build by coincidence of prefix: a re-run, a concurrent
          # submission, or another tier sharing the sha could all match, and the
          # manifest would then name a build that did not produce the image.
          # Logs still stream; --format only shapes the final resource line.
          WEB_BUILD_ID="$(gcloud builds submit \
            --format='value(id)' \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/single-web.yaml \
            --substitutions=_DEPS_TAG="${DEPS_TAG}",_SHORT_SHA="${SHORT_SHA}",_VITE_RUNTIME_MODE=remote-kubernetes,_VITE_RUNTIME_API_BASE_URL=https://api.e-code.ai/api/runtime,_VITE_BYOK_DISABLED=true \
            --machine-type=e2-highcpu-8 \
            --timeout=1800s \
            . )"
          echo "WEB_BUILD_ID=${WEB_BUILD_ID}" >> "$GITHUB_ENV"
          echo "single-web build id: ${WEB_BUILD_ID}"
          echo "::endgroup::"

      # ---- Build 3/3: workspace-agent runtime image ----
      # The agent runs INSIDE each workspace pod (its own Dockerfile, node-pty
      # native build, NOT the deps base), so it can't join the runtime tier.
      # Tag matches the prod convention `sha-<short>`; helm --set below points
      # platformEnv.runtime.workspaceAgentImage at it. New workspaces use the
      # fresh agent immediately; already-running workspaces keep their baked
      # image until they are reprovisioned (reopen / GC), which is expected.
      # Blocking on purpose: shipping a broken agent image should fail the deploy.
      - name: Build workspace-agent (Cloud Build)
        if: steps.tiers.outputs.wsagent == 'true'
        run: |
          set -euo pipefail
          echo "::group::gcloud builds submit — workspace-agent"
          # Capture the id of THIS submission directly. It used to be recovered
          # afterwards by listing builds and matching on the 10-char short sha, which
          # attributes a build by coincidence of prefix: a re-run, a concurrent
          # submission, or another tier sharing the sha could all match, and the
          # manifest would then name a build that did not produce the image.
          # Logs still stream; --format only shapes the final resource line.
          WSAGENT_BUILD_ID="$(gcloud builds submit \
            --format='value(id)' \
            --project="${GCP_PROJECT_ID}" \
            --region="${GAR_LOCATION}" \
            --config=infra/cloudbuild/workspace-agent.yaml \
            --substitutions=_SHORT_SHA="${SHORT_SHA}" \
            --machine-type=e2-highcpu-8 \
            --timeout=1800s \
            . )"
          echo "WSAGENT_BUILD_ID=${WSAGENT_BUILD_ID}" >> "$GITHUB_ENV"
          echo "workspace-agent build id: ${WSAGENT_BUILD_ID}"
          echo "::endgroup::"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2

      # kubectl through Connect Gateway: the cluster control plane is
      # IP-restricted, so direct `get-gke-credentials` won't reach it from a
      # GitHub-hosted runner. Connect Gateway routes kubectl through a
      # Google-managed proxy authenticated by the WIF identity (IAM), no VPN.
      #
      # Moved AHEAD of the scan/deploy steps: resolving digests for the tiers this
      # run did NOT rebuild requires reading what the release currently deploys.
      - name: Get cluster credentials via Connect Gateway
        run: |
          set -euo pipefail
          gcloud components install gke-gcloud-auth-plugin --quiet
          gcloud container fleet memberships get-credentials "${FLEET_MEMBERSHIP}" \
            --project="${GCP_PROJECT_ID}"
          kubectl config current-context

      - name: Assert every rebuilt tier has a traceable build id
        run: |
          set -euo pipefail
          # The ids are captured directly by the submit steps above. This only checks
          # none is empty: a rebuilt tier with no id produces a manifest that cannot be
          # audited, and the manifest builder would reject it later with a less useful
          # message.
          for pair in "runtime:${{ steps.tiers.outputs.runtime }}:${RUNTIME_BUILD_ID:-}" \
                      "web:${{ steps.tiers.outputs.web }}:${WEB_BUILD_ID:-}" \
                      "wsagent:${{ steps.tiers.outputs.wsagent }}:${WSAGENT_BUILD_ID:-}"; do
            tier="${pair%%:*}"; rest="${pair#*:}"; built="${rest%%:*}"; id="${rest#*:}"
            if [ "${built}" = "true" ] && [ -z "${id}" ]; then
              echo "::error::the ${tier} tier was rebuilt but its Cloud Build id was not captured"
              exit 1
            fi
            echo "${tier} build id: ${id:-(not rebuilt)}"
          done

      # ---- Resolve every deployed service to an IMMUTABLE DIGEST ----
      #
      # A tag is a mutable pointer. `--set imageTag=<sha>` only tells the kubelet a
      # name to resolve at pull time; between the vulnerability gate reading
      # `api:<sha>` and the pod pulling it, anything with registry write access can
      # move that tag onto different bytes and nothing in the rollout would notice.
      #
      # Every service in the chart gets a digest — including the tiers this run did
      # not rebuild (and `admin`, which this path never builds). Their currently
      # deployed reference is carried forward as a digest, so the release is fully
      # pinned rather than "pinned for the parts we happened to touch".
      - name: Resolve immutable image digests for every service
        run: |
          # Every failure below is fail-closed and, on the FIRST digest-based upgrade,
          # is also the most likely thing to stop the cutover. So each one prints what
          # the release actually stores for this service: without it the operator gets
          # "cannot pin this service" and has to go dig the values out of the cluster
          # by hand, during a deploy, to learn something the job already knew.
          explain_current() {
            echo "::group::what ${key} is actually running"
            kubectl -n "${HELM_NAMESPACE}" get deploy -l "app.kubernetes.io/name=${image}" \
              -o custom-columns='DEPLOYMENT:.metadata.name,IMAGE:.spec.template.spec.containers[0].image' 2>&1 || true
            echo "Fix: re-run once with this tier rebuilt, or pin it explicitly with"
            echo "  helm upgrade ... --set-string services.${key}.imageDigest=sha256:<64 hex>"
            echo "::endgroup::"
          }

          set -euo pipefail
          REG="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}"
          echo "REG=${REG}" >> "$GITHUB_ENV"

          # NOTE: this step deliberately does NOT read `helm get values`. On the real
          # production release that command emits INVALID JSON (a stored value contains
          # a raw newline inside a string), so parsing it would abort this step and
          # block every deploy. The live Deployments answer the same question — what is
          # each service running — and are always valid. See the non-rebuilt branch.

          # valuesKey:imageName:tier:chartService:rolled
          #   tier         — which build produces it, i.e. whether THIS run rebuilt it
          #   chartService — helm pins `services.<key>.imageDigest` for it, so its digest
          #                  must be resolvable on EVERY run (rebuilt or carried forward)
          #   rolled       — this workflow waits for its rollout and checks its imageIDs
          #
          # admin: an enabled chart service this continuous path never builds or rolls.
          # Its current digest is carried forward so the release stays fully pinned.
          #
          # screenshotter is a chart service like any other. The chart AND values-prod
          # both say `enabled: false`, but the live production release has it TRUE — set
          # once via `--set` and frozen by `--reuse-values`. Chart defaults are not what
          # runs, so enablement is discovered from the cluster (no Deployment => skip)
          # rather than assumed here; otherwise a genuinely running service would be the
          # only one left on a mutable tag.
          #
          # screenshotter stays rolled=false on purpose: this workflow has never waited
          # on its rollout, and it is not enabled in every environment, so demanding a
          # running pod for it would introduce a new failure mode. Its digest IS pinned,
          # scanned and signature-verified; only the post-rollout imageID check skips it.
          # That is a deliberate, stated limit — not an oversight.
          #
          # workspace-agent is not a chart service at all — it is an image reference the
          # api hands to each workspace pod, tagged `sha-<sha>`. It is listed so that
          # when it is rebuilt it is still scanned and signature-verified; the previous
          # vulnerability gate covered it, and dropping it would have silently ended
          # that coverage.
          SERVICES="web:web:web:true:true admin:admin:none:true:false api:api:runtime:true:true worker:worker:runtime:true:true aiGateway:ai-gateway:runtime:true:true workspaceManager:workspace-manager:runtime:true:true previewProxy:preview-proxy:runtime:true:true screenshotter:screenshotter:runtime:true:false workspaceAgent:workspace-agent:wsagent:false:false"

          rebuilt_web="${{ steps.tiers.outputs.web }}"
          rebuilt_runtime="${{ steps.tiers.outputs.runtime }}"
          rebuilt_wsagent="${{ steps.tiers.outputs.wsagent }}"

          echo '[]' > /tmp/services.json

          for entry in ${SERVICES}; do
            IFS=: read -r key image tier chart_service rolled <<< "${entry}"

            case "${tier}" in
              web) rebuilt="${rebuilt_web}" ;;
              runtime) rebuilt="${rebuilt_runtime}" ;;
              wsagent) rebuilt="${rebuilt_wsagent}" ;;
              *) rebuilt=false ;;
            esac


            if [ "${rebuilt}" = "true" ]; then
              # The workspace-agent uses the `sha-<sha>` tag convention, not `<sha>`.
              if [ "${tier}" = "wsagent" ]; then TAG="sha-${SHORT_SHA}"; else TAG="${SHORT_SHA}"; fi
              SOURCE_SHA="${TARGET_SHA}"
              case "${tier}" in
                web) BUILD_ID="${WEB_BUILD_ID}" ;;
                runtime) BUILD_ID="${RUNTIME_BUILD_ID}" ;;
                wsagent) BUILD_ID="${WSAGENT_BUILD_ID}" ;;
              esac
            else
              BUILD_ID=""
              # The workspace-agent is not a Deployment — its reference lives in the
              # platform configmap, which the api hands to each workspace pod. It used
              # to be skipped entirely when not rebuilt, which left it on a MUTABLE TAG
              # (`workspace-agent:sha-<sha>`) while every chart service was digest-
              # pinned: the one image running inside customer workspaces was the one
              # image nobody pinned. Resolve it like any other.
              if [ "${tier}" = "wsagent" ]; then
                CM_IMAGE="$(kubectl -n "${HELM_NAMESPACE}" get configmap \
                  "${HELM_RELEASE}-vibecore-platform-platform-env" \
                  -o jsonpath='{.data.WORKSPACE_AGENT_IMAGE}' 2>/dev/null || echo "")"
                if [ -z "${CM_IMAGE}" ]; then
                  echo "::error::${key}: WORKSPACE_AGENT_IMAGE is not set in the live configmap — cannot pin it"
                  exit 1
                fi
                echo "${key}: currently referenced as ${CM_IMAGE}"
                PINNED=""; TAG=""
                case "${CM_IMAGE}" in
                  *@sha256:*) PINNED="${CM_IMAGE##*@}" ;;
                  *:*)        TAG="${CM_IMAGE##*:}" ;;
                esac
                SOURCE_SHA=""
                # `sha-<10hex>` is this image's tag convention.
                CANDIDATE="${TAG#sha-}"
                if printf '%s' "${CANDIDATE}" | grep -Eq '^[0-9a-f]{10}$'; then
                  SOURCE_SHA="$(git rev-parse "${CANDIDATE}" 2>/dev/null || echo "")"
                fi
                if ! printf '%s' "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
                  # AMORÇAGE, même raisonnement que pour `admin` plus bas.
                  #
                  # L'ironie du cas : ce bloc existe pour que l'agent de workspace
                  # cesse de tourner sur un TAG MUTABLE. Il a réussi — la référence
                  # du configmap est désormais `...@sha256:...`. Et c'est cette
                  # réussite qui rend la provenance introuvable : le tag `sha-<sha>`
                  # dont on déduisait le commit n'existe plus dans la référence.
                  #
                  # Refuser ici ne protège de rien. Ce run ne reconstruit PAS l'agent
                  # (`rebuilt=false`) : son digest est repris à l'identique de ce qui
                  # tourne déjà dans les workspaces. Et la remédiation proposée par ce
                  # message — « relancer avec le tier reconstruit » — ne dépend pas de
                  # l'opérateur : le tier n'est reconstruit que si le commit touche
                  # ses fichiers.
                  #
                  # Le principe tient parce que le manifeste ÉCRIT le trou :
                  # `provenanceKnown: false`, le service listé dans `provenanceGaps`,
                  # et `fullyTraceable: false` au sommet du document.
                  echo "::warning::${key}: provenance inconnue — image reprise telle quelle, sourceSha enregistré à null"
                  echo "${key}: ${CM_IMAGE} est épinglée par digest ; le tag sha-<sha> dont on déduisait le commit n'y figure plus."
                  echo "Elle retrouvera une provenance au prochain build de ce tier, qui la référencera par son tag."
                  SOURCE_SHA=""
                else
                  echo "${key}: source commit ${SOURCE_SHA}"
                fi
              else

              # What is this service RUNNING right now? Read it from the live Deployment,
              # not from `helm get values`.
              #
              # Two reasons, both found by reading the real production release:
              #   * `helm get values -o json` on it emits INVALID JSON — one stored value
              #     (the Nix registry blob) contains a raw newline inside a string, which
              #     `jq` rejects. Under `set -e` this step would have died there and
              #     EVERY deploy would have been blocked, before ever reading a tag.
              #   * the release has `screenshotter.enabled: true`, set once via `--set`
              #     and frozen by `--reuse-values`, while both values.yaml and
              #     values-prod.yaml say false. Chart defaults are not what runs.
              #
              # The Deployment is the authority on both questions at once: it exists iff
              # the service is enabled, and its image is exactly what is deployed.
              DEP_IMAGE="$(kubectl -n "${HELM_NAMESPACE}" get deploy \
                -l "app.kubernetes.io/name=${image}" \
                -o jsonpath='{.items[0].spec.template.spec.containers[0].image}' 2>/dev/null || echo "")"
              if [ -z "${DEP_IMAGE}" ]; then
                # No Deployment => the service is disabled in this release. There is
                # nothing running to carry forward and nothing to pin.
                echo "${key}: no Deployment in the cluster (service disabled) — skipping"
                continue
              fi
              PINNED=""
              TAG=""
              case "${DEP_IMAGE}" in
                *@sha256:*) PINNED="${DEP_IMAGE##*@}" ;;
                *:*)        TAG="${DEP_IMAGE##*:}" ;;
              esac
              echo "${key}: currently running ${DEP_IMAGE}"

              # Provenance for a carried-forward image. A digest-pinned Deployment has
              # no tag left to infer a commit from, so the deploy stamps the source sha
              # as a pod-template annotation next to the image. Bootstrap (a release
              # still on tags, i.e. the first gated deploy) falls back to resolving the
              # 10-hex tag through git. If neither yields a commit we STOP: the manifest
              # must not claim provenance it does not have.
              SOURCE_SHA="$(kubectl -n "${HELM_NAMESPACE}" get deploy \
                -l "app.kubernetes.io/name=${image}" \
                -o jsonpath='{.items[0].spec.template.metadata.annotations.vibecore\.dev/image-source-sha}' 2>/dev/null || echo "")"
              if [ -z "${SOURCE_SHA}" ] && printf '%s' "${TAG}" | grep -Eq '^[0-9a-f]{10}$'; then
                SOURCE_SHA="$(git rev-parse "${TAG}" 2>/dev/null || echo "")"
              fi
              if ! printf '%s' "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
                if [ "${rebuilt}" = "true" ]; then
                  # Une image que CE run vient de produire doit être traçable. Sans
                  # provenance ici, le manifeste mentirait sur ce qu'on expédie.
                  echo "::error::${key}: cannot establish which commit produced ${DEP_IMAGE}"
                  echo "It carries no vibecore.dev/image-source-sha annotation and its reference is not a resolvable 10-hex tag."
                  echo "Fix: re-run this deploy with the tier that owns ${key} rebuilt, which stamps provenance for future runs."
                  explain_current
                  exit 1
                fi

                # AMORÇAGE. Ce service n'est PAS reconstruit par ce run : son digest est
                # repris tel quel, à l'identique de ce qui tourne déjà. Refuser ici
                # n'ajoute aucune sûreté — rien de nouveau n'est expédié pour lui — et
                # bloque en revanche TOUT déploiement.
                #
                # Le cas est structurel, pas accidentel : `admin` n'est pas construit
                # par ce chemin continu (voir l'en-tête du workflow), son image a été
                # épinglée par digest avant l'existence de l'annotation, et la
                # remédiation que ce message proposait — « rebuild the tier that owns
                # it » — est donc impossible ici. La porte réclamait une provenance que
                # ce pipeline n'a jamais été conçu pour lui donner.
                #
                # Le principe est tenu : « le manifeste ne doit pas revendiquer une
                # provenance qu'il n'a pas ». On l'enregistre INCONNUE (sourceSha null)
                # plutôt que de l'inventer, et on le dit fort. Un service reconstruit,
                # lui, échoue toujours.
                echo "::warning::${key}: provenance inconnue — image reprise telle quelle, sourceSha enregistré à null"
                echo "${key}: ${DEP_IMAGE} ne porte ni annotation vibecore.dev/image-source-sha ni tag 10-hex résolvable."
                echo "Pour lui donner une provenance : reconstruire ce service par le chemin qui le produit."
                explain_current
                SOURCE_SHA=""
              else
                echo "${key}: source commit ${SOURCE_SHA}"
              fi
              fi
            fi


            if [ -n "${PINNED:-}" ]; then
              DIGEST="${PINNED}"
              echo "${key}: carried forward pinned digest ${DIGEST}"
            else
              if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
                echo "::error::${key}: no digest and no tag available — cannot pin this service"
                explain_current
                exit 1
              fi
              if [ "${TAG}" = "REQUIRED_OVERRIDE_AT_DEPLOY" ]; then
                # values-prod.yaml's placeholder. Reaching it means the release has no
                # real image pinned for this service, so there is nothing to carry
                # forward — deploying would resolve a placeholder tag that does not exist.
                echo "::error::${key}: the release stores the values-prod placeholder tag; this service has never been pinned to a real image"
                explain_current
                exit 1
              fi
              # Ask the registry what that tag resolves to RIGHT NOW, once, and use the
              # answer everywhere downstream (scan, signature, deploy, verification).
              DIGEST="$(gcloud artifacts docker images describe "${REG}/${image}:${TAG}" \
                --project="${GCP_PROJECT_ID}" \
                --format='value(image_summary.digest)' 2>/dev/null || echo "")"
              if ! printf '%s' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                echo "::error::${key}: could not resolve ${REG}/${image}:${TAG} to a digest (got '${DIGEST}')"
                echo "The tag does not exist in the registry, or the deploy service account cannot read it."
                explain_current
                exit 1
              fi
              echo "${key}: ${image}:${TAG} -> ${DIGEST}"
            fi

            jq --arg service "${key}" --arg image "${image}" --arg tag "${TAG}" \
               --arg digest "${DIGEST}" --arg buildId "${BUILD_ID:-}" \
               --arg sourceSha "${SOURCE_SHA:-}" --argjson rebuilt "${rebuilt}" \
               --argjson chartService "${chart_service}" --argjson rolled "${rolled}" \
               '. += [{service:$service, image:$image, tag:$tag, digest:$digest,
                       rebuilt:$rebuilt, chartService:$chartService, rolled:$rolled,
                       cloudBuildId:(if $buildId == "" then null else $buildId end),
                       sourceSha:(if $sourceSha == "" then null else $sourceSha end)}]' \
               /tmp/services.json > /tmp/services.next && mv /tmp/services.next /tmp/services.json
            unset PINNED
          done

          echo "::group::resolved digests"
          jq -r '.[] | "\(.service)\t\(.digest)\t\(if .rebuilt then "rebuilt" else "carried forward" end)\t\(if .rolled then "rolled" else "not rolled" end)"' /tmp/services.json
          echo "::endgroup::"

      - name: Install Trivy and cosign
        run: |
          set -euo pipefail
          # Keep these pinned, and verify the asset actually exists before bumping:
          # release asset names are not stable across versions, and a 404 fails the
          # gate for the wrong reason (curl -sSfL is silent about it until tar chokes).
          # Both binaries are verified against a PINNED sha256 before they are trusted.
          # They decide whether this release ships: trivy is the vulnerability gate and
          # cosign is what proves the images are the ones that were signed. Downloading
          # either without checking its bytes means a compromised or truncated release
          # asset silently becomes the thing that says "safe".
          # Values taken from the projects' own published checksum files:
          #   trivy_<v>_checksums.txt  ·  cosign_checksums.txt
          # To rotate: bump the version and copy the line for this asset from those files.
          TRIVY_VERSION=0.72.0
          TRIVY_SHA256=bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
          COSIGN_VERSION=2.4.3
          COSIGN_SHA256=caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708

          curl -sSfL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version

          curl -sSfL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          sudo install /tmp/cosign /usr/local/bin/cosign
          cosign version

          gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      # B6 — BLOCKING vulnerability gate, now aimed at the DIGEST rather than the tag.
      #
      # Deliberately placed AFTER the builds and BEFORE `helm upgrade`: that is the
      # last point where refusing to ship costs nothing. A gate that ran after the
      # rollout would only be able to tell us we had already shipped the CVE. Scanning
      # the digest closes the remaining gap — the bytes scanned are provably the bytes
      # deployed, because the same digest string is what helm sets.
      #
      # Why Trivy and not the `gcloud artifacts docker images scan` steps in the Cloud
      # Build configs: Artifact Registry scanning is DISABLED on this project
      # (`containerscanning.googleapis.com` is not enabled), so those steps have been
      # failing into their `|| echo WARN` for as long as they have existed and
      # `allowFailure: true` hid it. They report nothing today.
      #
      # --ignore-unfixed: only CVEs with an available fix can block, otherwise the
      # gate is unactionable and the first instinct is to disable it. Accepted-risk
      # CVEs live in .trivyignore with a justification and expiry.
      #
      # The SBOM is produced in the same loop, while Trivy's analysis of that image is
      # still cached, so the supply-chain record costs one extra pass instead of a
      # second full download.
      # BUG-SEC-004 — une exception a date fixe ferme la chaine du jour au
      # lendemain, sans que personne ne l'ait vu venir. Le 2026-09-03, trois
      # exceptions globales ont echu ensemble : la porte a refuse les 8 images
      # d'un coup, et il a fallu des heures pour faire le lien, parce que rien
      # ne dit « cette exception tombe demain ».
      #
      # Cette etape ne bloque RIEN : elle previent. Une exception qui echoit
      # dans les 7 jours doit etre vue AVANT de fermer la livraison.
      - name: Alerte sur les exceptions de securite proches de l'echeance
        run: |
          set -euo pipefail
          limite=$(date -u -d '+7 days' '+%Y-%m-%d' 2>/dev/null || date -u -v+7d '+%Y-%m-%d')
          aujourdhui=$(date -u '+%Y-%m-%d')
          proches=0
          echues=0
          {
            echo "### Exceptions de sécurité — échéances"
            echo
            echo "| fichier | CVE | expire le | état |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in .trivyignore .trivyignore.*; do
            [ -f "$f" ] || continue
            while read -r cve exp; do
              case "$exp" in exp:*) d="${exp#exp:}";; *) continue;; esac
              if [[ "$d" < "$aujourdhui" ]]; then
                etat="**ÉCHUE**"; echues=$((echues+1))
                echo "::error::exception ECHUE — $f : $cve a expire le $d. La porte refusera ce deploiement."
              elif [[ "$d" < "$limite" ]]; then
                etat="⚠️ sous 7 jours"; proches=$((proches+1))
                echo "::warning::exception proche de l'echeance — $f : $cve expire le $d. Traiter AVANT cette date, sinon la livraison se fermera."
              else
                etat="ok"
              fi
              echo "| \`$f\` | $cve | $d | $etat |" >> "$GITHUB_STEP_SUMMARY"
            done < <(grep -hE '^CVE-' "$f" 2>/dev/null || true)
          done
          echo "exceptions echues : $echues, proches de l'echeance : $proches"

      - name: Vulnerability gate + SBOM on the exact digests (blocking)
        run: |
          set -euo pipefail
          mkdir -p sbom
          rc=0
          while read -r service image digest; do
            ref="${REG}/${image}@${digest}"
            echo "::group::trivy ${service} ${digest}"
            # Two passes so the log is useful: an informational HIGH listing, then the
            # CRITICAL pass that actually decides the gate.
            # Exception PAR IMAGE, jamais globale. `.trivyignore` reste la
            # regle commune ; `.trivyignore.<service>` ne s'applique qu'a CETTE
            # image. C'est ce qui rend impossible qu'une exception ouverte pour
            # `admin` couvre aussi `web` — le fichier global n'est pas modifie.
            ignorefile=".trivyignore"
            if [ -f ".trivyignore.${service}" ]; then
              ignorefile=".trivyignore.${service}"
              echo "exception propre a ${service} : ${ignorefile}"
            fi
            trivy image --quiet --scanners vuln --severity HIGH \
              --ignore-unfixed --ignorefile "${ignorefile}" "${ref}" || true
            if ! trivy image --quiet --scanners vuln --severity CRITICAL \
                   --ignore-unfixed --ignorefile "${ignorefile}" \
                   --exit-code 1 "${ref}"; then
              echo "::error::CRITICAL fixable vulnerability in ${ref}"
              rc=1
            fi
            trivy image --quiet --format cyclonedx --output "sbom/${service}.cdx.json" "${ref}"
            echo "::endgroup::"
          done < <(jq -r '.[] | "\(.service) \(.image) \(.digest)"' /tmp/services.json)

          if [ "$rc" -ne 0 ]; then
            echo "::error::Vulnerability gate FAILED — refusing to deploy. Fix the CVE, or add a justified entry to .trivyignore."
            exit 1
          fi

          # Record each SBOM's own sha256 in the manifest so the artifact uploaded with
          # this run can later be shown to be the one that was scanned.
          jq -c '.[]' /tmp/services.json | while read -r row; do
            svc="$(printf '%s' "${row}" | jq -r .service)"
            printf '%s  sbom/%s.cdx.json\n' "$(sha256sum "sbom/${svc}.cdx.json" | cut -d' ' -f1)" "${svc}"
          done > sbom/SHA256SUMS
          cat sbom/SHA256SUMS

      # Cosign signatures are already mandatory at admission (Kyverno). Verifying here
      # means an unsigned or mis-signed image is refused BEFORE the rollout starts,
      # instead of appearing as pods stuck at admission mid-upgrade.
      #
      # Verification needs only the KMS PUBLIC key, not signing rights: the deploy
      # service account requires roles/cloudkms.publicKeyViewer on the cosign-images
      # key. If that grant is missing this step fails closed with the role named.
      - name: Verify image signatures (cosign, blocking)
        run: |
          set -euo pipefail
          KMS_KEY="gcpkms://projects/${GCP_PROJECT_ID}/locations/${GAR_LOCATION}/keyRings/${KMS_KEYRING}/cryptoKeys/${KMS_KEY_NAME}"
          echo "KMS_KEY=${KMS_KEY}" >> "$GITHUB_ENV"
          rc=0
          while read -r service image digest; do
            ref="${REG}/${image}@${digest}"
            echo "::group::cosign verify ${service}"
            # --insecure-ignore-tlog : la vérification DOIT refléter la politique
            # de signature. `scripts/cosign-sign-images.sh` signe avec
            # `--tlog-upload=false` — choix délibéré et documenté : on ne publie
            # pas les empreintes d'images privées dans le Rekor public. Vérifier
            # sans ce drapeau exigeait donc une entrée de journal de transparence
            # que rien ne crée jamais, et la porte échouait invariablement :
            #
            #     no matching signatures: signature not found in transparency log
            #
            # Le nom du drapeau est trompeur ici : la confiance ne repose pas sur
            # Rekor mais sur la clé KMS, dont l'accès est contrôlé par IAM. Ce
            # qui est vérifié — que l'image est signée par CETTE clé — est
            # inchangé. `deploy-tlog-policy.spec.mjs` échoue si les deux côtés
            # divergent de nouveau.
            if cosign verify --key "${KMS_KEY}" --insecure-ignore-tlog=true "${ref}" >/dev/null 2>/tmp/cosign.err; then
              echo "signature OK: ${ref}"
            else
              sed -n '1,20p' /tmp/cosign.err
              echo "::error::signature verification FAILED for ${ref}"
              rc=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.[] | "\(.service) \(.image) \(.digest)"' /tmp/services.json)
          if [ "$rc" -ne 0 ]; then
            echo "::error::At least one image is not validly signed by ${KMS_KEY}."
            echo "::error::If this is a permissions error, the deploy service account needs roles/cloudkms.publicKeyViewer on that key."
            exit 1
          fi

      # RE-VERIFY THE GATE IMMEDIATELY BEFORE MUTATING PRODUCTION.
      #
      # The gate ran once, before the build. Building three image tiers takes tens of
      # minutes, and a required check can go red in that window — a re-run that fails,
      # a security scan that flips. Deploying on the strength of a verdict that old is
      # deploying on a stale fact. This costs one API round trip and is the last moment
      # at which refusing is free.
      - name: Re-verify required checks are STILL green (last point before rollout)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release-gate/verify-required-checks.mjs \
            --sha "${TARGET_SHA}" --repo "${GITHUB_REPOSITORY}" --no-wait \
            --json gate-verdict-prerollout.json
          # Bind the manifest to the verdict that actually authorised this rollout, so
          # "which checks were green when this shipped" is answerable from the artifact
          # rather than from run logs that expire.
          echo "GATE_VERDICT_SHA256=$(sha256sum gate-verdict-prerollout.json | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # THE MANIFEST (release-integrity requirement 5): service -> source sha ->
      # Cloud Build id -> digest -> signature -> SBOM. The builder REFUSES to emit a
      # manifest that would not be a proof: any missing digest, any rebuilt service
      # without a build id, any image built from a different commit, any unverified
      # signature stops the deploy here.
      - name: Build release manifest (blocking)
        run: |
          set -euo pipefail
          jq -n \
            --arg targetSha "${TARGET_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg registry "${REG}" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg key "${KMS_KEY}" \
            --arg verdict "${GATE_VERDICT_SHA256}" \
            --slurpfile services /tmp/services.json \
            --slurpfile sums <(jq -Rn '[inputs | split("  ") | {(.[1] | sub("^sbom/"; "") | sub("\\.cdx\\.json$"; "")): .[0]}] | add' < sbom/SHA256SUMS) \
            '{targetSha:$targetSha, repository:$repository, registry:$registry,
              workflowRunUrl:$runUrl, gateVerdictSha256:$verdict,
              expectedServices: ($services[0] | map(.service)),
              services: ($services[0] | map(. + {
                signature: {verified: true, key: $key},
                sbom: {format: "cyclonedx-json", artifact: ("sbom/" + .service + ".cdx.json"),
                       sha256: ($sums[0][.service] // null)}
              }))}' > /tmp/manifest-input.json

          node scripts/release-gate/release-manifest.mjs build \
            --input /tmp/manifest-input.json \
            --out release-manifest.json
          cp release-manifest.json sbom/release-manifest.json

      # D2 (approved 2026-07-17): MANDATORY render test before any upgrade. The
      # rollback flag used to live only in a `kubectl set env`, which the next
      # helm upgrade wiped — silently reviving the fake URL-copy rollback. This
      # step proves the chart itself renders SERVER_DEPLOY_ROLLBACK_FROM_DIGEST
      # under default values, values-prod.yaml AND legacy stored values
      # (--reuse-values simulation), and that values.schema.json rejects a
      # malformed value. Failing here blocks the deploy.
      - name: Helm render test — rollback flag (blocking)
        run: node scripts/validate-helm-rollback-flag.mjs

      # P11 screenshotter render test: proves the chart renders the screenshotter
      # Deployment/Service, the chart-managed auth Secret (mounted on every pod)
      # and the egress NetworkPolicy under the exact --set combination the
      # upgrade below uses — BEFORE touching the release. Failing here blocks
      # the deploy instead of burning an --atomic rollback.
      - name: Helm render test — screenshotter (blocking)
        run: node scripts/validate-helm-screenshotter.mjs

      # P104 / SEC-8: same idea as the D2 test above, for the password-activation
      # interlock — and with the default INVERTED (safe state = "0", not armed).
      # Proves the chart renders "0" by default, under values-prod.yaml, and for
      # legacy stored values (--reuse-values), that the schema rejects a malformed
      # value, that an explicit --set can still arm it, and that the api Deployment
      # actually consumes the configmap carrying it. Failing here blocks the deploy.
      - name: Helm render test — password-activation interlock (blocking)
        run: node scripts/validate-helm-access-activation-flag.mjs

      # RE-AUTHENTIFICATION avant la phase kubectl/helm.
      #
      # Les identifiants obtenus au début du job sont issus d'un échange WIF dont
      # le jeton d'accès vit environ une heure. Entre-temps, ce job construit
      # deux tiers d'images séquentiellement sur un seul worker Cloud Build : le
      # 2026-08-28, la construction du tier runtime a duré 36 minutes à elle
      # seule, et un `helm upgrade` a été refusé en plein vol avec
      #
      #     UPGRADE FAILED: … rolled back due to atomic being set:
      #     the server has asked for the client to provide credentials
      #     (get persistentvolumeclaims vibecore-shared-csi)
      #
      # `--atomic` a bien annulé, la production est restée saine — mais la
      # livraison a été perdue et a dû être relancée à la main. Ce n'est pas un
      # aléa : plus le build est lourd, plus l'expiration est certaine.
      #
      # Ré-échanger le jeton OIDC de GitHub (disponible pendant toute la durée
      # du job) donne des identifiants frais juste avant les opérations qui en
      # dépendent. `get-credentials` seul n'y suffit pas : il réécrit le
      # kubeconfig, il ne renouvelle pas le jeton d'accès sous-jacent.
      - name: Refresh Google Cloud credentials before the rollout
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}

      # kubectl through Connect Gateway: the cluster control plane is
      # IP-restricted, so direct `get-gke-credentials` won't reach it from a
      # GitHub-hosted runner. Connect Gateway routes kubectl through a
      # Google-managed proxy authenticated by the WIF identity (IAM), no VPN.
      - name: Get cluster credentials via Connect Gateway
        run: |
          set -euo pipefail
          gcloud components install gke-gcloud-auth-plugin --quiet
          gcloud container fleet memberships get-credentials "${FLEET_MEMBERSHIP}" \
            --project="${GCP_PROJECT_ID}"
          kubectl config current-context

      - name: Record current release revision (for rollback)
        id: prevrev
        run: |
          set -euo pipefail
          helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" || true
          # Captured, not merely printed: the post-rollout checks below can fail AFTER a
          # successful upgrade (imageID mismatch, missing flag), and `--atomic` does not
          # cover that window — it only reverts an upgrade that itself failed. Without
          # this number there is nothing to roll back TO except a human reading history
          # during an incident.
          PREV="$(helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" -o json 2>/dev/null \
            | jq -r '[.[] | select(.status == "deployed")] | last | .revision // ""')"
          if [ -z "${PREV}" ]; then
            PREV="$(helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" -o json 2>/dev/null \
              | jq -r 'max_by(.revision) | .revision // ""')"
          fi
          echo "previous deployed revision: ${PREV:-(none — first install)}"
          echo "revision=${PREV}" >> "$GITHUB_OUTPUT"

      # ---- P104 / SEC-8: decide phase-1 vs steady-state BEFORE the upgrade ----
      #
      # The hazard, precisely: a PRE-CUTOVER api answered a public static
      # deployment with `Cache-Control: public, max-age=60`. A shared cache may
      # replay that entry for 60s with no revalidation, and the origin cannot
      # purge it. Activating password protection inside that window protects the
      # origin and nothing else — an anonymous visitor keeps getting the cached
      # public copy. Post-cutover the origin emits `no-cache, must-revalidate`,
      # which closes the window for good, but only once every pre-cutover pod is
      # gone AND its last response has aged out.
      #
      # Two independent facts decide what this run must do:
      #
      #   CODE_HAS_INTERLOCK — does the tree being deployed even contain the
      #     interlock? It ships in the same commit as the `no-cache` header, so
      #     its absence means this run deploys PRE-cutover api code.
      #   LIVE_FLAG — is the interlock already armed on the live release? It is
      #     only ever set to "1" by the phase-2 step below, i.e. after a barrier
      #     has already run against post-cutover code. So `LIVE_FLAG=1` implies
      #     the pods currently serving are post-cutover and emit `no-cache`;
      #     nothing can mint a fresh max-age=60 entry and no barrier is needed.
      #
      # Any state we cannot positively recognise as "already safe" takes the
      # barrier. The cost of a needless barrier is ~90s of deploy time; the cost
      # of a skipped one is a protected deployment served from a public cache.
      - name: Detect password-activation cutover (SEC-8)
        id: cutover
        run: |
          set -euo pipefail

          # SEC-9: does the PRODUCTION BUNDLE carry the interlock?
          #
          # This used to be `grep -rq ... services/api/src`, which walks a
          # DIRECTORY — and the directory contains the tests. The token lives in
          # deployment-password.spec.ts too, so deleting the interlock from the
          # production route while leaving the spec in place still matched: the
          # workflow saw "control present", skipped the barrier as steady state,
          # and armed activation against an api with no interlock at all.
          #
          # The fix is not an --exclude list (another denylist to forget). The
          # verifier walks the real production module graph from the production
          # entrypoint (services/api/src/server.ts) and only inspects files
          # genuinely reachable from it — a spec file is not, so it cannot vote.
          # Cross-validated against `tsc`'s own emitted graph (identical file set).
          # It also refuses to certify if any test file IS reachable, or if the
          # graph is implausibly small (a broken walker must never look like a pass).
          #
          # --expect-sha binds the verdict to the exact commit being deployed, so a
          # certification can never be carried over from another tree.
          #
          # RELATION TO THE RELEASE-GATE LOT (feat/deploy-exact-sha-gate): that lot
          # adds a `resolve-target` job which pins `target_sha`, derives
          # `short_sha = ${TARGET_SHA:0:10}` into this same SHORT_SHA env, and makes
          # every job check out `ref: target_sha`. The two compose rather than
          # duplicate: this gate keeps reading SHORT_SHA and keeps returning the same
          # verdict, while that lot makes the checkout PROVABLY the target — at which
          # point the `sha-mismatch` branch below becomes unreachable. It is kept as a
          # belt, because it is the only thing standing between "we inspected tree A"
          # and "we deployed image B" until that lot actually lands.
          INTERLOCK_FAIL_REASON=''

          if node scripts/verify-prod-interlock.mjs \
               --expect-sha "${SHORT_SHA}" \
               --json "${RUNNER_TEMP:-/tmp}/sec9-interlock-attestation.json"; then
            CODE_HAS_INTERLOCK=true
          else
            CODE_HAS_INTERLOCK=false
            # Distinguish the two ways this can fail, because they mean very
            # different things and a wrong message sends the next person hunting
            # the wrong bug.
            HEAD_SHA="$(git rev-parse HEAD)"
            case "${HEAD_SHA}" in
              "${SHORT_SHA}"*) INTERLOCK_FAIL_REASON='absent-from-production-bundle' ;;
              *)               INTERLOCK_FAIL_REASON='sha-mismatch' ;;
            esac
          fi

          # `|| true`: the key is absent on every release predating this change,
          # and an absent key must read as "not armed", not as a step failure.
          LIVE_FLAG="$(kubectl -n "${HELM_NAMESPACE}" get configmap \
            "${HELM_RELEASE}-vibecore-platform-platform-env" \
            -o jsonpath='{.data.DEPLOYMENT_ACCESS_ACTIVATION_ENABLED}' 2>/dev/null || true)"

          echo "code carries the interlock : ${CODE_HAS_INTERLOCK}"
          echo "live activation flag       : '${LIVE_FLAG}'"

          if [ "${CODE_HAS_INTERLOCK}" != "true" ]; then
            # Either the interlock is genuinely absent from the shipping bundle
            # (a rollback to pre-cutover api code — that code ignores the flag AND
            # re-emits max-age=60, so it reverts the fix whatever we set here), or
            # the tree we can inspect is not the image being deployed, in which
            # case we simply cannot certify anything. Both disarm: the flag goes
            # to 0, so the next provable post-cutover deploy is treated as a fresh
            # cutover and re-runs the barrier.
            if [ "${INTERLOCK_FAIL_REASON}" = 'sha-mismatch' ]; then
              echo "::warning::SEC-9 exact-SHA gate: deploying image tag ${SHORT_SHA} but the checked-out tree is $(git rev-parse --short=10 HEAD). The production bundle actually being deployed cannot be inspected from here, so the activation interlock is NOT certified. Disarming DEPLOYMENT_ACCESS_ACTIVATION_ENABLED (fail-closed)."
            else
              echo "::warning::Deploying api code WITHOUT the SEC-8 activation interlock in its PRODUCTION BUNDLE — this reverts the deployment-password cache fix (public static deployments will again be served with Cache-Control: max-age=60). Disarming DEPLOYMENT_ACCESS_ACTIVATION_ENABLED."
            fi
            echo "barrier=false" >> "$GITHUB_OUTPUT"
            echo "phase1_flag=0" >> "$GITHUB_OUTPUT"
            echo "final_flag=0" >> "$GITHUB_OUTPUT"
          elif [ "${LIVE_FLAG}" = "1" ]; then
            # Steady state: the running pods are already post-cutover, so no pod
            # in this rollout — old or new — can mint a max-age=60 response. Single
            # upgrade, flag re-asserted (--reuse-values would otherwise freeze it).
            echo "Steady state — pods already post-cutover; no drain barrier needed."
            echo "barrier=false" >> "$GITHUB_OUTPUT"
            echo "phase1_flag=1" >> "$GITHUB_OUTPUT"
            echo "final_flag=1" >> "$GITHUB_OUTPUT"
          else
            # THE CUTOVER. Roll the new code with activation still closed, drain,
            # wait out the legacy max-age, and only then arm it in phase 2.
            echo "CUTOVER — phase 1 rolls out with activation CLOSED; phase 2 arms it after the drain barrier."
            echo "barrier=true" >> "$GITHUB_OUTPUT"
            echo "phase1_flag=0" >> "$GITHUB_OUTPUT"
            echo "final_flag=1" >> "$GITHUB_OUTPUT"
          fi

      # --reuse-values preserves every existing value (admin imageTag + all prod
      # config) and overrides only the tiers rebuilt above: web, api,
      # workspace-manager, preview-proxy, ai-gateway, worker, and the
      # workspace-agent runtime image. NOTE: because --reuse-values keeps the
      # release's stored configmap values, a change to values-prod.yaml alone
      # never reaches prod — values that must change here have to be re-asserted
      # via --set. previewUrlTemplate is pinned to the host ROOT (no
      # '/p/<ws>/<port>/' path prefix) so client-side routers in generated apps
      # work; a path prefix makes BrowserRouter-style apps render blank.
      # --atomic auto-rolls-back on a failed
      # upgrade (a bad ai-gateway/worker container fails readiness → rollback;
      # the agent image is a configmap value the api re-reads on its restart).

      # --reuse-values preserves every existing value (all prod config) and overrides
      # the image references. NOTE: because --reuse-values keeps the release's stored
      # configmap values, a change to values-prod.yaml alone never reaches prod —
      # values that must change here have to be re-asserted via --set.
      # previewUrlTemplate is pinned to the host ROOT (no '/p/<ws>/<port>/' path
      # prefix) so client-side routers in generated apps work; a path prefix makes
      # BrowserRouter-style apps render blank. --atomic auto-rolls-back on a failed
      # upgrade (a bad ai-gateway/worker container fails readiness → rollback; the
      # agent image is a configmap value the api re-reads on its restart).
      #
      # Every service is set BY DIGEST, from the manifest that was just validated —
      # including services this run did not rebuild, whose current digest is carried
      # forward. imageTag is re-asserted alongside purely as human-readable
      # provenance; the chart ignores it whenever a digest is present.
      - name: Helm upgrade (all services pinned by digest)
        run: |
          set -euo pipefail
          SETS=( --set "platformEnv.runtime.previewUrlTemplate=https://{workspaceId}-{port}.preview.e-code.ai/" )
          # D2 (approved 2026-07-17): re-assert the digest-rollback flag on EVERY
          # upgrade (configmap value that --reuse-values would otherwise freeze
          # at whatever the release stored). Belt on top of the chart default
          # "1" + values.schema.json; the post-deploy step below verifies the
          # flag actually reached the running api pods.
          SETS+=( --set-string "platformEnv.runtime.serverDeployRollbackFromDigest=1" )
          # P104 / SEC-8: phase-1 value of the activation interlock, decided by the
          # cutover step above ("0" on a cutover, "1" in steady state). Always
          # explicit — --reuse-values would otherwise freeze whatever the release
          # happens to store, which is precisely how an interlock silently rots.
          #
          # CONSERVÉ à la fusion avec le déploiement par digest : les `--set
          # imageTag` par service que portait cette branche sont, eux, remplacés
          # par la boucle de digests ci-dessous (le manifeste fait autorité). Ce
          # drapeau-ci n'est pas une référence d'image : le perdre rendrait
          # l'interlock dépendant de ce que la release a stocké.
          SETS+=( --set-string "platformEnv.runtime.deploymentAccessActivationEnabled=${{ steps.cutover.outputs.phase1_flag }}" )

          # Only entries that ARE chart services get a `services.<key>` override —
          # `--set services.workspaceAgent.…` would invent a service the chart has no
          # template for, and helm would happily store it.
          while read -r service digest tag; do
            SETS+=( --set-string "services.${service}.imageDigest=${digest}" )
            if [ -n "${tag}" ] && [ "${tag}" != "null" ]; then
              SETS+=( --set-string "services.${service}.imageTag=${tag}" )
            fi
          # `!= false`, not a bare truthiness test: an entry whose chartService field is
          # absent would be silently skipped by the latter, i.e. a service would quietly
          # keep whatever digest the release already stored instead of the one this run
          # verified. Absent means "not marked as non-chart", so include it and let the
          # chart reject an unknown key loudly. Same expression as the break-glass path.
          done < <(jq -r '.services[] | select(.chartService != false) | "\(.service) \(.digest) \(.tag // "")"' release-manifest.json)

          # The workspace-agent is not a chart service: it is an image reference the api
          # hands to each workspace pod. Pin it by the digest already resolved, scanned
          # and signature-verified above — never by re-resolving the tag here, which
          # would reintroduce the gap between "what we checked" and "what we ship".
          WSAGENT_DIGEST="$(jq -r '.services[] | select(.service == "workspaceAgent") | .digest' release-manifest.json)"
          if [ -n "${WSAGENT_DIGEST}" ]; then
            SETS+=( --set-string "platformEnv.runtime.workspaceAgentImage=${REG}/workspace-agent@${WSAGENT_DIGEST}" )
          fi

          # Repris de main : ces valeurs de configmap sont RÉ-AFFIRMÉES à chaque
          # upgrade parce que `--reuse-values` ignore values-prod.yaml — sans quoi
          # elles resteraient figées sur ce que la release avait stocké. Le digest
          # du screenshotter, lui, arrive par la boucle ci-dessus : c'est un chart
          # service comme un autre, il n'a donc pas besoin d'imageTag ici.
          #
          # HORS du `if` ci-dessus : ces valeurs ne dépendent pas du
          # workspace-agent. Les laisser dedans les aurait rendues
          # conditionnelles à la présence de son digest — le screenshotter aurait
          # perdu sa configuration sur tout run où le workspace-agent n'est pas
          # reconstruit.
          #
          # Ports 3030 / 3020, pas 8080. Vérifié sur le cluster de production :
          #   svc vibecore-vibecore-platform-screenshotter  → 3030
          #   svc vibecore-vibecore-platform-preview-proxy  → 3020
          # et c'est bien ce que le configmap servi aujourd'hui contient. Un
          # 8080 ici aurait été poussé au premier déploiement et aurait coupé
          # les vignettes, sans rien casser d'assez visible pour être remarqué
          # tout de suite.
          SETS+=(
            --set "services.screenshotter.enabled=true"
            --set-string "platformEnv.screenshotterUrl=http://vibecore-vibecore-platform-screenshotter.vibecore.svc.cluster.local:3030"
            --set-string "platformEnv.screenshotterAllowedHosts=preview.e-code.ai"
            --set-string "platformEnv.screenshotterPreviewProxyUrl=http://vibecore-vibecore-platform-preview-proxy.vibecore.svc.cluster.local:3020"
          )

          # DÉRIVE DES VALEURS — `--reuse-values` ne relit jamais values-prod.yaml.
          # Un réglage fusionné dans le fichier peut donc n'atteindre jamais la
          # production, sans erreur ni trace. C'est arrivé : #375 relevait la
          # limite processeur de l'api de 500m à 2, fusionnée le 2026-09-02,
          # restée lettre morte jusqu'au 2026-09-04 — deux jours à 12,6 % de
          # périodes étranglées, en silence.
          #
          # Ce contrôle CRIE et ne bloque pas : il ne referme pas les écarts tout
          # seul, parce que le fichier n'a pas toujours raison contre la
          # production (un `--set` d'hier peut être le bon réglage d'aujourd'hui).
          # PAS de `|| true`. Un contrôle qui ne peut pas s'exécuter doit faire
          # échouer, pas se taire : la première version importait `yaml`,
          # introuvable sur le runner, et mourait en silence derrière un
          # `|| true` — un garde contre les réglages silencieux, lui-même
          # silencieux. Exactement le défaut qu'il existe pour attraper.
          helm get values "${HELM_RELEASE}" --namespace "${HELM_NAMESPACE}" -o json > /tmp/valeurs-release.json
          python3 -c 'import json,sys,yaml; json.dump(yaml.safe_load(open(sys.argv[1])), open(sys.argv[2],"w"))' \
            infra/helm/platform/values-prod.yaml /tmp/valeurs-fichier.json
          node scripts/release-gate/detecter-derive-valeurs.mjs \
            /tmp/valeurs-fichier.json /tmp/valeurs-release.json

          echo "helm --set args: ${SETS[*]}"
          helm upgrade "${HELM_RELEASE}" infra/helm/platform \
            --namespace "${HELM_NAMESPACE}" \
            --reuse-values \
            --atomic \
            --timeout 10m \
            "${SETS[@]}"
          # From here on, a failure means production has ALREADY been changed. The
          # rollback step below keys off this marker so it never reverts a healthy
          # release because something failed before the upgrade (a build, a scan).
          echo "UPGRADE_APPLIED=1" >> "$GITHUB_ENV"

      - name: Verify rollout
        run: |
          set -euo pipefail
          for svc in web api workspace-manager preview-proxy ai-gateway worker; do
            dep="$(kubectl -n "${HELM_NAMESPACE}" get deploy \
              -l "app.kubernetes.io/name=${svc}" -o name 2>/dev/null | head -n1)"
            if [ -z "${dep}" ]; then
              # Fall back to the released chart's naming if the label selector misses.
              dep="deploy/${HELM_RELEASE}-vibecore-platform-${svc}"
            fi
            echo "::group::rollout status ${dep}"
            kubectl -n "${HELM_NAMESPACE}" rollout status "${dep}" --timeout=5m
            echo "::endgroup::"
          done
          # P11 screenshotter — only exists once a runtime-tier deploy has asserted
          # services.screenshotter.enabled=true (see the helm SETS above), so check
          # for the Deployment instead of failing a web-only deploy that predates it.
          if kubectl -n "${HELM_NAMESPACE}" get deploy "${HELM_RELEASE}-vibecore-platform-screenshotter" >/dev/null 2>&1; then
            echo "::group::rollout status deploy/${HELM_RELEASE}-vibecore-platform-screenshotter"
            kubectl -n "${HELM_NAMESPACE}" rollout status "deploy/${HELM_RELEASE}-vibecore-platform-screenshotter" --timeout=5m
            echo "::endgroup::"
          else
            echo "screenshotter Deployment absent (not yet enabled by a runtime-tier deploy) — skipped"
          fi

      # Release-integrity requirement 6, second half: prove the cluster is running the
      # digests this release recorded. `helm upgrade` succeeding only proves what we
      # ASKED for; `imageID` is what the kubelet reports it actually pulled and ran.
      #
      # Only pods of the CURRENT ReplicaSet are examined. With maxUnavailable:0 the old
      # pods can still be terminating when `rollout status` returns, and counting them
      # would report a mismatch for images that are on their way out.
      - name: Verify running imageIDs match the release manifest
        run: |
          set -euo pipefail
          echo '{}' > /tmp/observed.json

          while read -r service image; do
            # Chart service keys are camelCase; the k8s label is kebab-case.
            label="${image}"
            dep="$(kubectl -n "${HELM_NAMESPACE}" get deploy -l "app.kubernetes.io/name=${label}" -o name 2>/dev/null | head -n1)"
            if [ -z "${dep}" ]; then
              dep="deploy/${HELM_RELEASE}-vibecore-platform-${label}"
            fi
            # `kubectl get -o name` prints `deployment.apps/<name>`, NOT `deploy/<name>`.
            # Stripping a literal "deploy/" leaves the group prefix attached, the
            # ownerReferences match below never fires, and the ReplicaSet lookup comes
            # back empty — which this step then reports as "no running pod", i.e. a
            # deploy that failed for a reason that has nothing to do with the images.
            # Caught by scripts/release-gate/proof-digest-rollout.sh on a real cluster.
            depname="${dep##*/}"

            # The ACTIVE ReplicaSet is the one carrying the Deployment's current
            # revision — NOT the most recently created one. Kubernetes reuses an
            # existing ReplicaSet when a rollout returns to a pod template it has seen
            # before, so after a break-glass restore (or any return to an earlier
            # digest) the newest-by-creationTimestamp ReplicaSet is the one that was
            # just scaled to ZERO, and this step would report "no running pod" for a
            # service that is running perfectly. Caught by
            # scripts/release-gate/proof-digest-rollout.sh step 8 on a real cluster.
            REV="$(kubectl -n "${HELM_NAMESPACE}" get deploy "${depname}" \
              -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')"
            HASH="$(kubectl -n "${HELM_NAMESPACE}" get rs -o json \
              | jq -r --arg d "${depname}" --arg rev "${REV}" '
                  [ .items[]
                    | select((.metadata.ownerReferences // [])[]?.name == $d)
                    | select(.metadata.annotations["deployment.kubernetes.io/revision"] == $rev) ]
                  | first | .metadata.labels["pod-template-hash"] // ""')"
            if [ -z "${HASH}" ] || [ "${HASH}" = "null" ]; then
              echo "::error::${service}: could not find the ReplicaSet for ${depname} at revision ${REV}"
              exit 1
            fi

            IDS="$(kubectl -n "${HELM_NAMESPACE}" get pods \
              -l "app.kubernetes.io/name=${label},pod-template-hash=${HASH}" -o json \
              | jq -c --arg img "${label}" '
                  [ .items[]
                    | select(.metadata.deletionTimestamp == null)
                    | select(.status.phase == "Running")
                    | .status.containerStatuses[]?
                    | select(.name == $img)
                    | .imageID ]')"

            jq --arg s "${service}" --argjson ids "${IDS}" '. + {($s): $ids}' /tmp/observed.json \
              > /tmp/observed.next && mv /tmp/observed.next /tmp/observed.json
          # Must match verify-imageids' own filter EXACTLY (`rolled !== false`). With a
          # bare truthiness test here, an entry whose `rolled` field is absent would be
          # skipped when collecting imageIDs but still demanded by the verifier — which
          # then reports "no running pod reported an imageID" and fails the deploy for a
          # reason that has nothing to do with the images.
          done < <(jq -r '.services[] | select(.rolled != false) | "\(.service) \(.image)"' release-manifest.json)

          echo "::group::observed imageIDs"
          jq . /tmp/observed.json
          echo "::endgroup::"

          # verify-imageids itself skips entries with rolled=false (admin, screenshotter,
          # workspace-agent), so the set of services that must match is decided by the
          # manifest — an auditable artifact — rather than by a filter in this file.
          node scripts/release-gate/release-manifest.mjs verify-imageids \
            --manifest release-manifest.json \
            --observed /tmp/observed.json
      # ---- P104 / SEC-8 · phase 1 -> phase 2 barrier -------------------------
      #
      # `rollout status` above returned as soon as the NEW ReplicaSet was complete.
      # That is not the property we need. Old pods can still exist and still serve
      # (they keep answering through their ~10s preStop drain), and any response
      # they emit carries `max-age=60` — reusable from a shared cache for a full
      # minute after the pod itself is gone. So the barrier waits for BOTH:
      #
      #   1. zero pods outside the image the Deployment now wants — terminating
      #      ones included, since a terminating pod still answers; and
      #   2. 60s (the legacy max-age) + 30s margin of that being CONTINUOUSLY true.
      #
      # The clock is armed when the last old pod disappears, not when the rollout
      # started, and it RE-ARMS from zero if an old pod ever reappears (HPA scaling
      # the previous ReplicaSet, a partial rollback). The margin absorbs clock skew
      # between the pod that stamped the response and this runner, `Age` already
      # accrued in an intermediate cache, and the poll granularity.
      #
      # The state machine lives in scripts/deploy-cache-window.mjs and is proven
      # against a fake clock in scripts/deploy-cache-window.spec.mjs — including
      # the re-arm, the terminating-pod and the timeout cases — so this guarantee
      # is testable without a cluster. On timeout the step FAILS with the release
      # still at DEPLOYMENT_ACCESS_ACTIVATION_ENABLED=0: activation stays closed.
      # ---- P104 / SEC-9 · runtime probe of the DEPLOYED production API --------
      #
      # Everything before this point reasons about SOURCE. This step asks the
      # thing that is actually serving traffic. After phase 1 the rolled-out api
      # must REFUSE to activate password protection, and refuse it with the
      # interlock's own error code. That is only true if the interlock is present
      # AND wired AND reading the flag we set — three things no static check can
      # fully guarantee about a container image built elsewhere by Cloud Build.
      #
      # Unauthenticated on purpose: the route answers 401 before any interlock is
      # consulted, so the probe asserts the WEAKER, always-true property — the api
      # must never answer 2xx here while the interlock is closed. A 2xx means an
      # activation just succeeded unauthenticated, which is a far worse bug.
      # 401/403 (auth first) and 503 (interlock) are both acceptable; 200/201 is not.
      - name: Runtime probe — deployed api refuses activation in phase 1 (SEC-9)
        if: steps.cutover.outputs.barrier == 'true'
        run: |
          set -euo pipefail
          POD="$(kubectl -n "${HELM_NAMESPACE}" get pods \
            -l "app.kubernetes.io/name=api,app.kubernetes.io/instance=${HELM_RELEASE}" \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')"
          if [ -z "${POD}" ]; then
            echo "::error::no Running api pod to probe — refusing to arm activation" >&2
            exit 1
          fi
          echo "probing pod ${POD}"

          # Probe from INSIDE the cluster via a throwaway pod: the api Service is
          # not reachable from the runner.
          #
          # CE QUI TOMBAIT, mesuré une fois stderr rendue visible (run 1456) :
          #   pods "sec9-probe-…" is forbidden: violates PodSecurity
          #   "restricted:latest": allowPrivilegeEscalation != false,
          #   unrestricted capabilities, runAsNonRoot != true, seccompProfile
          # Le namespace applique la politique « restricted » ; un pod créé par
          # `kubectl run` nu n'a AUCUN securityContext, l'apiserver le refuse
          # avant même de l'ordonnancer. Les runs 1436 et 1454 tombaient sur ce
          # même refus, mais `2>/dev/null` l'avalait et l'étape sortait en
          # erreur sans un mot — la production était rollbackée sur un rollout
          # sain. (Une première réécriture attribuait le refus à l'attache
          # websocket de `--rm -i` : c'était une déduction, pas une mesure.)
          #
          # Le pod porte donc exactement ce que la politique exige, via
          # `--overrides` ; et l'on ne s'attache toujours pas : créer le pod,
          # lire son état par un GET, le supprimer.
          #
          # Le VERDICT voyage dans le code de sortie du pod (lisible par un GET
          # sur `status`), pas dans ses journaux ni dans une attache :
          #   0  → l'api a répondu autre chose que 2xx (refus : attendu)
          #   20 → l'api a répondu 2xx (activation acceptée : DÉFAUT)
          #   30 → aucun code HTTP (api injoignable : inconclusif, fail-closed).
          #        curl rend « 000 » quand la connexion échoue : c'est un « aucun
          #        code », pas un refus — mesuré, sans ce cas l'api injoignable
          #        passait pour un refus (fail-OPEN).
          PROBE="sec9-probe-${GITHUB_RUN_ID}"
          PROBE_URL="http://${HELM_RELEASE}-vibecore-platform-api.${HELM_NAMESPACE}.svc:3001/projects/sec9-probe/deployments/sec9-probe/access"
          kubectl -n "${HELM_NAMESPACE}" delete pod "${PROBE}" --ignore-not-found --wait=true
          # curlimages/curl tourne en utilisateur 100:101 ; l'écrire en clair
          # parce que `runAsNonRoot` ne se vérifie pas sur un USER symbolique.
          OVERRIDES="$(printf '{"spec":{"automountServiceAccountToken":false,"securityContext":{"runAsNonRoot":true,"runAsUser":100,"runAsGroup":101,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"%s","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}},"resources":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"cpu":"100m","memory":"64Mi"}}}]}}' "${PROBE}")"
          kubectl -n "${HELM_NAMESPACE}" run "${PROBE}" \
            --restart=Never --image=curlimages/curl:8.10.1 \
            --labels="app.kubernetes.io/name=sec9-probe,app.kubernetes.io/part-of=vibecore" \
            --env="PROBE_URL=${PROBE_URL}" \
            --overrides="${OVERRIDES}" \
            --command -- sh -c 'code="$(curl -s -o /dev/null -w "%{http_code}" -m 15 -X POST "$PROBE_URL" -H "content-type: application/json" -d "{\"mode\":\"password\",\"password\":\"sec9-probe-not-a-real-password\"}" || true)"; echo "http ${code:-none}"; printf "%s" "$code" > /dev/termination-log 2>/dev/null || true; case "$code" in 2*) exit 20 ;; ""|000) exit 30 ;; *) exit 0 ;; esac'

          PHASE=""
          for _ in $(seq 1 45); do
            PHASE="$(kubectl -n "${HELM_NAMESPACE}" get pod "${PROBE}" -o jsonpath='{.status.phase}')"
            case "${PHASE}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          STATUS_JSON="$(kubectl -n "${HELM_NAMESPACE}" get pod "${PROBE}" -o jsonpath='{.status.containerStatuses[0].state.terminated}')"
          EXIT_CODE="$(printf '%s' "${STATUS_JSON}" | jq -r '.exitCode // empty')"
          CODE="$(printf '%s' "${STATUS_JSON}" | jq -r '.message // empty' | tr -dc '0-9')"
          echo "probe pod phase=${PHASE:-unknown} exit=${EXIT_CODE:-none} http=${CODE:-none}"
          if [ -z "${EXIT_CODE}" ]; then
            # Jamais terminé (image non tirée, pod non ordonnancé, …) : dire POURQUOI.
            kubectl -n "${HELM_NAMESPACE}" describe pod "${PROBE}" | tail -n 25 || true
          fi
          kubectl -n "${HELM_NAMESPACE}" delete pod "${PROBE}" --ignore-not-found --wait=false \
            || echo "::warning::probe pod ${PROBE} could not be deleted — clean it up by hand"

          case "${EXIT_CODE}" in
            0)
              echo "ok — deployed api refuses activation (HTTP ${CODE:-non-2xx}) while the interlock is closed"
              ;;
            20)
              echo "::error::PHASE-1 PROBE FAILED — the deployed api answered ${CODE} to an activation request while the interlock is supposed to be CLOSED. Not arming activation." >&2
              exit 1
              ;;
            *)
              echo "::error::PHASE-1 PROBE INCONCLUSIVE — no HTTP status from the deployed api (probe exit ${EXIT_CODE:-none}, phase ${PHASE:-unknown}). Refusing to arm activation (fail-closed)." >&2
              exit 1
              ;;
          esac

      - name: Drain barrier — outlast the legacy public max-age (SEC-8)
        id: barrier
        if: steps.cutover.outputs.barrier == 'true'
        env:
          LEGACY_MAX_AGE_SECONDS: '60'
          SAFETY_MARGIN_SECONDS: '30'
          POLL_INTERVAL_SECONDS: '5'
          MAX_WAIT_SECONDS: '900'
        run: |
          set -euo pipefail
          # The image the api Deployment now WANTS (read back from the live
          # cluster, not assumed from SHORT_SHA — a run where the runtime tier was
          # skipped keeps its previous tag, and the barrier must compare against
          # what is actually being rolled out).
          EXPECTED_IMAGE="$(kubectl -n "${HELM_NAMESPACE}" get deploy \
            "${HELM_RELEASE}-vibecore-platform-api" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [ -z "${EXPECTED_IMAGE}" ]; then
            echo "::error::Could not read the api Deployment's image — refusing to arm activation." >&2
            exit 1
          fi
          echo "Barrier target image: ${EXPECTED_IMAGE}"

          # SEC-10: the api actually running MUST be the commit whose production
          # bundle we certified, or the certification says nothing about it.
          #
          # Without this the barrier can clear against PRE-cutover code. Concretely:
          # a cutover run dies before the helm upgrade (flag never set, api still
          # pre-cutover); a later push touches only app/, so `Detect changed tiers`
          # leaves runtime=false and the api keeps its old image. Cutover detection
          # still says "cutover" (the TREE carries the interlock), the barrier
          # compares pods against that OLD image, finds nothing older, clears after
          # 90s — and phase 2 arms activation against an api with no interlock that
          # is still emitting `max-age=60`. The runtime probe above does not catch
          # it either: it is unauthenticated, and the route answers 401 before the
          # interlock is ever consulted, so a pre-cutover api looks identical.
          #
          # Withhold arming instead — do NOT fail the job. By this point the
          # rollout has already succeeded, and turning "cannot certify the
          # interlock" into "the production deploy failed" would be both wrong and
          # actively harmful: it fires the rollback alarms for a deploy that is
          # fine. The safe outcome is simply that activation stays closed, so this
          # sets armable=false and the phase-2 step below skips. The release stays
          # at DEPLOYMENT_ACCESS_ACTIVATION_ENABLED=0 and the next deploy that
          # really rebuilds the api re-runs the whole sequence.
          case "${EXPECTED_IMAGE}" in
            *:"${SHORT_SHA}")
              echo "armable=true" >> "$GITHUB_OUTPUT"
              echo "SEC-10 ok: running api image is built from the certified commit ${SHORT_SHA}"
              ;;
            *)
              echo "armable=false" >> "$GITHUB_OUTPUT"
              echo "::warning::SEC-10: the api Deployment runs ${EXPECTED_IMAGE}, which is not built from the commit whose production bundle was certified (${SHORT_SHA}) — the runtime tier was not rebuilt this run, so the running code may predate the activation interlock. NOT arming password activation; the release stays fail-closed at DEPLOYMENT_ACCESS_ACTIVATION_ENABLED=0. The deploy itself is unaffected."
              exit 0
              ;;
          esac
          EXPECTED_IMAGE="${EXPECTED_IMAGE}" node scripts/deploy-cache-window.mjs

      # ---- P104 / SEC-8 · phase 2: NOW it is safe to arm activation ----------
      #
      # Only reached when the barrier proved no pre-cutover pod has existed for
      # longer than the legacy max-age. Flipping the configmap changes the pod
      # template's checksum annotation, so the api rolls once more; that is fine
      # and deliberate — every pod involved (old and new) is post-cutover code
      # emitting `no-cache`, so no cache entry can be minted during it. While that
      # roll is in flight, activation requests may hit a not-yet-updated pod and
      # get 503 DEPLOYMENT_ACCESS_ACTIVATION_DISABLED: fail-closed, and transient.
      - name: Phase 2 — arm password activation (SEC-8)
        # SEC-10: also requires the barrier to have certified that the api pods
        # actually run the commit whose production bundle was verified.
        if: steps.cutover.outputs.barrier == 'true' && steps.barrier.outputs.armable == 'true'
        run: |
          set -euo pipefail
          helm upgrade "${HELM_RELEASE}" infra/helm/platform \
            --namespace "${HELM_NAMESPACE}" \
            --reuse-values \
            --atomic \
            --timeout 10m \
            --set "platformEnv.runtime.previewUrlTemplate=https://{workspaceId}-{port}.preview.e-code.ai/" \
            --set-string "platformEnv.runtime.serverDeployRollbackFromDigest=1" \
            --set-string "platformEnv.runtime.deploymentAccessActivationEnabled=1"
          kubectl -n "${HELM_NAMESPACE}" rollout status \
            "deploy/${HELM_RELEASE}-vibecore-platform-api" --timeout=5m

      # D2 (approved 2026-07-17): POST-DEPLOY proof that the rollback flag
      # survived the upgrade — checked against the LIVE cluster (rendered
      # configmap value AND the env of a running api pod), not the workflow's
      # own inputs. If this fails the job goes red and the Notify step below
      # alerts (job summary + Slack): that IS the "flag absent after helm
      # upgrade" alert. A failure here does NOT auto-rollback — the deployed
      # code fails CLOSED (api refuses URL-only rollbacks even without the
      # env var), so red-alert-and-investigate beats a blind rollback.
      - name: Verify rollback flag survived the upgrade (D2)
        run: |
          set -euo pipefail
          CM_VALUE="$(kubectl -n "${HELM_NAMESPACE}" get configmap "${HELM_RELEASE}-vibecore-platform-platform-env" \
            -o jsonpath='{.data.SERVER_DEPLOY_ROLLBACK_FROM_DIGEST}')"
          echo "configmap SERVER_DEPLOY_ROLLBACK_FROM_DIGEST='${CM_VALUE}'"
          if [ "${CM_VALUE}" != "1" ]; then
            echo "::error::SERVER_DEPLOY_ROLLBACK_FROM_DIGEST missing/wrong in the live configmap after upgrade (got '${CM_VALUE}', want '1')" >&2
            exit 1
          fi
          # `kubectl exec` is NOT available through the Connect Gateway for the
          # CI's WIF identity (websocket upgrade denied — 5/5 retries failed on
          # both live runs while the pods actually carried '1'). Verify WITHOUT
          # exec, via plain GETs that DO work from here: the api Deployment's
          # pod template must consume the flag — an explicit env entry (must be
          # '1') or envFrom on the platform-env configmap whose live value was
          # asserted above. Every pod the Deployment creates then starts with
          # the flag; there is no per-pod drift channel left to check.
          TEMPLATE_JSON="$(kubectl -n "${HELM_NAMESPACE}" get deploy "${HELM_RELEASE}-vibecore-platform-api" \
            -o jsonpath='{.spec.template.spec.containers[0]}')"
          EXPLICIT="$(printf '%s' "${TEMPLATE_JSON}" | jq -r '[.env // [] | .[] | select(.name=="SERVER_DEPLOY_ROLLBACK_FROM_DIGEST")][0].value // "ABSENT"')"
          CONSUMES_CM="$(printf '%s' "${TEMPLATE_JSON}" | jq -r --arg cm "${HELM_RELEASE}-vibecore-platform-platform-env" '[.envFrom // [] | .[] | select(.configMapRef.name==$cm)] | length')"
          echo "api pod template: explicit env='${EXPLICIT}', envFrom platform-env configmap refs=${CONSUMES_CM}"
          if [ "${EXPLICIT}" != "ABSENT" ] && [ "${EXPLICIT}" != "1" ]; then
            echo "::error::api pod template pins SERVER_DEPLOY_ROLLBACK_FROM_DIGEST='${EXPLICIT}' (explicit env overrides the configmap)" >&2
            exit 1
          fi
          if [ "${EXPLICIT}" = "ABSENT" ] && [ "${CONSUMES_CM}" = "0" ]; then
            echo "::error::api pod template neither sets SERVER_DEPLOY_ROLLBACK_FROM_DIGEST nor consumes the platform-env configmap" >&2
            exit 1
          fi

      # The manifest and SBOMs are the audit trail for this release: what shipped,
      # from which commit and build, as which digests. Uploaded even on failure —
      # a refused or half-finished deploy is exactly when you want to see them.
      # POST-CHECK FAILURE => ROLL BACK. `--atomic` only reverts an upgrade that failed
      # on its own terms; everything verified afterwards (imageIDs match the manifest,
      # the rollback flag survived) happens on a release that is already live. Leaving
      # production on a rollout we just declared unverifiable, and merely going red, is
      # the wrong default: the previous revision was verified, this one is not.
      - name: Roll back to the previous revision (post-check failure)
        if: failure() && env.UPGRADE_APPLIED == '1' && steps.prevrev.outputs.revision != ''
        env:
          PREV_REVISION: ${{ steps.prevrev.outputs.revision }}
        run: |
          set -uo pipefail
          echo "::error::post-rollout verification failed — rolling production back to revision ${PREV_REVISION}"
          if helm rollback "${HELM_RELEASE}" "${PREV_REVISION}" -n "${HELM_NAMESPACE}" --wait --timeout 10m; then
            echo "rolled back to revision ${PREV_REVISION}"
          else
            echo "::error::ROLLBACK FAILED — production is on an unverified release. Escalate now."
            exit 1
          fi
          for svc in web api workspace-manager preview-proxy ai-gateway worker; do
            dep="$(kubectl -n "${HELM_NAMESPACE}" get deploy -l "app.kubernetes.io/name=${svc}" -o name 2>/dev/null | head -n1)"
            [ -n "${dep}" ] || continue
            kubectl -n "${HELM_NAMESPACE}" rollout status "${dep}" --timeout=5m || true
          done
          {
            echo "## ⚠️ Rolled back"
            echo ""
            echo "Post-rollout verification failed; production was returned to revision \`${PREV_REVISION}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ needs.resolve-target.outputs.short_sha }}
          path: sbom/
          if-no-files-found: warn

      # P104 / SEC-8: POST-DEPLOY proof, read back from the LIVE cluster, that the
      # interlock ended this run in exactly the state the cutover step decided —
      # "1" only when a barrier actually ran (or had already run on a previous
      # deploy), "0" otherwise. Guards the two failures that matter: a phase-2 that
      # silently no-op'd (protection unusable, loud instead of mysterious), and a
      # flag that arrived at "1" without a barrier (the hole this change closes).
      - name: Verify the activation interlock state (SEC-8)
        run: |
          set -euo pipefail
          WANT="${{ steps.cutover.outputs.final_flag }}"
          CM_VALUE="$(kubectl -n "${HELM_NAMESPACE}" get configmap "${HELM_RELEASE}-vibecore-platform-platform-env" \
            -o jsonpath='{.data.DEPLOYMENT_ACCESS_ACTIVATION_ENABLED}')"
          echo "configmap DEPLOYMENT_ACCESS_ACTIVATION_ENABLED='${CM_VALUE}' (expected '${WANT}')"
          if [ "${CM_VALUE}" != "${WANT}" ]; then
            echo "::error::DEPLOYMENT_ACCESS_ACTIVATION_ENABLED is '${CM_VALUE}' in the live configmap, expected '${WANT}'" >&2
            exit 1
          fi
          # Same reasoning as the D2 step above: `kubectl exec` is not available to
          # the CI identity through Connect Gateway, so prove the value REACHES the
          # process via the api pod template instead. An explicit env entry would
          # override the configmap, so it must either be absent or already correct.
          TEMPLATE_JSON="$(kubectl -n "${HELM_NAMESPACE}" get deploy "${HELM_RELEASE}-vibecore-platform-api" \
            -o jsonpath='{.spec.template.spec.containers[0]}')"
          EXPLICIT="$(printf '%s' "${TEMPLATE_JSON}" | jq -r '[.env // [] | .[] | select(.name=="DEPLOYMENT_ACCESS_ACTIVATION_ENABLED")][0].value // "ABSENT"')"
          CONSUMES_CM="$(printf '%s' "${TEMPLATE_JSON}" | jq -r --arg cm "${HELM_RELEASE}-vibecore-platform-platform-env" '[.envFrom // [] | .[] | select(.configMapRef.name==$cm)] | length')"
          echo "api pod template: explicit env='${EXPLICIT}', envFrom platform-env configmap refs=${CONSUMES_CM}"
          if [ "${EXPLICIT}" != "ABSENT" ] && [ "${EXPLICIT}" != "${WANT}" ]; then
            echo "::error::api pod template pins DEPLOYMENT_ACCESS_ACTIVATION_ENABLED='${EXPLICIT}' (explicit env overrides the configmap)" >&2
            exit 1
          fi
          if [ "${EXPLICIT}" = "ABSENT" ] && [ "${CONSUMES_CM}" = "0" ]; then
            echo "::error::api pod template neither sets DEPLOYMENT_ACCESS_ACTIVATION_ENABLED nor consumes the platform-env configmap" >&2
            exit 1
          fi
          {
            echo "### SEC-8 password-activation interlock"
            echo ""
            echo "- **Barrier ran this deploy:** \`${{ steps.cutover.outputs.barrier }}\`"
            echo "- **Live \`DEPLOYMENT_ACCESS_ACTIVATION_ENABLED\`:** \`${CM_VALUE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Notifications: always runs. Writes a GitHub job summary (visible on the
      # run + emailed to the actor by GitHub on failure) and, when a Slack
      # webhook secret is configured, posts there too. The Slack step is a no-op
      # if the secret is absent, so this works with zero extra setup.
      - name: Notify result
        if: always()
        env:
          STATUS: ${{ job.status }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -uo pipefail
          if [ "${STATUS}" = "success" ]; then
            ICON=":white_check_mark:"; TITLE="Production deploy succeeded"
          else
            ICON=":x:"; TITLE="Production deploy FAILED"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## ${TITLE}"
            echo ""
            echo "- **Gated commit:** \`${TARGET_SHA}\`"
            echo "- **Derived tag:** \`${SHORT_SHA:-unknown}\`"
            echo "- **Release:** \`${HELM_RELEASE}\` / ns \`${HELM_NAMESPACE}\`"
            echo "- **Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${SLACK_WEBHOOK}" ]; then
            payload="$(printf '{"text":"%s %s\n>tag: %s | commit: %s\n>%s"}' \
              "${ICON}" "${TITLE}" "${SHORT_SHA:-unknown}" "${TARGET_SHA}" "${RUN_URL}")"
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "${payload}" "${SLACK_WEBHOOK}" || echo "WARN: Slack notify failed (non-fatal)"
          else
            echo "SLACK_DEPLOY_WEBHOOK not set — skipping Slack notification."
          fi
