# WIF three-paths proof (P0-A2-09) — path 2: GitHub OIDC → GCP Workload Identity
# Federation, impersonation WITHOUT any service-account key.
#
# REJOUABLE : toutes les valeurs propres au projet de test sont des INPUTS
# workflow_dispatch (project_id/number, bucket, SAs, préfixe attendu). Après un
# teardown, repro.sh recrée un projet frais et redéclenche ce workflow avec les
# nouveaux paramètres — aucune valeur codée en dur, aucune clé stockée.
name: wif-proof
# run-name porte le NONCE du dispatch → repro.sh récupère l'identifiant EXACT du run
# déclenché (jamais « le plus récent »), même en cas de runs concurrents.
run-name: wif-proof ${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      nonce:           { description: "Unique dispatch nonce (exact-run tracking)", required: true, type: string }
      project_id:      { description: "GCP project id (test)",          required: true, type: string }
      project_number:  { description: "GCP project number",             required: true, type: string }
      bucket:          { description: "Bucket holding secret.txt",      required: true, type: string }
      authorized_sa:   { description: "SA granted objectViewer",        required: true, type: string }
      wrong_sa:        { description: "SA WITHOUT any grant",           required: true, type: string }
      expect_prefix:   { description: "Expected secret content prefix", required: true, type: string }
permissions:
  contents: read
  id-token: write   # mint a GitHub OIDC token — no stored key anywhere
jobs:
  authorized:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        name: Federate GitHub OIDC -> impersonate AUTHORIZED SA (eager token, no key)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ inputs.project_id }}
          workload_identity_provider: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: ${{ inputs.authorized_sa }}
          token_format: access_token
      - name: Read the secret bucket with the WIF-obtained token (no key) — REQUIRE 200 + content
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          BUCKET: ${{ inputs.bucket }}
          EXPECT: ${{ inputs.expect_prefix }}
        run: |
          set -euo pipefail
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          echo "NONCE=${{ inputs.nonce }}"
          echo "CREDENTIAL_FILE=$GOOGLE_APPLICATION_CREDENTIALS (external_account/federated, NOT a key)"
          grep -q '"type": "external_account"' "$GOOGLE_APPLICATION_CREDENTIALS" && echo "CREDENTIAL_KIND=external_account (federated, keyless)"
          echo "TOKEN_ACQUIRED_VIA=WIF_impersonation length=${#TOKEN}"
          CODE=$(curl -s -o "$body_file" -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
            "https://storage.googleapis.com/storage/v1/b/${BUCKET}/o/secret.txt?alt=media")
          echo "READ_HTTP=$CODE"
          test "$CODE" = "200" || { echo "FAIL: expected HTTP 200, got $CODE"; exit 1; }
          case "$(cat "$body_file")" in
            "$EXPECT"*) echo "CONTENT_OK: secret starts with expected prefix" ;;
            *) echo "FAIL: unexpected content"; exit 1 ;;
          esac
  negative:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        name: NEGATIVE — try to impersonate an UN-GRANTED SA (eager token must be DENIED)
        continue-on-error: true
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ inputs.project_id }}
          workload_identity_provider: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: ${{ inputs.wrong_sa }}
          token_format: access_token
      - name: Report negative outcome
        run: |
          echo "AUTH_STEP_OUTCOME=${{ steps.auth.outcome }}"
          if [ "${{ steps.auth.outcome }}" = "failure" ]; then
            echo "NEGATIVE_OK: impersonation of the un-granted SA was DENIED (no workloadIdentityUser binding)"
          else
            echo "NEGATIVE_UNEXPECTED: auth did not fail"; exit 1
          fi
