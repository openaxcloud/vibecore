name: Desktop Electron

on:
  pull_request:
    paths:
      - electron/**
      - app/**
      - package.json
      - pnpm-lock.yaml
      - electron-builder.yml
      - .github/workflows/electron.yml
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft release with uploaded artifacts
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

concurrency:
  # Les builds bureau sont les plus lourds du dépôt : chaque exécution en lance
  # TROIS (macOS / Windows / Linux), 21 à 40 min chacun. Sans ce groupe, pousser
  # un nouveau commit sur une PR laissait les trois builds du commit précédent
  # aller à leur terme.
  #
  # Mesuré le 2026-09-01 sur les 30 dernières exécutions : 395 minutes de
  # runner sur des commits DÉPASSÉS, dont 261 pour une seule branche — soit,
  # à trois builds par exécution, une vingtaine d'heures de runner.
  #
  # On n'annule que les exécutions de PULL REQUEST. Jamais un push de tag : une
  # exécution annulée n'est pas une exécution verte, et c'est ainsi qu'on
  # refuserait une release sur un résultat qu'on n'a pas laissé finir. Même
  # raisonnement que `ci.yml`, dont c'est l'idiome.
  #
  # Aucune porte n'exige ce workflow : il n'est ni dans
  # `scripts/release-gate/required-checks.json`, ni dans les contrôles requis de
  # la protection de `main` (`Install, test, build, scan`, `Playwright local
  # stack`, `Quality Gates`). L'annuler ne peut donc bloquer aucune livraison.
  group: electron-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.platform }} desktop build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            script: desktop:build:mac
            artifact_glob: dist/*
          - platform: windows
            os: windows-latest
            script: desktop:build:win
            artifact_glob: dist/*
          - platform: linux
            os: ubuntu-latest
            script: desktop:build:linux
            artifact_glob: dist/*

    env:
      NODE_OPTIONS: --max_old_space_size=8192
      CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Electron smoke test
        run: pnpm desktop:test

      - name: Build ${{ matrix.platform }}
        run: pnpm ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibecore-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  draft-release:
    name: Draft desktop release
    needs: desktop
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: VibeCore Desktop ${{ github.ref_name }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
