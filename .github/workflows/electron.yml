name: Desktop Electron

on:
  pull_request:
    paths:
      - electron/**
      - app/**
      - package.json
      - pnpm-lock.yaml
      - electron-builder.yml
      - .github/workflows/electron.yml
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft release with uploaded artifacts
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.platform }} desktop build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            script: desktop:build:mac
            artifact_glob: dist/*
          - platform: windows
            os: windows-latest
            script: desktop:build:win
            artifact_glob: dist/*
          - platform: linux
            os: ubuntu-latest
            script: desktop:build:linux
            artifact_glob: dist/*

    env:
      NODE_OPTIONS: --max_old_space_size=8192

      # Code-signing and notarization material is released to RELEASE builds only
      # (tag push / workflow_dispatch), never to `pull_request`.
      #
      # This workflow triggers on pull_request and previously exported the Apple
      # and Windows signing identities — the private key itself (DESKTOP_CSC_LINK
      # is a base64 .p12), its password, and the Apple app-specific password —
      # into the environment of a job that builds and RUNS PR-authored code
      # (`pnpm install` + `pnpm desktop:test` + electron-builder all execute
      # scripts from the PR). Any of those could read the .p12 out of the
      # environment and exfiltrate it. Unlike e2e.yml, this workflow had no
      # fork guard at all.
      #
      # A PR build does not need to be signed: an unsigned artifact still proves
      # the thing compiles and packages on all three platforms, which is the
      # whole point of the PR check. Signing happens on release.
      CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.DESKTOP_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DESKTOP_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.DESKTOP_APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.DESKTOP_APPLE_TEAM_ID || '' }}
      WIN_CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.DESKTOP_WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DESKTOP_WIN_CSC_KEY_PASSWORD || '' }}

      # Without this, electron-builder falls back to searching the runner's
      # keychain for a signing identity when CSC_LINK is empty, and a macOS PR
      # build fails on a missing identity instead of producing an unsigned app.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ github.event_name != 'pull_request' }}

      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Electron smoke test
        run: pnpm desktop:test

      - name: Build ${{ matrix.platform }}
        run: pnpm ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibecore-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  draft-release:
    name: Draft desktop release
    needs: desktop
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: VibeCore Desktop ${{ github.ref_name }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
