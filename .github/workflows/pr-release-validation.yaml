name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 65
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check wait regression tests
        run: node --test scripts/wait-required-pr-checks.checks.mjs

      - name: Wait for required CI checks
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Do not import enforcement code from the PR checkout into a token-bearing action.
            // Keep this workflow-defined gate self-contained; the token is read-only.
            const REQUIRED_PR_CHECKS = Object.freeze([
              'Install, test, build, scan',
              'CodeQL Analysis (javascript)',
              'CodeQL Analysis (typescript)',
            ]);
            function requiredCheckState(checks) {
              const latest = new Map();
              for (const check of checks) {
                if (!REQUIRED_PR_CHECKS.includes(check.name)) continue;
                if (!latest.has(check.name) || check.id > latest.get(check.name).id) latest.set(check.name, check);
              }
              const failed = [];
              const pending = [];
              for (const name of REQUIRED_PR_CHECKS) {
                const check = latest.get(name);
                if (!check || check.status !== 'completed') pending.push(name);
                else if (check.conclusion !== 'success') failed.push(`${name}: ${check.conclusion ?? 'missing conclusion'}`);
              }
              return { failed, pending };
            }
            async function waitRequiredPrChecks({
              listChecks,
              now = Date.now,
              sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms)),
              report = () => {},
              timeoutMs = 60 * 60 * 1000,
              intervalMs = 30 * 1000,
            }) {
              const deadline = now() + timeoutMs;
              for (;;) {
                const { failed, pending } = requiredCheckState(await listChecks());
                if (failed.length) throw new Error(`Required checks failed: ${failed.join(', ')}`);
                if (!pending.length) return;
                if (now() >= deadline) throw new Error(`Timed out waiting for required checks: ${pending.join(', ')}`);
                report(`Waiting for: ${pending.join(', ')}`);
                await sleep(Math.min(intervalMs, deadline - now()));
              }
            }
            await waitRequiredPrChecks({
              listChecks: () => github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
                per_page: 100,
              }),
              report: core.info,
            });

  validate-release:
    name: Release Validation
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate PR Labels
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'stable-release') }}" == "true" ]]; then
            echo "✓ PR has stable-release label"
            
            # Check version bump labels
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'major') }}" == "true" ]]; then
              echo "✓ Major version bump requested"
            elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'minor') }}" == "true" ]]; then
              echo "✓ Minor version bump requested"
            else
              echo "✓ Patch version bump will be applied"
            fi
          else
            echo "This PR doesn't have the stable-release label. No release will be created." 
          fi

      - name: Check breaking changes
        if: contains(github.event.pull_request.labels.*.name, 'major')
        run: |
          echo "⚠️ This PR contains breaking changes and will trigger a major release."
          
      - name: Validate changelog entry
        if: contains(github.event.pull_request.labels.*.name, 'stable-release')
        run: |
          if ! grep -q "${{ github.event.pull_request.number }}" CHANGES.md; then
            echo "❌ No changelog entry found for PR #${{ github.event.pull_request.number }}"
            echo "Please add an entry to CHANGES.md"
            exit 1
          else
            echo "✓ Changelog entry found"
          fi

  security-review:
    name: Security Review Required
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'security')
    
    steps:
      - name: Check security label
        run: |
          echo "🔒 This PR has security implications and requires additional review"
          echo "Ensure a security team member has approved this PR before merging"
