name: Production CI

on:
  pull_request:
  push:
    branches: [main, stable, product/saas-platform-production]

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    name: Install, test, build, scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vibecore
          POSTGRES_USER: vibecore
          POSTGRES_PASSWORD: vibecore
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibecore -d vibecore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: true
      HUSKY: 0
      DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55432/vibecore
      REDIS_URL: redis://127.0.0.1:56379
      API_HOST: 127.0.0.1
      API_PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma validate and generate
        run: |
          pnpm exec prisma validate --schema packages/database/prisma/schema.prisma
          pnpm --filter @vibecore/database db:generate
          pnpm --filter @vibecore/database db:deploy

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Integration tests
        run: |
          pnpm --filter @vibecore/api test
          pnpm --filter @vibecore/workspace-manager test
          pnpm --filter @vibecore/workspace-agent test
          pnpm --filter @vibecore/ai-gateway test

      - name: Build web
        run: pnpm run build

      - name: Build admin
        run: pnpm --filter @vibecore/admin build

      - name: Build services
        run: pnpm --filter './services/**' build

      - name: Security checks
        run: |
          pnpm run platform:no-mocks
          pnpm run production:validate
          pnpm audit --audit-level high
