name: Production CI

on:
  pull_request:
  push:
    branches: [main, stable, product/saas-platform-production]

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    name: Install, test, build, scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vibecore
          POSTGRES_USER: vibecore
          POSTGRES_PASSWORD: vibecore
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U vibecore -d vibecore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: true
      HUSKY: 0
      DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55432/vibecore
      REDIS_URL: redis://127.0.0.1:56379
      API_HOST: 127.0.0.1
      API_PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma validate and generate
        run: |
          pnpm exec prisma validate --schema packages/database/prisma/schema.prisma
          pnpm --filter @vibecore/database db:generate
          pnpm --filter @vibecore/database db:deploy

      # Le client Prisma est VERSIONNE (packages/database/generated). Ce job le
      # regenere juste au-dessus, donc lint/typecheck/tests y travaillent
      # toujours sur un client a jour — et ne voient jamais une derive.
      #
      # Les autres workflows, eux, ne le regenerent pas : l'audit i18n live et
      # les suites e2e demarrent l'API sur la copie COMMITEE. Un client perime
      # y produit une panne au demarrage ou un 500 a la premiere ecriture, avec
      # un message qui ne parle pas de Prisma. Trois branches du meme lot sont
      # restees bloquees des jours sur exactement ce symptome :
      #
      #   - `Property 'projectCheckpoint' does not exist on type 'PrismaClient'`
      #   - `Property 'dBMigrationExecution' does not exist ...`
      #   - `/auth/register` en 500, parce que SessionScalarFieldEnum ignorait
      #     `lastActiveAt` : chaque test qui commence par s'authentifier tombait.
      #
      # D'ou cette porte : si la regeneration produit autre chose que ce qui est
      # commite, l'artefact versionne est perime et on le dit tout de suite, ici,
      # avec le nom du fichier — plutot que trois workflows plus loin sous la
      # forme d'une panne d'infrastructure apparente.
      - name: Committed Prisma client matches the schema
        run: |
          if git diff --quiet -- packages/database/generated; then
            echo "client Prisma commite : a jour"
            exit 0
          fi

          echo "::error::Le client Prisma commite ne correspond plus au schema. Lancez 'pnpm --filter @vibecore/database db:generate' et committez packages/database/generated."
          git diff --stat -- packages/database/generated
          exit 1

      - name: Lint
        run: pnpm run lint

      - name: I18n catalogs and source regression guard
        run: pnpm run i18n:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Integration tests
        # services/** is excluded from the root `pnpm run test` (see
        # vitest.config.ts) because running a service without its own vitest
        # config makes real network probes block for their full timeouts. Every
        # service with specs is therefore run here with its own config so no
        # coverage is lost.
        run: |
          pnpm --filter @vibecore/api test
          pnpm --filter @vibecore/workspace-manager test
          pnpm --filter @vibecore/workspace-agent test
          pnpm --filter @vibecore/ai-gateway test
          pnpm --filter @vibecore/worker test
          pnpm --filter @vibecore/connector-proxy test
          pnpm --filter @vibecore/preview-proxy test
          pnpm --filter @vibecore/screenshotter test

      - name: Build web
        timeout-minutes: 20
        run: pnpm run build

      - name: Build admin
        timeout-minutes: 10
        run: pnpm --filter @vibecore/admin build

      - name: Build services
        timeout-minutes: 15
        run: pnpm --filter './services/**' build

      - name: Security checks
        run: |
          pnpm run platform:no-mocks
          pnpm run production:validate:self-test
          # Advisory only: `pnpm audit` queries the live advisory DB, so newly
          # published CVEs against already-pinned transitive deps red the whole
          # CI with no code change. The remaining high/critical findings are
          # transitive and need framework-level major bumps (remix >=2.17.5,
          # turbo-stream 3, vitest 3) that can't be force-overridden safely. The
          # dedicated Security Analysis workflow already runs audit with
          # continue-on-error; keep this consistent (run + report, don't gate).
          pnpm audit --audit-level high || echo "::warning::pnpm audit reported vulnerabilities (advisory — see Security Analysis workflow)"
