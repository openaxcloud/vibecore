name: E2E Runtime

on:
  workflow_dispatch:
  schedule:
    # 04:20 UTC daily — after the nightly parity collector, before EU morning.
    - cron: '20 4 * * *'

concurrency:
  group: e2e-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-runtime:
    name: Playwright @runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CI: true
      HUSKY: 0
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      RUNTIME_MODE: remote-kubernetes
      VITE_RUNTIME_MODE: remote-kubernetes
      RUNTIME_API_BASE_URL: http://127.0.0.1:3001/api/runtime
      VITE_RUNTIME_API_BASE_URL: http://127.0.0.1:3001/api/runtime
      API_BASE_URL: http://127.0.0.1:3001
      SAAS_API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          # BUG-CI-008 — `--with-deps` lance un `apt-get update` : quand un
          # miroir amont réécrit son index PENDANT le run, apt rend « Hash Sum
          # mismatch » et la porte E2E meurt AVANT le moindre test. Mesuré le
          # 2026-09-09 (run E2E 1828, sha dcfb310f, 49 s) : `Err:10
          # https://dl.google.com/linux/chrome-stable/deb` — index publié à
          # 09:41, run à 17:16. Rien ne le retentait.
          #
          # Les deux moitiés sont séparées pour ne retenter QUE celle qui dépend
          # d'un miroir extérieur. Purger /var/lib/apt/lists est ce qui répare
          # un Hash Sum mismatch : relancer sans purger réutilise l'index périmé.
          # Aucune sortie d'erreur n'est masquée (règle 13) — c'est la commande
          # dont on lit le résultat.
          for attempt in 1 2 3; do
            if pnpm exec playwright install-deps chromium; then break; fi
            echo "::warning::apt en échec (tentative $attempt/3) — purge de l'index puis reprise."
            if [ "$attempt" = "3" ]; then exit 1; fi
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get update || true
            sleep 10
          done
          pnpm exec playwright install chromium

      - name: Install pinned kind and kubectl clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-runtime-bin"
          cd "$RUNNER_TEMP/private-runtime-bin"
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          curl -fsSLo kind.sha256 https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64.sha256sum
          echo "$(cut -d ' ' -f 1 kind.sha256)  kind" | sha256sum -c -
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod 0755 kind kubectl
          echo "$RUNNER_TEMP/private-runtime-bin" >> "$GITHUB_PATH"
      - name: Validate recipe contracts
        run: |
          pnpm exec vitest run scripts/private-runtime-recipe/checks.test.ts
          pnpm exec tsc -p scripts/private-runtime-recipe/tsconfig.json
      - name: Validate preflight and build web app
        run: |
          pnpm exec vitest run scripts/qa/runtime-e2e-preflight.spec.ts
          pnpm run build
      - name: Provision real workspace and exercise Chromium
        timeout-minutes: 65
        run: pnpm exec tsx scripts/private-runtime-recipe/run.ts --browser
      - name: Remove only the generated local cluster (also on cancellation)
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/vibecore-private-runtime-state.json"; then
            node_modules/.bin/tsx scripts/private-runtime-recipe/run.ts --browser --cleanup
          fi
      - name: Collect bounded diagnostics
        if: always()
        run: node --import tsx scripts/qa/runtime-e2e-diagnostics.ts
      - name: Upload sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-diagnostics-light
          path: |
            runtime-diagnostics/
            private-runtime-evidence/cluster-services.json
            private-runtime-evidence/browser.json
            private-runtime-evidence/readme.json
            private-runtime-evidence/result.json
            private-runtime-evidence/pod-status.json
          retention-days: 7
