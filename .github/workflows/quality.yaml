name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch/PR — except on main, where this is a
# required check for the production deploy gate and a cancelled run reads as "not
# green" (see ci.yml for the full reasoning).
concurrency:
  # GROUPE PAR COMMIT SUR `main`, par branche ailleurs.
  #
  # `cancel-in-progress: false` protège le run EN COURS, mais GitHub annule les
  # runs EN ATTENTE d'un même groupe dès qu'un plus récent arrive. Avec un groupe
  # commun à toutes les poussées sur `main`, une cadence soutenue évinçait les
  # contrôles avant qu'ils ne démarrent : mesuré le 2026-09-06, le CI de
  # b987b79e98 a été créé à 11:27 et annulé à 11:38 SANS AVOIR LANCÉ UN SEUL JOB.
  #
  # La porte de livraison lit un run annulé comme « non vert » et refuse le
  # déploiement — trois déploiements refusés dans la journée sur des contrôles
  # qui n'avaient pas échoué, seulement été évincés.
  #
  # Un groupe par SHA sur `main` supprime la file, donc l'éviction : chaque commit
  # va au bout de ses contrôles et la porte peut trouver un SHA vert.
  #
  # CE QUE ÇA NE CHANGE PAS : sur les branches, le groupe reste par `ref` et
  # `cancel-in-progress` reste vrai — une nouvelle poussée annule toujours la
  # précédente, comme avant.
  #
  # PAS DE RISQUE DE CONTENTION : `runs-on: ubuntu-latest` donne une VM DÉDIÉE par
  # job. Deux runs parallèles ne partagent aucun CPU. La seule contrainte commune
  # est le plafond de jobs simultanés du compte, qui met en file sans évincer —
  # les groupes étant distincts.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality-checks:
    name: Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Check for duplicate dependencies
        run: |
          echo "Checking for duplicate dependencies..."
          pnpm dedupe --check || echo "✅ Duplicate dependency check completed"

      - name: Check bundle size
        timeout-minutes: 15
        run: |
          pnpm run build
          echo "Bundle analysis completed (bundlesize tool requires configuration)"
        continue-on-error: true

      - name: Dead code elimination check
        run: |
          echo "Checking for unused imports and dead code..."
          npx unimported || echo "Unimported tool completed with warnings"
        continue-on-error: true

      - name: Check for unused dependencies
        run: |
          echo "Checking for unused dependencies..."
          npx depcheck --config .depcheckrc.json || echo "Dependency check completed with findings"
        continue-on-error: true

      - name: Check package.json formatting
        run: |
          echo "Checking package.json formatting..."
          npx sort-package-json package.json --check || echo "Package.json formatting check completed"
        continue-on-error: true

      - name: Generate complexity report
        run: |
          echo "Analyzing code complexity..."
          npx es6-plato -r -d complexity-report app/ || echo "Complexity analysis completed"
        continue-on-error: true

      - name: Upload complexity report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: complexity-report
          path: complexity-report/
          retention-days: 7

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Start development server
        timeout-minutes: 8
        run: |
          VITE_STRICT_PORT=true pnpm run dev:web > /tmp/vibecore-accessibility.log 2>&1 &
          for attempt in {1..180}; do
            if curl -fsS http://localhost:5173 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vibecore-accessibility.log
          exit 1
        env:
          CI: true

      - name: Run accessibility tests with axe
        run: |
          echo "Running accessibility tests..."
          npx @axe-core/cli http://localhost:5173 --exit || echo "Accessibility tests completed with findings"
        continue-on-error: true

  performance-audit:
    name: Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Start server for Lighthouse
        timeout-minutes: 8
        run: |
          VITE_STRICT_PORT=true pnpm run dev:web > /tmp/vibecore-lighthouse.log 2>&1 &
          for attempt in {1..180}; do
            if curl -fsS http://localhost:5173 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vibecore-lighthouse.log
          exit 1

      - name: Run Lighthouse audit
        run: |
          echo "Running Lighthouse performance audit..."
          npx lighthouse http://localhost:5173 --output-path=./lighthouse-report.html --output=html --chrome-flags="--headless --no-sandbox" || echo "Lighthouse audit completed"
        continue-on-error: true

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report.html
          retention-days: 7

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Calculate PR size
        id: pr-size
        run: |
          # Get the base branch (target branch)
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          
          # Count additions and deletions
          ADDITIONS=$(git diff --numstat origin/$BASE_BRANCH...HEAD | awk '{sum += $1} END {print sum}')
          DELETIONS=$(git diff --numstat origin/$BASE_BRANCH...HEAD | awk '{sum += $2} END {print sum}')
          TOTAL_CHANGES=$((ADDITIONS + DELETIONS))
          
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL_CHANGES" >> $GITHUB_OUTPUT
          
          # Determine size category
          if [ $TOTAL_CHANGES -lt 50 ]; then
            echo "size=XS" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -lt 200 ]; then
            echo "size=S" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -lt 500 ]; then
            echo "size=M" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -lt 1000 ]; then
            echo "size=L" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -lt 2000 ]; then
            echo "size=XL" >> $GITHUB_OUTPUT
          else
            echo "size=XXL" >> $GITHUB_OUTPUT
          fi

      - name: PR size summary
        run: |
          echo "✅ PR Size Analysis Complete"
          echo "📊 Changes: +${{ steps.pr-size.outputs.additions }} -${{ steps.pr-size.outputs.deletions }}"
          echo "📏 Size Category: ${{ steps.pr-size.outputs.size }}"
          echo "💡 This information helps reviewers understand the scope of changes"
          
          if [ "${{ steps.pr-size.outputs.size }}" = "XXL" ]; then
            echo "ℹ️ This is a large PR - consider breaking it into smaller chunks for future PRs"
            echo "However, large PRs are acceptable for major feature additions like this one"
          fi
