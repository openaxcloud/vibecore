name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*', 'v*']

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.platform }} signed desktop artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            script: desktop:build:mac
          - platform: windows
            os: windows-latest
            script: desktop:build:win
          - platform: linux
            os: ubuntu-latest
            script: desktop:build:linux

    env:
      CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.14.4
          run_install: false

      - name: Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Desktop smoke test
        run: pnpm desktop:test

      - name: Build desktop artifact
        run: pnpm ${{ matrix.script }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibecore-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft desktop release
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
