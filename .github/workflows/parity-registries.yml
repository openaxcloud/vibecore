name: Parity registries

# P0-02: the registry validator FAILS the build when any docs/parity/ registry
# violates its schema. P0-04: the baseline collector runs DAILY (the Replit
# changelog publishes on arbitrary weekdays — llms.txt lists Sunday 2025-11-16
# and Wednesday 2025-11-26 — so Friday-keyed automation is forbidden) and
# commits the day's snapshot with its SHA-256 hashes.

on:
  pull_request:
    paths:
      - 'docs/parity/**'
      - 'scripts/parity/**'
      # P0-LS-03 : l'index de hash + le vérificateur du paquet livescan vivent
      # ici — les inclure garantit que toute altération de l'index redéclenche
      # le job de vérification (le scan lui-même est déjà sous docs/parity/**).
      - 'docs/deploy-evidence/2026-07-22-livescan-hashes/**'
      - '.github/workflows/parity-registries.yml'
  push:
    # LS-16 (verdict -03) : le job d'attestation doit partir À CHAQUE push sur
    # main — le filtre paths excluait les push code-only. Retiré.
    branches: [main]
  schedule:
    # DAILY at 05:17 UTC — deliberately not Friday-anything.
    - cron: '17 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  # LS-16 (verdict -04) : verify-attestation-run.mjs appelle « Get a workflow
  # run » — sans actions:read, l'API répond « Resource not accessible by
  # integration » et le contrôle est cassable.
  actions: read

concurrency:
  group: parity-registries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate registries (fails on schema violation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 : la garde anti-fictif (LS-16) vérifie que les commits de
      # l'attestation existent dans l'HISTORIQUE — impossible en clone shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate daily collector workflow contract and mutation guards
        run: |
          node scripts/parity/validate-collector-workflow.mjs
          node --test scripts/parity/collector-ci.node-test.mjs
      # The validator's only dependency is `yaml`. A plain `npm install` at the
      # repo root fails on pnpm `workspace:` protocols, so it goes into an
      # isolated dir handed to the script via PARITY_DEPS.
      - run: mkdir -p /tmp/parity-deps && cd /tmp/parity-deps && npm init -y >/dev/null && npm install yaml@2 >/dev/null
      # P0-EX-10: the CI GENERATES every computed view for real (not just
      # --check), then fails on ANY drift vs the committed tree — a hand-edited
      # or stale view cannot survive this step.
      - name: Generate all computed views
        run: |
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-approval-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-parity-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-implementation-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-counter-reconciliation.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-document-manifest.mjs
      - name: Fail on drift (generated ≠ committed)
        run: git diff --exit-code docs/parity
      # Full registry validation (cross-refs, freshness SLA, no CLOSED-without-review,
      # no surface DONE without evidence, computed-view drift).
      - run: PARITY_DEPS=/tmp/parity-deps node scripts/parity/validate-registries.mjs
      # P0-LS-03 (verdict RR-20260722-CODEX-06) : la commande annoncée du point
      # DOIT être rejouée dans un job CI officiel. Ce step recalcule le sha256 de
      # TOUS les fichiers du paquet livescan (dont les 21 *.links.txt) et ÉCHOUE
      # (exit 1) sur toute dérive de hash ou couverture incomplète. Aucune
      # dépendance externe (node built-ins) → pas de PARITY_DEPS requis.
      - name: Verify livescan hash coverage (P0-LS-03 — fails on hash drift)
        run: node docs/deploy-evidence/2026-07-22-livescan-hashes/verify-livescan-hashes.mjs --check
      # LS-16 (verdict -03) : AUTHENTIFIER l'attestation contre l'API GitHub —
      # runId/commit/date/conclusion doivent correspondre à une VRAIE exécution.
      - name: Authenticate attestation run against GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PARITY_DEPS=/tmp/parity-deps node scripts/parity/verify-attestation-run.mjs
      # LS-16 (verdict -04) : test négatif de SUBSTITUTION — un run vert réel
      # d'un AUTRE workflow, présenté comme attestation, doit être REJETÉ
      # (identité workflow + événement vérifiés). Échec du test = build rouge.
      - name: Negative test — foreign-run substitution must be rejected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PARITY_DEPS=/tmp/parity-deps node scripts/parity/verify-attestation-substitution-test.mjs
      # P0-EX-10: PUBLISH the generated status set as a build artifact.
      - name: Publish generated status views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-status-generated
          path: |
            docs/parity/APPROVAL_STATUS.json
            docs/parity/PARITY_STATUS.md
            docs/parity/IMPLEMENTATION_STATUS.yaml
            docs/parity/DOCUMENT_MANIFEST.yaml
            docs/parity/CI_ATTESTATION.yaml

  roll-attestation:
    # LS-16 : l'attestation est roulée AUTOMATIQUEMENT après chaque merge sur
    # main — plus un commit manuel. Le job écrit SON PROPRE run id + commit +
    # timestamp réels, régénère toutes les vues et pousse. Les pushes faits
    # avec GITHUB_TOKEN ne redéclenchent pas les workflows → pas de boucle.
    name: Roll CI attestation (post-merge, automatique)
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p /tmp/parity-deps && cd /tmp/parity-deps && npm init -y >/dev/null && npm install yaml@2 >/dev/null
      - name: Roll attestation with THIS run's real identifiers
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$GITHUB_RUN_ID" "$GITHUB_SHA" "$NOW" <<'EOF'
          import sys, re
          run_id, sha, now = sys.argv[1], sys.argv[2], sys.argv[3]
          p = 'docs/parity/CI_ATTESTATION.yaml'
          t = open(p).read()
          t = re.sub(r'repoCommit: \w+', f'repoCommit: {sha[:8]}', t, count=1)
          t = re.sub(r'runId: \d+', f'runId: {run_id}', t)
          t = re.sub(r'runs/\d+', f'runs/{run_id}', t)
          t = re.sub(r'runCommit: "[0-9a-f]+"', f'runCommit: "{sha}"', t)
          t = re.sub(r'mergedCommit: "[0-9a-f]+"', f'mergedCommit: "{sha}"', t)
          t = re.sub(r'  repoCommit: "[0-9a-f]+"', f'  repoCommit: "{sha}"', t)  # commit dépôt déclaré = head_sha (verdict -06)
          t = re.sub(r'mergedToMainAt: "[^"]+"', f'mergedToMainAt: "{now}"', t)
          t = re.sub(r'runDate: "[^"]+"', f'runDate: "{now}"', t)
          open(p, 'w').write(t)
          EOF
      - name: Regenerate every computed view
        run: |
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-approval-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-parity-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-implementation-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-counter-reconciliation.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-document-manifest.mjs
      - run: PARITY_DEPS=/tmp/parity-deps node scripts/parity/validate-registries.mjs
      - name: Commit the rolled attestation
        run: |
          git config user.name "parity-attestation-bot"
          git config user.email "noreply@e-code.ai"
          git add docs/parity
          if git diff --cached --quiet; then
            echo "attestation already current"
          else
            git commit -m "chore(parity): attestation roulée automatiquement (run ${GITHUB_RUN_ID} @ ${GITHUB_SHA:0:8}) — LS-16"
            git push origin HEAD:main
          fi

  collect-baseline:
    name: Daily baseline snapshot (schedule only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/parity/collector-runtime/package-lock.json
      - name: Restore pinned Chromium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: parity-collector-chromium-${{ runner.os }}-${{ hashFiles('scripts/parity/collector-runtime/package-lock.json') }}
      - name: Install isolated collector dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/parity-collector-diagnostics
          timeout 2m npm ci --prefix scripts/parity/collector-runtime --ignore-scripts --no-audit --no-fund 2>&1 \
            | tee /tmp/parity-collector-diagnostics/npm-ci.log
      - name: Install pinned Chromium and system dependencies
        shell: bash
        run: |
          set -o pipefail
          scripts/parity/collector-runtime/node_modules/.bin/playwright --version \
            | tee /tmp/parity-collector-diagnostics/playwright-version.log
          timeout 8m scripts/parity/collector-runtime/node_modules/.bin/playwright install --with-deps chromium 2>&1 \
            | tee /tmp/parity-collector-diagnostics/chromium-install.log
          find ~/.cache/ms-playwright -maxdepth 2 -type f -print \
            | sort > /tmp/parity-collector-diagnostics/browser-cache-files.log
      - name: Collect rendered daily baseline
        id: collect
        shell: bash
        env:
          PARITY_PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/parity/collector-runtime/node_modules/playwright/index.js
        run: |
          set -o pipefail
          DAY=$(date -u +%F)
          SNAPSHOT_DIR="docs/parity/baseline/snapshots/${DAY}"
          echo "day=${DAY}" >> "$GITHUB_OUTPUT"
          echo "snapshot_dir=${SNAPSHOT_DIR}" >> "$GITHUB_OUTPUT"
          timeout 10m node scripts/parity/collect-baseline.mjs 2>&1 | tee /tmp/collect.log
      - name: Require real pricing, gallery and community renders
        shell: bash
        run: timeout 1m node scripts/parity/assert-rendered-baseline.mjs --manifest "${{ steps.collect.outputs.snapshot_dir }}/manifest.json"
      - name: Validate registries with isolated dependencies
        run: PARITY_DEPS="${{ github.workspace }}/scripts/parity/collector-runtime" node scripts/parity/validate-registries.mjs
      - name: Preserve collector artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-baseline-collector-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/collect.log
            /tmp/parity-collector-diagnostics
            ${{ steps.collect.outputs.snapshot_dir }}/manifest.json
            ${{ steps.collect.outputs.snapshot_dir }}/pricing.rendered.html
            ${{ steps.collect.outputs.snapshot_dir }}/gallery.rendered.html
            ${{ steps.collect.outputs.snapshot_dir }}/community.rendered.html
      - name: Commit the day's snapshot
        run: |
          git config user.name "parity-baseline-bot"
          git config user.email "noreply@e-code.ai"
          git add docs/parity/baseline/snapshots
          if git diff --cached --quiet; then
            echo "no snapshot change to commit"
          else
            git commit -m "chore(parity): baseline snapshot ${{ steps.collect.outputs.day }} (P0-04 daily collector)" \
                       -m "$(tail -20 /tmp/collect.log)"
            git push origin HEAD:main
          fi
