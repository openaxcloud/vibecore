name: Parity registries

# P0-02: the registry validator FAILS the build when any docs/parity/ registry
# violates its schema. P0-04: the baseline collector runs DAILY (the Replit
# changelog publishes on arbitrary weekdays — llms.txt lists Sunday 2025-11-16
# and Wednesday 2025-11-26 — so Friday-keyed automation is forbidden) and
# commits the day's snapshot with its SHA-256 hashes.

on:
  pull_request:
    paths:
      - 'docs/parity/**'
      - 'scripts/parity/**'
      # P0-LS-03 : l'index de hash + le vérificateur du paquet livescan vivent
      # ici — les inclure garantit que toute altération de l'index redéclenche
      # le job de vérification (le scan lui-même est déjà sous docs/parity/**).
      - 'docs/deploy-evidence/2026-07-22-livescan-hashes/**'
      - '.github/workflows/parity-registries.yml'
  push:
    # LS-16 (verdict -03) : le job d'attestation doit partir À CHAQUE push sur
    # main — le filtre paths excluait les push code-only. Retiré.
    branches: [main]
  schedule:
    # DAILY at 05:17 UTC — deliberately not Friday-anything.
    - cron: '17 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  # ATTESTATION-PR-001 — créer la PR d'attestation et activer sa fusion
  # automatique. La protection de `main` reste intacte : c'est elle qui décide
  # quand la fusion peut avoir lieu.
  pull-requests: write
  # ATTESTATION-CHECKS-001 — `actions: write` pour DEMANDER les contrôles requis
  # sur le commit qu'on vient de pousser. En lecture seule, on saurait constater
  # qu'il n'en a aucun sans pouvoir y remédier.
  actions: write
  # LS-16 (verdict -04) : verify-attestation-run.mjs appelle « Get a workflow
  # run » — sans actions:read, l'API répond « Resource not accessible by
  # integration » et le contrôle est cassable.

concurrency:
  group: parity-registries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate registries (fails on schema violation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 : la garde anti-fictif (LS-16) vérifie que les commits de
      # l'attestation existent dans l'HISTORIQUE — impossible en clone shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The validator's only dependency is `yaml`. A plain `npm install` at the
      # repo root fails on pnpm `workspace:` protocols, so it goes into an
      # isolated dir handed to the script via PARITY_DEPS.
      - run: mkdir -p /tmp/parity-deps && cd /tmp/parity-deps && npm init -y >/dev/null && npm install yaml@2 >/dev/null
      # P0-EX-10: the CI GENERATES every computed view for real (not just
      # --check), then fails on ANY drift vs the committed tree — a hand-edited
      # or stale view cannot survive this step.
      - name: Generate all computed views
        run: |
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-approval-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-parity-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-implementation-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-counter-reconciliation.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-document-manifest.mjs
      - name: Fail on drift (generated ≠ committed)
        run: |
          set -euo pipefail
          # Les champs de PROVENANCE du manifeste (generatedAt,
          # generatedFromCommit, mergedCommit, validation.*) sont dérivés de
          # CI_ATTESTATION.yaml, qui est roulée à CHAQUE merge sur main. Les
          # inclure dans le drift-check couple le contenu versionné des branches
          # à l'état courant de main : dès qu'une PR est mergée, TOUTES les
          # autres PR ouvertes voient ce job passer au rouge, sans qu'aucune
          # d'elles n'ait touché à docs/parity. Le seul remède était alors de
          # régénérer le fichier sur chaque branche, à chaque merge — une taxe
          # permanente, et un rouge dont la cause est invisible depuis la PR.
          #
          # Ce qui doit être vérifié est la partie SÉMANTIQUE : la liste des
          # documents, leurs sha256, leurs schemaVersion et reviewer. Un
          # document ajouté, retiré ou modifié sans régénération fait toujours
          # échouer ce job — c'est l'invariant que le drift-check protège.
          git diff --exit-code \
            -I'^generatedAt:' \
            -I'^generatedFromCommit:' \
            -I'^mergedCommit:' \
            -I'^  runId:' \
            -I'^  runDate:' \
            -I'^  runCommit:' \
            -- docs/parity
      # Full registry validation (cross-refs, freshness SLA, no CLOSED-without-review,
      # no surface DONE without evidence, computed-view drift).
      - run: PARITY_DEPS=/tmp/parity-deps node scripts/parity/validate-registries.mjs
      # P0-LS-03 (verdict RR-20260722-CODEX-06) : la commande annoncée du point
      # DOIT être rejouée dans un job CI officiel. Ce step recalcule le sha256 de
      # TOUS les fichiers du paquet livescan (dont les 21 *.links.txt) et ÉCHOUE
      # (exit 1) sur toute dérive de hash ou couverture incomplète. Aucune
      # dépendance externe (node built-ins) → pas de PARITY_DEPS requis.
      - name: Verify livescan hash coverage (P0-LS-03 — fails on hash drift)
        run: node docs/deploy-evidence/2026-07-22-livescan-hashes/verify-livescan-hashes.mjs --check
      # LS-16 (verdict -03) : AUTHENTIFIER l'attestation contre l'API GitHub —
      # runId/commit/date/conclusion doivent correspondre à une VRAIE exécution.
      - name: Authenticate attestation run against GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PARITY_DEPS=/tmp/parity-deps node scripts/parity/verify-attestation-run.mjs
      # LS-16 (verdict -04) : test négatif de SUBSTITUTION — un run vert réel
      # d'un AUTRE workflow, présenté comme attestation, doit être REJETÉ
      # (identité workflow + événement vérifiés). Échec du test = build rouge.
      - name: Negative test — foreign-run substitution must be rejected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PARITY_DEPS=/tmp/parity-deps node scripts/parity/verify-attestation-substitution-test.mjs
      # P0-EX-10: PUBLISH the generated status set as a build artifact.
      - name: Publish generated status views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-status-generated
          path: |
            docs/parity/APPROVAL_STATUS.json
            docs/parity/PARITY_STATUS.md
            docs/parity/IMPLEMENTATION_STATUS.yaml
            docs/parity/DOCUMENT_MANIFEST.yaml
            docs/parity/CI_ATTESTATION.yaml

  roll-attestation:
    # LS-16 : l'attestation est roulée AUTOMATIQUEMENT après chaque merge sur
    # main — plus un commit manuel. Le job écrit SON PROPRE run id + commit +
    # timestamp réels, régénère toutes les vues et pousse. Les pushes faits
    # avec GITHUB_TOKEN ne redéclenchent pas les workflows → pas de boucle.
    name: Roll CI attestation (post-merge, automatique)
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p /tmp/parity-deps && cd /tmp/parity-deps && npm init -y >/dev/null && npm install yaml@2 >/dev/null
      - name: Roll attestation with THIS run's real identifiers
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$GITHUB_RUN_ID" "$GITHUB_SHA" "$NOW" <<'EOF'
          import sys, re
          run_id, sha, now = sys.argv[1], sys.argv[2], sys.argv[3]
          p = 'docs/parity/CI_ATTESTATION.yaml'
          t = open(p).read()
          t = re.sub(r'repoCommit: \w+', f'repoCommit: {sha[:8]}', t, count=1)
          t = re.sub(r'runId: \d+', f'runId: {run_id}', t)
          t = re.sub(r'runs/\d+', f'runs/{run_id}', t)
          t = re.sub(r'runCommit: "[0-9a-f]+"', f'runCommit: "{sha}"', t)
          t = re.sub(r'mergedCommit: "[0-9a-f]+"', f'mergedCommit: "{sha}"', t)
          t = re.sub(r'  repoCommit: "[0-9a-f]+"', f'  repoCommit: "{sha}"', t)  # commit dépôt déclaré = head_sha (verdict -06)
          t = re.sub(r'mergedToMainAt: "[^"]+"', f'mergedToMainAt: "{now}"', t)
          t = re.sub(r'runDate: "[^"]+"', f'runDate: "{now}"', t)
          open(p, 'w').write(t)
          EOF
      - name: Regenerate every computed view
        run: |
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-approval-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-parity-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-implementation-status.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-counter-reconciliation.mjs
          PARITY_DEPS=/tmp/parity-deps node scripts/parity/generate-document-manifest.mjs
      - run: PARITY_DEPS=/tmp/parity-deps node scripts/parity/validate-registries.mjs
      - name: Commit the rolled attestation
        id: attest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "parity-attestation-bot"
          git config user.email "noreply@e-code.ai"
          git add docs/parity

          if git diff --cached --quiet; then
            echo "attestation already current"
            exit 0
          fi

          #
          # ATTESTATION-PR-001 — l'attestation passe par une PR, jamais par un
          # push direct sur `main`.
          #
          # Mesuré le 2026-09-01 (run 33477515318) : `git push origin HEAD:main`
          # est refusé par la protection de branche —
          #   remote: error: GH006: Protected branch update failed
          #   remote: - 3 of 3 required status checks are expected
          # L'attestation n'était donc plus roulée du tout. Impasse par
          # construction : un push DIRECT ne peut par définition pas porter les
          # contrôles requis, puisqu'ils s'exécutent après.
          #
          # On n'assouplit PAS la protection. On emprunte le chemin qu'elle
          # autorise : une branche, une PR, les contrôles demandés sur SA tête,
          # et une fusion automatique qui n'aboutit que lorsqu'ils sont verts.
          #
          BRANCHE="chore/attestation-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCHE"
          git commit -m "chore(parity): attestation roulée automatiquement (run ${GITHUB_RUN_ID} @ ${GITHUB_SHA:0:8}) — LS-16"
          git push origin "$BRANCHE"

          gh pr create --base main --head "$BRANCHE" \
            --title "chore(parity): attestation roulée automatiquement (run ${GITHUB_RUN_ID})" \
            --body "Attestation roulée par le workflow \`parity-registries\` pour le run ${GITHUB_RUN_ID} (\`${GITHUB_SHA:0:8}\`).

          Passe par une PR et non par un push direct : la protection de \`main\` exige 3 contrôles, qu'un push direct ne peut pas porter. La fusion est automatique et n'aboutira qu'une fois ces contrôles verts."

          # `--auto` : GitHub fusionne SEULEMENT quand les contrôles requis sont
          # verts. Si l'appel échoue (auto-merge désactivé sur le dépôt), on
          # laisse la PR ouverte plutôt que d'échouer le run — l'attestation est
          # sauvegardée sur sa branche et reste fusionnable à la main.
          if ! gh pr merge "$BRANCHE" --auto --squash --delete-branch; then
            echo "::warning::fusion automatique indisponible — PR laissée ouverte pour fusion manuelle"
          fi

          echo "branche=$BRANCHE" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Déclencher les contrôles requis sur le commit d'attestation
        # ATTESTATION-CHECKS-001 — un commit sans contrôle est un commit
        # indéployable.
        #
        # Les pushes faits avec `GITHUB_TOKEN` ne redéclenchent aucun workflow.
        # C'est voulu : sans cela, ce workflow se relancerait sur son propre
        # commit, indéfiniment. Mais la porte de déploiement exige des contrôles
        # VERTS POUR CE COMMIT EXACT — un commit d'attestation en tête de `main`
        # bloquait donc tout déploiement automatique.
        #
        # On ne l'exempte pas et on ne fait pas remonter la porte à un autre
        # commit : les deux seraient des assouplissements déguisés. On DEMANDE
        # les contrôles, explicitement, sur le SHA qu'on vient de créer.
        #
        # Pas de boucle : on dispatche les workflows REQUIS, jamais celui-ci.
        if: steps.attest.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCHE="${{ steps.attest.outputs.branche }}"
          SHA="$(git rev-parse HEAD)"
          echo "contrôles demandés pour ${SHA} sur ${BRANCHE}"

          # `--ref` prend une BRANCHE, pas un SHA : le dispatch part donc de la
          # tête de `main`. C'est correct ici — le commit qu'on vient de pousser
          # EST cette tête — et on le journalise pour que ce ne soit pas une
          # supposition silencieuse si un autre push survenait entre-temps.
          HEAD_MAIN="$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
          if [ "${HEAD_MAIN}" != "${SHA}" ]; then
            echo "::warning::main a avancé (${HEAD_MAIN}) depuis notre commit ${SHA} — les contrôles porteront sur la tête courante"
          fi

          for wf in ci.yml e2e.yml; do
            if gh workflow run "${wf}" --ref "${BRANCHE}"; then
              echo "dispatché: ${wf} sur ${BRANCHE}"
            else
              echo "::error::impossible de dispatcher ${wf} — la PR d'attestation resterait sans contrôle"
              exit 1
            fi
          done

  collect-baseline:
    name: Daily baseline snapshot (schedule only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/parity/collect-baseline.mjs | tee /tmp/collect.log
      - run: mkdir -p /tmp/parity-deps && cd /tmp/parity-deps && npm init -y >/dev/null && npm install yaml@2 >/dev/null
      - run: PARITY_DEPS=/tmp/parity-deps node scripts/parity/validate-registries.mjs
      - name: Commit the day's snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "parity-baseline-bot"
          git config user.email "noreply@e-code.ai"
          git add docs/parity/baseline/snapshots

          if git diff --cached --quiet; then
            echo "no snapshot change to commit"
            exit 0
          fi

          # ATTESTATION-PR-001 (même défaut que le job d'attestation, second
          # site) : la protection de `main` refuse tout push direct. Ce relevé
          # quotidien emprunte donc lui aussi le chemin PR + fusion automatique.
          DAY=$(date -u +%F)
          BRANCHE="chore/baseline-${DAY}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCHE"
          git commit -m "chore(parity): baseline snapshot ${DAY} (P0-04 daily collector)" \
                     -m "$(tail -20 /tmp/collect.log)"
          git push origin "$BRANCHE"

          gh pr create --base main --head "$BRANCHE" \
            --title "chore(parity): baseline snapshot ${DAY}" \
            --body "Relevé quotidien du collecteur de parité (P0-04) pour ${DAY}.

          Passe par une PR : la protection de \`main\` refuse les pushes directs. La fusion est automatique et subordonnée aux contrôles requis."

          if ! gh pr merge "$BRANCHE" --auto --squash --delete-branch; then
            echo "::warning::fusion automatique indisponible — PR laissée ouverte pour fusion manuelle"
          fi
