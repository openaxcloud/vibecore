# BREAK-GLASS — the only sanctioned way to deploy production without a green
# release gate for the target commit.
#
# It exists because the alternative to a controlled bypass is an uncontrolled one:
# without this, the first real incident where main is red ends with someone running
# `helm upgrade` from a laptop against prod, with no record of what they shipped.
#
# What makes it break-glass rather than a back door:
#
#   * It cannot ship new code. There is no build step and no commit input. It can
#     only re-deploy image digests that a PREVIOUS, fully gated production deploy
#     already recorded in its release manifest — a last-known-good state.
#   * Every digest in that manifest is cosign-verified against the KMS key before
#     anything is applied, so a tampered manifest artifact cannot smuggle in an
#     image that was never signed.
#   * The source run must itself have been a successful `Deploy Production
#     (Continuous)` run on main, i.e. one that passed the exact-SHA gate.
#   * It requires TWO approvals, via the `production-break-glass` environment.
#     Configure it with at least two required reviewers; the job asserts this and
#     fails closed if it cannot prove it.
#   * Every use writes a loud job summary and Slack message naming the operator,
#     the reason, and the manifest being restored.
#
# Setup required before first use (needs repo admin — see docs/DEPLOY_RUNBOOK.md):
#   Settings > Environments > production-break-glass
#     - Required reviewers: at least TWO people, not the same person twice
#     - Deployment branches: main only

name: Deploy Production (Break-glass)

on:
  workflow_dispatch:
    inputs:
      manifest_run_id:
        description: >-
          Run id of the successful "Deploy Production (Continuous)" run whose
          release manifest should be restored (the last-known-good release).
        required: true
      reason:
        description: Why the normal gated path cannot be used (recorded in the audit trail)
        required: true
      confirm:
        description: Type BREAK-GLASS to confirm you are bypassing the release gate
        required: true

permissions:
  contents: read

concurrency:
  # Shares the group with the continuous path: a break-glass restore must never
  # race a normal rollout.
  group: deploy-production-continuous
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPO: vibecore-prod-containers
  FLEET_MEMBERSHIP: vibecore-prod-app
  HELM_RELEASE: vibecore
  HELM_NAMESPACE: vibecore
  # Must match infra/cloudbuild/*.yaml `_KMS_KEYRING` / `_KMS_KEY` — those are what
  # actually SIGN the images. These workflows previously said `vibecore-supply-chain`,
  # a keyring that does not exist in the project (`gcloud kms keyrings list` returns
  # only `ecode-supply-chain`), so `cosign verify` could never have succeeded.
  KMS_KEYRING: ecode-supply-chain
  KMS_KEY_NAME: cosign-images

jobs:
  # Everything that can be checked WITHOUT prod credentials is checked here, so a
  # malformed break-glass request is rejected before it reaches an approver's queue.
  validate-request:
    name: Validate break-glass request (no credentials)
    if: inputs.confirm == 'BREAK-GLASS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assert the source run is a successful, gated production deploy
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.manifest_run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${RUN_ID}" | grep -Eq '^[0-9]{1,20}$'; then
            echo "::error::manifest_run_id must be a numeric run id (got '${RUN_ID}')"
            exit 1
          fi

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          NAME="$(printf '%s' "${RUN_JSON}" | jq -r .name)"
          PATHF="$(printf '%s' "${RUN_JSON}" | jq -r .path)"
          CONCLUSION="$(printf '%s' "${RUN_JSON}" | jq -r .conclusion)"
          BRANCH="$(printf '%s' "${RUN_JSON}" | jq -r .head_branch)"
          SOURCE_SHA="$(printf '%s' "${RUN_JSON}" | jq -r .head_sha)"
          echo "run ${RUN_ID}: ${NAME} (${PATHF}) ${CONCLUSION} on ${BRANCH} @ ${SOURCE_SHA}"

          # Pinned by PATH, not display name — same reasoning as the release gate's
          # policy file: a name is editable, a workflow file path is identity.
          if [ "${PATHF}" != ".github/workflows/deploy-main.yml" ]; then
            echo "::error::run ${RUN_ID} is not a Deploy Production (Continuous) run (path='${PATHF}')"
            exit 1
          fi
          if [ "${CONCLUSION}" != "success" ]; then
            echo "::error::run ${RUN_ID} concluded '${CONCLUSION}' — a last-known-good manifest must come from a SUCCESSFUL deploy"
            exit 1
          fi
          if [ "${BRANCH}" != "main" ]; then
            echo "::error::run ${RUN_ID} ran on '${BRANCH}', not main"
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Download and structurally validate the manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.manifest_run_id }}
        run: |
          set -euo pipefail
          # `mkdir` + `|| true`, deliberately. Verified against the real CLI: when
          # nothing matches the pattern, `gh run download` exits 1 AND does not create
          # the directory. Under `set -e` the step would die on that line printing only
          # "no valid artifacts found to download", and the explicit, actionable message
          # below would never be reached. This path runs during an incident — the
          # operator should get the sentence that says what to do, not gh's.
          mkdir -p /tmp/lkg
          gh run download "${RUN_ID}" -R "${GITHUB_REPOSITORY}" -p 'release-manifest-*' -D /tmp/lkg || true
          MANIFEST="$(find /tmp/lkg -name release-manifest.json | head -n1 || true)"
          if [ -z "${MANIFEST}" ]; then
            echo "::error::run ${RUN_ID} has no release-manifest.json artifact — it predates the manifest, or the deploy never got that far"
            exit 1
          fi
          cp "${MANIFEST}" release-manifest.json
          # Re-run the manifest builder's validation over the downloaded file: an
          # artifact is just a file, and this is the cheapest place to notice that it
          # is missing digests, build ids or signature attestations.
          node --input-type=module -e "
            import { buildManifest } from './scripts/release-gate/release-manifest.mjs';
            import fs from 'node:fs';
            const m = JSON.parse(fs.readFileSync('release-manifest.json', 'utf8'));
            buildManifest(m); // throws on anything unverifiable
            console.log('manifest validates: ' + m.services.length + ' service(s), target ' + m.targetSha);
          "
          jq -r '.services[] | "\(.service)\t\(.digest)"' release-manifest.json

      - name: Upload validated manifest for the deploy job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: break-glass-manifest
          path: release-manifest.json

  # FIRST OF TWO SEQUENTIAL APPROVAL GATES.
  #
  # A GitHub environment with N required reviewers requires ONE of them to approve, not
  # N. Configuring "two reviewers" therefore buys a second NAME, not a second APPROVAL —
  # the previous version asserted the count and believed it had a quorum. Two sequential
  # environments force two separate approval events, and the check in `restore` proves
  # they came from two different people.
  #
  # This job holds no credentials and does nothing: it exists to be approved.
  approval-1:
    name: Approval 1 of 2 (break-glass)
    needs: [validate-request]
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    permissions:
      contents: read
    environment:
      name: production-break-glass-1
    steps:
      - name: Record first approval
        run: echo "first break-glass approval recorded"

  restore:
    name: Restore last-known-good release (approval 2 of 2)
    needs: [validate-request, approval-1]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      # SECOND gate. Together with approval-1 this forces two distinct approval events;
      # the step below proves they came from two distinct people.
      name: production-break-glass-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assert TWO DIFFERENT people approved this break-glass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Counting configured reviewers proves nothing: GitHub requires ONE of them.
          # What is checked here is what actually happened — the approval events on this
          # run — and that they came from two DISTINCT users. Approving both gates
          # yourself is a single-person bypass, and it is the failure mode a "two
          # reviewers" setting invites rather than prevents.
          if ! APPROVALS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" 2>/tmp/appr.err)"; then
            sed -n '1,10p' /tmp/appr.err
            echo "::error::cannot read this run's approvals — refusing to proceed"
            exit 1
          fi
          printf '%s' "${APPROVALS}" | jq -r '.[] | "\(.user.login): \(.state) on \([.environments[].name] | join(", "))"'
          APPROVERS="$(printf '%s' "${APPROVALS}" | jq -r '[.[] | select(.state == "approved") | .user.login] | unique | join(" ")')"
          COUNT="$(printf '%s' "${APPROVERS}" | wc -w | tr -d ' ')"
          echo "distinct approvers: ${COUNT} (${APPROVERS})"
          if [ "${COUNT}" -lt 2 ]; then
            echo "::error::break-glass needs TWO DIFFERENT approvers; got ${COUNT} (${APPROVERS})."
            echo "::error::Both gates were approved by the same person, which is not a quorum."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: break-glass-manifest

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2

      - name: Install cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=2.4.3
          curl -sSfL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          sudo install /tmp/cosign /usr/local/bin/cosign
          cosign version

      # The manifest is an artifact — bytes anyone with write access to a run could
      # in principle influence. What cannot be forged is a cosign signature over the
      # image digest, so THAT is what authorises the restore: every digest named in
      # the manifest must be validly signed by the production KMS key.
      - name: Verify every manifest digest is signed by the production KMS key
        run: |
          set -euo pipefail
          REG="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}"
          KMS_KEY="gcpkms://projects/${GCP_PROJECT_ID}/locations/${GAR_LOCATION}/keyRings/${KMS_KEYRING}/cryptoKeys/${KMS_KEY_NAME}"
          echo "REG=${REG}" >> "$GITHUB_ENV"
          rc=0
          while read -r service image digest; do
            ref="${REG}/${image}@${digest}"
            if cosign verify --key "${KMS_KEY}" "${ref}" >/dev/null 2>&1; then
              echo "signature OK: ${service} ${digest}"
            else
              echo "::error::${service}: ${ref} is not validly signed — refusing the restore"
              rc=1
            fi
          done < <(jq -r '.services[] | "\(.service) \(.image) \(.digest)"' release-manifest.json)
          [ "$rc" -eq 0 ]

      - name: Get cluster credentials via Connect Gateway
        run: |
          set -euo pipefail
          gcloud components install gke-gcloud-auth-plugin --quiet
          gcloud container fleet memberships get-credentials "${FLEET_MEMBERSHIP}" \
            --project="${GCP_PROJECT_ID}"
          kubectl config current-context

      - name: Record current release revision (for rollback)
        run: |
          set -euo pipefail
          helm history "${HELM_RELEASE}" -n "${HELM_NAMESPACE}" || true

      - name: Helm upgrade to the last-known-good digests
        run: |
          set -euo pipefail
          SETS=( --set-string "platformEnv.runtime.serverDeployRollbackFromDigest=1" )
          # Chart services only: a manifest entry like the workspace-agent is not a
          # `services.<key>` in the chart, and setting one would invent a service.
          while read -r service digest; do
            SETS+=( --set-string "services.${service}.imageDigest=${digest}" )
          done < <(jq -r '.services[] | select(.chartService != false) | "\(.service) \(.digest)"' release-manifest.json)
          WSAGENT_DIGEST="$(jq -r '.services[] | select(.service == "workspaceAgent") | .digest' release-manifest.json)"
          if [ -n "${WSAGENT_DIGEST}" ]; then
            SETS+=( --set-string "platformEnv.runtime.workspaceAgentImage=${REG}/workspace-agent@${WSAGENT_DIGEST}" )
          fi
          echo "helm --set args: ${SETS[*]}"
          helm upgrade "${HELM_RELEASE}" infra/helm/platform \
            --namespace "${HELM_NAMESPACE}" \
            --reuse-values \
            --atomic \
            --timeout 10m \
            "${SETS[@]}"

      - name: Verify rollout and imageIDs
        run: |
          set -euo pipefail
          echo '{}' > /tmp/observed.json
          while read -r service image; do
            dep="$(kubectl -n "${HELM_NAMESPACE}" get deploy -l "app.kubernetes.io/name=${image}" -o name 2>/dev/null | head -n1)"
            [ -n "${dep}" ] || dep="deploy/${HELM_RELEASE}-vibecore-platform-${image}"
            kubectl -n "${HELM_NAMESPACE}" rollout status "${dep}" --timeout=5m
            # `-o name` yields `deployment.apps/<name>`; stripping "deploy/" would leave
            # the group prefix and break the ownerReferences match below.
            depname="${dep##*/}"
            # The ACTIVE ReplicaSet is the one at the Deployment's current revision, not
            # the newest one: a restore returns to a pod template Kubernetes has already
            # seen, so it REUSES that older ReplicaSet and the newest one is the one just
            # scaled to zero. Picking by timestamp here would make every break-glass
            # restore report "no running pod" for services that are running fine.
            REV="$(kubectl -n "${HELM_NAMESPACE}" get deploy "${depname}" -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')"
            HASH="$(kubectl -n "${HELM_NAMESPACE}" get rs -o json \
              | jq -r --arg d "${depname}" --arg rev "${REV}" '[ .items[] | select((.metadata.ownerReferences // [])[]?.name == $d) | select(.metadata.annotations["deployment.kubernetes.io/revision"] == $rev) ] | first | .metadata.labels["pod-template-hash"] // ""')"
            IDS="$(kubectl -n "${HELM_NAMESPACE}" get pods \
              -l "app.kubernetes.io/name=${image},pod-template-hash=${HASH}" -o json \
              | jq -c --arg img "${image}" '[ .items[] | select(.metadata.deletionTimestamp == null) | select(.status.phase == "Running") | .status.containerStatuses[]? | select(.name == $img) | .imageID ]')"
            jq --arg s "${service}" --argjson ids "${IDS}" '. + {($s): $ids}' /tmp/observed.json > /tmp/observed.next
            mv /tmp/observed.next /tmp/observed.json
          done < <(jq -r '.services[] | select(.rolled != false) | "\(.service) \(.image)"' release-manifest.json)

          node scripts/release-gate/release-manifest.mjs verify-imageids \
            --manifest release-manifest.json --observed /tmp/observed.json

      - name: Record the break-glass in the audit trail
        if: always()
        env:
          STATUS: ${{ job.status }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          REASON: ${{ inputs.reason }}
          SOURCE_RUN: ${{ inputs.manifest_run_id }}
          SOURCE_SHA: ${{ needs.validate-request.outputs.source_sha }}
        run: |
          set -uo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## ⚠️ BREAK-GLASS production deploy (${STATUS})"
            echo ""
            echo "- **Operator:** @${GITHUB_ACTOR}"
            echo "- **Reason:** ${REASON}"
            echo "- **Restored manifest from run:** ${SOURCE_RUN} (commit \`${SOURCE_SHA}\`)"
            echo "- **Run:** ${RUN_URL}"
            echo ""
            echo "The exact-SHA release gate was BYPASSED. Open a follow-up to get main green."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${SLACK_WEBHOOK}" ]; then
            payload="$(printf '{"text":":rotating_light: BREAK-GLASS prod deploy (%s) by %s\n>reason: %s\n>restored: run %s @ %s\n>%s"}' \
              "${STATUS}" "${GITHUB_ACTOR}" "${REASON}" "${SOURCE_RUN}" "${SOURCE_SHA}" "${RUN_URL}")"
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "${payload}" "${SLACK_WEBHOOK}" || echo "WARN: Slack notify failed (non-fatal)"
          fi
