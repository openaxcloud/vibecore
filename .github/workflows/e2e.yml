name: Production E2E

on:
  pull_request:
  workflow_dispatch:
  push:
    # `main` was missing here, and that was not a cosmetic gap: the production
    # deploy gate requires E2E to be green for the exact commit it deploys, and a
    # required check that never runs is a check that is vacuously satisfied. Every
    # commit merged to main between the creation of this workflow and 2026-08-12
    # reached production without a single E2E run against it.
    branches: [main, stable, product/saas-platform-production]

concurrency:
  # GROUPE PAR COMMIT SUR `main`, par branche ailleurs.
  #
  # `cancel-in-progress: false` protège le run EN COURS, mais GitHub annule les
  # runs EN ATTENTE d'un même groupe dès qu'un plus récent arrive. Avec un groupe
  # commun à toutes les poussées sur `main`, une cadence soutenue évinçait les
  # contrôles avant qu'ils ne démarrent : mesuré le 2026-09-06, le CI de
  # b987b79e98 a été créé à 11:27 et annulé à 11:38 SANS AVOIR LANCÉ UN SEUL JOB.
  #
  # La porte de livraison lit un run annulé comme « non vert » et refuse le
  # déploiement — trois déploiements refusés dans la journée sur des contrôles
  # qui n'avaient pas échoué, seulement été évincés.
  #
  # Un groupe par SHA sur `main` supprime la file, donc l'éviction : chaque commit
  # va au bout de ses contrôles et la porte peut trouver un SHA vert.
  #
  # CE QUE ÇA NE CHANGE PAS : sur les branches, le groupe reste par `ref` et
  # `cancel-in-progress` reste vrai — une nouvelle poussée annule toujours la
  # précédente, comme avant.
  #
  # PAS DE RISQUE DE CONTENTION : `runs-on: ubuntu-latest` donne une VM DÉDIÉE par
  # job. Deux runs parallèles ne partagent aucun CPU. La seule contrainte commune
  # est le plafond de jobs simultanés du compte, qui met en file sans évincer —
  # les groupes étant distincts.
  # Deliberately NOT cancel-in-progress on main. Cancelling an E2E run makes it
  # `cancelled`, which the deploy gate reads as "not green" — so a rapid second
  # push would kill the first commit's E2E and block its (already queued) deploy
  # on a result that was never allowed to finish. On PR branches, cancelling is
  # still the right trade: nothing deploys from there.
  group: production-e2e-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: Playwright local stack
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Forked PRs can't read the AI provider secrets (so the run would hard-fail
    # on the secret-validation step anyway), and same-repo PR branches run
    # arbitrary code with the real prod keys injected. Restrict to non-fork
    # events so external contributors aren't blocked by an unsatisfiable gate
    # and prod keys aren't exposed to untrusted fork code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      CI: true
      HUSKY: 0
      DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55432/vibecore
      REDIS_URL: redis://127.0.0.1:56379
      POSTGRES_PORT: 55432
      REDIS_PORT: 56379
      API_HOST: 127.0.0.1
      API_PORT: 3001
      API_BASE_URL: http://127.0.0.1:3001
      SAAS_API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      # The WORKFLOW owns the servers (prod web below + admin below); without
      # this flag Playwright's webServer would try to boot a dev server on the
      # same port and hard-fail now that reuseExistingServer=false in CI.
      PLAYWRIGHT_SKIP_WEB_SERVER: '1'
      # Local-stack admin used by gallery-remix-license.spec.ts (curation step).
      # ADMIN_MFA_REQUIRED=false is the API's own harness escape hatch — the
      # admin-MFA gate stays ON everywhere else (prod keeps enforcing TOTP).
      PLATFORM_ADMIN_EMAILS: e2e-platform-admin@local.test
      ADMIN_MFA_REQUIRED: 'false'
      # Every test registers a throwaway user, and CI retries multiply that.
      # The default ceiling (10/min/IP) made the limiter the single biggest
      # source of run-to-run instability: whichever tests landed in a saturated
      # window died with `Rate limit exceeded, retry in N seconds`, so a
      # DIFFERENT test failed on every run of identical code. The limiter exists
      # to protect production, not a throwaway CI stack — services/api's own
      # comment says operators may lift it via this variable.
      AUTH_REGISTER_RATE_LIMIT_MAX: '2000'
      AUTH_LOGIN_RATE_LIMIT_MAX: '2000'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate AI provider secret for E2E
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Production E2E requires ANTHROPIC_API_KEY because the default IDE model is Anthropic."
            exit 1
          fi

      - name: Start local dependencies
        run: |
          trap 'docker compose --env-file .env -f docker-compose.dev.yml ps; docker compose --env-file .env -f docker-compose.dev.yml logs --tail=120 postgres redis mailpit' ERR
          touch .env
          docker compose --env-file .env -f docker-compose.dev.yml up -d --wait --wait-timeout 180 postgres redis mailpit
          npx wait-on --timeout 180000 --interval 1000 tcp:127.0.0.1:55432 tcp:127.0.0.1:56379 tcp:127.0.0.1:8025

      - name: Prepare database
        run: |
          pnpm --filter @vibecore/database db:deploy
          pnpm --filter @vibecore/database db:seed

      - name: Start API
        run: |
          pnpm --filter @vibecore/api dev > /tmp/vibecore-api.log 2>&1 &
          echo $! > /tmp/vibecore-api.pid
          npx wait-on --timeout 180000 --interval 1000 http://127.0.0.1:3001/health

      - name: Build web app
        run: pnpm run build

      - name: Start web app
        run: |
          HOST=127.0.0.1 PORT=5173 NODE_ENV=production pnpm run start:node > /tmp/vibecore-web.log 2>&1 &
          echo $! > /tmp/vibecore-web.pid
          npx wait-on --timeout 180000 --interval 1000 http://127.0.0.1:5173

      # PLAYWRIGHT_SKIP_WEB_SERVER means Playwright no longer boots the admin
      # dev server (5174) either — the workflow provides it, like the web app.
      - name: Start admin app
        run: |
          pnpm --filter @vibecore/admin dev > /tmp/vibecore-admin.log 2>&1 &
          echo $! > /tmp/vibecore-admin.pid
          npx wait-on --timeout 180000 --interval 1000 http://127.0.0.1:5174

      # `@runtime` tests need a live workspace pod + dev server + preview iframe,
      # which this stack does not provide (postgres/redis/mailpit + API + web).
      # They run in the separate, non-blocking `E2E Runtime` workflow.
      #
      # The run itself is allowed to exit non-zero; the gate step below is what
      # decides, applying the bounded waiver in tests/e2e/e2e-waivers.json.
      - name: Playwright auth, project, IDE, terminal, billing mock flows
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-results.json \
            pnpm exec playwright test tests/e2e --project=chromium \
              --grep-invert @runtime --reporter=list,json
          echo "playwright exit: $?"

      # Fails on any failure that is NOT waived, on an expired waiver, and on a
      # waived test that has started passing. The policy path is hard-coded in
      # the script, so this cannot be widened from the workflow.
      - name: E2E gate (bounded waiver)
        run: node scripts/e2e-gate.mjs playwright-results.json

      - name: Playwright mobile viewport tests
        run: pnpm exec playwright test tests/e2e/responsive-ide.spec.ts --project=chromium --grep-invert @runtime

      - name: Upload E2E traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-results.json
            test-results
            tmp/ide-panel-audit.json
            /tmp/vibecore-api.log
            /tmp/vibecore-web.log
          if-no-files-found: ignore
