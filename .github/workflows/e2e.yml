name: Production E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      spec:
        description: >-
          Chemin d'un spec à jouer SEUL, pour prouver un correctif précis sans
          attendre la suite entière. Vide = suite complète, comme avant.
        required: false
        type: string
  push:
    # `main` was missing here, and that was not a cosmetic gap: the production
    # deploy gate requires E2E to be green for the exact commit it deploys, and a
    # required check that never runs is a check that is vacuously satisfied. Every
    # commit merged to main between the creation of this workflow and 2026-08-12
    # reached production without a single E2E run against it.
    branches: [main, stable, product/saas-platform-production]

concurrency:
  # GROUPE PAR COMMIT SUR `main`, par branche ailleurs.
  #
  # `cancel-in-progress: false` protège le run EN COURS, mais GitHub annule les
  # runs EN ATTENTE d'un même groupe dès qu'un plus récent arrive. Avec un groupe
  # commun à toutes les poussées sur `main`, une cadence soutenue évinçait les
  # contrôles avant qu'ils ne démarrent : mesuré le 2026-09-06, le CI de
  # b987b79e98 a été créé à 11:27 et annulé à 11:38 SANS AVOIR LANCÉ UN SEUL JOB.
  #
  # La porte de livraison lit un run annulé comme « non vert » et refuse le
  # déploiement — trois déploiements refusés dans la journée sur des contrôles
  # qui n'avaient pas échoué, seulement été évincés.
  #
  # Un groupe par SHA sur `main` supprime la file, donc l'éviction : chaque commit
  # va au bout de ses contrôles et la porte peut trouver un SHA vert.
  #
  # CE QUE ÇA NE CHANGE PAS : sur les branches, le groupe reste par `ref` et
  # `cancel-in-progress` reste vrai — une nouvelle poussée annule toujours la
  # précédente, comme avant.
  #
  # PAS DE RISQUE DE CONTENTION : `runs-on: ubuntu-latest` donne une VM DÉDIÉE par
  # job. Deux runs parallèles ne partagent aucun CPU. La seule contrainte commune
  # est le plafond de jobs simultanés du compte, qui met en file sans évincer —
  # les groupes étant distincts.
  # Deliberately NOT cancel-in-progress on main. Cancelling an E2E run makes it
  # `cancelled`, which the deploy gate reads as "not green" — so a rapid second
  # push would kill the first commit's E2E and block its (already queued) deploy
  # on a result that was never allowed to finish. On PR branches, cancelling is
  # still the right trade: nothing deploys from there.
  group: production-e2e-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    # ⚠️ CE JOB NE PORTE PLUS LE NOM REQUIS. La protection de branche exige
    # « Playwright local stack » ; c'est le job `verdict` en fin de fichier qui
    # le porte désormais. Renommer celui-ci sans renommer celui-là ferait
    # attendre à la protection un contrôle qui n'existe plus — et plus aucune
    # proposition ne pourrait jamais fusionner. Épinglé par
    # tests/guards/e2e-tranches.spec.ts.
    name: E2E tranche ${{ matrix.shard }}/4
    strategy:
      # Une tranche rouge ne doit pas annuler les autres : on veut les quatre
      # rapports, y compris quand l'un d'eux porte l'échec à expliquer.
      fail-fast: false
      matrix:
        # DEUX tranches, pas quatre. Arbitrage du 2026-09-30, chiffres à
        # l'appui : la suite entière prenait 81 min sous un plafond de 90 — neuf
        # minutes de marge, d'où deux exécutions sans le moindre verdict. Quatre
        # tranches ramènent chacune à ~30 min mais QUADRUPLENT les jobs, et la
        # file était le goulot du jour (10 runs en cours, 6 en attente). Deux
        # tranches donnent ~45 min, soit le double de marge sous le plafond,
        # pour deux fois moins de jobs. On rachète la marge sans affamer la file.
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # Plafond par TRANCHE. Une tranche joue un QUART des specs — remis à quatre
    # tranches le 2026-10-01 parce que la suite a dépassé son budget : elle n'a
    # jamais approché ce plafond, il reste large exprès. + 15 min de canari iOS
    # borné ci-dessous. Épinglé par tests/guards/ci-canari-borne.spec.ts.
    timeout-minutes: 90
    # Forked PRs can't read the AI provider secrets (so the run would hard-fail
    # on the secret-validation step anyway), and same-repo PR branches run
    # arbitrary code with the real prod keys injected. Restrict to non-fork
    # events so external contributors aren't blocked by an unsatisfiable gate
    # and prod keys aren't exposed to untrusted fork code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      CI: true
      HUSKY: 0
      DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55432/vibecore
      REDIS_URL: redis://127.0.0.1:56379
      POSTGRES_PORT: 55432
      REDIS_PORT: 56379
      API_HOST: 127.0.0.1
      API_PORT: 3001
      API_BASE_URL: http://127.0.0.1:3001
      SAAS_API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      # The WORKFLOW owns the servers (prod web below + admin below); without
      # this flag Playwright's webServer would try to boot a dev server on the
      # same port and hard-fail now that reuseExistingServer=false in CI.
      PLAYWRIGHT_SKIP_WEB_SERVER: '1'
      # Local-stack admin used by gallery-remix-license.spec.ts (curation step).
      # ADMIN_MFA_REQUIRED=false is the API's own harness escape hatch — the
      # admin-MFA gate stays ON everywhere else (prod keeps enforcing TOTP).
      PLATFORM_ADMIN_EMAILS: e2e-platform-admin@local.test
      ADMIN_MFA_REQUIRED: 'false'
      # Every test registers a throwaway user, and CI retries multiply that.
      # The default ceiling (10/min/IP) made the limiter the single biggest
      # source of run-to-run instability: whichever tests landed in a saturated
      # window died with `Rate limit exceeded, retry in N seconds`, so a
      # DIFFERENT test failed on every run of identical code. The limiter exists
      # to protect production, not a throwaway CI stack — services/api's own
      # comment says operators may lift it via this variable.
      AUTH_REGISTER_RATE_LIMIT_MAX: '2000'
      AUTH_LOGIN_RATE_LIMIT_MAX: '2000'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      # LA PRÉPARATION EST PARTAGÉE, PAS DUPLIQUÉE.
      #
      # Ces 93 lignes vivaient ici. Elles sont maintenant dans
      # .github/actions/preparer-pile-e2e, appelée aussi par le job `canari`
      # ci-dessous. Deux copies auraient divergé au premier changement — c'est
      # ce que disait docs/bugs/DETTE-CI-ACTION-COMPOSITE-001.md, et c'est la
      # raison pour laquelle le canari était resté sur le chemin critique.
      #
      # `chromium` seulement : WebKit ne sert qu'au canari, et l'installer ici
      # remettrait du temps sur le chemin critique de la porte requise.
      # Le dépôt doit être sorti AVANT l'appel d'une action locale, sinon GitHub
      # ne trouve pas son `action.yml`. Voir le commentaire en tête de l'action.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/preparer-pile-e2e
        with:
          navigateurs: chromium

      # `@runtime` tests need a live workspace pod + dev server + preview iframe,
      # which this stack does not provide (postgres/redis/mailpit + API + web).
      # They run in the separate, non-blocking `E2E Runtime` workflow.
      #
      # The run itself is allowed to exit non-zero; the gate step below is what
      # decides, applying the bounded waiver in tests/e2e/e2e-waivers.json.
      - name: Playwright auth, project, IDE, terminal, billing mock flows
        run: |
          set +e

          # Un correctif se prouve par le scénario qui le couvre, pas par
          # quatre-vingt-dix minutes de suite entière. Vide = comportement
          # d'avant, à l'octet près.
          CIBLE="${{ inputs.spec }}"
          if [ -n "$CIBLE" ]; then
            echo "::notice::suite ciblée sur $CIBLE"
          else
            CIBLE="tests/e2e"
          fi

          # Une suite ciblée ne se découpe pas : CHAQUE tranche la joue entière,
          # soit quatre exécutions indépendantes du même spec. La porte le sait
          # (E2E_SPEC) : elle attend ce seul fichier, et un échec dans une tranche
          # n'est jamais effacé par une réussite dans une autre.
          # LE DÉNOMINATEUR EST DÉRIVÉ DE LA MATRICE, PAS RÉÉCRIT.
          #
          # `strategy.job-total` est le nombre de tranches que GitHub a réellement
          # lancées. L'écrire en dur une seconde fois a été un vrai défaut : en
          # portant la découpe de 2 à 4, laisser `/2` ici gardait les 70 gardes au
          # VERT. Un dénominateur trop grand fait qu'une part de la suite n'est
          # jouée par PERSONNE, et la porte voit des rapports pleins sans pouvoir
          # le voir — une couverture amputée qui se présente comme un succès.
          DECOUPE="--shard=${{ matrix.shard }}/${{ strategy.job-total }}"
          if [ -n "${{ inputs.spec }}" ]; then
            DECOUPE=""
          fi

          PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-results.json \
            pnpm exec playwright test "$CIBLE" --project=chromium $DECOUPE \
              --grep-invert @runtime --reporter=list,json
          echo "playwright exit: $?"

      # La porte ne juge PLUS ici : une tranche seule ne voit qu'un quart des
      # specs, et la faire conclure sur ce quart serait exactement
      # l'affaiblissement qu'une découpe introduit sans le dire. Elle juge dans
      # le job `verdict`, sur les quatre rapports réunis.
      - name: Rapport de la tranche
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultats-tranche-${{ matrix.shard }}
          path: playwright-results.json
          if-no-files-found: error
          retention-days: 7

      # Ces deux suites ne se découpent pas — elles tiennent en quelques minutes
      # et se jouent une fois, sur la première tranche.
      - name: Playwright mobile viewport tests
        if: matrix.shard == 1
        run: pnpm exec playwright test tests/e2e/responsive-ide.spec.ts --project=chromium --grep-invert @runtime

      # LE MOTEUR D'AVI. `playwright.config.ts` définit un projet `webkit-iphone`
      # (iPhone 15 Pro) pour les quatre specs dont le sujet EST une interaction
      # tactile — et son commentaire cite le cas mesuré : une barre d'actions
      # révélée par `:focus-within`, vivante sous Chromium, MORTE sous Safari iOS.
      #
      # Ce projet n'était exécuté NULLE PART : chaque invocation de ce dépôt passe
      # `--project=chromium`, et l'audit i18n tourne lui aussi sur Chromium sur
      # ses quatre shards. La garde écrite contre le faux vert Chromium n'avait
      # donc jamais tourné une seule fois.
      #
      # ⚠️ NON BLOQUANT, ET C'EST DÉLIBÉRÉ — pour l'instant. Ce pas n'a jamais été
      # exécuté : son premier passage en CI EST sa vérification. Le rendre
      # bloquant d'emblée, c'est risquer de fermer la porte E2E de tout le monde
      # sur un réglage que personne n'a encore vu tourner. Le résultat est imprimé
      # dans le résumé du run pour qu'un rouge se VOIE au lieu de se taire — un
      # canari qu'on ne regarde pas ne vaut pas mieux que pas de canari.
      #
      # À basculer en bloquant (retirer `continue-on-error` et le `set +e`) après
      # quelques runs stables.
      #
      # BORNÉ : mesuré le 2026-09-28/29, 4 des 12 derniers passages annulés à
      # ~75 min — le canari, sans plafond propre, consommait le budget du job
      # après une suite Chromium de 60 min, et le contrôle REQUIS était annulé
      # alors que la porte ci-dessus avait déjà rendu « gate passes ». Un canari
      # qui dépasse est maintenant marqué en échec, et le job se termine.
      - name: Upload E2E traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-tranche-${{ matrix.shard }}
          path: |
            playwright-report
            playwright-results.json
            test-results
            tmp/ide-panel-audit.json
            /tmp/vibecore-api.log
            /tmp/vibecore-web.log
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # LE VERDICT. Ce job — et lui seul — porte le nom que la protection de branche
  # exige. Le renommer, ou le supprimer, ferait attendre à GitHub un contrôle
  # qui ne se présente jamais : aucune proposition ne pourrait plus fusionner.
  # ═══════════════════════════════════════════════════════════════════════════
  # LE CANARI iOS, SORTI DU CHEMIN CRITIQUE — 15 min 12 s rendues à chaque mise
  # en production.
  #
  # Il est NON BLOQUANT depuis toujours, et il tournait pourtant dans le job qui
  # porte le contrôle requis « Playwright local stack » : le job `verdict` porte
  # `needs: e2e`, donc il attendait le canari. Mesuré le 2026-09-30 sur la
  # tranche 1 de l'E2E de `1fb51f092a` : 15 min 12 s sur une tranche de
  # 57 min 30 s, elle-même sur le chemin de la porte de release.
  #
  # Il est ici un job à lui, qui n'est dans le `needs` de PERSONNE. Son échec ne
  # comptait pas ; sa durée ne compte plus non plus.
  canari-ios:
    name: Canari iOS WebKit (non bloquant)
    # Même garde que le job bloquant : pas de fork, pour les mêmes raisons.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Son propre plafond : il ne peut plus manger le budget de personne, mais un
    # job pendu reste un coureur immobilisé.
    timeout-minutes: 45
    continue-on-error: true
    env:
      CI: true
      HUSKY: 0
      DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55432/vibecore
      REDIS_URL: redis://127.0.0.1:56379
      POSTGRES_PORT: 55432
      REDIS_PORT: 56379
      API_HOST: 127.0.0.1
      API_PORT: 3001
      API_BASE_URL: http://127.0.0.1:3001
      SAAS_API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      # The WORKFLOW owns the servers (prod web below + admin below); without
      # this flag Playwright's webServer would try to boot a dev server on the
      # same port and hard-fail now that reuseExistingServer=false in CI.
      PLAYWRIGHT_SKIP_WEB_SERVER: '1'
      # Local-stack admin used by gallery-remix-license.spec.ts (curation step).
      # ADMIN_MFA_REQUIRED=false is the API's own harness escape hatch — the
      # admin-MFA gate stays ON everywhere else (prod keeps enforcing TOTP).
      PLATFORM_ADMIN_EMAILS: e2e-platform-admin@local.test
      ADMIN_MFA_REQUIRED: 'false'
      # Every test registers a throwaway user, and CI retries multiply that.
      # The default ceiling (10/min/IP) made the limiter the single biggest
      # source of run-to-run instability: whichever tests landed in a saturated
      # window died with `Rate limit exceeded, retry in N seconds`, so a
      # DIFFERENT test failed on every run of identical code. The limiter exists
      # to protect production, not a throwaway CI stack — services/api's own
      # comment says operators may lift it via this variable.
      AUTH_REGISTER_RATE_LIMIT_MAX: '2000'
      AUTH_LOGIN_RATE_LIMIT_MAX: '2000'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      # Le dépôt doit être sorti AVANT l'appel d'une action locale, sinon GitHub
      # ne trouve pas son `action.yml`. Voir le commentaire en tête de l'action.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/preparer-pile-e2e
        with:
          navigateurs: chromium,webkit

      - name: Canari iOS — Playwright WebKit iPhone (non bloquant)
        id: canari_ios
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          pnpm exec playwright test tests/e2e --project=webkit-iphone --reporter=list
          code=$?
          echo "webkit-iphone exit: $code"
          if [ "$code" = "0" ]; then
            echo "✅ Canari iOS (WebKit iPhone) : vert." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Canari iOS (WebKit iPhone) : ROUGE (sortie $code) — non bloquant, mais à regarder." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

  verdict:
    name: Playwright local stack
    needs: e2e
    # `always()` pour que le verdict tombe MÊME si une tranche échoue ou se fait
    # annuler. C'est le cas qui compte : sans lui, une tranche perdue laisserait
    # le contrôle requis sans conclusion, et on retomberait dans le silence que
    # cette découpe existe pour supprimer.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 22

      - name: Rassembler les rapports des tranches
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: resultats-tranche-*
          path: tranches

      - name: Ce qui est réellement arrivé
        run: |
          echo "rapports reçus :"
          find tranches -name 'playwright-results.json' | sort | sed 's/^/  /'
          echo "total : $(find tranches -name 'playwright-results.json' | wc -l)"

      # La porte EXIGE ses quatre rapports. Une tranche manquante la fait
      # rougir : un vert sur trois quarts des specs serait un vert menteur.
      - name: E2E gate (bounded waiver)
        env:
          E2E_EXPECTED_REPORTS: '4'
          E2E_SPEC: ${{ inputs.spec }}
        run: node scripts/e2e-gate.mjs $(find tranches -name 'playwright-results.json' | sort | tr '\n' ' ')
