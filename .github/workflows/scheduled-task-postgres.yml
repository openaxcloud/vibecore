name: Scheduled task PostgreSQL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-task-postgres:
    name: Scheduled task PostgreSQL (7 real scenarios, no skips)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b # pg16 multi-platform index, same as Production CI
        env:
          POSTGRES_DB: panel_proof
          POSTGRES_USER: vibecore
          POSTGRES_PASSWORD: vibecore
        ports: ['55438:5432', '127.0.0.1:55439:5432']
        options: >-
          --health-cmd "pg_isready -U vibecore -d panel_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: true
      DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55438/panel_proof
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Pre-install action identity gate
        run: node scripts/validate-github-actions-pinned.bundle.mjs --allow-temporary-exceptions

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate client and migrate the disposable database
        run: |
          pnpm --filter @vibecore/database db:generate
          git diff --exit-code -- packages/database/generated
          pnpm --filter @vibecore/database db:deploy

      - name: Require all 7 PostgreSQL scenarios and zero skipped tests
        run: sh services/api/scripts/verify-scheduled-task-postgres.sh "$RUNNER_TEMP/scheduled-task-proof"

      - name: Require all 6 explicit-budget PostgreSQL scenarios and zero skips
        run: sh services/api/scripts/verify-explicit-run-postgres.sh "$RUNNER_TEMP/explicit-run-proof"

      - name: Create and migrate the isolated credit-pack database
        env:
          DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55438/credit_pack_proof
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username=vibecore credit_pack_proof
          pnpm --filter @vibecore/database db:deploy

      - name: Require all 10 credit-pack and reservation PostgreSQL scenarios and zero skips
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55438/credit_pack_proof
          CREDIT_PACK_POSTGRES_PROOF: '1'
          NODE_ENV: test
        run: |
          proof_dir="$RUNNER_TEMP/credit-pack-proof"
          mkdir -p "$proof_dir"
          set +e
          node ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts \
            src/credit-pack-postgres.integration.spec.ts src/credit-reservation-postgres.integration.spec.ts --reporter=json \
            --outputFile="$proof_dir/tests.json" > "$proof_dir/tests.log" 2>&1
          test_exit=$?
          set -e
          node --input-type=module - "$proof_dir" "$test_exit" <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const [directory, exitCode] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(`${directory}/tests.json`, 'utf8'));
          const receipt = {
            sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            dirty: execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim() !== '',
            exitCode: Number(exitCode),
            total: report.numTotalTests, passed: report.numPassedTests,
            failed: report.numFailedTests, skipped: report.numPendingTests, todo: report.numTodoTests,
            sourceSha256: createHash('sha256').update(readFileSync('src/credit-pack-postgres.integration.spec.ts')).digest('hex'),
            reservationSourceSha256: createHash('sha256').update(readFileSync('src/credit-reservation-postgres.integration.spec.ts')).digest('hex'),
          };
          writeFileSync(`${directory}/receipt.json`, JSON.stringify(receipt, null, 2) + '\n');
          assert.equal(receipt.sha, process.env.EXPECTED_SHA);
          assert.equal(receipt.dirty, false);
          assert.equal(receipt.exitCode, 0);
          assert.equal(report.success, true);
          assert.equal(receipt.total, 10);
          assert.equal(receipt.passed, 10);
          assert.equal(receipt.failed, 0);
          assert.equal(receipt.skipped, 0);
          assert.equal(receipt.todo, 0);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nCredit-pack/reservation PostgreSQL: 10 passed, 0 skipped, commit ${receipt.sha}.\n`);
          JS

      - name: Create and migrate the isolated database-panel database
        env:
          DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55439/database_audit
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username=vibecore database_audit
          pnpm --filter @vibecore/database db:deploy

      - name: Require all 8 database-panel PostgreSQL scenarios and zero skips
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55439/database_audit
          DATABASE_PANEL_TEST_URL: postgresql://vibecore:vibecore@127.0.0.1:55439/database_audit
          NODE_ENV: test
        run: |
          proof_dir="$RUNNER_TEMP/database-panel-proof"
          mkdir -p "$proof_dir"
          set +e
          node ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts \
            src/tests/database-panel.postgres.spec.ts --reporter=json \
            --outputFile="$proof_dir/tests.json" > "$proof_dir/tests.log" 2>&1
          test_exit=$?
          set -e
          node --input-type=module - "$proof_dir" "$test_exit" <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const [directory, exitCode] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(`${directory}/tests.json`, 'utf8'));
          const receipt = {
            sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            dirty: execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim() !== '',
            exitCode: Number(exitCode),
            total: report.numTotalTests, passed: report.numPassedTests,
            failed: report.numFailedTests, skipped: report.numPendingTests, todo: report.numTodoTests,
            sourceSha256: createHash('sha256').update(readFileSync('src/tests/database-panel.postgres.spec.ts')).digest('hex'),
          };
          writeFileSync(`${directory}/receipt.json`, JSON.stringify(receipt, null, 2) + '\n');
          assert.equal(receipt.sha, process.env.EXPECTED_SHA);
          assert.equal(receipt.dirty, false);
          assert.equal(receipt.exitCode, 0);
          assert.equal(report.success, true);
          assert.equal(receipt.total, 8);
          assert.equal(receipt.passed, 8);
          assert.equal(receipt.failed, 0);
          assert.equal(receipt.skipped, 0);
          assert.equal(receipt.todo, 0);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\ndatabase-panel PostgreSQL: 8 passed, 0 skipped, commit ${receipt.sha}.\n`);
          JS

      - name: Create and migrate the isolated skills database
        env:
          DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55439/skills_proof
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username=vibecore skills_proof
          pnpm --filter @vibecore/database db:deploy

      - name: Require all 4 skills PostgreSQL scenarios and zero skips
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55439/skills_proof
          SKILLS_DATABASE_PROOF: '1'
          NODE_ENV: test
        run: |
          proof_dir="$RUNNER_TEMP/skills-proof"
          mkdir -p "$proof_dir"
          set +e
          node ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts \
            src/tests/skills-persistence.integration.spec.ts --reporter=json \
            --outputFile="$proof_dir/tests.json" > "$proof_dir/tests.log" 2>&1
          test_exit=$?
          set -e
          node --input-type=module - "$proof_dir" "$test_exit" <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const [directory, exitCode] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(`${directory}/tests.json`, 'utf8'));
          const receipt = {
            sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            dirty: execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim() !== '',
            exitCode: Number(exitCode),
            total: report.numTotalTests, passed: report.numPassedTests,
            failed: report.numFailedTests, skipped: report.numPendingTests, todo: report.numTodoTests,
            sourceSha256: createHash('sha256').update(readFileSync('src/tests/skills-persistence.integration.spec.ts')).digest('hex'),
          };
          writeFileSync(`${directory}/receipt.json`, JSON.stringify(receipt, null, 2) + '\n');
          assert.equal(receipt.sha, process.env.EXPECTED_SHA);
          assert.equal(receipt.dirty, false);
          assert.equal(receipt.exitCode, 0);
          assert.equal(report.success, true);
          assert.equal(receipt.total, 4);
          assert.equal(receipt.passed, 4);
          assert.equal(receipt.failed, 0);
          assert.equal(receipt.skipped, 0);
          assert.equal(receipt.todo, 0);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nskills PostgreSQL: 4 passed, 0 skipped, commit ${receipt.sha}.\n`);
          JS

      - name: Create and migrate the isolated terminal-receipt database
        env:
          DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55438/terminal_receipt_proof
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username=vibecore terminal_receipt_proof
          pnpm --filter @vibecore/database db:deploy

      - name: Require all 2 terminal-receipt PostgreSQL scenarios and zero skips
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://vibecore:vibecore@127.0.0.1:55438/terminal_receipt_proof
          TERMINAL_RECEIPT_POSTGRES_PROOF: '1'
          NODE_ENV: test
        run: |
          proof_dir="$RUNNER_TEMP/terminal-receipt-proof"
          mkdir -p "$proof_dir"
          set +e
          node ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts \
            src/transcript-terminal-postgres.integration.spec.ts --reporter=json \
            --outputFile="$proof_dir/tests.json" > "$proof_dir/tests.log" 2>&1
          test_exit=$?
          set -e
          node --input-type=module - "$proof_dir" "$test_exit" <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const [directory, exitCode] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(`${directory}/tests.json`, 'utf8'));
          const receipt = {
            sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            dirty: execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim() !== '',
            exitCode: Number(exitCode),
            total: report.numTotalTests, passed: report.numPassedTests,
            failed: report.numFailedTests, skipped: report.numPendingTests, todo: report.numTodoTests,
            sourceSha256: createHash('sha256').update(readFileSync('src/transcript-terminal-postgres.integration.spec.ts')).digest('hex'),
          };
          writeFileSync(`${directory}/receipt.json`, JSON.stringify(receipt, null, 2) + '\n');
          assert.equal(receipt.sha, process.env.EXPECTED_SHA);
          assert.equal(receipt.dirty, false);
          assert.equal(receipt.exitCode, 0);
          assert.equal(report.success, true);
          assert.equal(receipt.total, 2);
          assert.equal(receipt.passed, 2);
          assert.equal(receipt.failed, 0);
          assert.equal(receipt.skipped, 0);
          assert.equal(receipt.todo, 0);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nTerminal-receipt PostgreSQL: 2 passed, 0 skipped, commit ${receipt.sha}.\n`);
          JS

      - name: Verify the exact tested commit and publish the receipt
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/scheduled-task-proof/receipt.json`, 'utf8'));
          assert.equal(receipt.sha, process.env.EXPECTED_SHA);
          assert.equal(receipt.dirty, false);
          assert.equal(receipt.postgresTests, 7);
          assert.equal(receipt.skipped, 0);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n\`\`\`json\n${JSON.stringify(receipt, null, 2)}\n\`\`\`\n`);
          JS

      - name: Preserve test evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-task-postgres-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/scheduled-task-proof/tests.log
            ${{ runner.temp }}/scheduled-task-proof/tests.json
            ${{ runner.temp }}/scheduled-task-proof/tests-summary.json
            ${{ runner.temp }}/scheduled-task-proof/receipt.json
            ${{ runner.temp }}/explicit-run-proof/tests.log
            ${{ runner.temp }}/explicit-run-proof/tests.json
            ${{ runner.temp }}/explicit-run-proof/summary.json
            ${{ runner.temp }}/credit-pack-proof/tests.log
            ${{ runner.temp }}/credit-pack-proof/tests.json
            ${{ runner.temp }}/credit-pack-proof/receipt.json
            ${{ runner.temp }}/skills-proof/tests.log
            ${{ runner.temp }}/skills-proof/tests.json
            ${{ runner.temp }}/skills-proof/receipt.json
            ${{ runner.temp }}/database-panel-proof/tests.log
            ${{ runner.temp }}/database-panel-proof/tests.json
            ${{ runner.temp }}/database-panel-proof/receipt.json
            ${{ runner.temp }}/terminal-receipt-proof/tests.log
            ${{ runner.temp }}/terminal-receipt-proof/tests.json
            ${{ runner.temp }}/terminal-receipt-proof/receipt.json
          if-no-files-found: error
          retention-days: 7
