name: Production Docker

on:
  push:
    branches: [stable, product/saas-platform-production]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GAR_LOCATION: ${{ vars.GAR_LOCATION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'vibecore-prod-containers' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  docker:
    name: Build, scan, SBOM, push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: Dockerfile
            context: .
            target: bolt-ai-production
            build_args: ""
          - image: admin
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/admin
              START_CMD=node serve.mjs
          - image: api
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/api
              START_CMD=node services/api/dist/server.js
          - image: worker
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/worker
              START_CMD=node services/worker/dist/index.js
          - image: ai-gateway
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/ai-gateway
              START_CMD=node services/ai-gateway/dist/server.js
          - image: workspace-manager
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/workspace-manager
              START_CMD=node services/workspace-manager/dist/server.js
          - image: workspace-agent
            dockerfile: services/workspace-agent/Dockerfile
            context: .
            target: runtime
            build_args: ""
          - image: preview-proxy
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/preview-proxy
              START_CMD=node services/preview-proxy/dist/server.js

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/product/saas-platform-production' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
