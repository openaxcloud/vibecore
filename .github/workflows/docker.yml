name: Production Docker

on:
  push:
    branches: [stable, product/saas-platform-production]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GAR_LOCATION: ${{ vars.GAR_LOCATION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'vibecore-prod-containers' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deps:
    name: Build shared deps base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.deps-meta.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Deps metadata
        id: deps-meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/deps:sha-${SHORT_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push deps
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/deps.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.deps-meta.outputs.image }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/deps:latest

  docker:
    name: Build, scan, SBOM, push
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: Dockerfile
            context: .
            target: bolt-ai-production
            # VITE_* values are inlined into the client bundle at vite build
            # time, so they MUST be build args here — setting them only in the
            # Helm configmap is a no-op for the browser bundle, which then
            # silently falls back to WebContainer and never routes through
            # workspace-manager / preview-proxy. Mirror infra/cloudbuild/single-web.yaml.
            build_args: |
              VITE_RUNTIME_MODE=remote-kubernetes
              VITE_RUNTIME_API_BASE_URL=https://api.e-code.ai/api/runtime
          - image: admin
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/admin
              START_CMD=node serve.mjs
          - image: api
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/api
              START_CMD=tsx dist/server.js
          - image: worker
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/worker
              START_CMD=tsx dist/index.js
          - image: ai-gateway
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/ai-gateway
              START_CMD=tsx dist/server.js
          - image: workspace-manager
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/workspace-manager
              START_CMD=tsx dist/server.js
          - image: workspace-agent
            dockerfile: services/workspace-agent/Dockerfile
            context: .
            target: runtime
            build_args: ''
          - image: preview-proxy
            dockerfile: infra/docker/node-service.Dockerfile
            context: .
            target: runtime
            build_args: |
              PACKAGE_FILTER=@vibecore/preview-proxy
              START_CMD=tsx dist/server.js

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/product/saas-platform-production' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            DEPS_IMAGE=${{ needs.deps.outputs.image }}
            ${{ matrix.build_args }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
