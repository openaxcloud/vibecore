# Artifact Registry retention — protection-tag refresher.
#
# The prod repos enforce cleanup policies (see infra/artifact-registry/*.json):
#   vibecore-prod-containers: KEEP 20 most-recent per image
#                             + KEEP tags running-*/helm-active-*
#                             + DELETE older than 7 days
#   vibecore-prod-apps:       KEEP 10 most-recent per app
#                             + KEEP tags active-*
#                             + DELETE older than 60 days
#
# The DELETE policies are only safe because the KEEP tag prefixes always cover
# what production actually uses. This workflow keeps that promise true: every
# 6 hours (and on demand) it re-tags
#   * nonterminal platform pods: running-sha256-<digest>
#   * desired platform images: helm-active-sha256-<digest>
#   * deployed apps (including scale-to-zero): active-sha256-<digest>
# Refresh only adds digest-specific protection. Legacy tags remain untouched.
# Protected versions accumulate until a separately coordinated retirement.

name: AR Protect Running Images

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: ar-protect-images
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: europe-west9
  CLUSTER: vibecore-prod-app
  NAMESPACE: vibecore
  REPO_CONTAINERS: europe-west9-docker.pkg.dev/vibecore-495216/vibecore-prod-containers
  REPO_APPS: europe-west9-docker.pkg.dev/vibecore-495216/vibecore-prod-apps

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Le pas `running-*` appelle scripts/ar-protect/tag-running.sh : sans
      # checkout, le job n'a pas le script.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_WRITER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - id: cluster
        name: Get cluster credentials via Connect Gateway
        run: |
          set -euo pipefail
          gcloud components install gke-gcloud-auth-plugin --quiet
          gcloud container fleet memberships get-credentials "$CLUSTER" \
            --project "$GCP_PROJECT_ID" --location "$REGION"

      - id: running
        name: Tag running platform images (running-*)
        run: |
          set -euo pipefail
          pods=$(kubectl get pods -A -o json)
          images=$(jq -r -f scripts/ar-protect/pod-images.jq <<< "$pods")
          printf '%s\n' "$images" | sort -u | scripts/ar-protect/tag-running.sh

      - id: helm_active
        name: Tag Helm-active images (helm-active-*)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: |
          set -euo pipefail
          # Use desired templates even when no pod has started or replicas are zero.
          deploys=$(kubectl -n "$NAMESPACE" get deployments -l app.kubernetes.io/part-of=vibecore -o json)
          images=$(jq -r '.items[].spec.template.spec | (.containers[], .initContainers[]?) | .image' <<< "$deploys")
          release=$(helm -n "$NAMESPACE" get values vibecore -a -o json | jq -r --arg repo "$REPO_CONTAINERS" '
            .global as $g | .services[] | select(.enabled and .image)
            | (.imageDigest // "" | if length > 0 then . else ($g.imageDigest // "") end) as $digest
            | if $digest != "" then "\($repo)/\(.image)@\($digest)"
              else (.imageTag // "" | if length > 0 then . else $g.imageTag end) as $tag
              | "\($repo)/\(.image):\($tag)" end')
          agent=$(kubectl -n "$NAMESPACE" get configmap vibecore-vibecore-platform-platform-env -o json \
            | jq -er '.data.WORKSPACE_AGENT_IMAGE | strings | select(length > 0)')
          [[ "$agent" == "$REPO_CONTAINERS/"* ]] || { echo "::error::unexpected workspace-agent repository"; exit 1; }
          printf '%s\n' "$images" "$release" "$agent" | sort -u | scripts/ar-protect/tag-running.sh helm-active

      - id: apps
        name: Tag app images referenced by k8s Deployments (active-*)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: |
          set -euo pipefail
          # Includes scaled-to-zero apps: their Deployment object still carries
          # the image, and the scale-to-zero wake path must be able to pull it.
          #
          deployments=$(kubectl -n workspaces get deploy \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[0].image}{"\n"}{end}')

          tagged=0; skipped=0; failed=0
          while IFS=$'\t' read -r name img; do
            [ -n "${img:-}" ] || continue
            case "$img" in "$REPO_APPS"/*) ;; *) continue ;; esac
            ref="${img#"$REPO_APPS"/}"
            pkg="${ref%%@*}"; pkg="${pkg%%:*}"
            if err=$(scripts/ar-protect/pin-image.sh "$img" active "$REPO_APPS/$pkg" 2>&1); then
              tagged=$((tagged + 1))
              continue
            fi

            # A workspace can be deleted (and its image swept by the DELETE
            # policy) between listing the Deployments and tagging. A vanished
            # image protects nothing, so skip it — every other failure is real
            # and must still fail the run.
            case "$err" in
              *"not found"*|*"NOT_FOUND"*|*"does not exist"*)
                # A missing version is harmless only after the desired reference disappears.
                current=$(kubectl -n workspaces get deploy "$name" --ignore-not-found -o jsonpath='{.spec.template.spec.containers[0].image}')
                if [[ "$current" == "$REPO_APPS/"* ]]; then
                  echo "::error::failed to protect $img for $name (currently desires $current)"
                  failed=1
                else
                  skipped=$((skipped + 1))
                fi
                ;;
              *)
                echo "::error::failed to tag $img"
                printf '%s\n' "$err" >&2
                failed=1
                ;;
            esac
          done <<< "$deployments"

          echo "active-* tags written: $tagged, skipped (image gone): $skipped"
          exit "$failed"

      - name: Verify all retention passes
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        env:
          RUNNING: ${{ steps.running.outcome }}
          HELM_ACTIVE: ${{ steps.helm_active.outcome }}
          APPS: ${{ steps.apps.outcome }}
        run: |
          echo "Retention passes: running=$RUNNING helm-active=$HELM_ACTIVE apps=$APPS"
          [[ "$RUNNING" == success && "$HELM_ACTIVE" == success && "$APPS" == success ]]
