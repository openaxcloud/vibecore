# Answer "would this commit be allowed to deploy?" without deploying anything.
#
# Same policy file, same engine, same job shape as the gate inside
# deploy-main.yml — but with no build, no rollout, and no cloud credentials at all
# (note the permissions block: there is no `id-token`, so this workflow physically
# cannot reach GCP even if someone edited it to try).
#
# Use it to check a commit before merging, to confirm a refusal is genuine rather
# than a gate bug, or to demonstrate the gate's behaviour on historical commits.
#
#   gh workflow run release-gate-dryrun.yml -R openaxcloud/vibecore \
#     -f sha=<full 40-hex commit>
#
# `expect` turns the run into an assertion: with expect=refuse the job is GREEN when
# the gate refuses, which is what makes this usable as evidence that a known-red
# commit is actually blocked.

name: Release gate (dry run)

on:
  # TEMPORARY (throwaway proof branch only): workflow_dispatch requires the workflow
  # to exist on the default branch, so live evidence is produced by a push here.
  # Not part of the deliverable — this branch is deleted after the evidence is captured.
  push:
    branches: [proof/release-gate-live]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-hex commit sha to evaluate
        required: true
      expect:
        description: What the gate should say — "pass", "refuse", or "report" (just print)
        required: false
        default: report

permissions:
  contents: read
  actions: read

jobs:
  proof-red:
    name: PROOF — a commit with red CI must be REFUSED
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sha:
          - 113c17e877d50f40a0a8ba5c2e68aaa027337985  # Production CI = failure, deployed anyway
          - 9fc8a243fa1baa61d3f33e2aa6a66c88625ba878  # Production CI = failure, deployed anyway
          - 3a53b4394993d440ba0e51f9eb82d235b188cbff  # CI + Quality = cancelled, deployed anyway
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the gate engine
        run: node scripts/release-gate/verify-required-checks.mjs --self-test
      - name: Self-test the gate WIRING policy
        run: node scripts/release-gate/validate-deploy-gate-wired.mjs --self-test
      - name: Assert the wiring is intact on the real workflow
        run: node scripts/release-gate/validate-deploy-gate-wired.mjs
      - name: Gate must refuse ${{ matrix.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          rc=0
          node scripts/release-gate/verify-required-checks.mjs \
            --sha "${{ matrix.sha }}" --repo "${GITHUB_REPOSITORY}" --no-wait || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::REGRESSION — the gate allowed a commit whose pipeline was not green"
            exit 1
          fi
          echo "proven: gate refuses ${{ matrix.sha }} (exit ${rc}), in a job with NO id-token permission"

  proof-green:
    name: PROOF — an all-green commit is authorised
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Gate must pass an all-green commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 2c104f24 is green on the three pipelines that ran on main before e2e.yml was
          # given a push:main trigger, so E2E is evaluated under a WAIVER — the same
          # mechanism offered for the phased cutover, exercised here for real.
          jq '(.requiredWorkflows[] | select(.displayName=="Production E2E")) |= (. + {
                waivedUntil: "2026-08-26",
                waiverReason: "E2E suite red across all branches for reasons unrelated to release integrity",
                waiverTicket: "BUG-E2E-001"})' \
            scripts/release-gate/required-checks.json > /tmp/policy-waived.json
          node scripts/release-gate/verify-required-checks.mjs \
            --sha 2c104f24b7d6c52a5e41b394036a0eba37f39a2a \
            --policy /tmp/policy-waived.json --no-wait
          echo "proven: gate authorises an all-green commit, and prints the waiver loudly"

  proof-red-under-waiver:
    name: PROOF — a red commit is STILL refused under the E2E waiver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sha:
          - 113c17e877d50f40a0a8ba5c2e68aaa027337985
          - 3a53b4394993d440ba0e51f9eb82d235b188cbff
    steps:
      - uses: actions/checkout@v4
      - name: Waiving E2E must not weaken the CI/Security/Quality gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          jq '(.requiredWorkflows[] | select(.displayName=="Production E2E")) |= (. + {
                waivedUntil: "2026-08-26",
                waiverReason: "E2E suite red across all branches for reasons unrelated to release integrity",
                waiverTicket: "BUG-E2E-001"})' \
            scripts/release-gate/required-checks.json > /tmp/policy-waived.json
          rc=0
          node scripts/release-gate/verify-required-checks.mjs \
            --sha "${{ matrix.sha }}" --policy /tmp/policy-waived.json --no-wait || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::REGRESSION — the E2E waiver let a red commit through"
            exit 1
          fi
          echo "proven: ${{ matrix.sha }} still refused under the waiver (exit ${rc})"

  dry-run:
    name: Evaluate required checks for a commit (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the gate engine
        run: node scripts/release-gate/verify-required-checks.mjs --self-test

      - name: Evaluate
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set -uo pipefail
          # `|| rc=$?` is load-bearing, not style. GitHub invokes every `run` block as
          # `bash -e`, and `set -uo pipefail` does NOT clear that -e — so without the
          # `||` the step dies the instant the gate refuses, the assertion below never
          # runs, and `expect: refuse` could never be satisfied. Found by a live run:
          # the gate correctly printed VERDICT: REFUSE and the job still went red.
          # --no-wait: a dry run reports the CURRENT state of a commit's checks. It
          # must not sit for 90 minutes waiting for a pipeline that may never run —
          # that is the deploy path's job, not this one's.
          rc=0
          node scripts/release-gate/verify-required-checks.mjs \
            --sha "${SHA}" --repo "${GITHUB_REPOSITORY}" --no-wait --json verdict.json || rc=$?
          echo "gate exit code: ${rc}"

          case "${EXPECT}" in
            pass)
              if [ "${rc}" -ne 0 ]; then
                echo "::error::expected the gate to PASS ${SHA}, but it refused"
                exit 1
              fi
              echo "asserted: gate PASSES ${SHA}" ;;
            refuse)
              if [ "${rc}" -eq 0 ]; then
                echo "::error::expected the gate to REFUSE ${SHA}, but it passed"
                exit 1
              fi
              echo "asserted: gate REFUSES ${SHA}" ;;
            *)
              echo "report-only mode (gate exit ${rc})" ;;
          esac

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-verdict-${{ inputs.sha }}
          path: verdict.json
          if-no-files-found: warn
