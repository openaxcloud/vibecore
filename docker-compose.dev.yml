services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vibecore
      POSTGRES_USER: vibecore
      POSTGRES_PASSWORD: vibecore
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vibecore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecore -d vibecore"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vibecore-postgres:
