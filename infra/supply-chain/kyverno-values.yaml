# Kyverno install values — image-signature admission control (B7).
#
# Blast-radius containment is the whole point of this file. Three independent
# layers, any one of which is sufficient to keep the product path safe:
#
#   1. config.webhooks.namespaceSelector pins the generated webhook
#      configurations to namespace `vibecore` ONLY. The API server therefore
#      never calls Kyverno for pods in `workspaces` (user app pods, images built
#      dynamically at publish time), `project-databases` (CNPG), ingress-nginx,
#      cert-manager or any gke-managed namespace. This is enforced by the API
#      server itself, so it holds even if every Kyverno pod is down and the
#      policy is set to failurePolicy: Fail.
#   2. The ClusterPolicy (kyverno-policy-verify-images.yaml) matches the same
#      namespace AND only the vibecore-prod-containers image glob.
#   3. resourceFiltersIncludeNamespaces keeps Kyverno's own internal filtering
#      aligned with 1 and 2.
#
# The cluster's control plane is private (master 172.16.0.0/28) and there is no
# explicit master->node firewall rule for webhook ports; ingress-nginx's
# admission webhook nonetheless works today on containerPort 8443, so
# control-plane egress reaches arbitrary webhook ports via the node subnet.
# We still do NOT assume it: the policy ships with failurePolicy Ignore +
# Audit, and only flips to Fail/Enforce once PolicyReports prove the webhook is
# actually being reached.

config:
  # Layer 1 — the API server only sends ns/vibecore admission reviews here.
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - vibecore
  # Layer 3 — defence in depth on Kyverno's own resource filtering.
  resourceFiltersIncludeNamespaces:
    - vibecore

# HA across the three app-system nodes. Signature verification sits on the pod
# creation path for the platform namespace, so a single replica would make
# Kyverno a availability single point of failure for deploys.
admissionController:
  # Kyverno must PULL the cosign signature objects out of Artifact Registry to
  # verify them. Without an identity it gets
  # `artifactregistry.repositories.downloadArtifacts denied` and then DENIES the
  # pod — note that failurePolicy: Ignore does NOT protect against this, because
  # Kyverno returns a deny, not a webhook call failure. Enforcing without this
  # binding is therefore a guaranteed outage; it was caught by the canary
  # namespace before it ever reached ns/vibecore.
  #
  # Workload Identity binding (least privilege — roles/artifactregistry.reader
  # on the vibecore-prod-containers repository only, no write, no other repo):
  #   GSA  vibecore-kyverno-ar@vibecore-495216.iam.gserviceaccount.com
  #   KSA  vibecore-495216.svc.id.goog[kyverno/kyverno-admission-controller]
  # NB: the key is rbac.serviceAccount.annotations, NOT serviceAccount
  # .annotations — helm silently ignores unknown value keys, so getting this
  # path wrong produces a successful-looking upgrade that changes nothing.
  rbac:
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: vibecore-kyverno-ar@vibecore-495216.iam.gserviceaccount.com
  replicas: 3
  podDisruptionBudget:
    minAvailable: 1
  antiAffinity:
    enable: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Generates PolicyReports — this is what supplies the Audit-phase evidence that
# the webhook is genuinely being invoked before we enforce anything.
reportsController:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Not used by verifyImages (which is admission-time only, background: false).
# Left off to keep the added footprint and failure surface minimal.
backgroundController:
  enabled: false
cleanupController:
  enabled: false
