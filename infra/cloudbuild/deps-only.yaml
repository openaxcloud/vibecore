# Builds ONLY the shared deps base image.
#
# Why this exists: on a COLD registry (a fresh project, e.g. the ephemeral audit
# environment) the full `cloudbuild.yaml` — deps plus seven service builds fanned
# out in parallel on one worker — dies with INTERNAL_ERROR after ~57 minutes,
# reproducibly, and independently of the configured timeout (observed at both
# 3600s and 7200s, failing at 57m21s and 57m36s). Splitting the work restores a
# working path: build deps here, then each service via single-service.yaml,
# which is what that config already expects (`_DEPS_TAG` must already exist).
#
# Usage:
#   gcloud builds submit \
#     --project=<PROJECT> --region=europe-west9 \
#     --config=infra/cloudbuild/deps-only.yaml \
#     --substitutions=_PROJECT=<PROJECT>,_REPO=<REPO>,_SHORT_SHA=<sha> \
#     --timeout=3600s .
substitutions:
  _REGION: europe-west9
  _PROJECT: vibecore-495216
  _REPO: vibecore-prod-containers
  _SHORT_SHA: dev
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 200
  env:
    - DOCKER_BUILDKIT=1

timeout: 3600s

steps:
  - id: prime-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:latest || true

  - id: build-deps
    name: gcr.io/cloud-builders/docker
    waitFor: ['prime-cache']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/deps.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:latest
