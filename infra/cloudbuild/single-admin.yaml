# Cloud Build config for the standalone admin SPA against an existing deps image.
#
# The admin tier uses infra/docker/node-service.Dockerfile because its build is a
# filtered pnpm workspace build followed by `pnpm deploy`. It has a dedicated
# config (instead of the generic single-service config) because production
# admission requires the same digest-bound Cosign/KMS signature as the web tier.
#
# Usage:
#   gcloud builds submit \
#     --project=vibecore-495216 \
#     --region=europe-west9 \
#     --config=infra/cloudbuild/single-admin.yaml \
#     --substitutions=_DEPS_TAG=<sha>,_SHORT_SHA=<sha> \
#     --machine-type=e2-highcpu-8 \
#     --timeout=1800s .
substitutions:
  _REGION: europe-west9
  _PROJECT: vibecore-495216
  _REPO: vibecore-prod-containers
  _DEPS_TAG: latest
  _SHORT_SHA: dev
  _KMS_KEYRING: ecode-supply-chain
  _KMS_KEY: cosign-images

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 200
  env:
    - DOCKER_BUILDKIT=1

timeout: 1800s

steps:
  - id: prime-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "::: pulling deps:${_DEPS_TAG}"
        docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_DEPS_TAG}
        echo "::: pulling admin:latest (best-effort)"
        docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest || true

  - id: build-admin
    name: gcr.io/cloud-builders/docker
    waitFor: ['prime-cache']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/node-service.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_DEPS_TAG}
      - --build-arg=PACKAGE_FILTER=@vibecore/admin
      - '--build-arg=START_CMD=node serve.mjs'
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest
      - .

  # Fetch Cosign independently while the image builds. Both the OCI index and
  # extracted binary are pinned exactly; no mutable release artifact executes in
  # this privileged supply-chain path.
  - id: fetch-cosign
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cosign_image="ghcr.io/sigstore/cosign/cosign:v2.4.3@sha256:c77247c92f4dfea851c70555738226498393e34e2f9ca83cb959e51c230e4ad7"
        cosign_bin_sha256="37db5533587f87c2f9225c5896b39e1ee238205e3a71ba9ff9f0c84a2fd14474"
        docker pull "$cosign_image"
        cid="$(docker create "$cosign_image")"
        docker cp "$cid:/ko-app/cosign" /workspace/cosign
        docker rm "$cid"
        chmod +x /workspace/cosign
        echo "$cosign_bin_sha256  /workspace/cosign" | sha256sum -c -
        /workspace/cosign version

  # Explicit push is required before signing: Cosign signs the immutable digest
  # that Artifact Registry accepted, never only the mutable local tag.
  - id: push-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-admin']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest

  - id: sign-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['push-image', 'fetch-cosign']
    entrypoint: bash
    env:
      - 'COSIGN_KMS_KEY=gcpkms://projects/${_PROJECT}/locations/${_REGION}/keyRings/${_KMS_KEYRING}/cryptoKeys/${_KMS_KEY}'
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace:$$PATH"
        ref="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}"
        digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$ref")"
        bash scripts/cosign-sign-images.sh "$digest_ref"

  # Artifact Registry scanning remains informational because the production
  # project has Container Scanning disabled. deploy-main.yml separately runs the
  # blocking Trivy gate after this build and before Helm touches production.
  - id: scan-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['push-image']
    allowFailure: true
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        echo "::: scanning admin:${_SHORT_SHA}"
        gcloud artifacts docker images scan \
          "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}" \
          --location="${_REGION}" \
          --format='value(response.scan)' \
          || echo "WARN: scan failed for admin (non-fatal; blocking Trivy gate runs in deploy-main)"

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest
