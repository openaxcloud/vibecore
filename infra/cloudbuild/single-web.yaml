# Cloud Build config for the `web` service against an existing deps image.
#
# The web image diverges from the other six node services: it builds from
# the repo-root `Dockerfile` with `--target=bolt-ai-production` (Remix +
# remix-serve), so it can't share the parameterized
# `single-service.yaml`. Keeping a second tiny file is simpler than
# wedging a branch into a Cloud Build substitution.
#
# Usage (via `make deploy-web`):
#
#   gcloud builds submit \
#     --project=vibecore-495216 \
#     --region=europe-west9 \
#     --config=infra/cloudbuild/single-web.yaml \
#     --substitutions=_DEPS_TAG=<sha>,_SHORT_SHA=<sha> \
#     --machine-type=e2-highcpu-8 \
#     --timeout=1800s .
substitutions:
  _REGION: europe-west9
  _PROJECT: vibecore-495216
  _REPO: vibecore-prod-containers
  _DEPS_TAG: latest
  _SHORT_SHA: dev
  # Browser runtime mode baked into the client bundle at `vite build` time.
  # This is the prod web image, so it defaults to remote-kubernetes (the mode
  # the whole workspace-manager / preview-proxy / workspace-agent backend is
  # built for). Without this build arg the bundle silently ships WebContainer
  # and the preview/port pipeline never touches the remote infra.
  _VITE_RUNTIME_MODE: remote-kubernetes
  # The runtime API base URL is ALSO inlined at build time (RuntimeAdapter-
  # Provider). It must point at the off-origin API host: the /api/runtime/*
  # routes (POST /workspaces, terminal, files, commands, …) are served by the
  # API service (services/api/src/app.ts) at api.e-code.ai. Leaving this empty
  # made the adapter default to the same-origin /api/runtime, which lands on
  # the web pod (Remix) — it has no runtime routes, so the workspace never
  # provisions and the IDE shows "No backend workspace" / "Failed to spawn bolt
  # shell". (The Helm configmap's VITE_RUNTIME_API_BASE_URL is a *runtime* env
  # that the browser never reads — only this build arg reaches the bundle.)
  _VITE_RUNTIME_API_BASE_URL: 'https://api.e-code.ai/api/runtime'
  # Managed (Replit-parity) mode: the platform admin supplies the AI provider
  # keys (OPENAI/ANTHROPIC/GOOGLE/XAI/MOONSHOT secrets), so the IDE composer must
  # not show the per-user "API Key: Not set / Get API Key" prompt. This is a
  # VITE_* flag, inlined at vite build time, so it MUST come through as a build
  # arg here (a runtime configmap env would never reach the client bundle).
  # Defaults to true because this is the prod web image; a bare local
  # `docker build` leaves the arg empty and keeps BYOK key entry (dev/self-host).
  _VITE_BYOK_DISABLED: 'true'
  # Cosign signing key (B7) — see infra/cloudbuild/runtime-tier.yaml.
  _KMS_KEYRING: ecode-supply-chain
  _KMS_KEY: cosign-images
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 200
  env:
    - DOCKER_BUILDKIT=1

timeout: 1800s

steps:
  - id: prime-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "::: pulling deps:${_DEPS_TAG}"
        docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_DEPS_TAG}
        echo "::: pulling web:latest (best-effort)"
        docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:latest || true

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: ['prime-cache']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --target=bolt-ai-production
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_DEPS_TAG}
      - --build-arg=VITE_RUNTIME_MODE=${_VITE_RUNTIME_MODE}
      - --build-arg=VITE_RUNTIME_API_BASE_URL=${_VITE_RUNTIME_API_BASE_URL}
      - --build-arg=VITE_BYOK_DISABLED=${_VITE_BYOK_DISABLED}
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:latest
      - .

  # ---- sign image (B7) — see infra/cloudbuild/runtime-tier.yaml for rationale ----
  - id: fetch-cosign
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # The official cosign image is distroless: no shell, no coreutils, so
        # `entrypoint: cp` cannot work. Lift the binary out of a created (never
        # started) container instead. Still pinned to a released tag, which is
        # the point — we do not curl an unpinned tarball into a build that
        # exists to make artifacts trustworthy.
        docker pull ghcr.io/sigstore/cosign/cosign:v2.4.3
        cid="$(docker create ghcr.io/sigstore/cosign/cosign:v2.4.3)"
        docker cp "$cid:/ko-app/cosign" /workspace/cosign
        docker rm "$cid"
        /workspace/cosign version

  - id: push-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-web']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:${_SHORT_SHA}
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:latest

  - id: sign-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['push-image', 'fetch-cosign']
    entrypoint: bash
    env:
      - 'COSIGN_KMS_KEY=gcpkms://projects/${_PROJECT}/locations/${_REGION}/keyRings/${_KMS_KEYRING}/cryptoKeys/${_KMS_KEY}'
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace:$$PATH"
        ref="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:${_SHORT_SHA}"
        digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$ref")"
        bash scripts/cosign-sign-images.sh "$digest_ref"

  - id: scan-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['build-web']
    allowFailure: true
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        echo "::: scanning web:${_SHORT_SHA}"
        gcloud artifacts docker images scan \
          "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:${_SHORT_SHA}" \
          --location="${_REGION}" \
          --format='value(response.scan)' \
          || echo "WARN: scan failed for web (non-fatal)"

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/web:latest
