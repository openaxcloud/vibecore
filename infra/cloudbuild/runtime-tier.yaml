# Cloud Build pipeline for the runtime tier (api, workspace-manager,
# preview-proxy, ai-gateway, worker and screenshotter) with a freshly rebuilt
# deps image.
#
# When to use this instead of the full pipeline:
#   * pnpm-lock.yaml or any package.json changed (deps must be rebuilt), AND
#   * the runtime services need a fresh dependency base or runtime source
#     changes must ship together, while web and admin can keep their current SHA.
#
# When to use the full pipeline (cloudbuild.yaml) instead:
#   * Source changed in `app/` (web), `apps/admin/` or another non-runtime tier.
#   * You want consistent imageTag rollouts across every chart subdeployment
#     (see "Targeted Rebuilds" in docs/INFRASTRUCTURE.md for the caveat).
#
# Expected duration: ~15-35 min depending on cache state. Service images are
# deliberately serialized below to stay within the production worker's 8 GB
# memory limit.
#
# Usage (via `make deploy-runtime`):
#
#   gcloud builds submit \
#     --project=vibecore-495216 \
#     --region=europe-west9 \
#     --config=infra/cloudbuild/runtime-tier.yaml \
#     --substitutions=_SHORT_SHA=$(git rev-parse --short=10 HEAD) \
#     --machine-type=e2-highcpu-8 \
#     --timeout=3600s .
substitutions:
  _REGION: europe-west9
  _PROJECT: vibecore-495216
  _REPO: vibecore-prod-containers
  _SHORT_SHA: dev
  # Cosign signing key (B7). The Cloud Build service account
  # (267592214411-compute@developer.gserviceaccount.com) holds
  # roles/cloudkms.signerVerifier on this key and nothing else; the private key
  # material never leaves Cloud KMS.
  _KMS_KEYRING: ecode-supply-chain
  _KMS_KEY: cosign-images
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 200
  env:
    - DOCKER_BUILDKIT=1

timeout: 3600s

steps:
  # ---- 1. prime cache ----
  - id: prime-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        for img in deps api workspace-manager preview-proxy ai-gateway worker screenshotter; do
          docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/$img:latest || true
        done

  # ---- 2. fresh deps base ----
  - id: build-deps
    name: gcr.io/cloud-builders/docker
    waitFor: ['prime-cache']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/deps.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:latest
      - .

  # ---- 3. memory-safe service builds ----
  #
  # Every Docker build runs a filtered pnpm workspace install. Running all six
  # at once contends for the production E2_HIGHCPU_8 worker's 8 GB of memory,
  # shared I/O and Docker daemon, and has left every BuildKit process stalled
  # without new logs. Keep this chain sequential: the outer deploy workflow
  # already gives the runtime tier a one-hour timeout, and a slower successful
  # build is safer than a parallel deadlock that blocks every queued rollout.
  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-deps']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/node-service.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
      - --build-arg=PACKAGE_FILTER=@vibecore/api
      - --build-arg=START_CMD=tsx dist/server.js
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/api:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/api:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/api:latest
      - .

  - id: build-workspace-manager
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-api']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/node-service.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
      - --build-arg=PACKAGE_FILTER=@vibecore/workspace-manager
      - --build-arg=START_CMD=tsx dist/server.js
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-manager:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-manager:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-manager:latest
      - .

  - id: build-preview-proxy
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-workspace-manager']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/node-service.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
      - --build-arg=PACKAGE_FILTER=@vibecore/preview-proxy
      - --build-arg=START_CMD=tsx dist/server.js
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/preview-proxy:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/preview-proxy:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/preview-proxy:latest
      - .

  - id: build-ai-gateway
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-preview-proxy']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/node-service.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
      - --build-arg=PACKAGE_FILTER=@vibecore/ai-gateway
      - --build-arg=START_CMD=tsx dist/server.js
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/ai-gateway:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/ai-gateway:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/ai-gateway:latest
      - .

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-ai-gateway']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/node-service.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
      - --build-arg=PACKAGE_FILTER=@vibecore/worker
      - --build-arg=START_CMD=tsx dist/index.js
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/worker:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/worker:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/worker:latest
      - .

  # screenshotter (P11 auto thumbnails). Diverges from the others only in its
  # runtime base (Playwright/Chromium) via a dedicated Dockerfile; the build
  # stage still reuses the shared deps image. Heavier than the node services, so
  # if pipeline time regresses this step can move to its own trigger — the pod
  # ships enabled:false so nothing consumes the image until infra is validated.
  - id: build-screenshotter
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-worker']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/screenshotter.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
      - --build-arg=PACKAGE_FILTER=@vibecore/screenshotter
      - --build-arg=START_CMD=node dist/server.js
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/screenshotter:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/screenshotter:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/screenshotter:latest
      - .

  # ---- 4. sign images (B7) ----
  #
  # Pull the cosign binary out of the official, version-pinned image rather than
  # curl-ing a release tarball mid-build: a supply-chain control whose own
  # tooling is fetched from an unpinned URL is not much of a control. Runs from
  # the start (waitFor '-') so it costs no wall-clock.
  - id: fetch-cosign
    name: ghcr.io/sigstore/cosign/cosign:v2.4.3
    waitFor: ['-']
    entrypoint: cp
    args: ['/ko-app/cosign', '/workspace/cosign']

  # Cloud Build only pushes the `images:` list AFTER every step has finished, so
  # without an explicit push here there would be nothing in the registry for
  # cosign to attach a signature to. Pushing early is harmless: the trailing
  # `images:` push then finds the layers already present and just records the
  # digests in the build metadata.
  - id: push-images
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-screenshotter']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for img in deps api workspace-manager preview-proxy ai-gateway worker screenshotter; do
          docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/$img:${_SHORT_SHA}
          docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/$img:latest
        done

  # Signing is BLOCKING on purpose (no allowFailure): an unsigned image would be
  # refused at admission by the Kyverno policy anyway, so failing here gives a
  # clear "signing broke" error instead of a confusing rollout failure 20
  # minutes later. Images are signed by digest — see scripts/cosign-sign-images.sh.
  - id: sign-images
    name: gcr.io/cloud-builders/docker
    waitFor: ['push-images', 'fetch-cosign']
    entrypoint: bash
    env:
      - 'COSIGN_KMS_KEY=gcpkms://projects/${_PROJECT}/locations/${_REGION}/keyRings/${_KMS_KEYRING}/cryptoKeys/${_KMS_KEY}'
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace:$$PATH"
        REFS=""
        for img in deps api workspace-manager preview-proxy ai-gateway worker screenshotter; do
          ref="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/$img:${_SHORT_SHA}"
          # Resolve locally from the daemon: the tag was just pushed, so
          # RepoDigests holds the immutable digest without a registry round-trip.
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$ref")"
          REFS="$REFS $digest_ref"
        done
        bash scripts/cosign-sign-images.sh $REFS

  # ---- 5. vulnerability scan (non-blocking) ----
  - id: scan-images
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['build-screenshotter']
    allowFailure: true
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        for img in api workspace-manager preview-proxy ai-gateway worker screenshotter; do
          echo "::: scanning $img:${_SHORT_SHA}"
          gcloud artifacts docker images scan \
            "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/$img:${_SHORT_SHA}" \
            --location="${_REGION}" \
            --format='value(response.scan)' \
            || echo "WARN: scan failed for $img (non-fatal)"
        done

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:latest
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/api:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/api:latest
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-manager:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-manager:latest
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/preview-proxy:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/preview-proxy:latest
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/ai-gateway:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/ai-gateway:latest
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/worker:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/worker:latest
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/screenshotter:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/screenshotter:latest
