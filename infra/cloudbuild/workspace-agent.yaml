# Cloud Build config for the workspace-agent RUNTIME image.
#
# Unlike the platform node services (which share infra/docker/node-service.Dockerfile
# against a prebuilt deps image), the workspace-agent has its OWN Dockerfile
# (services/workspace-agent/Dockerfile): it compiles node-pty against the image's
# musl/node ABI and installs bash/git/curl/tini for the interactive terminal. So
# it gets a dedicated build that uses that Dockerfile with the repo root as context.
#
# Usage (ergonomic path: `make deploy-workspace-agent`):
#
#   gcloud builds submit \
#     --project=vibecore-495216 \
#     --region=europe-west9 \
#     --config=infra/cloudbuild/workspace-agent.yaml \
#     --substitutions=_SHORT_SHA=$(git rev-parse --short HEAD) \
#     --timeout=1800s .
#
# The produced tag is `workspace-agent:sha-<short>` (matching the existing prod
# convention). After the build, bump platformEnv.runtime.workspaceAgentImage to
# the new tag via helm; NEW workspaces pick it up immediately, existing pods keep
# their current image until they are reprovisioned (GC + reopen).
substitutions:
  _REGION: europe-west9
  _PROJECT: vibecore-495216
  _REPO: vibecore-prod-containers
  _SHORT_SHA: dev
  # Cosign signing key (B7) — see infra/cloudbuild/runtime-tier.yaml.
  _KMS_KEYRING: ecode-supply-chain
  _KMS_KEY: cosign-images

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 100
  env:
    - DOCKER_BUILDKIT=1

timeout: 1800s

steps:
  # ---- 1. prime cache (best-effort) ----
  - id: prime-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "::: pulling workspace-agent:latest (best-effort)"
        docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:latest || true

  # ---- 2. build using the service's own Dockerfile (repo root as context) ----
  - id: build-workspace-agent
    name: gcr.io/cloud-builders/docker
    waitFor: ['prime-cache']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=services/workspace-agent/Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:sha-${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:latest
      - .

  # ---- 3. sign image (B7) — see infra/cloudbuild/runtime-tier.yaml for rationale ----
  #
  # NOTE: the workspace-agent image runs inside user workspace pods in namespace
  # `workspaces`, which the Kyverno policy deliberately does NOT cover (that
  # namespace also runs per-publish user app images that this key never signs).
  # It is signed anyway so provenance is uniform across everything the platform
  # builds, and so coverage can be extended later without a pipeline change.
  - id: fetch-cosign
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # The official cosign image is distroless: no shell, no coreutils, so
        # `entrypoint: cp` cannot work. Lift the binary out of a created (never
        # started) container instead. Still pinned to a released tag, which is
        # the point — we do not curl an unpinned tarball into a build that
        # exists to make artifacts trustworthy.
        docker pull ghcr.io/sigstore/cosign/cosign:v2.4.3
        cid="$(docker create ghcr.io/sigstore/cosign/cosign:v2.4.3)"
        docker cp "$cid:/ko-app/cosign" /workspace/cosign
        docker rm "$cid"
        /workspace/cosign version

  - id: push-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-workspace-agent']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:sha-${_SHORT_SHA}
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:latest

  - id: sign-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['push-image', 'fetch-cosign']
    entrypoint: bash
    env:
      - 'COSIGN_KMS_KEY=gcpkms://projects/${_PROJECT}/locations/${_REGION}/keyRings/${_KMS_KEYRING}/cryptoKeys/${_KMS_KEY}'
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace:$$PATH"
        ref="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:sha-${_SHORT_SHA}"
        digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$ref")"
        bash scripts/cosign-sign-images.sh "$digest_ref"

  # ---- 4. vulnerability scan (non-blocking) ----
  - id: scan-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['build-workspace-agent']
    allowFailure: true
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        echo "::: scanning workspace-agent:sha-${_SHORT_SHA}"
        gcloud artifacts docker images scan \
          "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:sha-${_SHORT_SHA}" \
          --location="${_REGION}" \
          --format='value(response.scan)' \
          || echo "WARN: scan failed for workspace-agent (non-fatal)"

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:sha-${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/workspace-agent:latest
