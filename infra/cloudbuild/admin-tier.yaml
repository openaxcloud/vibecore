# Étage `admin` — la console d'administration.
#
# POURQUOI CE FICHIER EXISTE.
#
# `cloudbuild.yaml` sait construire l'image admin depuis toujours (`build-admin`).
# Mais le déploiement continu n'invoque JAMAIS `cloudbuild.yaml` : il n'appelle que
# `runtime-tier.yaml`, `single-web.yaml` et `workspace-agent.yaml`. L'étape qui sait
# construire l'admin n'est donc appelée par rien.
#
# Mesuré le 2026-09-07 : l'image admin servie en production datait du 2026-07-12 —
# **56 jours et 1 415 commits** de retard, pendant que les sept autres étages
# avançaient à chaque poussée. Entre-temps `apps/admin/` avait reçu 9 commits,
# 13 fichiers, **+1 782 / −456**, dont la localisation française de la plateforme
# et trois correctifs de contraste sur des libellés illisibles. Rien de tout cela
# n'a jamais atteint la console.
#
# Le plus révélateur : `d839c4f65` (2026-08-18) a réparé la CONSTRUCTIBILITÉ de
# l'étage admin — « `app/` manquait au contexte Docker ». Le correctif était juste,
# et il n'a rien changé, parce que personne ne construisait cette image. Un
# correctif sur un chemin que rien n'emprunte.
#
# L'en-tête de `runtime-tier.yaml` documente pourtant l'échappatoire : « When to use
# the full pipeline (cloudbuild.yaml) instead: Source changed in `app/` (web),
# `apps/admin/` or another non-runtime tier. » Cette échappatoire n'existe plus dans
# le workflow. Ce fichier la remplace par un étage de plein droit.
#
# La forme suit `single-web.yaml` — même primage de cache, même signature cosign,
# même analyse — parce qu'un étage qui diverge de ses voisins est un étage qu'on
# oublie de maintenir. C'est précisément ce qui vient d'arriver.
substitutions:
  _REGION: europe-west9
  _PROJECT: vibecore-495216
  _REPO: vibecore-prod-containers
  _DEPS_TAG: latest
  _SHORT_SHA: dev
  _KMS_KEYRING: ecode-supply-chain
  _KMS_KEY: cosign-images

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 200
  env:
    - DOCKER_BUILDKIT=1

timeout: 1800s

steps:
  - id: prime-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "::: pulling deps:${_DEPS_TAG}"
        docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_DEPS_TAG}
        echo "::: pulling admin:latest (best-effort)"
        docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest || true

  # Les arguments sont ceux de `build-admin` dans `cloudbuild.yaml`, à l'identique.
  # Vérifiés le 2026-09-07 par une construction RÉELLE depuis `main` (b1b24751a1) :
  # image produite, conteneur démarré, `admin.serve.ready` journalisé, HTTP 200.
  - id: build-admin
    name: gcr.io/cloud-builders/docker
    waitFor: ['prime-cache']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=infra/docker/node-service.Dockerfile
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_DEPS_TAG}
      - --build-arg=PACKAGE_FILTER=@vibecore/admin
      - --build-arg=START_CMD=node serve.mjs
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest
      - .

  - id: fetch-cosign
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cosign_image="ghcr.io/sigstore/cosign/cosign:v2.4.3@sha256:c77247c92f4dfea851c70555738226498393e34e2f9ca83cb959e51c230e4ad7"
        cosign_bin_sha256="37db5533587f87c2f9225c5896b39e1ee238205e3a71ba9ff9f0c84a2fd14474"
        docker pull "$cosign_image"
        cid="$(docker create "$cosign_image")"
        docker cp "$cid:/ko-app/cosign" /workspace/cosign
        docker rm "$cid"
        chmod +x /workspace/cosign
        echo "$cosign_bin_sha256  /workspace/cosign" | sha256sum -c -
        /workspace/cosign version

  - id: push-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-admin']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest

  # La signature n'est pas décorative : le déploiement épingle par empreinte et
  # Kyverno vérifie. Une image admin non signée ne démarrerait pas.
  - id: sign-image
    name: gcr.io/cloud-builders/docker
    waitFor: ['push-image', 'fetch-cosign']
    entrypoint: bash
    env:
      - 'COSIGN_KMS_KEY=gcpkms://projects/${_PROJECT}/locations/${_REGION}/keyRings/${_KMS_KEYRING}/cryptoKeys/${_KMS_KEY}'
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace:$$PATH"
        ref="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}"
        digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$ref")"
        bash scripts/cosign-sign-images.sh "$digest_ref"

  - id: scan-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['build-admin']
    allowFailure: true
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        echo "::: scanning admin:${_SHORT_SHA}"
        gcloud artifacts docker images scan \
          "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}" \
          --location="${_REGION}" \
          --format='value(response.scan)' \
          || echo "WARN: scan failed for admin (non-fatal)"

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/admin:latest
