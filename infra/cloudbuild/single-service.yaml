# Cloud Build config for ONE service against an existing deps image.
#
# When only one service's source has changed and the lockfile is stable,
# rebuilding the full pipeline (~8-12 min for 7 images) is wasteful. This
# variant skips `build-deps` and the six other service builds, so a
# targeted rebuild lands in roughly 90-180 seconds.
#
# Usage (via `make deploy-<service>` is the ergonomic path):
#
#   gcloud builds submit \
#     --project=vibecore-495216 \
#     --region=europe-west9 \
#     --config=infra/cloudbuild/single-service.yaml \
#     --substitutions=_SERVICE=api,_PACKAGE_FILTER=@vibecore/api,_START_CMD="tsx dist/server.js",_DEPS_TAG=<sha>,_SHORT_SHA=<sha> \
#     --machine-type=e2-highcpu-8 \
#     --timeout=1800s .
#
# Notes:
#   * _DEPS_TAG must reference a deps image already in Artifact Registry. The
#     Makefile auto-detects the most recent SHA tag; pass DEPS_TAG= on the
#     command line to pin a specific one.
#   * This config is INTENTIONALLY restricted to a single service. For
#     "rebuild api + workspace-manager + preview-proxy + a fresh deps",
#     use infra/cloudbuild/runtime-tier.yaml instead.
#   * _SHORT_SHA tags the produced image. Production helm pins
#     `global.imageTag` to a SHA, so when you upgrade with only one
#     service rebuilt at the new SHA, the other six deployments will
#     ImagePullBackOff — re-tag or rebuild the rest. See
#     docs/INFRASTRUCTURE.md → "Targeted Rebuilds".
substitutions:
  # Dockerfile du service. Par defaut l'image node generique ; le screenshotter
  # passe `_DOCKERFILE=infra/docker/screenshotter.Dockerfile` (base
  # Playwright/Chromium). Parametre plutot que duplique : un second fichier de
  # build divergerait du premier des la premiere evolution.
  _DOCKERFILE: infra/docker/node-service.Dockerfile
  _REGION: europe-west9
  _PROJECT: vibecore-495216
  _REPO: vibecore-prod-containers
  _SERVICE: api
  _PACKAGE_FILTER: '@vibecore/api'
  _START_CMD: tsx dist/server.js
  _DEPS_TAG: latest
  _SHORT_SHA: dev
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 200
  env:
    - DOCKER_BUILDKIT=1

timeout: 1800s

steps:
  # ---- 1. prime cache ----
  # Pull the pinned deps image (mandatory) and the previous service :latest
  # (best-effort) so `--cache-from` has layers to match against.
  - id: prime-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "::: pulling deps:${_DEPS_TAG}"
        docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_DEPS_TAG}
        echo "::: pulling ${_SERVICE}:latest (best-effort)"
        docker pull ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:latest || true

  # ---- 2. build the one service ----
  - id: build-service
    name: gcr.io/cloud-builders/docker
    waitFor: ['prime-cache']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -f=${_DOCKERFILE}
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=DEPS_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/deps:${_DEPS_TAG}
      - --build-arg=PACKAGE_FILTER=${_PACKAGE_FILTER}
      - --build-arg=START_CMD=${_START_CMD}
      - --cache-from=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:latest
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:latest
      - .

  # ---- 3. vulnerability scan (non-blocking) ----
  - id: scan-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['build-service']
    allowFailure: true
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        echo "::: scanning ${_SERVICE}:${_SHORT_SHA}"
        gcloud artifacts docker images scan \
          "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:${_SHORT_SHA}" \
          --location="${_REGION}" \
          --format='value(response.scan)' \
          || echo "WARN: scan failed for ${_SERVICE} (non-fatal)"

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:latest
