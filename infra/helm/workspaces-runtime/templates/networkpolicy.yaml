apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-controlled-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vibecore-workspace
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The project's integrated database (CNPG, `project-databases`). The Database
    # panel talks to Postgres from the API pod, so the panel itself works even
    # without this rule — but the user's app, running in THIS pod, could not open
    # a socket: DNS resolved the pooler and the TCP connect then hung until the
    # client gave up (proven live 2026-08-06, cluster-C audit). The deployed app
    # already had this egress via `server-deploy-egress`; dev and prod must agree,
    # otherwise code that works once deployed is broken in the IDE.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.databaseNamespace | default "project-databases" | quote }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: {{ .Values.network.packageRegistryCidr | quote }}
            except:
{{- range .Values.network.blockedCidrs }}
              - {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-manager-preview-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vibecore-workspace
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platformNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: workspace-manager
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platformNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platformNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: preview-proxy
      ports:
        - protocol: TCP
          port: 8080
---
# Server deployments (Replit-parity durable runtime). The preview-proxy fronts the
# PUBLIC app URL `d-<deploymentId>.<previewDomain>` and forwards it to the app-<id>
# Service/pod. These pods carry `vibecore.ai/server-deploy` (NOT the workspace label)
# and listen on a per-deployment app port, so the workspace-preview policy above
# (which matches app.kubernetes.io/name=vibecore-workspace on the fixed agent port
# 8080) does not cover them — under the namespace default-deny the proxy's fetch to
# app-<id> failed and the public URL fell back to the "app is booting" page. Allow the
# preview-proxy IN on all ports (the app port varies per deployment; the proxy is the
# only front door for public traffic).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-deploy-preview-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: vibecore.ai/server-deploy
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platformNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: preview-proxy
---
# Server-deployment egress (Replit-parity Lot 2): the deployed app must reach its
# OWN production database + DNS + the internet. These pods carry
# `vibecore.ai/server-deploy` (not the workspace label), so the workspace
# controlled-egress above (which only grants DNS + 443 to vibecore-workspace pods)
# leaves them under the namespace default-deny with NO egress at all — a deployed
# app couldn't resolve DNS or connect to Postgres. Allow: DNS, the per-project
# CNPG databases on 5432, and outbound HTTPS (metadata + private ranges blocked).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-deploy-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: vibecore.ai/server-deploy
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.databaseNamespace | default "project-databases" | quote }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: {{ .Values.network.packageRegistryCidr | quote }}
            except:
{{- range .Values.network.blockedCidrs }}
              - {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 443
