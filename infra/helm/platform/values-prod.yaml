global:
  environment: production
  imageRegistry: europe-west9-docker.pkg.dev/vibecore-495216/vibecore-prod-containers
  # imageTag MUST be overridden at deploy time with an immutable SHA tag, e.g.
  #   helm upgrade ... --set global.imageTag=sha-abc1234
  # The sentinel below makes an accidental `helm upgrade -f values-prod.yaml`
  # fail fast on ImagePullBackOff instead of silently pulling a stale image.
  imageTag: REQUIRED_OVERRIDE_AT_DEPLOY
  appDomain: app.e-code.ai
  previewDomain: preview.e-code.ai
  marketingDomain: e-code.ai
  apiDomain: api.e-code.ai
  workspaceManagerDomain: workspace-manager.e-code.ai
  dns01:
    enabled: true
    project: vibecore-495216
    hostedZoneName: e-code-ai
  labels:
    app.kubernetes.io/part-of: vibecore
  workloadIdentity:
    web: ''
    admin: ''
    api: ''
    worker: ''
    aiGateway: ''
    workspaceManager: ''
    previewProxy: ''

secrets:
  existingSecret: vibecore-platform-secrets
  # K8s Secret key → GCP Secret Manager secret name. The bootstrap script
  # in docs/DEPLOYMENT.md (Step 2) reads each GCP secret and writes the
  # resulting key/value pairs into the K8s Secret named above, which every
  # Deployment consumes via envFrom. The chart templates themselves don't
  # iterate this map yet (Phase 1 will introduce External Secrets Operator);
  # for now it is the auditable source of truth and must stay in sync with
  # the bash MAP in the runbook. When you add a secret here, also add it to
  # the runbook so the next re-sync picks it up.
  secretManagerMap:
    DATABASE_URL: vibecore-prod-database-url
    REDIS_URL: vibecore-prod-redis-url
    JWT_SECRET: vibecore-prod-jwt-secret
    COOKIE_SECRET: vibecore-prod-cookie-secret
    CONFIG_ENCRYPTION_KEY: vibecore-prod-encryption-key
    WORKSPACE_AGENT_TOKEN_SECRET: vibecore-prod-workspace-agent-token-secret
    BACKUP_ENCRYPTION_KEY: vibecore-prod-backup-encryption-key
    SIEM_SIGNING_SECRET: vibecore-prod-siem-signing-secret
    GOOGLE_CLIENT_ID: vibecore-prod-google-client-id
    GOOGLE_CLIENT_SECRET: vibecore-prod-google-client-secret
    GITHUB_CLIENT_ID: vibecore-prod-github-client-id
    GITHUB_CLIENT_SECRET: vibecore-prod-github-client-secret
    INTEGRATION_GITHUB_CLIENT_ID: vibecore-prod-integration-github-client-id
    INTEGRATION_GITHUB_CLIENT_SECRET: vibecore-prod-integration-github-client-secret
    INTEGRATION_GITLAB_CLIENT_ID: vibecore-prod-integration-gitlab-client-id
    INTEGRATION_GITLAB_CLIENT_SECRET: vibecore-prod-integration-gitlab-client-secret
    INTEGRATION_BITBUCKET_CLIENT_ID: vibecore-prod-integration-bitbucket-client-id
    INTEGRATION_BITBUCKET_CLIENT_SECRET: vibecore-prod-integration-bitbucket-client-secret
    OPENAI_API_KEY: vibecore-prod-openai-api-key
    ANTHROPIC_API_KEY: vibecore-prod-anthropic-api-key
    GOOGLE_GEMINI_API_KEY: vibecore-prod-google-gemini-api-key
    # Same Google key under the env name the web LLM provider expects
    # (app/lib/modules/llm/providers/google.ts `apiTokenKey`). The ai-gateway
    # reads GOOGLE_GEMINI_API_KEY; the web direct-provider path + the managed
    # selector trim read GOOGLE_GENERATIVE_AI_API_KEY. Point both at the one
    # secret so every code path resolves Google. (Same value, no new secret.)
    GOOGLE_GENERATIVE_AI_API_KEY: vibecore-prod-google-gemini-api-key
    XAI_API_KEY: vibecore-prod-xai-api-key
    MOONSHOT_API_KEY: vibecore-prod-moonshot-api-key
    STRIPE_SECRET_KEY: vibecore-prod-stripe-secret-key
    STRIPE_WEBHOOK_SECRET: vibecore-prod-stripe-webhook-secret
    EMAIL_HTTP_TOKEN: vibecore-prod-email-http-token
    PREVIEW_PROXY_SHARED_SECRET: vibecore-prod-preview-proxy-shared-secret
    # Gate for the workspace-manager control plane (start/stop/gc/agent-token).
    # The manager is fail-closed (503) in prod without it, and api+worker send
    # the bearer ONLY from this var — so it MUST be provisioned on every fresh/DR
    # install, not hand-patched out-of-band. Same value across api, worker, ws-mgr.
    WORKSPACE_MANAGER_SHARED_SECRET: vibecore-prod-workspace-manager-shared-secret
    # Svix-format signing secret from the Resend dashboard. Verifies POSTs
    # to /webhooks/resend (services/api/src/app.ts:5217); the route returns
    # 503 WEBHOOK_NOT_CONFIGURED until this is populated.
    RESEND_WEBHOOK_SECRET: vibecore-prod-resend-webhook-secret
    SENTRY_DSN: vibecore-prod-sentry-dsn

# OAuth provider URLs, in-cluster api URL, and platform-admin allowlist.
# These are public well-known endpoints (Google/GitHub) plus operational
# config — none of them are secrets. Mounted via a ConfigMap so they live
# in version-controlled chart values, not Secret Manager.
platformEnv:
  saasApiUrl: 'http://vibecore-vibecore-platform-api.vibecore.svc.cluster.local:3001'
  apiBaseUrl: 'http://vibecore-vibecore-platform-api.vibecore.svc.cluster.local:3001'
  # P11 auto thumbnails. Leave EMPTY until the screenshotter is deployed — while
  # empty the API's capture triggers are inert. When enabling, set the URL to the
  # in-cluster service and provision SCREENSHOTTER_SHARED_SECRET in the platform
  # secret (the API sends it as a Bearer; the pod verifies it).
  #   screenshotterUrl: 'http://vibecore-vibecore-platform-screenshotter.vibecore.svc.cluster.local:3030'
  #   screenshotterAllowedHosts: 'preview.e-code.ai'
  screenshotterUrl: ''
  screenshotterAllowedHosts: ''
  publicApiBaseUrl: 'https://api.e-code.ai'
  # Comma-separated emails. PlatformAdmin grants global console access
  # (services/api/src/app.ts:2224). Edit cautiously.
  platformAdminEmails: 'avi@snatchbot.me,groupequaliwatt@gmail.com'
  # Fastify must trust X-Forwarded-* headers because traffic arrives via the
  # GKE ingress (ingress-nginx). Without this, request.ip is always the proxy
  # pod IP, breaking audit logs, rate-limits, and OAuth callback origin checks.
  trustProxy: 'true'
  # Shared NFS path for API project files and static-deployment artifacts.
  # When `storage.enabled=true` (below) the chart sets both PROJECT_STORAGE_DIR
  # and STATIC_DEPLOY_STORAGE_DIR via per-pod env vars that override these
  # ConfigMap values, so the literals here only show the default fallback.
  # Keep them in sync with `storage.mountPath` for sanity.
  projectStorageDir: '/data/vibecore/projects'
  staticDeployStorageDir: '/data/vibecore/static-deployments'
  # NOTE: ADMIN_MFA_REQUIRED is hardcoded "false" in templates/configmap.yaml
  # (MFA optional for everyone — Avi's decision; reuse-values would ignore a
  # values key here). To re-require admin MFA, flip that literal to "true".
  runtime:
    mode: 'remote-kubernetes'
    apiBaseUrl: 'https://api.e-code.ai/api/runtime'
    workspaceManagerUrl: 'http://vibecore-vibecore-platform-workspace-manager.vibecore.svc:3010'
    # In-cluster ai-gateway service (port 3030). Required: without it the api
    # defaults to localhost and every AI chat completion 500s.
    aiGatewayUrl: 'http://vibecore-vibecore-platform-ai-gateway.vibecore.svc:3030'
    workspaceRuntimeNamespace: 'workspaces'
    workspaceStorageClass: 'workspace-standard-rwo'
    workspaceAgentImage: 'europe-west9-docker.pkg.dev/vibecore-495216/vibecore-prod-containers/workspace-agent:sha-7704c1dd6b'
    # Host-based preview: the {workspaceId}-{port} subdomain already identifies
    # the workspace+port and the preview-proxy host-routes EVERY path to the dev
    # server, so the URL must be the host ROOT. A '/p/<ws>/<port>/' path prefix
    # here is redundant for assets AND breaks any app that uses a client-side
    # router (BrowserRouter reads window.location.pathname; '/p/<ws>/<port>/'
    # matches no route, so the app renders blank). Host-root works for relative
    # assets, root-relative assets, and client routing alike (verified live).
    previewUrlTemplate: 'https://{workspaceId}-{port}.preview.e-code.ai/'
    # Snapshot-image server deploys (Publish = the workspace, imaged). ⚠️ CD
    # upgrades with --reuse-values: these keys reach the release only via a
    # one-time manual `--set platformEnv.runtime.serverDeployImageRepo=...`.
    serverDeployImageRepo: 'europe-west9-docker.pkg.dev/vibecore-495216/vibecore-prod-apps'
    serverDeploySnapshotImage: '1'
    # Reproducible pipeline: per-project allowlist ('*' = all). Rolled out
    # project-by-project after live proof; empty = Phase-A snapshot path.
    serverDeployRevisionProjects: ''
    # Shared RO Nix store (candidate E) rollout gate: PVC in ns `workspaces`.
    # Resynced 2026-07-20 to the LIVE generation-2 PVC (the file said
    # `nix-store-spike-pvc` while prod ran v2 via --set — a full-values manual
    # deploy would have silently reverted the store). ⚠️ The per-project
    # allowlist (`nixProjects`) is live-managed via --set; a full-values deploy
    # must re-assert it or Nix turns off for the allowlisted projects.
    nixStorePvc: 'nix-store-v2-pvc'
    nixProjects: ''
    # D3 multi-zone (approved 2026-07-17): identical zonal clones of the v2
    # store (snapshot nix-store-v2-gen2-20260717), preference order a → b.
    # The drift guard hash is the sha256 of /nix/ecode/catalog.json, identical
    # on both clones (proven at clone time). ⚠️ CD uses --reuse-values: these
    # reach the release via a one-time --set (see D3 runbook/evidence).
    nixStorePvcZones: 'europe-west9-a=nix-store-v2-pvc,europe-west9-b=nix-store-v2-b-pvc'
    nixGenerationHash: 'sha256:3029b5810ba485844f1029132f3f00652075e1e2c0cbb454992d3a94aa8fd5d5'
    # CTR-RUNTIME-NIX: le REGISTRE de générations (rotation/révocation) — quand
    # il est posé, il remplace le trio legacy ci-dessus comme source de vérité
    # (une seule entrée ACTIVE; REVOKED = refus typé partout). Données gen-2
    # relevées sur le store LIVE le 2026-07-22 (catalog.json + manifests hashés).
    nixGenerations: '{"schemaVersion":1,"generations":[{"id":"gen-2","status":"ACTIVE","catalogSha256":"sha256:3029b5810ba485844f1029132f3f00652075e1e2c0cbb454992d3a94aa8fd5d5","nixVersion":"2.34.8","nixpkgs":{"channel":"nixos-26.05","rev":"8eeec934ae0dbeca3d7868c059568a65c08b2fc3"},"storePublicKey":"ecode-nix-1:J/eP9X5r7KWkjAVGioyGv79KFmnHTDCo+qGDoy3LoVk=","zones":{"europe-west9-a":"nix-store-v2-pvc","europe-west9-b":"nix-store-v2-b-pvc"},"bundles":[{"name":"go","storePath":"/nix/store/wj08cpff4x0fql7mkvp01jfs8lvik2wj-ecode-env-go","sha256":"d1f15e4f642e565bcfc1e5044b60b4c1ff80666aba5bec2e6140d4a4f39d4bf5"},{"name":"nodejs22","storePath":"/nix/store/c0dyns39xzkgblqwzda20pz5smm18rlx-ecode-env-nodejs-22","sha256":"6f133d267d14cd8fc84cff74a1ecbda164fbda867851cbf82d990d3cdeedd402"},{"name":"python312","storePath":"/nix/store/vyv024fnqmzz1aklrysgd3vmwixgplgg-ecode-env-python-3.12","sha256":"ac06cde244ee0a2a7f0c400848245a75123cf408277cc22caf06540563a083ce"}],"publishedAt":"2026-07-15T15:43:48Z"}]}'
    # D2 (approved 2026-07-17): server rollback re-deploys the retained image
    # BY DIGEST, permanently — previously `kubectl set env` only, which the
    # next helm upgrade wiped, silently reviving the URL-copy pseudo-rollback.
    # ⚠️ CD upgrades with --reuse-values: deploy-main.yml also re-asserts this
    # via --set on every run, and the configmap template defaults to "1".
    serverDeployRollbackFromDigest: '1'
  email:
    httpEndpoint: 'https://api.resend.com/emails'
    from: 'no-reply@e-code.ai'
  # Non-secret Stripe catalog IDs. Populate from `pnpm stripe:seed` after
  # rotating STRIPE_SECRET_KEY; empty values are intentionally omitted from
  # the rendered ConfigMap so they cannot mask Secret-sourced env values.
  # Free has no checkout (short-circuits with STRIPE_FREE_NO_CHECKOUT) and
  # Enterprise routes to /contact-sales (STRIPE_ENTERPRISE_CONTACT_SALES),
  # so only Pro and Team need real price IDs for self-serve checkout.
  stripe:
    freeProductId: ''
    freePriceId: ''
    proProductId: 'prod_SmqeF8z5hVEDgn'
    proPriceId: 'price_1RrGxL2VSIgdqPLPk54OZhZX'
    teamProductId: 'prod_SmqqkOPRY15MGD'
    teamPriceId: 'price_1RrH8b2VSIgdqPLPCDou48K3'
    enterpriseProductId: ''
    enterprisePriceId: 'price_1RrHLq2VSIgdqPLP9Z9KniIZ'
  google:
    authorizationUrl: 'https://accounts.google.com/o/oauth2/v2/auth'
    tokenUrl: 'https://oauth2.googleapis.com/token'
    userinfoUrl: 'https://openidconnect.googleapis.com/v1/userinfo'
    redirectUri: 'https://app.e-code.ai/auth/oauth/google/callback'
    scope: 'openid email profile'
  github:
    authorizationUrl: 'https://github.com/login/oauth/authorize'
    tokenUrl: 'https://github.com/login/oauth/access_token'
    userinfoUrl: 'https://api.github.com/user'
    redirectUri: 'https://app.e-code.ai/auth/oauth/github/callback'
    scope: 'read:user user:email'

ingress:
  className: nginx
  issuerName: letsencrypt-dns01
  tlsSecretName: vibecore-platform-tls
  previewTlsSecretName: vibecore-preview-wildcard-tls
  proxyReadTimeoutSeconds: 180
  proxySendTimeoutSeconds: 180

services:
  # Optional `imageTag` on any service overrides `global.imageTag` for that
  # service only. This keeps emergency backend/runtime rollouts narrow while
  # preserving immutable tags in production.
  web:
    enabled: true
    image: web
    port: 3000
    # 2 replicas → PDB minAvailable: 1 activates (template guards on replicas>1)
    # so rolling updates and node drains never take the public site to zero.
    replicas: 2
    command: []
    path: /
    resources:
      # Remix SSR routinely exceeds 512Mi (RSS + heap) and would be OOMKilled.
      # The namespace quota has ample room; give it 1Gi headroom like staging.
      requests: { cpu: 100m, memory: 384Mi }
      limits: { cpu: 500m, memory: 1Gi }
  admin:
    enabled: true
    image: admin
    port: 3000
    replicas: 2
    path: /admin
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
  api:
    enabled: true
    image: api
    port: 3001
    replicas: 2
    # HPA cap (templates/hpa.yaml). Default would be replicas*5 = 10; we hold
    # the API at 6 because beyond that, Filestore-backed /data/vibecore IO
    # becomes the bottleneck before CPU does — adding pods only raises NFS
    # contention instead of throughput.
    maxReplicas: 6
    path: /api
    # /ready hits Postgres + Redis (services/api/src/app.ts:3575). On a
    # transient DB hiccup the pod drops out of the Service without being
    # killed, so users hit a healthy replica instead of a 5xx mid-request.
    readyPath: /ready
    resources:
      # The API does zip imports / static builds in-process; 512Mi OOMKills it
      # under load. Match staging headroom (1Gi).
      requests: { cpu: 100m, memory: 384Mi }
      limits: { cpu: 500m, memory: 1Gi }
  worker:
    enabled: true
    image: worker
    port: 3002
    # Queue worker: a single consumer is fine, BullMQ handles dedup. Keeping
    # replicas: 1 avoids paying for an idle second worker. Re-evaluate once
    # queue depth justifies a second consumer.
    replicas: 1
    path: ''
    # No HTTP listener — background consumer driven by Redis/Postgres.
    # An exec probe keeps liveness honest while the pod has no /health route.
    httpHealth: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  aiGateway:
    enabled: true
    image: ai-gateway
    # ai-gateway binary binds 3030 (services/ai-gateway/src/server.ts AI_GATEWAY_PORT default).
    port: 3030
    replicas: 2
    path: /ai
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  workspaceManager:
    enabled: true
    image: workspace-manager
    # workspace-manager binary binds 3010 (services/workspace-manager/src/server.ts).
    # B4 landed: PrismaWorkspaceStore lets replicas > 1 share Postgres-backed
    # state — PDB activates because replicas > 1.
    port: 3010
    replicas: 2
    path: /runtime
    # Optional operator override (JSON) for the per-plan FALLBACK per-workspace
    # pod resource table in @vibecore/k8s-client (used when a plan carries no
    # custom entitlement). Partial per plan/field; malformed values fall back to
    # the built-in code defaults per field (request can never exceed limit,
    # limits clamped to the LimitRange max). Empty (the default) → the built-in
    # defaults apply, which already request 250-500m and burst to 1-4 cores.
    # Injected as WORKSPACE_PLAN_RESOURCES_JSON only on this pod. Example:
    #   planResourcesJson: '{"team":{"cpuRequest":"400m"},"enterprise":{"cpuRequest":"600m"}}'
    planResourcesJson: ''
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  previewProxy:
    enabled: true
    image: preview-proxy
    # preview-proxy binary binds 3020 (services/preview-proxy/src/server.ts).
    port: 3020
    replicas: 2
    path: /
    host: '*.preview.e-code.ai'
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  # P11 automatic thumbnails — headless Chromium render service.
  # ⚠️ INFRA-GATED: keep enabled:false until Avi validates the envelope. Flip to
  # true (and provision SCREENSHOTTER_SHARED_SECRET in the platform secret) to
  # deploy. The API triggers stay inert until SCREENSHOTTER_URL is configured, so
  # this whole change is safe to merge with the pod absent.
  screenshotter:
    enabled: false
    image: screenshotter
    port: 3030
    replicas: 1
    path: ''
    readOnlyRootFilesystem: false
    tmpSizeLimit: 512Mi
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }

# Shared NFS storage backing the API's project files and static deployment
# artifacts. Mounted at /data/vibecore on every API pod so all replicas see
# the same on-disk state — the prerequisite for scaling the API beyond 1
# replica without losing data between requests.
#
# Backed by GCP Filestore (instance `vibecore-shared` in europe-west9-a,
# 1 TiB BASIC_HDD, NFSv3) on vibecore-prod-vpc. Created out-of-band via:
#   gcloud filestore instances create vibecore-shared \
#     --project=vibecore-495216 --zone=europe-west9-a \
#     --tier=BASIC_HDD --file-share=name=vibecore_data,capacity=1TB \
#     --network=name=vibecore-prod-vpc
# The NFS export uses NO_ROOT_SQUASH for 10.0.0.0/8 so the CSI driver's
# kubelet (running as root) can chown the mount root to gid 1000 on
# attach. Mounts go through the GKE Filestore CSI driver — the only
# Kubernetes-managed path that honors fsGroup on NFS volumes. Enable the
# driver once per cluster:
#   gcloud container clusters update vibecore-prod-app \
#     --region=europe-west9 --update-addons=GcpFilestoreCsiDriver=ENABLED
# reclaimPolicy=Retain means deleting the chart's PVC leaves the Filestore
# data intact — destroying the instance is a separate, deliberate operation.
storage:
  enabled: true
  mountPath: /data/vibecore
  projectSubpath: projects
  staticDeploySubpath: static-deployments
  pv:
    create: true
    name: vibecore-shared-csi
    capacity: 1Ti
    accessModes:
      - ReadWriteMany
    reclaimPolicy: Retain
    bindToClaim: true
    driver: csi-filestore
    csi:
      # Filestore reserved IP (see `gcloud filestore instances describe
      # vibecore-shared --location=europe-west9-a`). Lives on
      # vibecore-prod-vpc, peered with the GKE cluster — no extra firewall
      # rule needed for in-VPC pods.
      ip: '10.18.14.98'
      volume: 'vibecore_data'
      volumeHandle: 'modeInstance/europe-west9-a/vibecore-shared/vibecore_data'
  pvc:
    name: vibecore-shared-csi
    accessModes:
      - ReadWriteMany
    storage: 1Ti
    storageClassName: ''

podSecurity:
  enabled: true
  enforce: restricted

networkPolicy:
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
  # kube-dns ClusterIP of vibecore-prod-app, read live:
  #   kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'
  #     ->  10.30.0.10
  # Renders allow-dns-clusterip as a /32. Current prod does NOT need it — it runs
  # ADVANCED_DATAPATH (Dataplane V2), where the namespaceSelector DNS rule
  # matches — and a NetworkPolicy union can only add an allow, so this is inert
  # here. It is pinned because a DR rebuild may land on a dataplane that
  # evaluates egress before service DNAT, where its absence takes ALL DNS down.
  dnsServiceIp: 10.30.0.10
  # PINNED to the EXACT ranges the live cluster uses (Cloud SQL 10.237.1.2 ∈
  # 10.237.1.0/24:5432, Memorystore Redis 10.237.0.4 ∈ 10.237.0.0/24:6379).
  # Previously prod relied on the chart's inline staging defaults; a fresh/DR
  # deploy auto-allocates a different private range and would silently break
  # DB/Redis egress. Pinning here makes the policy explicit + deterministic; the
  # values equal what's already live, so applying this is a no-op on current prod.
  databaseRedisEgress:
    postgresCidr: 10.237.1.0/24
    postgresPort: 5432
    redisCidr: 10.237.0.0/24
    redisPort: 6379
