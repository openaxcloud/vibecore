global:
  environment: production
  imageRegistry: europe-west9-docker.pkg.dev/vibecore-495216/vibecore-prod-containers
  imageTag: latest
  appDomain: app.e-code.ai
  previewDomain: preview.e-code.ai
  marketingDomain: e-code.ai
  apiDomain: api.e-code.ai
  workspaceManagerDomain: workspace-manager.e-code.ai
  dns01:
    enabled: true
    project: vibecore-495216
    hostedZoneName: e-code-ai
  labels:
    app.kubernetes.io/part-of: vibecore
  workloadIdentity:
    web: ""
    admin: ""
    api: ""
    worker: ""
    aiGateway: ""
    workspaceManager: ""
    previewProxy: ""

secrets:
  existingSecret: vibecore-platform-secrets

ingress:
  className: nginx
  issuerName: letsencrypt-dns01
  tlsSecretName: vibecore-platform-tls
  previewTlsSecretName: vibecore-preview-wildcard-tls

services:
  web:
    enabled: true
    image: web
    port: 5173
    replicas: 1
    command: []
    path: /
    healthPath: /
    readOnlyRootFilesystem: false
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { cpu: "1", memory: 2Gi }
  admin:
    enabled: false
    image: admin
    port: 3000
    replicas: 1
    path: /admin
    healthPath: ""
    readOnlyRootFilesystem: false
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  api:
    enabled: true
    image: api
    port: 3001
    replicas: 1
    path: /api
    command: ["tsx", "dist/server.js"]
    healthPath: /health
    readOnlyRootFilesystem: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  worker:
    enabled: true
    image: worker
    port: 3002
    replicas: 1
    path: ""
    command: ["tsx", "dist/index.js"]
    healthPath: ""
    readOnlyRootFilesystem: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  aiGateway:
    enabled: true
    image: ai-gateway
    port: 3030
    replicas: 1
    path: /ai
    command: ["tsx", "dist/server.js"]
    healthPath: /health
    readOnlyRootFilesystem: false
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
  workspaceManager:
    enabled: true
    image: workspace-manager
    port: 3010
    replicas: 1
    path: /runtime
    command: ["tsx", "dist/server.js"]
    healthPath: /health
    readOnlyRootFilesystem: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  previewProxy:
    enabled: true
    image: preview-proxy
    port: 3020
    replicas: 1
    path: /
    host: "*.preview.e-code.ai"
    command: ["tsx", "dist/server.js"]
    healthPath: /health
    readOnlyRootFilesystem: false
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

podSecurity:
  enabled: true
  enforce: restricted

networkPolicy:
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
