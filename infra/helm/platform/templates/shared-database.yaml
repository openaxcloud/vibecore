{{- /*
  Free-tier shared Postgres cluster (CloudNativePG) + PgBouncer Pooler.

  Every FREE-plan project gets a logical database + isolated owner role on THIS
  one HA cluster (paid plans get a dedicated per-project Cluster instead — see
  database-provisioner.ts resolveDatabaseTier). The api provisions each tenant
  through the workspace-manager: it reads this cluster's `<name>-app` admin
  secret and runs CREATE ROLE / CREATE DATABASE / REVOKE CONNECT … FROM PUBLIC.
  That admin role therefore needs CREATEDB + CREATEROLE, granted here via
  bootstrap.initdb.postInitSQL.

  GATED OFF by default: `database.sharedCluster.enabled` defaults to false, so the
  always-on `helm upgrade --reuse-values` CD path (which drops new values keys)
  never materialises this heavy cluster on an existing release. Enable explicitly
  with `--set database.sharedCluster.enabled=true` once free-tier provisioning is
  meant to go live. project-databases is provisioned out-of-band (Phase 1).
*/ -}}
{{- /*
  Nil-safe gate: the always-on `helm upgrade --reuse-values` CD path reuses the
  LIVE release's values and does NOT merge this chart's values.yaml, so on an
  existing release `.Values.database` has no `sharedCluster` key and a direct
  `.Values.database.sharedCluster.enabled` chain is a nil-pointer (this broke
  every prod deploy after the free-tier DB commit). `dig` traverses safely with
  a `false` default, so the cluster stays gated off until an explicit
  `--set database.sharedCluster.enabled=true`.
*/ -}}
{{- if dig "sharedCluster" "enabled" false (.Values.database | default dict) }}
{{- /*
  Nil-safe BODY too: `--reuse-values --set database.sharedCluster.enabled=true`
  leaves $sc as just `{enabled: true}` — every nested block (resources, pooler,
  backup) is absent, so a `$sc.resources.requests.cpu` chain nil-pointers BEFORE
  the leaf `default` runs. Default each level to an empty dict first so the
  template renders with built-in defaults from `--set enabled=true` alone.
*/ -}}
{{- $sc := .Values.database.sharedCluster | default dict }}
{{- $name := $sc.name | default "shared-pg-0" }}
{{- $res := $sc.resources | default dict }}
{{- $resReq := $res.requests | default dict }}
{{- $resLim := $res.limits | default dict }}
{{- $pooler := $sc.pooler | default dict }}
{{- $backup := $sc.backup | default dict }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  namespace: project-databases
  labels:
    app.kubernetes.io/name: vibecore-shared-database
    app.kubernetes.io/managed-by: vibecore
spec:
  instances: {{ $sc.instances | default 3 }}
  storage:
    size: {{ $sc.storageGi | default 10 }}Gi
  resources:
    requests:
      cpu: {{ $resReq.cpu | default "500m" | quote }}
      memory: {{ $resReq.memory | default "1Gi" | quote }}
    limits:
      cpu: {{ $resLim.cpu | default "2" | quote }}
      memory: {{ $resLim.memory | default "2Gi" | quote }}
  # The CNPG-managed `app` role provisions tenants, so it needs CREATEDB +
  # CREATEROLE. Idempotent — postInitSQL only runs on first bootstrap.
  bootstrap:
    initdb:
      postInitSQL:
        - ALTER ROLE app CREATEDB CREATEROLE
  {{- if $backup.enabled }}
  {{- if $backup.serviceAccount }}
  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: {{ $backup.serviceAccount | quote }}
  {{- end }}
  backup:
    barmanObjectStore:
      destinationPath: gs://{{ $backup.bucket }}/db/{{ $name }}
      googleCredentials:
        gkeEnvironment: true
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: {{ $backup.retentionDays | default 7 }}d
  {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ $name }}-pooler
  namespace: project-databases
  labels:
    app.kubernetes.io/name: vibecore-shared-database-pooler
    app.kubernetes.io/managed-by: vibecore
spec:
  cluster:
    name: {{ $name }}
  instances: {{ $pooler.instances | default 2 }}
  type: rw
  pgbouncer:
    poolMode: transaction
{{- end }}
