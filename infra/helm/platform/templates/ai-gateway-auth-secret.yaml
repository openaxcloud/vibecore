{{- /*
Shared-secret used to authenticate the api -> ai-gateway /chat/completions call
(audit wave-29 #30). The ai-gateway's /chat/completions was unauthenticated while
/v1/agent-runs required a bearer; this provisions the secret the api sends and the
gateway verifies.

The value is GENERATED here and PERSISTED across upgrades via `lookup`: on the
first install a random 48-char value is created; subsequent upgrades reuse the
existing value (so rotating pods/api+ai-gateway always agree). No operator action
or out-of-band Secret Manager entry is required — the chart owns this secret.

Enforcement is gated separately by platformEnv.aiGatewayRequireAuth so the secret
can reach BOTH pods (api sends it, gateway reads it) before /chat/completions
starts REQUIRING it — flipping aiGatewayRequireAuth to "true" is the safe last step.
*/ -}}
{{- $secretName := printf "%s-ai-gateway-auth" (include "vibecore-platform.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $value := "" -}}
{{- if and $existing $existing.data (index $existing.data "AI_GATEWAY_SHARED_SECRET") -}}
{{- $value = index $existing.data "AI_GATEWAY_SHARED_SECRET" | b64dec -}}
{{- else -}}
{{- $value = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/part-of: vibecore
  annotations:
    # Keep the generated value if this template is ever re-rendered without lookup
    # (e.g. a `helm template` diff) — helm won't delete/replace on upgrade.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  AI_GATEWAY_SHARED_SECRET: {{ $value | b64enc | quote }}
