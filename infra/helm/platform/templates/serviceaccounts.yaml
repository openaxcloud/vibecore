{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vibecore-platform.fullname" $ }}-{{ kebabcase $name }}
  {{- $gcpServiceAccount := index $.Values.global.workloadIdentity $name }}
  {{- if $gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ $gcpServiceAccount | quote }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ kebabcase $name }}
    app.kubernetes.io/part-of: vibecore
{{- end }}
{{- end }}
