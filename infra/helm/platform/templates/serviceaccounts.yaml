{{- if eq (.Values.platformEnv.cloudTenantFactoryEnabled | default "false" | toString) "true" }}
{{- if not (.Values.global.workloadIdentity.api | default "") }}
{{- fail "cloudTenantFactoryEnabled=true requires global.workloadIdentity.api (ADC/Workload Identity; JSON keys are forbidden)" }}
{{- end }}
{{- if not (.Values.platformEnv.cloudTenantAllowedParentFolders | default "") }}
{{- fail "cloudTenantFactoryEnabled=true requires cloudTenantAllowedParentFolders" }}
{{- end }}
{{- if eq (.Values.platformEnv.cloudOperationWorker | default "off" | toString) "off" }}
{{- fail "cloudTenantFactoryEnabled=true requires cloudOperationWorker to be enabled" }}
{{- end }}
{{- end }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vibecore-platform.fullname" $ }}-{{ kebabcase $name }}
  {{- $gcpServiceAccount := index $.Values.global.workloadIdentity $name }}
  {{- if $gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ $gcpServiceAccount | quote }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ kebabcase $name }}
    app.kubernetes.io/part-of: vibecore
{{- end }}
{{- end }}
