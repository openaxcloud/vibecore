apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-required-egress
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
    # Native per-project databases (CloudNativePG Pooler / cluster Postgres in the
    # project-databases namespace) — needed by the api for the DATABASE_URL reconcile
    # + the SQL/data panel API. Egress-ALLOW only; carries no traffic until the
    # database feature flag is flipped, so this is a no-op for current prod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: project-databases
      ports:
        - protocol: TCP
          port: 5432
{{- $np := .Values.networkPolicy | default dict }}
{{- $dnsIp := $np.dnsServiceIp | default "" }}
{{- /* `| default true` would turn an explicit `false` back into true. */}}
{{- $acmeSolver := true }}
{{- if hasKey $np "acmeHttp01Solver" }}{{ $acmeSolver = $np.acmeHttp01Solver }}{{ end }}
{{- if $dnsIp }}
---
# DNS, allowed by ClusterIP and not by namespaceSelector.
#
# `allow-platform-required-egress` above authorises :53 towards the kube-system
# NAMESPACE, which is how everyone writes this rule — and on some dataplanes it
# is enough. It is NOT enough on a dataplane that evaluates egress policy BEFORE
# service DNAT: there the packet's destination is kube-dns's ClusterIP
# (a Service address, in the SERVICES range), which belongs to no pod, so no
# podSelector/namespaceSelector rule can ever match it. Result on a fresh
# install: every name lookup fails with EAI_AGAIN, the api can reach neither
# Redis nor its own siblings, /ready answers 503 — and the cause is invisible
# because the "allow DNS" rule is right there in the chart.
#
# Reproduced on the audit test cluster (Calico, classic datapath), 2026-08-07:
# kube-dns ClusterIP 10.30.0.10.
#
# Scoped to the kube-dns ClusterIP as a /32, NOT to the whole Service range: the
# earlier version allowed :53 to every Service address in the cluster, which
# would also reach any tenant- or third-party Service that happens to listen on
# 53 — a needlessly wide hole for a rule whose only job is to reach one address.
# Empty by default, so this renders only for the environments that need it.
# NetworkPolicies are a union, so this only ever ADDS an allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-clusterip
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" $dnsIp | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- if $acmeSolver }}
---
# ACME HTTP-01 solver pods must be reachable, or no certificate is ever issued.
#
# cert-manager creates its HTTP-01 solver Pods in the namespace of the Ingress
# being solved — this one. They carry cert-manager's own labels and none of the
# platform's, so `deny-all-default` blackholes them and
# `allow-ingress-controller` (which selects nothing in particular, but is an
# Ingress-type policy) does not save them either: the solver Pod is not selected
# by any policy that allows ingress, so it is unreachable. ingress-nginx returns
# 504 for /.well-known/acme-challenge/..., Let's Encrypt marks the challenge
# failed, no cert is issued, and every public URL stays broken. Reproduced on
# the audit test cluster, 2026-08-07.
#
# Scoped to the label cert-manager stamps on solver Pods, and to ingress only.
# Inert where HTTP-01 is not used (prod solves DNS-01, so no solver Pod ever
# matches) — kept default-on so a from-scratch install works without a values
# change, and so `--reuse-values` cannot drop it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-solver-ingress
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: ["Ingress"]
  ingress:
    - {}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
{{- range $key, $value := .Values.networkPolicy.ingressControllerNamespaceSelector }}
              {{ $key }}: {{ $value | quote }}
{{- end }}
---
# `deny-all-default` above blocks pod-to-pod traffic inside this namespace, so
# web→api, worker→api, ai-gateway→api etc. all fail. This policy re-opens
# intra-namespace traffic, scoped to pods labelled `app.kubernetes.io/part-of:
# vibecore` (all the chart's workloads carry that label — see deployments.yaml
# and cronjobs.yaml). Cross-namespace traffic stays blocked; only ingress-nginx
# (allow-ingress-controller above) and DNS/HTTPS egress (allow-platform-
# required-egress above) remain reachable from outside the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-platform
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: vibecore
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: vibecore
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: vibecore
---
# Runtime traffic leaves the platform namespace on port 8080 to reach
# workspace-agent pods. Keep it scoped to the runtime control-plane callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workspace-runtime-egress
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["api", "workspace-manager", "preview-proxy"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platformEnv.runtime.workspaceRuntimeNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vibecore-workspace
      ports:
        - protocol: TCP
          port: 8080
    # Server-deployment pods (Replit-parity durable runtime) carry
    # `vibecore.ai/server-deploy` (NOT the workspace label) and listen on a
    # per-deployment app port, so the workspace rule above (workspace label +
    # fixed :8080) does not let the preview-proxy reach them — the proxy's fetch
    # to app-<id> was default-denied and the public URL fell back to the "app is
    # booting" page. Allow egress to any server-deploy pod on all ports (the app
    # port varies per deployment; the proxy is the only public front door).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platformEnv.runtime.workspaceRuntimeNamespace | quote }}
          podSelector:
            matchExpressions:
              - key: vibecore.ai/server-deploy
                operator: Exists
{{- $dbEgress := .Values.networkPolicy.databaseRedisEgress | default dict }}
---
# Cloud SQL (Postgres) and Memorystore (Redis) are private-VPC endpoints, NOT
# pods, reached on 5432/6379 over RFC1918 IPs. deny-all-default + the 443-only
# egress rule above otherwise blocks them, so api/worker/ai-gateway cannot reach
# the DB/cache — a full outage on a NetworkPolicy-enforcing dataplane (this is
# Dataplane V2). Prod had this hand-patched out-of-band as a NetworkPolicy named
# `allow-database-redis-egress` (NOT helm-managed); bringing the rule into the
# chart makes a fresh/DR deploy self-contained. The chart object uses a distinct
# name (`-managed`) so helm doesn't collide with / try to adopt the pre-existing
# unmanaged object — both coexist additively, and the manual one can be deleted
# by an operator once this chart-managed policy is verified live. CIDRs/ports are
# overridable but defaulted inline so `helm upgrade --reuse-values` (which drops
# newly-added values keys) still renders them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-redis-egress-managed
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: {{ $dbEgress.postgresCidr | default "10.237.1.0/24" | quote }}
      ports:
        - protocol: TCP
          port: {{ $dbEgress.postgresPort | default 5432 }}
    - to:
        - ipBlock:
            cidr: {{ $dbEgress.redisCidr | default "10.237.0.0/24" | quote }}
      ports:
        - protocol: TCP
          port: {{ $dbEgress.redisPort | default 6379 }}
{{- if (index .Values.services "screenshotter").enabled }}
---
# P11 screenshotter egress (renders only when the service is enabled).
#
# The screenshotter loads project preview URLs and screenshots them, so its
# egress is the one thing worth constraining. It needs exactly:
#   1. DNS (kube-system:53) to resolve *.preview.e-code.ai,
#   2. 443 to the internet to fetch the preview (served via the public ingress),
#      but NEVER the cloud metadata IP (169.254.169.254),
#   3. intra-namespace to preview-proxy for any in-cluster preview path.
#
# NOTE (additivity): NetworkPolicies are a UNION. `allow-platform-required-egress`
# (podSelector {}) already grants every pod 443-to-internet-except-metadata and
# `allow-intra-namespace-platform` already grants pod-to-pod, so this policy does
# not tighten screenshotter below those today — it documents intent and is the
# hook for real isolation. To make it BINDING, exclude the screenshotter pod
# (app.kubernetes.io/name=screenshotter) from those two blanket policies. The
# enforced SSRF control meanwhile is the app-level SCREENSHOTTER_ALLOWED_HOSTS
# allowlist plus the existing 169.254.169.254 exception above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-screenshotter-egress
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: screenshotter
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: preview-proxy
      ports:
        - protocol: TCP
          port: {{ (index .Values.services "previewProxy").port | default 3020 }}
{{- end }}
