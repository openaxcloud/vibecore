{{- /*
  Native per-project database (CloudNativePG) RBAC.

  The api pod has no Kubernetes RBAC; it routes CNPG CustomResources + Secret reads
  through the workspace-manager (ManagerK8sPort → /databases/apply|resource|secret).
  The manager therefore needs create/get/delete on the CNPG CRs and read on the
  generated connection Secrets in the project-databases namespace.

  Kept as an always-rendered template (no new values key) so the always-on
  `helm upgrade --reuse-values` CD path applies it — see configmap.yaml DB_* note.
  The project-databases namespace is provisioned out-of-band (Phase 1), so this
  binds into it by literal name rather than creating it.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-manager-databases
  namespace: project-databases
  labels:
    app.kubernetes.io/part-of: vibecore
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "databases", "poolers", "scheduledbackups", "backups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    # get/list the CNPG `<cluster>-app` connection secret; create/update for the
    # shared-tier tenant connection secret written back at provision time.
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-manager-databases
  namespace: project-databases
  labels:
    app.kubernetes.io/part-of: vibecore
    app.kubernetes.io/managed-by: {{ .Release.Service }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vibecore-platform.fullname" . }}-workspace-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: workspace-manager-databases
  apiGroup: rbac.authorization.k8s.io
