{{- /*
  Native per-project database (CloudNativePG) RBAC.

  The api pod has no Kubernetes RBAC; it routes CNPG CustomResources + Secret reads
  through the workspace-manager (ManagerK8sPort → /databases/apply|resource|secret).
  The manager therefore needs create/get/delete on the CNPG CRs and read on the
  generated connection Secrets in the project-databases namespace.

  GATED to opt-in (`database.rbacManaged.enabled`, default false). These Role +
  RoleBinding were first created OUT-OF-BAND (kubectl, label managed-by=vibecore,
  no Helm ownership annotations) when project-databases was bootstrapped Phase 1.
  An always-rendered Helm copy therefore FAILS every `helm upgrade --reuse-values`
  with "exists and cannot be imported into the current release: invalid ownership
  metadata" — Helm refuses to adopt a resource it doesn't own. Default-off so the
  always-on CD path renders nothing here and the working out-of-band resource is
  left untouched (it keeps serving the DB feature). To hand ownership to Helm:
  annotate the live resources (`meta.helm.sh/release-name=vibecore`,
  `meta.helm.sh/release-namespace=vibecore`, label `app.kubernetes.io/managed-by=Helm`)
  THEN deploy with `--set database.rbacManaged.enabled=true`.

  Nil-safe gate (see shared-database.yaml): --reuse-values drops new chart keys,
  so traverse with `dig`/default rather than a bare `.enabled` chain.
*/ -}}
{{- if dig "rbacManaged" "enabled" false (.Values.database | default dict) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-manager-databases
  namespace: project-databases
  labels:
    app.kubernetes.io/part-of: vibecore
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    # Shared Poolers are Helm-owned and deliberately outside manager authority.
    resources: ["clusters", "databases", "scheduledbackups", "backups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    # get/list the CNPG `<cluster>-app` connection secret; create/update for the
    # shared-tier tenant connection secret written back at provision time. Delete
    # is needed only by the fenced permanent-deletion endpoint.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
    # CNPG descendants are discovered by exact tenant/cluster labels and may only
    # be removed through a live ObjectStorageOperation lease.
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-manager-databases
  namespace: project-databases
  labels:
    app.kubernetes.io/part-of: vibecore
    app.kubernetes.io/managed-by: {{ .Release.Service }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vibecore-platform.fullname" . }}-workspace-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: workspace-manager-databases
  apiGroup: rbac.authorization.k8s.io
{{- end }}
