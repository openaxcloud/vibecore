{{- /*
  Run `prisma migrate deploy` as a Helm pre-install / pre-upgrade hook so
  the database schema is always in sync with the deployed image before
  any service pod is rolled. Replaces the manual `kubectl run prisma-
  migrate-<SHA>` step that DEPLOYMENT.md used to require.

  The Job runs against the api image (which now bundles the prisma CLI
  via @vibecore/database/dependencies) and reads DATABASE_URL from the
  same vibecore-platform-secrets every other deployment mounts.

  hook-weight -10 puts it before everything else in the same install
  pass. hook-delete-policy cleans the previous successful run before
  creating the next, while leaving the failed Pod around for triage.
*/}}
{{- $migrations := .Values.migrations | default dict -}}
{{- $migrationsEnabled := true -}}
{{- $apiImageTag := default .Values.global.imageTag .Values.services.api.imageTag -}}
{{- $apiImageDigest := default .Values.global.imageDigest .Values.services.api.imageDigest -}}
{{- $apiImageArgs := dict "registry" .Values.global.imageRegistry "image" "api" "digest" $apiImageDigest "tag" $apiImageTag -}}
{{- if hasKey $migrations "enabled" -}}
{{-   $migrationsEnabled = $migrations.enabled -}}
{{- end -}}
{{- if $migrationsEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vibecore-platform.fullname" . }}-prisma-migrate
  labels:
    app.kubernetes.io/name: prisma-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: vibecore
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prisma-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: vibecore
    spec:
      serviceAccountName: {{ include "vibecore-platform.fullname" . }}-api
      # The migration job runs prisma against the DB only; it never calls the
      # kube-apiserver, so don't mount a usable SA token (matches the Deployments).
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Avoid the recursive chown of the shared Filestore share on attach.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prisma-migrate
          image: "{{ include "vibecore-platform.imageRef" $apiImageArgs }}"
          imagePullPolicy: {{ include "vibecore-platform.imagePullPolicy" $apiImageArgs }}
          command:
            - sh
            - -c
            - |
              set -e
              # Prisma 7 requires `datasource.url` to come from `prisma.config.ts`
              # (the schema.prisma block intentionally omits `url`). The config
              # file lives at the @vibecore/database package root, so prisma
              # must run with that directory as CWD — it discovers
              # prisma.config.ts in CWD, then resolves the `schema:` and
              # `migrations.path:` entries inside it relative to CWD too.
              DB_DIR=$(node -e "process.stdout.write(require('path').dirname(require.resolve('@vibecore/database/package.json')))")
              cd "$DB_DIR"
              PRISMA_BIN=$(node -e "process.stdout.write(require.resolve('prisma/build/index.js'))")
              echo "db dir:     $DB_DIR"
              echo "prisma bin: $PRISMA_BIN"
              node "$PRISMA_BIN" migrate deploy
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
