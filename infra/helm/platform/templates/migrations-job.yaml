{{- /*
  Run `prisma migrate deploy` as a Helm pre-install / pre-upgrade hook so
  the database schema is always in sync with the deployed image before
  any service pod is rolled. Replaces the manual `kubectl run prisma-
  migrate-<SHA>` step that DEPLOYMENT.md used to require.

  The Job runs against the api image (which now bundles the prisma CLI
  via @vibecore/database/dependencies) and reads DATABASE_URL from the
  same vibecore-platform-secrets every other deployment mounts.

  hook-weight -10 puts it before everything else in the same install
  pass. hook-delete-policy cleans the previous successful run before
  creating the next, while leaving the failed Pod around for triage.

  The Job carries its OWN ServiceAccount, rendered as a hook at weight
  -20 so it exists before the Job. It used to reference the api's
  ServiceAccount instead — which templates/serviceaccounts.yaml renders
  as a NORMAL resource, i.e. AFTER every pre-install hook. On an
  established release that is invisible (the api SA is already there from
  a previous pass), but a FROM-SCRATCH install deadlocks: the Job is
  admitted, then the ServiceAccount admission plugin rejects its Pod with
    Error creating: pods ... is forbidden: error looking up service
    account vibecore/...-api: serviceaccount "...-api" not found
  so the Job reports FailedCreate until activeDeadlineSeconds, --atomic
  rolls the release back, and nothing is ever installed. Proven on the
  audit test cluster, 2026-08-07 — and it is exactly the path a disaster
  recovery would take.
*/}}
{{- $migrations := .Values.migrations | default dict -}}
{{- $migrationsEnabled := true -}}
{{- $apiImageTag := default .Values.global.imageTag .Values.services.api.imageTag -}}
{{- if hasKey $migrations "enabled" -}}
{{-   $migrationsEnabled = $migrations.enabled -}}
{{- end -}}
{{- if $migrationsEnabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vibecore-platform.fullname" . }}-prisma-migrate
  labels:
    app.kubernetes.io/name: prisma-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: vibecore
  annotations:
    # -20 < the Job's -10, so Helm creates this first within the same hook pass.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    # Recreated on every pass; NOT deleted after the hook, so a `kubectl describe`
    # on a failed migration Pod still resolves its ServiceAccount during triage.
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vibecore-platform.fullname" . }}-prisma-migrate
  labels:
    app.kubernetes.io/name: prisma-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: vibecore
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prisma-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: vibecore
    spec:
      serviceAccountName: {{ include "vibecore-platform.fullname" . }}-prisma-migrate
      # The migration job runs prisma against the DB only; it never calls the
      # kube-apiserver, so don't mount a usable SA token (matches the Deployments).
      # NOTE: `automountServiceAccountToken: false` does NOT waive the SA's
      # existence — the admission plugin looks it up before deciding about the
      # token — hence the hook-ordered ServiceAccount above.
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Avoid the recursive chown of the shared Filestore share on attach.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prisma-migrate
          image: "{{ .Values.global.imageRegistry }}/api:{{ required "global.imageTag or services.api.imageTag must be set" $apiImageTag }}"
          imagePullPolicy: {{ if eq ($apiImageTag | toString) "latest" }}Always{{ else }}IfNotPresent{{ end }}
          command:
            - sh
            - -c
            - |
              set -e
              # Prisma 7 requires `datasource.url` to come from `prisma.config.ts`
              # (the schema.prisma block intentionally omits `url`). The config
              # file lives at the @vibecore/database package root, so prisma
              # must run with that directory as CWD — it discovers
              # prisma.config.ts in CWD, then resolves the `schema:` and
              # `migrations.path:` entries inside it relative to CWD too.
              DB_DIR=$(node -e "process.stdout.write(require('path').dirname(require.resolve('@vibecore/database/package.json')))")
              cd "$DB_DIR"
              PRISMA_BIN=$(node -e "process.stdout.write(require.resolve('prisma/build/index.js'))")
              echo "db dir:     $DB_DIR"
              echo "prisma bin: $PRISMA_BIN"
              node "$PRISMA_BIN" migrate deploy
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
