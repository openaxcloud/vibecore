{{- /*
Shared-secret used to authenticate the api -> screenshotter POST /capture call
(P11 automatic project thumbnails). The screenshotter's /capture would otherwise
run with auth disabled (services/screenshotter/src/server.ts only enforces the
bearer when SCREENSHOTTER_SHARED_SECRET is set); this provisions the secret the
api sends (services/api/src/thumbnail-capture.ts) and the pod verifies.

Same chart-owned pattern as ai-gateway-auth-secret.yaml: the value is GENERATED
here and PERSISTED across upgrades via `lookup` — on the first install a random
48-char value is created; subsequent upgrades reuse the existing value (so
rotating pods/api+screenshotter always agree). No operator action or
out-of-band Secret Manager entry is required.

Rendered UNCONDITIONALLY (even while services.screenshotter.enabled=false):
the secret is inert on its own, and having it pre-provisioned means flipping
the service on is a single-step, race-free change — both sides read the same
value from the same Secret in the same rollout.
*/ -}}
{{- $secretName := printf "%s-screenshotter-auth" (include "vibecore-platform.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $value := "" -}}
{{- if and $existing $existing.data (index $existing.data "SCREENSHOTTER_SHARED_SECRET") -}}
{{- $value = index $existing.data "SCREENSHOTTER_SHARED_SECRET" | b64dec -}}
{{- else -}}
{{- $value = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/part-of: vibecore
  annotations:
    # Keep the generated value if this template is ever re-rendered without lookup
    # (e.g. a `helm template` diff) — helm won't delete/replace on upgrade.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  SCREENSHOTTER_SHARED_SECRET: {{ $value | b64enc | quote }}
