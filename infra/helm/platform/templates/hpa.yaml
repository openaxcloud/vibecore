{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (ne (kebabcase $name) "worker") }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "vibecore-platform.fullname" $ }}-{{ kebabcase $name }}
  labels:
    app.kubernetes.io/name: {{ kebabcase $name }}
    app.kubernetes.io/part-of: vibecore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "vibecore-platform.fullname" $ }}-{{ kebabcase $name }}
  minReplicas: {{ $svc.replicas | default 2 | int }}
  maxReplicas: {{ $svc.maxReplicas | default (max 3 (mul ($svc.replicas | default 2 | int) 5)) | int }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
{{- end }}
