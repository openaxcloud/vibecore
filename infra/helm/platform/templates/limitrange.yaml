apiVersion: v1
kind: LimitRange
metadata:
  name: platform-limits
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 8Gi
