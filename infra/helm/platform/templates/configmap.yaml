{{- /*
Non-secret platform-wide env: OAuth provider URLs, the api base URL the web
pod uses to reach the api service, and the admin allowlist. These are public
well-known URLs (Google/GitHub) and cluster-internal DNS — none of them belong
in Secret Manager. Mounted via `envFrom` alongside the existing secret so the
API and web pods see them as process.env entries.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vibecore-platform.fullname" . }}-platform-env
  labels:
    app.kubernetes.io/part-of: vibecore
data:
  # In-cluster URL the web/admin pods use to reach the api service. Mirrors
  # the build-time fallback baked into app/lib/enterprise-api.server.ts —
  # set explicitly here so the source of truth is the chart, not the bundle.
  SAAS_API_URL: {{ .Values.platformEnv.saasApiUrl | quote }}
  API_BASE_URL: {{ .Values.platformEnv.apiBaseUrl | quote }}
  # Browser origins accepted by Fastify CORS. This is public routing metadata,
  # not a credential: keeping it in the chart prevents a production boot from
  # depending on an opaque Secret value. If no explicit override is provided,
  # derive the exact HTTPS allowlist from the app/marketing ingress hosts; the
  # optional www host is included only when its redirect is actually enabled.
  # The API still validates every entry and refuses wildcards/non-HTTPS origins.
  API_CORS_ORIGINS: {{ include "vibecore-platform.apiCorsOrigins" . | quote }}
  {{- with (.Values.platformEnv.apiInternalUrl | default .Values.platformEnv.saasApiUrl) }}
  # URL interne que le WORKER utilise pour déclencher les jobs internes
  # (inactivity.gc, metering.objectStorage, metering.databaseStorage,
  # database.maintenance). Ces handlers exigeaient `API_INTERNAL_URL` ou
  # `API_URL` sans repli : la prod ne définissant ni l'une ni l'autre, ils
  # échouaient à CHAQUE déclenchement — plus aucun métrage stockage/base, et la
  # maintenance base à l'arrêt, pendant que les CronJobs restaient « Complete »
  # (ils n'empilent que le job ; l'échec se produit côté worker).
  #
  # Le code sait désormais retomber sur SAAS_API_URL / API_BASE_URL, donc cette
  # clé n'est plus indispensable — elle est posée en ceinture+bretelles, et
  # rend l'intention explicite. Par défaut elle reprend `saasApiUrl`, l'URL de
  # Service interne vérifiée joignable depuis le pod worker de production
  # (HTTP 200 sur /health et /ready). Émise seulement si non vide : une valeur
  # vide l'emporterait sur les suivantes côté worker.
  API_INTERNAL_URL: {{ . | quote }}
  {{- end }}
  # P11 auto thumbnails. SCREENSHOTTER_URL is the in-cluster screenshotter
  # service; EMPTY by default so the API's capture triggers stay inert (safe to
  # merge before the pod exists). Set it (and provision SCREENSHOTTER_SHARED_SECRET
  # in the platform secret) when the screenshotter is enabled. ALLOWED_HOSTS is
  # the screenshotter's own SSRF allowlist (only read by that pod).
  SCREENSHOTTER_URL: {{ .Values.platformEnv.screenshotterUrl | default "" | quote }}
  SCREENSHOTTER_ALLOWED_HOSTS: {{ .Values.platformEnv.screenshotterAllowedHosts | default "" | quote }}
  # In-cluster preview-proxy base URL. When set, the screenshotter routes preview
  # requests through it (preserving Host) instead of the public preview URL, which
  # an in-cluster pod can't reach (hairpin to the cluster's own external LB).
  SCREENSHOTTER_PREVIEW_PROXY_URL: {{ .Values.platformEnv.screenshotterPreviewProxyUrl | default "" | quote }}
  {{- if .Values.platformEnv.publicApiBaseUrl }}
  PUBLIC_API_BASE_URL: {{ .Values.platformEnv.publicApiBaseUrl | quote }}
  {{- end }}

  # Google OAuth — well-known endpoints, redirect URI derived from the chart.
  GOOGLE_AUTHORIZATION_URL: {{ .Values.platformEnv.google.authorizationUrl | quote }}
  GOOGLE_TOKEN_URL: {{ .Values.platformEnv.google.tokenUrl | quote }}
  GOOGLE_USERINFO_URL: {{ .Values.platformEnv.google.userinfoUrl | quote }}
  GOOGLE_REDIRECT_URI: {{ .Values.platformEnv.google.redirectUri | quote }}
  GOOGLE_SCOPE: {{ .Values.platformEnv.google.scope | quote }}

  # GitHub OAuth — well-known endpoints, redirect URI derived from the chart.
  GITHUB_AUTHORIZATION_URL: {{ .Values.platformEnv.github.authorizationUrl | quote }}
  GITHUB_TOKEN_URL: {{ .Values.platformEnv.github.tokenUrl | quote }}
  GITHUB_USERINFO_URL: {{ .Values.platformEnv.github.userinfoUrl | quote }}
  GITHUB_REDIRECT_URI: {{ .Values.platformEnv.github.redirectUri | quote }}
  GITHUB_SCOPE: {{ .Values.platformEnv.github.scope | quote }}

  # Comma-separated list of emails granted PlatformAdmin (services/api/src/app.ts:2224).
  PLATFORM_ADMIN_EMAILS: {{ .Values.platformEnv.platformAdminEmails | quote }}

  # P0-V3-04 CloudTenant/Project Factory. All values are non-secret. The
  # service authenticates exclusively through the API pod's Workload Identity;
  # service-account JSON keys are intentionally unsupported.
  CLOUD_TENANT_FACTORY_ENABLED: {{ .Values.platformEnv.cloudTenantFactoryEnabled | default "false" | quote }}
  CLOUD_TENANT_ALLOWED_PARENT_FOLDERS: {{ .Values.platformEnv.cloudTenantAllowedParentFolders | default "" | quote }}
  CLOUD_OPERATION_WORKER: {{ .Values.platformEnv.cloudOperationWorker | default "off" | quote }}
  CLOUD_OPERATION_WORKER_INTERVAL_MS: {{ .Values.platformEnv.cloudOperationWorkerIntervalMs | default "5000" | quote }}

  # When 'true', the ai-gateway requires the shared-secret bearer on
  # /chat/completions (the api always sends it once provisioned). Separate flag so
  # the secret rolls out to both pods BEFORE enforcement is enabled — flipping this
  # to 'true' is the LAST, safe step (no chat outage).
  AI_GATEWAY_REQUIRE_AUTH: {{ .Values.platformEnv.aiGatewayRequireAuth | default "" | quote }}

  # Tell Fastify to honor X-Forwarded-* from the GKE ingress so request.ip
  # is the real client IP (audit logs, rate-limits, OAuth callback origin).
  TRUST_PROXY: {{ .Values.platformEnv.trustProxy | default "true" | quote }}

  # MFA is OPTIONAL for everyone, admins included (Avi's decision). "false" turns
  # adminMfaRequired() off so the global requireAuth gate (app.ts:2297) and
  # requireAdminMfaForSensitiveAction (app.ts:3289, e.g. the platform-admin
  # promotion) no longer block an admin who hasn't enrolled MFA. MFA stays
  # AVAILABLE (anyone can enroll it on the security page), just never forced.
  # Hardcoded LITERAL (not a values key) because CD's `helm upgrade
  # --reuse-values` ignores values changes — same reason as BILLING_CREDITS_SHADOW.
  # Reversible: set "true" (or delete this line — the env then defaults to
  # MFA-required for admins).
  ADMIN_MFA_REQUIRED: "false"
  # Default paths for API-local project files + static deployment artifacts.
  # The deployment template overrides these via per-pod env vars when the
  # `storage` block is enabled, so this is only the fallback for the
  # single-replica path. Keep in sync with values.yaml `storage.mountPath`.
  PROJECT_STORAGE_DIR: {{ .Values.platformEnv.projectStorageDir | default "/tmp/vibecore-project-storage" | quote }}
  STATIC_DEPLOY_STORAGE_DIR: {{ .Values.platformEnv.staticDeployStorageDir | default "/tmp/vibecore-static-deployments" | quote }}

  # Replit-parity billing — SHADOW mode: the effort-based credit engine OPENS and
  # SETTLES a checkpoint per agent request and records the computed cost + usage,
  # but NEVER debits the wallet (shadow). This certifies the engine in prod with
  # zero billing risk. Going LIVE is a separate, deliberate step — set
  # BILLING_CREDITS_ENABLED: "true" (which flips shadow off and starts debiting).
  # Hardcoded literal (NOT a values key) because CD runs `helm upgrade
  # --reuse-values`, which ignores newly-added values keys — see the
  # ECODE_PARALLEL_SUBAGENTS_ENABLED note below.
  BILLING_CREDITS_SHADOW: "true"

  # Multi-tenant anti-abuse guardrails (P0-A2-14 — ReputationTier /
  # BillingAccountBinding / provider allowlists / cost + burst ceilings).
  # Security default is ENFORCED; only an explicit emergency change to "false"
  # enters observe-only mode, and every would-be refusal stays audited/metriced.
  # Hardcoded literal (NOT a values key) for the same --reuse-values reason as
  # BILLING_CREDITS_SHADOW above.
  TENANT_GUARDRAILS_ENABLED: "true"

  # Replit-parity managed model registry, read-through. "true" makes
  # GET /orgs/:id/ai/models return the admin-owned provider/model registry
  # (seeded enabled-by-default at API boot — seedProviderRegistry, app.ts:5722)
  # filtered to the org's plan tier, instead of {registryEnabled:false,models:[]}.
  # This is the authoritative source for the (future) admin-managed model picker;
  # the current IDE composer still reads the legacy /api/models catalog, so this
  # flag is forward-looking and inert for today's selector — the user-visible
  # "no per-user key" change is driven by VITE_BYOK_DISABLED (a build arg), not
  # this. Hardcoded literal (NOT a values key) because CD's `helm upgrade
  # --reuse-values` ignores newly-added values keys. Reversible: set "false" or
  # delete this line (the endpoint then reports the registry as disabled).
  MODEL_REGISTRY_DB: "true"

  # Managed-mode model-selector trim (runtime half of VITE_BYOK_DISABLED). The
  # build arg hides the per-user key UI in the *client bundle*; this runtime pod
  # env lets the web SSR `/api/models` loader (services it from the web pod) read
  # the same flag (the SSR `process.env` is shimmed to {}, so the loader reads
  # globalThis.process.env via readRuntimeEnv). When "true", the loader trims the
  # selector to providers that have a configured platform key, so users can't
  # pick a provider with no key. Hardcoded literal (CD `--reuse-values` ignores
  # new values keys). Reversible: set "false" / delete → full legacy BYOK list.
  VITE_BYOK_DISABLED: "true"

  # Remote Kubernetes runtime. These are operational endpoints and image
  # references, not credentials; credentials stay in the Secret.
  VITE_RUNTIME_MODE: {{ .Values.platformEnv.runtime.mode | quote }}
  VITE_RUNTIME_API_BASE_URL: {{ .Values.platformEnv.runtime.apiBaseUrl | quote }}
  WORKSPACE_MANAGER_URL: {{ .Values.platformEnv.runtime.workspaceManagerUrl | quote }}
  # Native per-project database (CloudNativePG, tiered by plan — see
  # docs/DB_ARCHITECTURE_V3_TIERED.md). Hardcoded literals (not a values key) for
  # the SAME reason as ADMIN_MFA_REQUIRED below: the always-on CD path runs
  # `helm upgrade --reuse-values`, which silently drops NEW values keys, so a
  # `.Values…` reference here would render empty and the flag would flip itself
  # off on every deploy. The provisioner stays Noop (zero effect) until
  # DB_ROLLBACK_ENABLED is "true"; setting it "false" fully disables the feature.
  # Bucket/GSA/shared-cluster are this prod cluster's CNPG coordinates (Phase 1).
  DB_ROLLBACK_ENABLED: "true"
  DB_BACKUP_BUCKET: "vibecore-495216-vibecore-prod-backups"
  DB_BACKUP_GSA: "cnpg-backups@vibecore-495216.iam.gserviceaccount.com"
  DB_SHARED_CLUSTER: "shared-pg-0"
  # Per-project GCS object storage (services/api/src/object-storage.ts). Same
  # hardcoded-literal rule as DB_ROLLBACK_ENABLED above: a manual `kubectl set
  # env` on the api Deployment is silently wiped by the always-on CD path
  # (`helm upgrade --reuse-values` regenerates the pod spec from this chart), and
  # a `.Values…` reference would render empty under --reuse-values. Carrying it
  # here keeps the flag ON across every deploy. The api stays Noop (no GCS calls,
  # routes 404 FEATURE_NOT_ENABLED) until this is "true"; the bucket calls then
  # authenticate via the api pod's Workload Identity (no key/secret in-chart).
  # The token-auth path (OBJECT_STORAGE_API_URL + OBJECT_STORAGE_ACCESS_TOKEN_SECRET,
  # used only by the workspace-agent proxy) is provisioned separately via the Secret.
  OBJECT_STORAGE_ENABLED: "true"
  # "Add Authentication" scaffold (services/api/src/auth-scaffold.ts) — same
  # hardcoded-literal rule as the flags above (survives `helm upgrade
  # --reuse-values`). When "true", POST /projects/:id/auth/scaffold writes the
  # real users-migration + Express session/JWT auth files into the project; the
  # endpoint 404s FEATURE_NOT_ENABLED while off.
  AUTH_SCAFFOLD_ENABLED: "true"
  # Preview private-port gate (services/preview-proxy). The api side reads the
  # per-port flag from VIBECORE_PORTS_STATE; turning this on just lets the
  # /internal/preview/port-access endpoint return real data. The preview-proxy
  # ENFORCEMENT (PREVIEW_ENFORCE_PRIVATE_PORTS) stays OFF — a dark-launch that
  # needs the vc_preview session cookie rollout first.
  #
  # API_BASE_URL is defined ONCE, above, from platformEnv.apiBaseUrl. A second
  # literal used to be re-declared HERE with port :80 — the api Service listens
  # on 3001, so the duplicate silently won (last key wins in YAML) and every
  # proxy→api call failed. It went unnoticed because the only consumer (the
  # private-port lookup) fails OPEN on error; the static-deploy proxy added
  # 2026-08-01 surfaced it as STATIC_DEPLOY_UPSTREAM_FAILED.
  PREVIEW_PRIVATE_PORTS_ENABLED: "true"
  # Deployment access rollout is deliberately two-phase. First every preview-
  # proxy pod enforces policy (and fails closed on API/policy uncertainty); only
  # after rollout completion may operators flip ACTIVATION to "true" so the API
  # accepts protected-policy creation. This prevents old proxy replicas from
  # serving a newly-private release during a mixed rolling deployment.
  DEPLOYMENT_ACCESS_ENFORCEMENT: "true"
  DEPLOYMENT_ACCESS_ACTIVATION_ENABLED: {{ .Values.platformEnv.deploymentAccessActivationEnabled | default "false" | quote }}
  {{- if .Values.platformEnv.runtime.aiGatewayUrl }}
  # In-cluster URL the api pod uses to reach the ai-gateway service. Without
  # this the api falls back to http://127.0.0.1:3030 (app.ts aiGatewayUrl
  # default), which does not exist in-pod, so every AI completion fails. The
  # ai-gateway binds 3030 (services/ai-gateway/src/server.ts).
  AI_GATEWAY_URL: {{ .Values.platformEnv.runtime.aiGatewayUrl | quote }}
  # Multi-agent orchestration: the web pod's build-mode chat fans a complex
  # request out to specialist sub-agents (architect/frontend/backend/devops/qa)
  # running in parallel on the ai-gateway, then runs consensus over their
  # outputs. Reuses the ai-gateway service URL; the executor reuses
  # AI_GATEWAY_SHARED_SECRET as its bearer (see getSubagentExecutorToken / the
  # /v1/agent-runs expectedToken fallback), so no extra secret is required.
  #
  # NOTE: keyed off aiGatewayUrl (which is in --reuse-values), NOT a new values
  # key — CD runs `helm upgrade --reuse-values`, which IGNORES newly-added values
  # keys, so a dedicated `parallelSubagentsEnabled` flag silently never rendered
  # (the configmap shipped AI_GATEWAY_URL but not these). Deriving from an
  # already-persisted key guarantees they ship.
  ECODE_PARALLEL_SUBAGENTS_ENABLED: "1"
  ECODE_SUBAGENT_EXECUTOR_URL: {{ .Values.platformEnv.runtime.aiGatewayUrl | quote }}
  {{- end }}
  WORKSPACE_RUNTIME_NAMESPACE: {{ .Values.platformEnv.runtime.workspaceRuntimeNamespace | quote }}
  WORKSPACE_STORAGE_CLASS: {{ .Values.platformEnv.runtime.workspaceStorageClass | quote }}
  WORKSPACE_AGENT_IMAGE: {{ .Values.platformEnv.runtime.workspaceAgentImage | quote }}
  PREVIEW_URL_TEMPLATE: {{ .Values.platformEnv.runtime.previewUrlTemplate | quote }}
  # Base preview domain (e.g. preview.e-code.ai). The preview-proxy uses it to
  # recognize per-preview hosts `<workspaceId>-<port>.<PREVIEW_DOMAIN>` and serve
  # the app at the host root, so apps whose HTML uses root-relative asset URLs
  # (`/main.js`, `/@vite/client` — the Vite/CRA default) load correctly instead
  # of 404ing because the path prefix `/p/<ws>/<port>/` is dropped.
  PREVIEW_DOMAIN: {{ .Values.global.previewDomain | quote }}

  {{- if .Values.platformEnv.runtime.serverDeployImageRepo }}
  # Snapshot-image server deploys (Replit-parity: Publish = the workspace,
  # imaged). The api snapshots the FULL workspace (deps included), Cloud Build
  # bakes it onto the workspace base image, and the app Deployment runs that
  # image — no install at boot. Repo is the Artifact Registry docker repo the
  # app images are pushed to; the flag rides the same key so ONE `--set`
  # enables the pipeline (NOTE: CD runs `helm upgrade --reuse-values`, which
  # ignores newly-added values keys until they are `--set` once by hand).
  SERVER_DEPLOY_SNAPSHOT_IMAGE: {{ .Values.platformEnv.runtime.serverDeploySnapshotImage | default "1" | quote }}
  SERVER_DEPLOY_IMAGE_REPO: {{ .Values.platformEnv.runtime.serverDeployImageRepo | quote }}
  {{- if .Values.platformEnv.runtime.serverDeployCosignKmsKey }}
  # Resource name only; signing runs in Cloud Build under ADC and private key
  # material never enters this ConfigMap or the API pod.
  SERVER_DEPLOY_COSIGN_KMS_KEY: {{ .Values.platformEnv.runtime.serverDeployCosignKmsKey | quote }}
  {{- end }}
  {{- if .Values.platformEnv.runtime.serverDeployBuildServiceAccount }}
  # Explicit dedicated Cloud Build identity; missing means image publication
  # fails closed before a build is submitted (no implicit default SA).
  SERVER_DEPLOY_BUILD_SERVICE_ACCOUNT: {{ .Values.platformEnv.runtime.serverDeployBuildServiceAccount | quote }}
  {{- end }}
  {{- if .Values.platformEnv.runtime.serverDeployRevisionProjects }}
  # Reproducible pipeline rollout gate (docs/DEPLOY_REPRODUCIBLE_PIPELINE.md):
  # for the listed project ids ('*' = all) the docker-build context is produced
  # by an isolated build pod from the SOURCE revision instead of the live dev
  # pod. Unset ⇒ the Phase-A snapshot path, byte-for-byte.
  SERVER_DEPLOY_REVISION_PROJECTS: {{ .Values.platformEnv.runtime.serverDeployRevisionProjects | quote }}
  {{- end }}
  {{- end }}

  # D2 (approved 2026-07-17): server rollback re-deploys the retained image BY
  # DIGEST (I-REL-1), fail-closed. Anchored HERE — unconditionally, outside any
  # if-block — so a helm upgrade can never drop it (it used to live only in a
  # `kubectl set env`, which the next upgrade wipes). `default "1"` keeps the
  # digest path on even for a release whose stored values pre-date this key
  # (--reuse-values). '0' is an explicit kill switch: the api then REFUSES
  # server rollbacks (409 SERVER_ROLLBACK_DIGEST_DISABLED) instead of the
  # URL-copy row that re-deploys nothing.
  SERVER_DEPLOY_ROLLBACK_FROM_DIGEST: {{ .Values.platformEnv.runtime.serverDeployRollbackFromDigest | default "1" | quote }}

  {{- if .Values.platformEnv.runtime.nixStorePvc }}
  # Shared RO Nix store (candidate E) — per-project rollout gate. The api
  # threads the PVC into workspace pods AND published-app pods for the projects
  # in WORKSPACE_NIX_PROJECTS ('*' = all). The PVC is zonal (its PV carries the
  # zone-a node affinity); the cluster-wide NIX_STORE_PVC_NAME kill switch
  # stays untouched.
  WORKSPACE_NIX_STORE_PVC: {{ .Values.platformEnv.runtime.nixStorePvc | quote }}
  WORKSPACE_NIX_PROJECTS: {{ .Values.platformEnv.runtime.nixProjects | default "" | quote }}
  {{- end }}

  {{- if .Values.platformEnv.runtime.nixStorePvcZones }}
  # D3 multi-zone store (approved 2026-07-17): per-zone identical clones
  # (`zone=pvc,zone=pvc`, order = preference). The workspace-manager picks the
  # zone with live schedulable sandbox capacity and mounts THAT zone's clone
  # (zone stockout ⇒ new pods route to the surviving zone). The generation
  # hash arms the drift guard: a clone whose /nix/ecode/catalog.json does not
  # hash to it BLOCKS the pod (initContainer nix-store-guard).
  NIX_STORE_PVC_ZONES: {{ .Values.platformEnv.runtime.nixStorePvcZones | quote }}
  {{- if .Values.platformEnv.runtime.nixGenerationHash }}
  NIX_STORE_GENERATION_HASH: {{ .Values.platformEnv.runtime.nixGenerationHash | quote }}
  {{- end }}
  {{- end }}

  {{- if .Values.platformEnv.runtime.nixGenerations }}
  # CTR-RUNTIME-NIX generation registry — when set it supersedes the legacy
  # PVC/zones/hash trio (rotation = flip the ACTIVE entry, révocation = status
  # REVOKED refused everywhere with a typed error).
  NIX_STORE_GENERATIONS: {{ .Values.platformEnv.runtime.nixGenerations | quote }}
  {{- end }}

  {{- if .Values.platformEnv.email.httpEndpoint }}
  EMAIL_HTTP_ENDPOINT: {{ .Values.platformEnv.email.httpEndpoint | quote }}
  {{- end }}
  {{- if .Values.platformEnv.email.from }}
  EMAIL_FROM: {{ .Values.platformEnv.email.from | quote }}
  {{- end }}

  {{- with .Values.platformEnv.stripe }}
  {{- if .freeProductId }}
  STRIPE_FREE_PRODUCT_ID: {{ .freeProductId | quote }}
  {{- end }}
  {{- if .freePriceId }}
  STRIPE_FREE_PRICE_ID: {{ .freePriceId | quote }}
  {{- end }}
  {{- if .proProductId }}
  STRIPE_PRO_PRODUCT_ID: {{ .proProductId | quote }}
  {{- end }}
  {{- if .proPriceId }}
  STRIPE_PRO_PRICE_ID: {{ .proPriceId | quote }}
  {{- end }}
  {{- if .teamProductId }}
  STRIPE_TEAM_PRODUCT_ID: {{ .teamProductId | quote }}
  {{- end }}
  {{- if .teamPriceId }}
  STRIPE_TEAM_PRICE_ID: {{ .teamPriceId | quote }}
  {{- end }}
  {{- if .enterpriseProductId }}
  STRIPE_ENTERPRISE_PRODUCT_ID: {{ .enterpriseProductId | quote }}
  {{- end }}
  {{- if .enterprisePriceId }}
  STRIPE_ENTERPRISE_PRICE_ID: {{ .enterprisePriceId | quote }}
  {{- end }}
  {{- end }}
