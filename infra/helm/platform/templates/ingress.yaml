apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vibecore-platform.fullname" . }}-app
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.issuerName | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.proxyReadTimeoutSeconds | default 180 | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.proxySendTimeoutSeconds | default 180 | quote }}
    # The API accepts request bodies up to 25 MB (API_BODY_LIMIT_BYTES — zip
    # project imports, large file uploads). nginx's default proxy-body-size is
    # 1 MB, which silently 413s those uploads before they reach Fastify. Raise the
    # ingress limit to match (slightly above, for multipart overhead).
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | default "26m" | quote }}
    # Cookie session affinity pins each browser to one web pod for the life of the
    # cookie. The frontend is a Vite/Remix build whose code is split into hashed
    # chunks served from each pod's local disk. During a RollingUpdate two builds
    # coexist (maxSurge), and without affinity nginx round-robins every request —
    # so an HTML document rendered by the new-build pod pulls /assets/<hash>.js
    # chunks that round-robin onto the old-build pod, which doesn't have that hash,
    # and the request 503s. The result is the IDE stuck on "Loading E-Code" for
    # any load that straddles a deploy. Affinity keeps a client's document and all
    # its chunk requests on the same pod (same build); "persistent" mode avoids
    # rebalancing a mid-session client onto a freshly-added (different-build) pod,
    # so a deploy only affects users after their old pod is fully drained.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "vc_upstream"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
{{- if .Values.global.marketingWwwRedirect }}
    # `www.<hôte>` -> `<hôte>`, en préservant chemin ET query.
    #
    # Pourquoi cette annotation et pas `permanent-redirect` : mesuré sur
    # ingress-nginx 1.15.1 (la version de prod), `permanent-redirect` REFUSE
    # `$request_uri` — le webhook d'admission rejette l'Ingress
    # (« annotation ... contains invalid value ») — et avec une URL nue il perd
    # le chemin : /pricing atterrit sur la racine. `from-to-www-redirect`
    # préserve les deux. Les snippets nginx, qui auraient permis un `return 301`
    # sur mesure, sont désactivés depuis ingress-nginx 1.9
    # (`allow-snippet-annotations: false`, CVE-2021-25742) et le contrôleur de
    # prod n'a pas d'override.
    #
    # ⚠️ Le code renvoyé est **308**, pas 301 : c'est le défaut du contrôleur
    # (`http-redirect-code`, non défini ici). 308 est un permanent au même titre
    # que 301 pour les navigateurs et l'indexation, à ceci près qu'il préserve la
    # méthode HTTP. Le passer à 301 se ferait par la ConfigMap du contrôleur,
    # donc GLOBALEMENT sur toutes les redirections — changement volontairement
    # écarté ici.
    #
    # Le `Location` contient `:443` (`https://<hôte>:443/chemin`) — cosmétique,
    # valide, les navigateurs le suivent sans broncher.
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
{{- end }}
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.global.appDomain | quote }}
        {{- with .Values.global.marketingDomain }}
        - {{ . | quote }}
        {{- end }}
        {{- with .Values.global.apiDomain }}
        - {{ . | quote }}
        {{- end }}
        {{- with .Values.global.workspaceManagerDomain }}
        - {{ . | quote }}
        {{- end }}
        {{- if .Values.global.marketingWwwRedirect }}
        {{- with .Values.global.marketingDomain }}
        # La redirection s'opère APRÈS la terminaison TLS : sans `www` dans le
        # certificat, le navigateur se prend une erreur de certificat avant même
        # de voir le 308. L'hôte doit donc figurer ici.
        - {{ printf "www.%s" . | quote }}
        {{- end }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.global.appDomain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vibecore-platform.fullname" . }}-web
                port:
                  name: http
          - path: /runtime
            pathType: Prefix
            backend:
              service:
                name: {{ include "vibecore-platform.fullname" . }}-workspace-manager
                port:
                  name: http
    {{- with .Values.global.marketingDomain }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vibecore-platform.fullname" $ }}-web
                port:
                  name: http
    {{- end }}
    {{- with .Values.global.apiDomain }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vibecore-platform.fullname" $ }}-api
                port:
                  name: http
    {{- end }}
    {{- with .Values.global.workspaceManagerDomain }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vibecore-platform.fullname" $ }}-workspace-manager
                port:
                  name: http
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vibecore-platform.fullname" . }}-preview
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.issuerName | quote }}
    # Match the -app limit so uploads to a running preview app aren't 413'd at 1 MB.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | default "26m" | quote }}
    # The proxy answers a sleeping / booting / wedged app with its own branded
    # holding page inside SERVER_DEPLOY_WAKE_WAIT_MS + the upstream budget. State
    # the read timeout explicitly (rather than inheriting nginx's default) so the
    # relationship between the two is deliberate: nginx must outlast the proxy,
    # or the browser gets a raw `504 Gateway Time-out` instead — proven live
    # 2026-08-06 (BUG-DEPLOY-003).
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.previewProxyReadTimeout | default "75" | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.previewProxyReadTimeout | default "75" | quote }}
  labels:
    app.kubernetes.io/part-of: vibecore
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: ["*.{{ .Values.global.previewDomain }}"]
      secretName: {{ .Values.ingress.previewTlsSecretName }}
  rules:
    - host: "*.{{ .Values.global.previewDomain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vibecore-platform.fullname" . }}-preview-proxy
                port:
                  name: http
