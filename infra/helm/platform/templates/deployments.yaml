{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $imageTag := default $.Values.global.imageTag $svc.imageTag }}
{{- /*
Mount the shared PVC only on the API. Project storage + static-deployment
artifacts are written by the API; worker and workspace-manager don't read
them. Adding the mount where it isn't needed wastes a mount handle and
pulls those pods onto the NFS network without reason.
*/ -}}
{{- $needsSharedStorage := and $.Values.storage.enabled (eq $name "api") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vibecore-platform.fullname" $ }}-{{ kebabcase $name }}
  labels:
    app.kubernetes.io/name: {{ kebabcase $name }}
    app.kubernetes.io/component: {{ kebabcase $name }}
    app.kubernetes.io/part-of: vibecore
spec:
  replicas: {{ $svc.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ kebabcase $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      annotations:
        checksum/platform-env: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ kebabcase $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ kebabcase $name }}
        app.kubernetes.io/part-of: vibecore
    spec:
      serviceAccountName: {{ include "vibecore-platform.fullname" $ }}-{{ kebabcase $name }}
      # Only workspace-manager talks to the Kubernetes API server (it creates and
      # deletes workspace pods/PVCs via @vibecore/k8s-client). Every other service
      # is a stateless HTTP app that never calls the API, so mounting the SA token
      # into those pods only widens the attack surface. Computed from the service
      # name in-template so it survives `helm upgrade --reuse-values`, which ignores
      # newly-added values keys.
      automountServiceAccountToken: {{ if has $name (list "workspaceManager") }}true{{ else }}false{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Skip the recursive chown of the shared RWX Filestore share on every
        # pod attach (default policy is Always → O(files) walk, slowing every
        # rollout and scale-up). OnRootMismatch only checks/fixes the root dir.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ kebabcase $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $svc.image }}:{{ $imageTag }}"
          # `latest` is mutable in our registry, so always pull to pick up new SHAs.
          # For pinned (immutable) tags, IfNotPresent would be cheaper, but the
          # current flow rolls all services on the `latest` tag.
          imagePullPolicy: {{ if eq ($imageTag | toString) "latest" }}Always{{ else }}IfNotPresent{{ end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - secretRef:
                name: {{ $.Values.secrets.existingSecret }}
            # Non-secret platform-wide URLs (OAuth endpoints, in-cluster api
            # base URL, admin allowlist). Defined in templates/configmap.yaml.
            - configMapRef:
                name: {{ include "vibecore-platform.fullname" $ }}-platform-env
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: {{ $.Values.global.environment | quote }}
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            {{- if $needsSharedStorage }}
            # When shared storage is enabled the chart overrides whatever
            # PROJECT_STORAGE_DIR / STATIC_DEPLOY_STORAGE_DIR come from the
            # ConfigMap so the API always reads from the PVC mount. These
            # env vars take precedence over `envFrom: configMapRef` because
            # `env:` entries are merged last by the Kubelet.
            - name: PROJECT_STORAGE_DIR
              value: {{ printf "%s/%s" $.Values.storage.mountPath $.Values.storage.projectSubpath | quote }}
            - name: STATIC_DEPLOY_STORAGE_DIR
              value: {{ printf "%s/%s" $.Values.storage.mountPath $.Values.storage.staticDeploySubpath | quote }}
            {{- end }}
          {{- if ne $svc.httpHealth false }}
          # readinessProbe distinguished from livenessProbe: a 503 on /ready
          # (DB/Redis check) drops the pod from the Service backend without
          # killing the process. /health stays a pure sync 200 so liveness
          # only fires on a deadlocked or crashed Node process.
          readinessProbe:
            httpGet:
              path: {{ $svc.readyPath | default $svc.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          {{- else }}
          # Services with no HTTP server (worker) can't be HTTP-probed. Use an
          # exec liveness that checks the freshness of the heartbeat file the
          # process rewrites every 15s: a hung/deadlocked event loop stops the
          # writes, the file goes stale, and Kubernetes restarts the wedged pod.
          # (/tmp is a writable emptyDir even with readOnlyRootFilesystem.)
          # Fail-SAFE: a MISSING file passes (exit 0) so an older image that
          # predates the heartbeat is never crash-looped during a rollout; only a
          # STALE file (live but hung) fails. Once the heartbeat-writing image is
          # deployed the probe becomes meaningful.
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "const fs=require('fs');let t;try{t=Number(fs.readFileSync(process.env.WORKER_HEARTBEAT_PATH||'/tmp/worker-heartbeat','utf8'))}catch(e){process.exit(0)}process.exit(Number.isFinite(t)&&Date.now()-t<120000?0:1)"
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
{{ toYaml $svc.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $svc.readOnlyRootFilesystem | default true }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $needsSharedStorage }}
            - name: shared-data
              mountPath: {{ $.Values.storage.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          # Cap node ephemeral-storage usage so a runaway write to /tmp can't
          # fill the node disk and trigger a silent pod eviction with no signal.
          emptyDir:
            sizeLimit: {{ $svc.tmpSizeLimit | default "1Gi" }}
        {{- if $needsSharedStorage }}
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ $.Values.storage.pvc.name }}
        {{- end }}
{{- end }}
{{- end }}
