{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $imageTag := default $.Values.global.imageTag $svc.imageTag }}
{{- $imageDigest := default $.Values.global.imageDigest $svc.imageDigest }}
{{- $imageArgs := dict "registry" $.Values.global.imageRegistry "image" $svc.image "digest" $imageDigest "tag" $imageTag }}
{{- /*
Mount the shared PVC only on the API. Project storage + static-deployment
artifacts are written by the API; worker and workspace-manager don't read
them. Adding the mount where it isn't needed wastes a mount handle and
pulls those pods onto the NFS network without reason.
*/ -}}
{{- $needsSharedStorage := and $.Values.storage.enabled (eq $name "api") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vibecore-platform.fullname" $ }}-{{ kebabcase $name }}
  labels:
    app.kubernetes.io/name: {{ kebabcase $name }}
    app.kubernetes.io/component: {{ kebabcase $name }}
    app.kubernetes.io/part-of: vibecore
spec:
  replicas: {{ $svc.replicas | default 2 }}
  # Zero-downtime rollout. Without an explicit strategy Kubernetes defaults to
  # maxUnavailable: 25%, which at higher replica counts (e.g. the API HPA scaling
  # past 4) removes >=1 old pod BEFORE a new one is Ready — briefly shrinking
  # nginx's healthy upstreams and surfacing "503 no healthy upstream" during a CD
  # cutover. maxUnavailable: 0 keeps the full desired count serving throughout;
  # maxSurge: 1 rolls one extra pod at a time. minReadySeconds makes a pod wait
  # ~10s of stable Ready before it counts as available, so a pod that crashes
  # right after boot never briefly replaces a healthy one. Hardcoded defaults
  # (overridable per service via values) so the guarantee survives
  # `helm upgrade --reuse-values`, which ignores newly-added values keys.
  minReadySeconds: {{ $svc.minReadySeconds | default 10 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ if hasKey $svc "maxUnavailable" }}{{ $svc.maxUnavailable }}{{ else }}0{{ end }}
      maxSurge: {{ $svc.maxSurge | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ kebabcase $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      annotations:
        checksum/platform-env: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- /*
        Provenance stamped next to the image it describes.

        A digest-pinned Deployment carries no tag, so once a service is pinned there is
        nothing left in the cluster that says WHICH COMMIT produced the image now
        running. The release manifest requires that commit for every service, including
        the ones a given run did not rebuild — so it has to be readable back from the
        same authoritative place as the image itself.
        */}}
        {{- with (default "" $svc.imageSourceSha) }}
        vibecore.dev/image-source-sha: {{ . | quote }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ kebabcase $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ kebabcase $name }}
        app.kubernetes.io/part-of: vibecore
    spec:
      serviceAccountName: {{ include "vibecore-platform.fullname" $ }}-{{ kebabcase $name }}
      # Graceful drain window: the preStop below sleeps ~10s so nginx-ingress can
      # remove this pod from its upstreams before the process gets SIGTERM. Keep
      # this comfortably above that sleep so the container still has time to close
      # in-flight connections after the drain.
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds | default 30 }}
      # Only workspace-manager talks to the Kubernetes API server (it creates and
      # deletes workspace pods/PVCs via @vibecore/k8s-client). Every other service
      # is a stateless HTTP app that never calls the API, so mounting the SA token
      # into those pods only widens the attack surface. Computed from the service
      # name in-template so it survives `helm upgrade --reuse-values`, which ignores
      # newly-added values keys.
      automountServiceAccountToken: {{ if has $name (list "workspaceManager") }}true{{ else }}false{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Skip the recursive chown of the shared RWX Filestore share on every
        # pod attach (default policy is Always → O(files) walk, slowing every
        # rollout and scale-up). OnRootMismatch only checks/fixes the root dir.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ kebabcase $name }}
          # Digest-pinned in production (services.<svc>.imageDigest), tag-based
          # everywhere else. See "vibecore-platform.imageRef" for why.
          image: "{{ include "vibecore-platform.imageRef" $imageArgs }}"
          imagePullPolicy: {{ include "vibecore-platform.imagePullPolicy" $imageArgs }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          # Zero-downtime drain: on pod shutdown, keep serving for ~10s while
          # nginx-ingress propagates the endpoint removal, so in-flight/racing
          # requests don't hit a socket that's already closing (the "upstream
          # prematurely closed connection" 502 seen during CD cutovers). `node`
          # is present in every service image (the worker liveness uses it too).
          lifecycle:
            preStop:
              exec:
                command:
                  - node
                  - -e
                  - "setTimeout(function(){}, {{ $svc.preStopDrainMs | default 10000 }})"
          envFrom:
            - secretRef:
                name: {{ $.Values.secrets.existingSecret }}
            # Chart-managed shared secret for api -> ai-gateway auth (wave-29 #30).
            # Mounted on every pod (api sends it, ai-gateway verifies it; others
            # ignore it) so both sides always agree on the value.
            - secretRef:
                name: {{ include "vibecore-platform.fullname" $ }}-ai-gateway-auth
            # Chart-managed shared secret for api -> screenshotter auth (P11 auto
            # thumbnails, templates/screenshotter-auth-secret.yaml). Same model:
            # generated on first install, preserved via lookup, mounted on every
            # pod (the api sends it as a Bearer on POST /capture, the screenshotter
            # verifies it; other services ignore it) so both sides always agree.
            - secretRef:
                name: {{ include "vibecore-platform.fullname" $ }}-screenshotter-auth
            # Non-secret platform-wide URLs (OAuth endpoints, in-cluster api
            # base URL, admin allowlist). Defined in templates/configmap.yaml.
            - configMapRef:
                name: {{ include "vibecore-platform.fullname" $ }}-platform-env
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: {{ $.Values.global.environment | quote }}
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            {{- if and (eq $name "workspaceManager") $svc.planResourcesJson }}
            # Operator override for the per-plan FALLBACK pod resource table in
            # @vibecore/k8s-client (used when a plan carries no custom entitlement).
            # JSON, partial per plan/field, e.g.
            #   {"team":{"cpuRequest":"400m"},"enterprise":{"cpuRequest":"600m"}}
            # Unknown plans/fields and malformed values fall back to the built-in
            # defaults per field; the code guarantees request<=limit and clamps
            # limits to the LimitRange max, so a bad value can never brick pods.
            # Unset (the default) → the built-in code defaults apply unchanged.
            # Computed from the service name in-template so it survives
            # `helm upgrade --reuse-values` (which ignores newly-added values keys).
            - name: WORKSPACE_PLAN_RESOURCES_JSON
              value: {{ $svc.planResourcesJson | quote }}
            {{- end }}
            {{- if $needsSharedStorage }}
            # When shared storage is enabled the chart overrides whatever
            # PROJECT_STORAGE_DIR / STATIC_DEPLOY_STORAGE_DIR come from the
            # ConfigMap so the API always reads from the PVC mount. These
            # env vars take precedence over `envFrom: configMapRef` because
            # `env:` entries are merged last by the Kubelet.
            - name: PROJECT_STORAGE_DIR
              value: {{ printf "%s/%s" $.Values.storage.mountPath $.Values.storage.projectSubpath | quote }}
            - name: STATIC_DEPLOY_STORAGE_DIR
              value: {{ printf "%s/%s" $.Values.storage.mountPath $.Values.storage.staticDeploySubpath | quote }}
            {{- end }}
          {{- if ne $svc.httpHealth false }}
          # readinessProbe distinguished from livenessProbe: a 503 on /ready
          # (DB/Redis check) drops the pod from the Service backend without
          # killing the process. /health stays a pure sync 200 so liveness
          # only fires on a deadlocked or crashed Node process.
          readinessProbe:
            httpGet:
              path: {{ $svc.readyPath | default $svc.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          {{- else }}
          # Services with no HTTP server (worker) can't be HTTP-probed. Use an
          # exec liveness that checks the freshness of the heartbeat file the
          # process rewrites every 15s: a hung/deadlocked event loop stops the
          # writes, the file goes stale, and Kubernetes restarts the wedged pod.
          # (/tmp is a writable emptyDir even with readOnlyRootFilesystem.)
          # Fail-SAFE: a MISSING file passes (exit 0) so an older image that
          # predates the heartbeat is never crash-looped during a rollout; only a
          # STALE file (live but hung) fails. Once the heartbeat-writing image is
          # deployed the probe becomes meaningful.
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "const fs=require('fs');let t;try{t=Number(fs.readFileSync(process.env.WORKER_HEARTBEAT_PATH||'/tmp/worker-heartbeat','utf8'))}catch(e){process.exit(0)}process.exit(Number.isFinite(t)&&Date.now()-t<120000?0:1)"
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
{{ toYaml $svc.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # `| default true` would coerce an explicit `false` (Helm treats false
            # as empty) back to true; hasKey distinguishes unset from an explicit value.
            readOnlyRootFilesystem: {{ if hasKey $svc "readOnlyRootFilesystem" }}{{ $svc.readOnlyRootFilesystem }}{{ else }}true{{ end }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $needsSharedStorage }}
            - name: shared-data
              mountPath: {{ $.Values.storage.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          # Cap node ephemeral-storage usage so a runaway write to /tmp can't
          # fill the node disk and trigger a silent pod eviction with no signal.
          emptyDir:
            sizeLimit: {{ $svc.tmpSizeLimit | default "1Gi" }}
        {{- if $needsSharedStorage }}
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ $.Values.storage.pvc.name }}
        {{- end }}
{{- end }}
{{- end }}
