global:
  environment: staging
  imageRegistry: us-central1-docker.pkg.dev/PROJECT/vibecore
  imageTag: latest
  appDomain: staging.example.com
  previewDomain: preview.staging.example.com
  # Optional additional public hosts. Leave empty when not needed (staging).
  # In production these split the marketing landing, raw API, and workspace
  # manager onto their own subdomains so each can be reached without sharing
  # the application path prefix.
  marketingDomain: ''
  apiDomain: ''
  workspaceManagerDomain: ''
  dns01:
    enabled: true
    project: PROJECT
    hostedZoneName: staging-example-com
  labels:
    app.kubernetes.io/part-of: vibecore
  workloadIdentity:
    web: ''
    admin: ''
    api: ''
    worker: ''
    aiGateway: ''
    workspaceManager: ''
    previewProxy: ''

secrets:
  existingSecret: vibecore-platform-secrets

# Non-secret env values injected via ConfigMap (templates/configmap.yaml).
# OAuth client IDs/secrets live in the existing Secret; only the public,
# well-known URLs and the platform admin allowlist go here.
platformEnv:
  # In-cluster DNS for the api Service. Released chart name is
  # `<release>-<chart>-api`, so with `helm install vibecore ...` this is
  # `vibecore-vibecore-platform-api.<ns>.svc.cluster.local:<port>`.
  saasApiUrl: 'http://vibecore-vibecore-platform-api.vibecore.svc.cluster.local:3001'
  apiBaseUrl: 'http://vibecore-vibecore-platform-api.vibecore.svc.cluster.local:3001'
  publicApiBaseUrl: ''
  platformAdminEmails: ''
  # Fastify trust-proxy. Staging/prod sit behind ingress-nginx; leave true.
  # Override to "false" only for local helm template debugging.
  trustProxy: 'true'
  # API project storage path. When `storage.enabled` is true, the chart
  # overrides this with `<storage.mountPath>/<storage.projectSubpath>` so
  # every API replica reads/writes the same shared volume. When false, the
  # API falls back to /tmp emptyDir — fine for single-replica dev only.
  projectStorageDir: '/tmp/vibecore-project-storage'
  # Static-deployment artifact path (served from app.ts /static-deployments
  # route). Same single-replica caveat as `projectStorageDir`: required to
  # be shared across replicas, defaults to /tmp emptyDir when storage is
  # disabled.
  staticDeployStorageDir: '/tmp/vibecore-static-deployments'
  # PlatformAdmin TOTP gate. Defaults to "true" in the api (the env var is
  # treated as required unless it equals the string "false") — set
  # explicitly so the policy is visible in chart values.
  adminMfaRequired: 'true'
  runtime:
    mode: 'remote-kubernetes'
    apiBaseUrl: 'https://api.staging.example.com/api/runtime'
    workspaceManagerUrl: 'http://vibecore-vibecore-platform-workspace-manager.vibecore.svc:3010'
    # In-cluster ai-gateway service (port 3030). Required: without it the api
    # defaults to localhost and every AI chat completion 500s.
    aiGatewayUrl: 'http://vibecore-vibecore-platform-ai-gateway.vibecore.svc:3030'
    workspaceRuntimeNamespace: 'workspaces'
    workspaceStorageClass: 'workspace-standard-rwo'
    workspaceAgentImage: 'us-central1-docker.pkg.dev/PROJECT/vibecore/workspace-agent:sha-staging'
    previewUrlTemplate: 'https://{workspaceId}-{port}.preview.staging.example.com/p/{workspaceId}/{port}/'
  email:
    httpEndpoint: ''
    from: ''
  # Stripe product and price IDs are not secrets. Leave empty until the
  # catalog is seeded, then set them so the API can seed Plan rows with
  # checkout-capable price IDs at startup.
  stripe:
    freeProductId: ''
    freePriceId: ''
    proProductId: ''
    proPriceId: ''
    teamProductId: ''
    teamPriceId: ''
    enterpriseProductId: ''
    enterprisePriceId: ''
  google:
    authorizationUrl: 'https://accounts.google.com/o/oauth2/v2/auth'
    tokenUrl: 'https://oauth2.googleapis.com/token'
    userinfoUrl: 'https://openidconnect.googleapis.com/v1/userinfo'
    redirectUri: ''
    scope: 'openid email profile'
  github:
    authorizationUrl: 'https://github.com/login/oauth/authorize'
    tokenUrl: 'https://github.com/login/oauth/access_token'
    userinfoUrl: 'https://api.github.com/user'
    redirectUri: ''
    scope: 'read:user user:email'

ingress:
  className: nginx
  issuerName: letsencrypt-dns01
  tlsSecretName: vibecore-platform-tls
  previewTlsSecretName: vibecore-preview-wildcard-tls
  proxyReadTimeoutSeconds: 180
  proxySendTimeoutSeconds: 180

services:
  # Optional `imageTag` on any service overrides `global.imageTag` for that
  # service only. Use it for narrow production rollouts when a backend service
  # changes without rebuilding every frontend/admin image.
  web:
    enabled: true
    image: web
    port: 3000
    replicas: 3
    command: []
    path: /
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  admin:
    enabled: true
    image: admin
    port: 3000
    replicas: 2
    path: /admin
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  api:
    enabled: true
    image: api
    port: 3001
    replicas: 3
    path: /api
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  worker:
    enabled: true
    image: worker
    port: 3002
    replicas: 2
    path: ''
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  aiGateway:
    enabled: true
    image: ai-gateway
    port: 3010
    replicas: 3
    path: /ai
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: '2', memory: 2Gi }
  workspaceManager:
    enabled: true
    image: workspace-manager
    port: 3020
    replicas: 2
    path: /runtime
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  previewProxy:
    enabled: true
    image: preview-proxy
    port: 3030
    replicas: 3
    path: /
    host: '*.preview.staging.example.com'
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }

# Shared persistent storage for the API. Backs `PROJECT_STORAGE_DIR` and
# `STATIC_DEPLOY_STORAGE_DIR` so every API replica sees the same project
# files, git working trees, and static-deployment artifacts. When disabled
# the API falls back to its emptyDir mount — only safe at replicas <= 1.
#
# `pv.create=true` renders a manually-provisioned PersistentVolume that
# points at an external NFS server (e.g. a GCP Filestore instance). Leave
# false and set `pvc.storageClassName` to use a cluster StorageClass.
storage:
  enabled: false
  mountPath: /data/vibecore
  projectSubpath: projects
  staticDeploySubpath: static-deployments
  pv:
    create: false
    name: vibecore-shared
    capacity: 1Ti
    accessModes:
      - ReadWriteMany
    # Reclaim policy must be Retain when the PV is backed by a long-lived
    # external resource (Filestore, NetApp, etc.). Delete would orphan the
    # bound external volume the moment the PVC is removed.
    reclaimPolicy: Retain
    # `nfs` uses the in-tree NFS plugin; `csi-filestore` uses the
    # GKE-managed Filestore CSI driver (required for fsGroup chown so
    # non-root pods can write to the share root).
    driver: nfs
    nfs:
      server: ''
      path: /vibecore_data
      readOnly: false
    # Only consulted when driver=csi-filestore.
    csi:
      ip: ''
      volume: ''
      # `volumeHandle` is the canonical CSI Filestore handle, format:
      # modeInstance/<zone>/<instance-name>/<file-share-name>
      volumeHandle: ''
    # Optional: bind the PV exclusively to the PVC below. Required when
    # `pv.create=true` so dynamic claims can't accidentally grab it.
    bindToClaim: true
  pvc:
    name: vibecore-shared
    accessModes:
      - ReadWriteMany
    storage: 1Ti
    # Empty string + `volumeName` = static binding to the PV above.
    # Set to a class name (e.g. `standard-rwx`) to use dynamic provisioning.
    storageClassName: ''

podSecurity:
  enabled: true
  enforce: restricted

networkPolicy:
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
