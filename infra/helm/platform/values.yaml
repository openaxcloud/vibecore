global:
  environment: staging
  imageRegistry: us-central1-docker.pkg.dev/PROJECT/vibecore
  imageTag: latest
  appDomain: staging.example.com
  previewDomain: preview.staging.example.com
  # Optional additional public hosts. Leave empty when not needed (staging).
  # In production these split the marketing landing, raw API, and workspace
  # manager onto their own subdomains so each can be reached without sharing
  # the application path prefix.
  marketingDomain: ''
  # Sert `www.<marketingDomain>` et le redirige (308) vers l'apex, chemin et
  # query préservés. DÉSACTIVÉ par défaut : l'activer ajoute `www.<domaine>`
  # aux SAN du certificat, ce qui déclenche une RÉÉMISSION du certificat de
  # l'ingress principal (apex + app + api + workspace-manager) par
  # cert-manager. À n'activer que sur un environnement dont le DNS `www`
  # pointe déjà sur le load balancer.
  marketingWwwRedirect: false
  apiDomain: ''
  workspaceManagerDomain: ''
  dns01:
    enabled: true
    project: PROJECT
    hostedZoneName: staging-example-com
  labels:
    app.kubernetes.io/part-of: vibecore
  workloadIdentity:
    web: ''
    admin: ''
    api: ''
    worker: ''
    aiGateway: ''
    workspaceManager: ''
    previewProxy: ''

secrets:
  existingSecret: vibecore-platform-secrets

# Non-secret env values injected via ConfigMap (templates/configmap.yaml).
# OAuth client IDs/secrets live in the existing Secret; only the public,
# well-known URLs and the platform admin allowlist go here.
platformEnv:
  # In-cluster DNS for the api Service. Released chart name is
  # `<release>-<chart>-api`, so with `helm install vibecore ...` this is
  # `vibecore-vibecore-platform-api.<ns>.svc.cluster.local:<port>`.
  saasApiUrl: 'http://vibecore-vibecore-platform-api.vibecore.svc.cluster.local:3001'
  # Surcharge explicite de l'URL interne utilisée par le worker pour ses jobs
  # internes. VIDE par défaut : le chart retombe alors sur `saasApiUrl`.
  apiInternalUrl: ''
  apiBaseUrl: 'http://vibecore-vibecore-platform-api.vibecore.svc.cluster.local:3001'
  publicApiBaseUrl: ''
  # Optional explicit comma-separated HTTPS browser-origin allowlist. Empty
  # derives it from global.appDomain + marketingDomain (+ www when enabled),
  # so legacy releases upgraded with --reuse-values receive a safe value too.
  apiCorsOrigins: ''
  platformAdminEmails: ''
  # CloudTenant / Project Factory is fail-closed until an API Workload
  # Identity and an explicit folder allowlist are supplied. No JSON key is
  # accepted by the application.
  cloudTenantFactoryEnabled: 'false'
  cloudTenantAllowedParentFolders: ''
  cloudOperationWorker: 'off'
  cloudOperationWorkerIntervalMs: '5000'
  # Set to 'true' to make the ai-gateway REQUIRE the shared-secret bearer on
  # /chat/completions. Leave empty until the secret is confirmed present on both
  # the api and ai-gateway pods (it is provisioned by templates/ai-gateway-auth-secret.yaml
  # and the api sends it automatically) — flipping this on is the safe final step.
  aiGatewayRequireAuth: ''
  # Fastify trust-proxy. Staging/prod sit behind ingress-nginx; leave true.
  # Override to "false" only for local helm template debugging.
  trustProxy: 'true'
  # API project storage path. When `storage.enabled` is true, the chart
  # overrides this with `<storage.mountPath>/<storage.projectSubpath>` so
  # every API replica reads/writes the same shared volume. When false, the
  # API falls back to /tmp emptyDir — fine for single-replica dev only.
  projectStorageDir: '/tmp/vibecore-project-storage'
  # Static-deployment artifact path (served from app.ts /static-deployments
  # route). Same single-replica caveat as `projectStorageDir`: required to
  # be shared across replicas, defaults to /tmp emptyDir when storage is
  # disabled.
  staticDeployStorageDir: '/tmp/vibecore-static-deployments'
  # NOTE: ADMIN_MFA_REQUIRED is hardcoded "false" in templates/configmap.yaml
  # (MFA optional for everyone). See that file to change the policy.
  runtime:
    mode: 'remote-kubernetes'
    apiBaseUrl: 'https://api.staging.example.com/api/runtime'
    workspaceManagerUrl: 'http://vibecore-vibecore-platform-workspace-manager.vibecore.svc:3010'
    # In-cluster ai-gateway service (port 3030). Required: without it the api
    # defaults to localhost and every AI chat completion 500s.
    aiGatewayUrl: 'http://vibecore-vibecore-platform-ai-gateway.vibecore.svc:3030'
    workspaceRuntimeNamespace: 'workspaces'
    workspaceStorageClass: 'workspace-standard-rwo'
    workspaceAgentImage: 'us-central1-docker.pkg.dev/PROJECT/vibecore/workspace-agent:sha-staging'
    # Host-based preview must point at the host ROOT (no '/p/<ws>/<port>/' path
    # prefix): the subdomain already identifies the workspace+port, the proxy
    # host-routes every path, and a path prefix breaks client-side routers
    # (BrowserRouter sees '/p/<ws>/<port>/' → no route match → blank app).
    previewUrlTemplate: 'https://{workspaceId}-{port}.preview.staging.example.com/'
    # Snapshot-image server deploys: AR docker repo for published app images.
    # Empty = pipeline off (boot-script server deploys). See configmap.yaml.
    serverDeployImageRepo: ''
    serverDeploySnapshotImage: ''
    # Cloud KMS key reference used by the Cloud Build service account to sign
    # each generated app image. This is a resource name, never key material.
    serverDeployCosignKmsKey: ''
    # Full projects/.../serviceAccounts/... resource for the dedicated Cloud
    # Build identity. Empty keeps snapshot-image publication fail-closed.
    serverDeployBuildServiceAccount: ''
    # Reproducible (revision-based) server deploys: '*' or comma-separated
    # project-id allowlist; empty = off (Phase-A snapshot path unchanged).
    serverDeployRevisionProjects: ''
    # Reserved VM is fail-closed until the dedicated node pool/operator gate is
    # proven. The key id is non-secret; key material and the rotation keyring
    # are mounted only from `secrets.existingSecret`.
    reservedVmEnabled: 'false'
    reservedVmPayloadEncryptionKeyId: ''
    # Shared RO Nix store rollout gate (candidate E): PVC name + project
    # allowlist ('*' = all). Empty = off, pod specs unchanged.
    nixStorePvc: ''
    nixProjects: ''
    # Registre de générations du store Nix (JSON compact, cf. schéma dans
    # packages/k8s-client/src/nix-generations.ts). Vide = mode legacy.
    nixGenerations: ''
    # D3 multi-zone (approved 2026-07-17): per-zone store clones, same
    # generation snapshot. Format `zone=pvc,zone=pvc` (order = preference);
    # empty = legacy single-zone PVC behaviour. nixGenerationHash =
    # `sha256:<hex>` of /nix/ecode/catalog.json — arms the drift guard
    # (wrong-generation clone blocks the pod).
    nixStorePvcZones: ''
    nixGenerationHash: ''
    # D2 (approved 2026-07-17): server-deploy rollback re-deploys the RETAINED
    # image by digest (I-REL-1) — fail-closed. '1' = digest path (the default,
    # also enforced by the configmap template's `default "1"`); '0' = explicit
    # kill switch — the api then REFUSES server rollbacks (409) instead of
    # reviving the silent URL-copy row this replaced. Required by
    # values.schema.json so an upgrade can never drop it unnoticed.
    serverDeployRollbackFromDigest: '1'
    # Deployment-access activation is a two-phase interlock. '0' is the safe
    # default; deploy-main flips it to '1' only after every serving edge enforces
    # policies and the legacy public-cache window has drained.
    deploymentAccessActivationEnabled: '0'
  email:
    httpEndpoint: ''
    from: ''
  # Stripe product and price IDs are not secrets. Leave empty until the
  # catalog is seeded, then set them so the API can seed Plan rows with
  # checkout-capable price IDs at startup.
  stripe:
    freeProductId: ''
    freePriceId: ''
    proProductId: ''
    proPriceId: ''
    teamProductId: ''
    teamPriceId: ''
    enterpriseProductId: ''
    enterprisePriceId: ''
  google:
    authorizationUrl: 'https://accounts.google.com/o/oauth2/v2/auth'
    tokenUrl: 'https://oauth2.googleapis.com/token'
    userinfoUrl: 'https://openidconnect.googleapis.com/v1/userinfo'
    redirectUri: ''
    scope: 'openid email profile'
  github:
    authorizationUrl: 'https://github.com/login/oauth/authorize'
    tokenUrl: 'https://github.com/login/oauth/access_token'
    userinfoUrl: 'https://api.github.com/user'
    redirectUri: ''
    scope: 'read:user user:email'

ingress:
  className: nginx
  issuerName: letsencrypt-dns01
  tlsSecretName: vibecore-platform-tls
  previewTlsSecretName: vibecore-preview-wildcard-tls
  proxyReadTimeoutSeconds: 180
  proxySendTimeoutSeconds: 180

services:
  # Optional `imageTag` on any service overrides `global.imageTag` for that
  # service only. Use it for narrow production rollouts when a backend service
  # changes without rebuilding every frontend/admin image.
  web:
    enabled: true
    image: web
    port: 3000
    replicas: 3
    command: []
    path: /
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  admin:
    enabled: true
    image: admin
    port: 3000
    replicas: 2
    path: /admin
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  api:
    enabled: true
    image: api
    port: 3001
    replicas: 3
    path: /api
    # /ready does the DB+Redis check; /health is a pure sync 200 for liveness.
    # Without this, readiness falls back to /health and a DB-down pod still
    # reports Ready and keeps serving 5xx instead of being pulled from the LB.
    readyPath: /ready
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  worker:
    enabled: true
    image: worker
    port: 3002
    replicas: 2
    path: ''
    # Background BullMQ consumer — no HTTP listener, so HTTP probes against
    # /health would fail forever and crash-loop the pod. Disable them.
    httpHealth: false
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  aiGateway:
    enabled: true
    image: ai-gateway
    # The ai-gateway binary binds AI_GATEWAY_PORT ?? 3030 (it does not read
    # PORT), so the container port / Service targetPort / probes must be 3030.
    port: 3030
    replicas: 3
    path: /ai
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: '2', memory: 2Gi }
  workspaceManager:
    enabled: true
    image: workspace-manager
    # The workspace-manager binary binds WORKSPACE_MANAGER_PORT ?? 3010.
    port: 3010
    replicas: 2
    path: /runtime
    # Optional operator override (JSON) for the per-plan FALLBACK pod resource
    # table in @vibecore/k8s-client — the requests/limits a per-workspace pod is
    # created with when the plan carries no custom entitlement. Partial per
    # plan/field; malformed values fall back to the built-in code defaults per
    # field (request can never exceed limit, limits clamped to the LimitRange
    # max). Empty (the default) → the built-in defaults apply. Injected as
    # WORKSPACE_PLAN_RESOURCES_JSON only on this pod. Example:
    #   planResourcesJson: '{"team":{"cpuRequest":"400m"},"enterprise":{"cpuRequest":"600m"}}'
    planResourcesJson: ''
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  previewProxy:
    enabled: true
    image: preview-proxy
    # The preview-proxy binary binds PREVIEW_PROXY_PORT ?? 3020.
    port: 3020
    replicas: 3
    path: /
    host: '*.preview.staging.example.com'
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }
  # P11 automatic thumbnails. DISABLED by default — no Deployment/Service is
  # rendered until enabled (see values-prod.yaml). Chromium needs a writable
  # rootfs, so readOnlyRootFilesystem is off (defence stays: non-root, dropped
  # caps, no SA token, egress + app-level SSRF allowlist). Concurrency is held
  # to 1-2 via SCREENSHOTTER_MAX_CONCURRENCY in the env, not replicas.
  screenshotter:
    enabled: false
    image: screenshotter
    # server.ts binds SCREENSHOTTER_PORT ?? PORT ?? 3030.
    port: 3030
    replicas: 1
    # Cap the HPA (templates/hpa.yaml would otherwise default to 5): render
    # concurrency is held via SCREENSHOTTER_MAX_CONCURRENCY in the pod, not by
    # fanning out Chromium replicas. Chart-default (not values-prod-only) so the
    # cap also applies under CD's `helm upgrade --reuse-values`.
    maxReplicas: 2
    path: ''
    readOnlyRootFilesystem: false
    # Chromium is memory-hungry; give /tmp headroom for its shm/profile writes.
    tmpSizeLimit: 512Mi
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits: { cpu: '1', memory: 1Gi }

# Shared persistent storage for the API. Backs `PROJECT_STORAGE_DIR` and
# `STATIC_DEPLOY_STORAGE_DIR` so every API replica sees the same project
# files, git working trees, and static-deployment artifacts. When disabled
# the API falls back to its emptyDir mount — only safe at replicas <= 1.
#
# `pv.create=true` renders a manually-provisioned PersistentVolume that
# points at an external NFS server (e.g. a GCP Filestore instance). Leave
# false and set `pvc.storageClassName` to use a cluster StorageClass.
storage:
  enabled: false
  mountPath: /data/vibecore
  projectSubpath: projects
  staticDeploySubpath: static-deployments
  pv:
    create: false
    name: vibecore-shared
    capacity: 1Ti
    accessModes:
      - ReadWriteMany
    # Reclaim policy must be Retain when the PV is backed by a long-lived
    # external resource (Filestore, NetApp, etc.). Delete would orphan the
    # bound external volume the moment the PVC is removed.
    reclaimPolicy: Retain
    # `nfs` uses the in-tree NFS plugin; `csi-filestore` uses the
    # GKE-managed Filestore CSI driver (required for fsGroup chown so
    # non-root pods can write to the share root).
    driver: nfs
    nfs:
      server: ''
      path: /vibecore_data
      readOnly: false
    # Only consulted when driver=csi-filestore.
    csi:
      ip: ''
      volume: ''
      # `volumeHandle` is the canonical CSI Filestore handle, format:
      # modeInstance/<zone>/<instance-name>/<file-share-name>
      volumeHandle: ''
    # Optional: bind the PV exclusively to the PVC below. Required when
    # `pv.create=true` so dynamic claims can't accidentally grab it.
    bindToClaim: true
  pvc:
    name: vibecore-shared
    accessModes:
      - ReadWriteMany
    storage: 1Ti
    # Empty string + `volumeName` = static binding to the PV above.
    # Set to a class name (e.g. `standard-rwx`) to use dynamic provisioning.
    storageClassName: ''

podSecurity:
  enabled: true
  enforce: restricted

networkPolicy:
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
  # GKE app-services secondary range starts at 10.30.0.0/20; kube-dns owns the
  # conventional .10 ClusterIP. Some NetworkPolicy datapaths evaluate egress
  # before Service DNAT, so namespace/pod selectors alone do not match DNS.
  dnsServiceCidr: 10.30.0.10/32
  # Egress allow-list for the private-VPC Cloud SQL (Postgres) and Memorystore
  # (Redis) endpoints. deny-all-default blocks these otherwise. Override the
  # CIDRs to match your VPC's private-service-access ranges.
  databaseRedisEgress:
    postgresCidr: 10.237.1.0/24
    postgresPort: 5432
    redisCidr: 10.237.0.0/24
    redisPort: 6379

# Free-tier shared Postgres (CloudNativePG) — see templates/shared-database.yaml.
# DISABLED by default: `helm upgrade --reuse-values` drops new keys, so an
# existing release never auto-creates this heavy HA cluster. Enable explicitly
# with `--set database.sharedCluster.enabled=true` when free-tier DB goes live.
database:
  sharedCluster:
    enabled: false
    name: shared-pg-0
    instances: 3
    storageGi: 10
    # Sized for a shared HA cluster serving many free tenants. These also exist
    # as built-in defaults in templates/shared-database.yaml, so the cluster
    # renders correctly even via `helm upgrade --reuse-values --set …enabled=true`
    # (which does NOT merge these values.yaml keys).
    resources:
      requests:
        cpu: '500m'
        memory: '1Gi'
      limits:
        cpu: '2'
        memory: '2Gi'
    pooler:
      instances: 2
    backup:
      enabled: false
      bucket: ''
      serviceAccount: ''
      retentionDays: 7
  # workspace-manager RBAC in project-databases (templates/database-rbac.yaml).
  # DISABLED by default: the Role/RoleBinding already exist out-of-band (created at
  # Phase-1 bootstrap with managed-by=vibecore), and Helm cannot adopt unowned
  # resources — an always-rendered copy fails every --reuse-values upgrade. Enable
  # only AFTER annotating the live resources for Helm ownership (see template).
  rbacManaged:
    enabled: false
  # Additive hardened Role/RoleBinding. Also default-off: enable only after the
  # GCS IAM and manager shared-secret preflights have been configured and
  # reviewed; this grants controller/descendant erasure in project-databases.
  hardenedRbacManaged:
    enabled: false
