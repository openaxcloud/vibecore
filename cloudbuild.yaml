# Cloud Build pipeline for the web (Remix) image.
#
# Builds `Dockerfile` target `bolt-ai-production` and tags it both with the
# commit SHA (immutable) and `latest` (for convenience) in the regional
# Artifact Registry that the GKE chart pulls from.
#
# Trigger:
#   gcloud builds submit \
#     --project=vibecore-495216 \
#     --region=europe-west9 \
#     --config=cloudbuild.yaml \
#     --substitutions=_SHORT_SHA=$(git rev-parse --short=10 HEAD) \
#     --machine-type=e2-highcpu-8 \
#     --timeout=1800s .
#
# The chart pins `global.imageTag` to a SHA at deploy time, so the SHA tag
# is what production actually rolls. `latest` is kept fresh as a fallback
# for ad-hoc kubectl runs.
substitutions:
  _REGION: europe-west9
  _PROJECT: vibecore-495216
  _REPO: vibecore-prod-containers
  _IMAGE: web
  _SHORT_SHA: dev
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  # The build context is large (~1GB of node_modules + Vite output during
  # the build stage). Bump the disk so Docker doesn't OOM mid-bundle.
  diskSizeGb: 100

timeout: 1800s

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=bolt-ai-production
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}:${_SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}:${_SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_IMAGE}:latest
