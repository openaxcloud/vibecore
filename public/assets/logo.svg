<?xml version="1.0" encoding="UTF-8"?>
<!-- E-Code Logo SVG -->
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>E-Code</title>
  <defs>
    <linearGradient id="ecode-brand-gradient-light" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A1A" />
      <stop offset="1" stop-color="#F26207" />
    </linearGradient>
    <linearGradient id="ecode-brand-gradient-dark" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8A2B" />
