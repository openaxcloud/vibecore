<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>E-Code</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          'IBM Plex Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #080b12;
        color: #f8fafc;
      }

      :root[data-theme='light'] {
        color-scheme: light;
        background: #f6f8fb;
        color: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(16px, 4vw, 40px);
        background: radial-gradient(circle at top, rgb(242 98 7 / 12%), transparent 42%), var(--offline-page, #080b12);
      }

      :root[data-theme='light'] body {
        --offline-page: #f6f8fb;
      }

      .offline-card {
        width: min(100%, 620px);
        padding: clamp(24px, 6vw, 48px);
        border: 1px solid #293244;
        border-radius: 24px;
        background: rgb(17 24 39 / 92%);
        box-shadow: 0 30px 80px rgb(0 0 0 / 30%);
      }

      :root[data-theme='light'] .offline-card {
        border-color: #dce2ea;
        background: rgb(255 255 255 / 96%);
        box-shadow: 0 24px 70px rgb(15 23 42 / 12%);
      }

      .offline-header,
      .brand,
      .language-switch,
      .connection-status {
        display: flex;
        align-items: center;
      }

      .offline-header {
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 32px;
      }

      .brand {
        min-width: 0;
        gap: 10px;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 11px;
        background: linear-gradient(135deg, #f26207, #f99d25);
        color: #fff;
      }

      .language-switch {
        min-height: 44px;
        padding: 4px;
        gap: 2px;
        border: 1px solid #354055;
        border-radius: 999px;
      }

      :root[data-theme='light'] .language-switch {
        border-color: #d5dce6;
      }

      .language-switch button {
        min-width: 40px;
        min-height: 36px;
        padding: 0 10px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .language-switch button[aria-pressed='true'] {
        background: #f26207;
        color: #fff;
      }

      .offline-icon {
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
        color: #f26207;
      }

      h1,
      h2,
      p {
        overflow-wrap: anywhere;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1.05;
        letter-spacing: -0.035em;
      }

      .subtitle {
        margin: 14px 0 0;
        color: #b5c0d1;
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.6;
      }

      :root[data-theme='light'] .subtitle,
      :root[data-theme='light'] .status-message,
      :root[data-theme='light'] .feature-list,
      :root[data-theme='light'] .connection-status {
        color: #4b5563;
      }

      .status-message {
        margin: 28px 0;
        padding: 18px 20px;
        border: 1px solid #293244;
        border-radius: 16px;
        background: rgb(30 41 59 / 58%);
        color: #cbd5e1;
        line-height: 1.65;
      }

      :root[data-theme='light'] .status-message {
        border-color: #e0e5ec;
        background: #f8fafc;
      }

      .feature-list {
        color: #cbd5e1;
      }

      .feature-list h2 {
        margin: 0 0 14px;
        color: inherit;
        font-size: 1rem;
      }

      .feature-list ul {
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
        list-style: none;
      }

      .feature-list li {
        position: relative;
        padding-left: 26px;
        line-height: 1.45;
      }

      .feature-list li::before {
        position: absolute;
        left: 0;
        color: #f26207;
        content: '✓';
        font-weight: 700;
      }

      .retry-button {
        width: 100%;
        min-height: 48px;
        margin-top: 30px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #f26207, #e95500);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .retry-button:focus-visible,
      .language-switch button:focus-visible {
        outline: 3px solid rgb(242 98 7 / 38%);
        outline-offset: 3px;
      }

      .connection-status {
        justify-content: center;
        gap: 9px;
        margin-top: 22px;
        color: #94a3b8;
        font-size: 0.875rem;
      }

      .connection-indicator {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #ef4444;
      }

      .connection-indicator.online {
        background: #22c55e;
      }

      @media (max-width: 420px) {
        .offline-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .language-switch {
          align-self: stretch;
          justify-content: center;
        }

        .language-switch button {
          flex: 1;
        }
      }
    </style>
    <script src="/offline-messages.js" defer></script>
    <script src="/offline-i18n.js" defer></script>
  </head>
  <body>
    <main class="offline-card">
      <header class="offline-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">E</span>
          <span>E-Code</span>
        </div>
        <div class="language-switch" role="group" data-i18n-aria-label="languageSwitch">
          <button type="button" data-language="en"></button>
          <button type="button" data-language="fr"></button>
        </div>
      </header>

      <svg
        class="offline-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path d="M1 1l22 22"></path>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>

      <h1 data-i18n="heading"></h1>
      <p class="subtitle" data-i18n="subtitle"></p>

      <div class="status-message">
        <p data-i18n="explanation"></p>
      </div>

      <section class="feature-list">
        <h2 data-i18n="availableHeading"></h2>
        <ul>
          <li data-i18n="cachedProjects"></li>
          <li data-i18n="loadedDocumentation"></li>
          <li data-i18n="localTools"></li>
          <li data-i18n="workspace"></li>
        </ul>
      </section>

      <button class="retry-button" id="retry-button" type="button" data-i18n="retry"></button>

      <div class="connection-status" role="status" aria-live="polite">
        <span class="connection-indicator" id="connection-indicator"></span>
        <span id="connection-status" data-i18n="checking"></span>
      </div>
    </main>
  </body>
</html>
