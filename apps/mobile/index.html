<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080B12" />
    <title>E-Code</title>
  </head>
  <body>
    <main id="app" class="mobile-shell" data-offline="false">
      <section class="mobile-topbar">
        <div>
          <p class="eyebrow">E-Code</p>
          <h1 id="mobile-title"></h1>
        </div>
        <div class="native-actions">
          <button id="language-toggle" class="language-toggle" type="button"></button>
          <button id="share-project" type="button"></button>
          <button id="open-browser" type="button"></button>
        </div>
      </section>
      <section id="offline-banner" class="offline-banner" hidden></section>
      <section id="upload-error" class="upload-error" role="alert" hidden></section>
      <section id="config-missing" class="config-missing" hidden>
        <h2 id="config-missing-title"></h2>
        <p id="config-missing-description"></p>
      </section>
      <iframe
        id="web-app-frame"
        title="E-Code"
        allow="clipboard-read; clipboard-write; fullscreen; publickey-credentials-get; publickey-credentials-create"
      ></iframe>
      <nav class="mobile-tabs" data-mobile-nav>
        <button data-route="/login" type="button"></button>
        <button data-route="/onboarding" type="button"></button>
        <button data-route="/dashboard" type="button"></button>
        <button data-route="/projects" type="button"></button>
        <button data-route="/notifications" type="button"></button>
        <button data-route="/settings" type="button"></button>
      </nav>
      <footer class="mobile-status">
        <span id="app-version" data-native-version></span>
        <label>
          <span id="upload-label"></span>
          <input id="file-upload" data-project-upload type="file" />
        </label>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
